<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Almond · Project Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/domain.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <nav id="view-tabs" aria-label="조회 대상">
        <button data-view="files" aria-pressed="false">
          <span>01</span>File 목록</button
        ><button data-view="scenes" aria-pressed="false">
          <span>02</span>Scene 조회</button
        ><button data-view="holons" aria-pressed="false">
          <span>03</span>Holon 조회</button
        ><button data-view="phases" aria-pressed="false">
          <span>04</span>Phase</button
        ><button data-view="tasks" aria-pressed="false">
          <span>05</span>Task</button
        ><button data-view="steps" aria-pressed="false">
          <span>06</span>Step
        </button>
      </nav>
      <div class="sidebar-note">
        READ ONLY
        <p>저장된 맥락을 읽습니다.<br />모델과 DB를 수정하지 않습니다.</p>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <h1 id="domain-title">Dashboard</h1>
        <div class="header-actions">
          <button id="refresh" class="secondary" disabled>새로고침</button
          ><button id="open-button">DB 파일 열기 ↗</button>
        </div>
      </header>
      <section class="workspace">
        <div id="message" role="status" aria-live="polite" hidden></div>
        <section id="empty" class="empty-state">
          <span class="eyebrow">YOUR PROJECT, IN CONTEXT</span>
          <h1>작업의 맥락을 이어서 읽기</h1>
          <p>
            SQLite DB 파일을 선택하면 파일·장면·작업과<br />현재 회차의 Step
            기록을 함께 살펴볼 수 있습니다.
          </p>
        </section>
        <section id="domain-explorer" hidden>
          <div class="page-heading">
            <p id="domain-description" class="sr-only"></p>
            <form id="domain-search-form">
              <label class="sr-only" for="domain-search">조회 목록 검색</label
              ><input
                id="domain-search"
                type="search"
                maxlength="200"
                placeholder="이름·목표 검색"
              /><button type="submit" class="secondary">검색</button>
            </form>
          </div>
          <details id="task-filters" class="context-controls" hidden>
            <summary>
              <span class="filter-disclosure"
                ><span id="filter-title">파일·Phase·Scene 필터</span>
                <span id="filter-summary">전체</span></span
              >
              <button id="clear-context" type="button" class="secondary">
                필터 해제
              </button>
            </summary>
            <div class="filters">
              <label
                >파일명<select id="filter-file">
                  <option value="">전체 파일</option>
                </select></label
              ><label
                >Phase<select id="filter-phase">
                  <option value="">전체 Phase</option>
                </select></label
              ><label
                >Scene<select id="filter-scene">
                  <option value="">전체 Scene</option>
                </select></label
              ><label
                >Plan 상태<select id="filter-status">
                  <option value="">전체 상태</option>
                </select></label
              ><label
                >실행 이력<select id="filter-execution" aria-describedby="execution-filter-help">
                  <option value="">전체 실행 이력</option>
                  <option value="unstarted">아직 시작 안 함</option>
                </select>
                <span id="execution-filter-help">실행한 Loop와 저장된 작업 기록이 없는 Plan입니다. 대기 상태와 겹칠 수 있습니다.</span></label
              >
            </div>
          </details>
          <div id="task-outline" hidden></div>
          <label id="task-chooser" class="task-chooser" hidden>
            <span>Task 선택 <span id="task-count"></span></span>
            <select id="task-select" disabled aria-label="Task 선택"></select>
          </label>
          <div id="focus-bar" class="focus-bar" hidden>
            <span id="focus-label"></span
            ><button id="domain-show-all" class="record-link">전체 목록</button>
          </div>
          <p id="domain-note" class="hint" role="status" aria-live="polite"></p>
          <div id="domain-results" aria-busy="false"></div>
          <div class="pagination">
            <span id="domain-page-info" aria-live="polite"></span>
            <div>
              <button id="domain-previous" class="secondary">← 이전</button
              ><button id="domain-next" class="secondary">다음 →</button>
            </div>
          </div>
        </section>
        <footer>
          <strong id="database-name">DB를 선택하세요</strong>
          <span id="database-meta"></span>
        </footer>
      </section>
    </main>
    <dialog id="detail" aria-labelledby="detail-title">
      <div class="detail-heading">
        <div>
          <span class="eyebrow">STORED RECORD</span>
          <h2 id="detail-title">상세 조회</h2>
        </div>
        <button id="close-detail" class="secondary" aria-label="상세 닫기">
          닫기 ×
        </button>
      </div>
      <div id="detail-fields"></div>
    </dialog>
  </body>
</html>
