AddBrep(), etc.\n            // Append each GUID: guids.Add(guid);\n            return guids;\n        }\n    }\n\nAvailable namespaces (auto-imported if not present):\n    System, System.Collections.Generic, System.Linq,\n    Rhino, Rhino.Geometry, Rhino.DocObjects\n\nArgs:\n    script: C# source code containing a class with public static List<Guid> Run(RhinoDoc doc).\nReturns:\n    JSON with status (success/compile_error/runtime_error), created GUIDs, or error trace.","params":[{"name":"script","type":"str","label":"실행할 C# 코드","required":true,"hint":"원본은 C# class Script + static List<Guid> Run(RhinoDoc doc) 형식입니다.","example":"using System;\nusing System.Collections.Generic;\nusing Rhino;\nusing Rhino.Geometry;\n\npublic class Script\n{\n    public static List<Guid> Run(RhinoDoc doc)\n    {\n        var line = new Line(new Point3d(0, 0, 3000),\n                            new Point3d(4000, 0, 3000));\n        var id = doc.Objects.AddLine(line);\n        return new List<Guid> { id };\n    }\n}","original_help":"script: C# source code containing a class with public static List<Guid> Run(RhinoDoc doc)."}],"returns":"str","line":2137,"source":"https://github.com/liangjunglj-cpu/almond-mcp/blob/c42b9210f0feeda2f70699221733470ef82213f2/almond_mcp/server.py#L2137","body":"payload = json.dumps({\"type\": \"execute\", \"script\": script}).encode('utf-8')\n# 실제 실행 결과를 받아 그대로 반환한다.\nreturn _send_and_receive(payload)","annotations":null,"signature":"def execute_rhino_script(script: str) -> str","group":"gh","links":[],"branches":[{"label":"컴파일 오류","when":"C# 컴파일이 실패했을 때","data":{"status":"compile_error"},"links":[],"extra_note":"〈컴파일 오류 정보〉"},{"label":"실행 오류","when":"스크립트 실행이 실패했을 때","data":{"status":"runtime_error"},"links":[],"extra_note":"〈실행 오류 정보〉"}],"outputs":{"status":"success","guids":["〈생성·반환 객체 GUID〉"]},"success_label":"정상 반환","success_when":"입력이 유효하고 요청이 처리됐을 때","response_links":[],"pre_links":[],"internal_links":[],"outputs_title":"실행에 따라 채워지는 반환 구조","schema":{"type":"object","properties":{"script":{"type":"string"}},"required":["script"]},"nexts":[]},"list_materials":{"name":"list_materials","title":"재료 ID 찾기","summary":"재료 목록에서 material_id를 받습니다. 다음 assign_material의 입력값으로 사용합니다.","doc":"Lists the curated PBR material library used by assign_material.\n\nEach entry carries metallic/roughness PBR channels, an Unreal material\nslot name (ue_material_slot) for deterministic remapping after import,\nand tags. Categories: metal, plastic, glass, wood, mineral, polymer.","params":[{"name":"category","type":"str","label":"재료 분류","required":false,"hint":"라이브러리의 분류명입니다. 빈 문자열은 분류 필터를 사용하지 않습니다.","default":""},{"name":"query","type":"str","label":"검색어","required":false,"hint":"검색할 단어입니다.","default":""}],"returns":"str","line":1530,"source":"https://github.com/liangjunglj-cpu/almond-mcp/blob/c42b9210f0feeda2f70699221733470ef82213f2/almond_mcp/server.py#L1530","body":"materials = material_library.list(category=category, query=query)\nreturn json.dumps({\n    \"total\": len(materials),\n    \"materials\": materials,\n    \"library_dir\": str(material_library.directory),\n})","annotations":null,"signature":"def list_materials(category: str = '', query: str = '') -> str","group":"guidance","links":[],"branches":[],"outputs":{"total":"〈개수〉","materials":["〈material_id·이름·PBR 값·태그 등〉"],"library_dir":"〈재료 폴더〉"},"success_label":"정상 반환","success_when":"조회가 처리됐을 때; 결과가 비어 있을 수도 있음","response_links":[],"pre_links":[],"internal_links":[],"outputs_title":"실행에 따라 채워지는 반환 구조","schema":{"type":"object","properties":{"category":{"type":"string","default":""},"query":{"type":"string","default":""}}},"nexts":[]},"assign_material":{"name":"assign_material","title":"객체에 재료 적용","summary":"앞 응답의 guids와 재료 목록의 material_id를 함께 넣습니다. 적용 개수·GUID와 조건부 warnings가 돌아옵니다.","doc":"Assigns a curated PBR material to Rhino objects and stamps them with\nmachine-readable material metadata for downstream pipelines (Unreal).\n\nFor structural members, also declare what the object IS in construction\nterms: structural_role (e.g. \"joist\", \"girder\", \"stud\", \"truss_chord\")\nand construction_system (a system_id from get_construction_guidance).\nThese are written as almond:structural_role / almond:construction_system\nuser text on the objects, so the stated construction intent lives on the\nRhino geometry itself and survives export. If the chosen material_id is\nnot a typical finish for the declared system, the response carries a\nwarning (it still applies).\n\nTwo effects, independently switchable:\n- apply_render_material: creates/reuses a physically-based Rhino\n  material (ALMOND::<material_id>) and assigns it per object, so GLB\n  export (publish_to_chestnut) and Datasmith carry real PBR channels.\n- attach_metadata: writes almond:* user-text keys (material_id, name,\n  category, ue_material_slot, base_color, metallic, roughness, opacity)\n  on each object - Datasmith imports these as asset metadata in Unreal,\n  so materials can be remapped by ue_material_slot deterministically.\n\nWorks on breps, meshes, and block instances (an instance's material\napplies to definition geometry set to 'by parent'; the metadata is\nalways attached to the instance itself). Call list_materials first to\ndiscover material_ids.","params":[{"name":"guids","type":"list[str]","label":"대상 객체 GUID 목록","required":true,"hint":"GUID는 설명용입니다. 실제 호출에서는 Rhino 문서에서 받은 객체 ID를 사용합니다.","example":["11111111-1111-4111-8111-111111111111"]},{"name":"material_id","type":"str","label":"재료 ID","required":true,"hint":"list_materials에서 받은 material_id입니다.","example":"plaster-white"},{"name":"apply_render_material","type":"bool","label":"실제 재료 적용","required":false,"hint":"PBR 재료의 생성·할당을 수행합니다.","default":true},{"name":"attach_metadata","type":"bool","label":"메타데이터 기록","required":false,"hint":"객체의 almond:* UserText에 재료 메타데이터를 기록합니다. 원본 기본값은 true입니다.","default":true},{"name":"structural_role","type":"str","label":"구축 역할","required":false,"hint":"","default":""},{"name":"construction_system","type":"str","label":"구축 시스템 ID","required":false,"hint":"구축 시스템의 system_id입니다.","default":""}],"returns":"str","line":1794,"source":"https://github.com/liangjunglj-cpu/almond-mcp/blob/c42b9210f0feeda2f70699221733470ef82213f2/almond_mcp/server.py#L1794","body":"# 객체에 적용한 다음 결과를 구성한다.\nresult = {\"status\": \"success\", \"material_id\": material_id,\n          \"applied_count\": len(applied), \"applied_guids\": applied,\n          # 다른 반환 필드는 생략\n         }\nif warnings:\n    result[\"warnings\"] = warnings\nreturn json.dumps(result)","annotations":null,"signature":"def assign_material(guids: list[str], material_id: str, apply_render_material: bool = True, attach_metadata: bool = True, structural_role: str = '', construction_system: str = '') -> str","group":"guidance","links":[{"target":"list_materials","kind":"before","quote":"Call list_materials first to discover material_ids.","label":"사용할 material_id 확인","when":"","field":""}],"branches":[],"outputs":{"status":"success","material_id":"〈ID〉","rhino_material_name":"ALMOND::<material_id>","ue_material_slot":"〈슬롯〉","applied_count":"〈적용 객체 수〉","requested_count":"〈요청 객체 수〉","applied_guids":["〈GUID〉"],"metadata_attached":"〈true / false〉","render_material_applied":"〈true / false〉"},"success_label":"정상 반환","success_when":"입력이 유효하고 요청이 처리됐을 때","optional_output":"structural_role·construction_system은 입력한 경우에만 결과에도 추가됩니다. 비전형 재료 조합이면 warnings를 추가하지만 적용은 진행됩니다.","response_links":[],"pre_links":[{"target":"list_materials","kind":"before","quote":"Call list_materials first to discover material_ids.","label":"사용할 material_id 확인","when":"","field":""}],"internal_links":[],"outputs_title":"실행에 따라 채워지는 반환 구조","schema":{"type":"object","properties":{"guids":{"type":"array","items":{"type":"string"}},"material_id":{"type":"string"},"apply_render_material":{"type":"boolean","default":true},"attach_metadata":{"type":"boolean","default":true},"structural_role":{"type":"string","default":""},"construction_system":{"type":"string","default":""}},"required":["guids","material_id"]},"nexts":[]},"search_detail_sources":{"name":"search_detail_sources","title":"자료 출처 검색","summary":"로컬 자료 디렉터리 목록을 검색하고 URL·형식·권리 정보와 일치 검색어를 받습니다.","doc":"Search six curated free architectural source directories offline.\nReturns links, formats and rights notes; no external content is fetched.\nResults are research candidates, not attributed inputs or certified details.\nDETAIL subscription access is not required.","params":[{"name":"query","type":"str","label":"검색어","required":false,"hint":"검색할 단어입니다.","default":"","example":"timber"}],"returns":"dict","line":915,"source":"https://github.com/liangjunglj-cpu/almond-mcp/blob/c42b9210f0feeda2f70699221733470ef82213f2/almond_mcp/server.py#L915","body":"data = json.loads((Path(DRAFTING_LIBRARY_DIR)/\"sources.json\").read_text(encoding=\"utf-8\"))\nterms = set(re.findall(r\"[a-z0-9]+\", query.lower()))\nmatches = []\nfor source in data[\"sources\"]:\n    haystack = \" \".join([source[\"title\"], *source[\"tags\"], *source[\"formats\"]]).lower()\n    matched = sorted(t for t in terms if t in haystack)\n    if not terms or matched:\n        matches.append({**source, \"matched_terms\": matched})\nmatches.sort(key=lambda s: (-len(s[\"matched_terms\"]), s[\"source_id\"]))\nreturn {\"status\": \"success\", \"scope\": data[\"scope\"], \"sources\": matches}","annotations":{"readOnlyHint":true,"openWorldHint":false},"signature":"def search_detail_sources(query: str = '') -> dict","group":"guidance","links":[],"branches":[],"outputs":{"status":"success","scope":"〈검색 범위〉","sources":["〈출처 URL·형식·권리·matched_terms〉"]},"success_label":"정상 반환","success_when":"조회가 처리됐을 때; 결과가 비어 있을 수도 있음","response_links":[],"pre_links":[],"internal_links":[],"outputs_title":"실행에 따라 채워지는 반환 구조","schema":{"type":"object","properties":{"query":{"type":"string","default":""}}},"nexts":[]},"list_drawing_recipes":{"name":"list_drawing_recipes","title":"도면 표현 방식 목록","summary":"인수 없이 호출해 도면 recipe_id를 받습니다  \"generate\", \"form_find\", or \"aggregate\".\n    audited_only: When true, list only capsules that run_gh_definition will accept.\nReturns:\n    JSON with total and a list of compact capsule cards.","params":[{"name":"capability","type":"str","required":false,"label":"capability","hint":"","default":"","original_help":"capability: Optional filter: \"analyze\", \"generate\", \"form_find\", or \"aggregate\"."},{"name":"audited_only","type":"bool","required":false,"label":"audited_only","hint":"true이면 실행을 허용하는 audited 캡슐만 목록에 남깁니다.","default":false,"original_help":"audited_only: When true, list only capsules that run_gh_definition will accept."}],"returns":"str","signature":"def list_capsules(capability: str = \"\", audited_only: bool = False) -> str","source":"https://github.com/liangjunglj-cpu/almond-mcp/blob/c42b9210f0feeda2f70699221733470ef82213f2/almond_mcp/server.py","body":"page = retrieval_store.search_capsules(capability=capability, audited_only=audited_only, limit=50)\nreturn json.dumps({\"capsule_library_dir\":CAPSULE_LIBRARY_DIR, **page})","outputs":{"capsule_library_dir":"〈폴더〉","total":"〈개수〉","offset":0,"limit":50,"next_offset":"〈다음 위치 또는 null〉","capsules":[{"capsule_id":"〈ID〉","capability":"〈기능〉","structure_type":"〈구조 유형〉","definition_file":"〈파일〉","title":"〈제목〉","audited":"〈true / false〉","inputs":["ALMOND_IN_<name>"],"outputs":["ALMOND_OUT_<name>"]}]},"branches":[],"annotations":null,"links":[{"target":"run_gh_definition","kind":"description","quote":"Only capsules with audited=true can actually run","label":"검증된 캡슐 실행","when":"audited=true","field":"","mapping":[["선택한 capsules[].capsule_id","capsule_id"],["선택한 capsules[].inputs의 포트 이름","inputs 객체의 key"]]},{"target":"get_logic_by_id","kind":"description","quote":"audited=false capsules are retrieval context only (read them via get_logic_by_id instead).","label":"실행하지 않고 맥락 조회","when":"audited=false","field":""}],"success_label":"정상 반환","success_when":"조회가 처리됐을 때; 결과가 비어 있을 수도 있음","response_links":[],"pre_links":[{"target":"run_gh_definition","kind":"description","quote":"Only capsules with audited=true can actually run","label":"검증된 캡슐 실행","when":"audited=true","field":"","mapping":[["선택한 capsules[].capsule_id","capsule_id"],["선택한 capsules[].inputs의 포트 이름","inputs 객체의 key"]]},{"target":"get_logic_by_id","kind":"description","quote":"audited=false capsules are retrieval context only (read them via get_logic_by_id instead).","label":"실행하지 않고 맥락 조회","when":"audited=false","field":""}],"internal_links":[],"outputs_title":"실행에 따라 채워지는 반환 구조","schema":{"type":"object","properties":{"capability":{"type":"string","default":"","description":"capability: Optional filter: \"analyze\", \"generate\", \"form_find\", or \"aggregate\"."},"audited_only":{"type":"boolean","default":false,"description":"audited_only: When true, list only capsules that run_gh_definition will accept."}},"additionalProperties":false},"nexts":["run_gh_definition","get_logic_by_id"]},"run_gh_definition":{"name":"run_gh_definition","title":"Grasshopper 캡슐 실행","group":"gh","summary":"캡슐 ID와 포트별 값을 전달합니다. 형상 포트에는 Rhino 객체 GUID 목록을 넣습니다.","doc":"Runs an audited Grasshopper capsule (GH definition + typed contract) through\nthe Rhino bridge and returns its declared outputs.\n\nWorkflow: call list_capsules() first to pick a capsule_id and see its input/\noutput port names. Create any geometry with execute_rhino_script, then pass\nthe returned GUIDs here. Inputs are validated client-side against the capsule\nmanifest before anything is sent to Rhino, so errors from this tool name the\nexact port at fault.\n\nInput value forms (keyed by the exact ALMOND_IN_* port name):\n  - Geometry ports (point/curve/mesh/brep and their [] list forms):\n    {\"guids\": [\"<rhino-object-guid>\", ...]} referencing objects already in\n    the Rhino document.\n  - number / integer / string / bool ports: the raw JSON value.\n  - number[] / integer[] / string[] ports: a flat JSON list.\nUnits are declared per port in the manifest — supply values in those units;\nnothing is guessed or auto-converted client-side. Optional inputs may be\nomitted; the capsule's declared defaults then apply inside the definition.\n\nOnly audited capsules run. audited=false means the GHX has no verified\nALMOND_IN_*/ALMOND_OUT_* harness params yet; this tool refuses it\n(see capsules/AUTHORING.md for how to harness one).\n\nThe response's \"outputs\" object is keyed by ALMOND_OUT_* names; interpret\neach value using the manifest's semantics field (e.g. max_nodal_displacement,\nper_element_utilization) and declared units. The response also carries\nanalysis_method (api|template|rule_based), confidence (high|medium|low),\nwarnings, and baked_guids — report method and confidence honestly;\nrule_based/low means an estimate, not FEA.\n\nArgs:\n    capsule_id: Stable capsule identifier from list_capsules (e.g. \"karamba_beam_v1\").\n    inputs: Object mapping ALMOND_IN_* port names to values (forms above).\n    seed: Optional integer seed for stochastic definitions; omit for deterministic ones.\n    timeout_s: Solver budget in seconds (default 60, max 600).\nReturns:\n    JSON with status, capsule_id, outputs, baked_guids, analysis_method,\n    confidence, warnings, and error — or a validation error naming the\n    offending input and the valid port names.","params":[{"name":"capsule_id","type":"str","required":true,"label":"capsule_id","hint":"list_capsules에서 받은 capsule_id입니다. 원본에서 audited=true로 확인된 캡슐 ID.","example":"karamba_beam_v1","original_help":"capsule_id: Stable capsule identifier from list_capsules (e.g. \"karamba_beam_v1\")."},{"name":"inputs","type":"dict","required":true,"label":"inputs","hint":"캡슐의 정확한 ALMOND_IN_* 포트 이름을 key로 하는 JSON 객체입니다. 원본 karamba_beam_v1.capsule.json 필수 포트(ALMOND_IN_LINES) 반영. GUID는 실제 Rhino 선 객체에서 받아야 하는 설명용 예시입니다.","example":{"ALMOND_IN_LINES":{"guids":["11111111-1111-4111-8111-111111111111"]},"ALMOND_IN_LOAD_KN":10},"original_help":"inputs: Object mapping ALMOND_IN_* port names to values (forms above)."},{"name":"seed","type":"int | None","required":false,"label":"seed","hint":"확률적 정의에 전달할 정수 seed입니다.","default":null,"original_help":"seed: Optional integer seed for stochastic definitions; omit for deterministic ones."},{"name":"timeout_s","type":"float","required":false,"label":"timeout_s","hint":"캡슐 실행 제한 시간(초). 원본은 0 초과, 600 이하를 검사합니다.","default":60.0,"original_help":"timeout_s: Solver budget in seconds (default 60, max 600)."}],"returns":"str","signature":"def run_gh_definition(capsule_id: str, inputs: dict, seed: int | None = None, timeout_s: float = 60.0) -> str","source":"https://github.com/liangjunglj-cpu/almond-mcp/blob/c42b9210f0feeda2f70699221733470ef82213f2/almond_mcp/server.py","body":"manifest = retrieval_store.get_capsule(capsule_id)\n# audited / unknown inputs / missing required / per-port type / timeout 검사\nproblems = [_capsule_input_error(ports[name], inputs[name]) for name in sorted(inputs)]\nreturn _send_and_receive(payload, timeout=float(timeout_s) + 15.0)","outputs":{"status":"〈실행 상태〉","capsule_id":"〈ID〉","outputs":{"ALMOND_OUT_<name>":"〈포트별 결과〉"},"baked_guids":["〈객체 GUID〉"],"analysis_method":"〈api / template / rule_based〉","confidence":"〈high / medium / low〉","warnings":"〈경고〉","error":"〈오류 정보〉"},"branches":[{"label":"캡슐 없음","when":"capsule_id가 없을 때","data":{"status":"error","message":"Unknown capsule_id: <capsule_id>. Use list_capsules() to discover capsules.","available_capsules":["〈사용 가능한 캡슐 ID〉"]},"links":[{"target":"list_capsules","kind":"response","quote":"Use list_capsules() to discover capsules.","label":"캡슐 목록 확인","when":"","field":"message"}]},{"label":"포트 이름 오류","when":"inputs에 선언되지 않은 포트 이름이 있을 때","data":{"status":"error","message":"Unknown input name(s) for '<capsule_id>': <names>.","valid_inputs":["〈유효 포트 이름〉"]},"links":[]},{"label":"필수 포트 누락","when":"required 포트 값이 빠졌을 때","data":{"status":"error","message":"Missing required input(s) for '<capsule_id>': <names>.","valid_inputs":["〈유효 포트 이름〉"]},"links":[]},{"label":"캡슐 미검증","when":"audited=false일 때","data":{"status":"error","message":"Capsule '<capsule_id>' is not audited: its definition has no verified ALMOND_IN_*/ALMOND_OUT_* harness params, so run_gh_definition refuses to execute it. It remains available as retrieval context (get_logic_by_id). See capsules/AUTHORING.md for how to harness and audit the definition."},"links":[{"target":"get_logic_by_id","kind":"response","quote":"It remains available as retrieval context (get_logic_by_id).","label":"캡슐 맥락만 조회","when":"","field":"message"}]}],"annotations":null,"links":[{"target":"list_capsules","kind":"before","quote":"call list_capsules() first to pick a capsule_id","label":"캡슐 ID·포트 이름의 출처","when":"","field":""},{"target":"execute_rhino_script","kind":"before","quote":"Create any geometry with execute_rhino_script, then pass the returned GUIDs here.","label":"형상 포트에 넣을 GUID 생성","when":"","field":""}],"success_label":"정상 반환","success_when":"입력이 유효하고 요청이 처리됐을 때","response_links":[],"pre_links":[{"target":"list_capsules","kind":"before","quote":"call list_capsules() first to pick a capsule_id","label":"캡슐 ID·포트 이름의 출처","when":"","field":""},{"target":"execute_rhino_script","kind":"before","quote":"Create any geometry with execute_rhino_script, then pass the returned GUIDs here.","label":"형상 포트에 넣을 GUID 생성","when":"","field":""}],"internal_links":[],"outputs_title":"실행에 따라 채워지는 반환 구조","schema":{"type":"object","properties":{"capsule_id":{"type":"string","description":"capsule_id: Stable capsule identifier from list_capsules (e.g. \"karamba_beam_v1\")."},"inputs":{"type":"object","additionalProperties":true,"description":"inputs: Object mapping ALMOND_IN_* port names to values (forms above)."},"seed":{"type":["integer","null"],"default":null,"description":"seed: Optional integer seed for stochastic definitions; omit for deterministic ones."},"timeout_s":{"type":"number","default":60.0,"description":"timeout_s: Solver budget in seconds (default 60, max 600)."}},"additionalProperties":false,"required":["capsule_id","inputs"]},"nexts":[]},"list_design_codes":{"name":"list_design_codes","title":"구조 설계 기준 목록","group":"structure","summary":"검증·시각화에 넣을 design_code ID와 계수·기준 정보를 받습니다.","doc":"Lists the design code profiles validate_structure / visualize_structure accept as design_code.\n\nA profile holds the numbers a design code or National Annex sets (load factors gamma_G,\ngamma_Q, psi_0, xi; the ULS expression; material factors gamma_M0, gamma_M1; the deflection\nlimit; suggested imposed floor loads), each with its source clause and a verified flag.\n\"eurocode\" (EN recommended values) is built in and the default; \"off\" is unfactored mechanics.\nPractices add National Annex profiles as JSON files in user_dir (see docs/design-codes.md).\nUnverified values are allowed but flagged in every result that uses them.\n\nReturns JSON: default, profiles [{id, name, basis, origin, verified, unverified,\nuls_expression, uls_default, deflection_limit_ratio, imposed_floor_kn_m2}], problems\n(files that failed validation), user_dir.","params":[],"returns":"str","signature":"def list_design_codes() -> str","source":"https://github.com/liangjunglj-cpu/almond-mcp/blob/c42b9210f0feeda2f70699221733470ef82213f2/almond_mcp/server.py","body":"return json.dumps(design_codes.listing())","outputs":{"default":"〈기본 기준 ID〉","profiles":["〈기준 ID·이름·계수·확인 여부〉"],"problems":"〈읽기·검증 실패 파일〉","user_dir":"〈기준 폴더〉"},"branches":[],"annotations":null,"links":[{"target":"validate_structure","kind":"description","quote":"Lists the design code profiles validate_structure / visualize_structure accept as design_code.","label":"design_code를 구조 검증에 입력","when":"","field":"","mapping":[["선택한 profiles[].id","design_code"]]},{"target":"visualize_structure","kind":"description","quote":"Lists the design code profiles validate_structure / visualize_structure accept as design_code.","label":"design_code를 구조 시각화에 입력","when":"","field":"","mapping":[["선택한 profiles[].id","design_code"]]}],"success_label":"정상 반환","success_when":"조회가 처리됐을 때; 결과가 비어 있을 수도 있음","response_links":[],"pre_links":[{"target":"validate_structure","kind":"description","quote":"Lists the design code profiles validate_structure / visualize_structure accept as design_code.","label":"design_code를 구조 검증에 입력","when":"","field":"","mapping":[["선택한 profiles[].id","design_code"]]},{"target":"visualize_structure","kind":"description","quote":"Lists the design code profiles validate_structure / visualize_structure accept as design_code.","label":"design_code를 구조 시각화에 입력","when":"","field":"","mapping":[["선택한 profiles[].id","design_code"]]}],"internal_links":[],"outputs_title":"실행에 따라 채워지는 반환 구조","schema":{"type":"object","properties":{},"additionalProperties":false},"nexts":["validate_structure","visualize_structure"]},"validate_structure":{"name":"validate_structure","title":"구조 검증","group":"structure","summary":"객체 GUID·구조 유형·하중·재료를 입력합니다. 수치 결과와 판정·수정 제안·문제 부재 GUID를 받습니다.","doc":"Validates AI-generated geometry with a structural analysis.\nCall this AFTER execute_rhino_script to verify the generated structure is buildable.\n\nengine=\"auto\" (default) analyses line models (beams, columns, trusses, frames) with\nAlmond's built-in 3D frame solver: analysis_method \"native\", confidence \"high\",\nno Karamba install needed. It is a linear-elastic first-order frame analysis with\nEN 1993-1-1 member checks (elastic moduli; flexural buckling with L_cr = member\nlength; no lateral-torsional buckling), benchmarked against closed-form results\nand live Karamba runs. Models with shells, and shell/gridshell/membrane structure\ntypes, go to Karamba. engine=\"karamba\" forces the Karamba route, which tries three\npathways in strict order of confidence and always tells you which one ran:\n    analysis_method \"api\"        — direct Karamba 3.1 API solve, confidence \"high\"\n    analysis_method \"template\"   — audited capsule GHX template, confidence \"medium\"\n    analysis_method \"rule_based\" — heuristic span/slenderness rules, confidence \"low\"\nThe verdict string names the method (e.g. \"[RULE-BASED ESTIMATE, LOW CONFIDENCE] ...\").\nTreat rule_based/low results as estimates, NOT finite element analysis, and say so\nwhen reporting to the user.\n\nIf the structure FAILS, modify the design (add supports, increase member size,\nchange material) and call execute_rhino_script + validate_structure again.\nWhen worst_member_guids is present, edit only those offending members instead\nof regenerating everything. Iterate up to 3 times before reporting the best attempt.\n\nArgs:\n    guids: List of Rhino object GUID strings from execute_rhino_script output.\n    structure_type: Analysis template to use. Options:\n        \"beam\"       — simple beam bending/deflection\n        \"truss\"      — axial force/buckling analysis\n        \"shell\"      — shell stress/displacement\n        \"frame\"      — moment/shear frame analysis\n        \"canopy\"     — cantilevered canopy\n        \"gridshell\"  — large deformation gridshell\n        \"membrane\"   — form-finding membrane\n        \"highrise\"   — high-rise structural systems\n    load_kn: Applied load in kN (default 10.0).\n    material: Material type: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\" (default \"Steel\").\n    engine: \"auto\" | \"native\" | \"karamba\" (see above).\n    fixed_supports: True = fully fixed supports, False = pinned (rotations free).\n    self_weight: include member self weight.\n    span_m: structural span in meters for the L/250 limit when members are split at\n        every node (e.g. a 6.2 m joist drawn as two 3.1 m segments). Native engine only.\n    asset_loads: add the gravity loads of placed library assets (estimated self weight\n        plus in-use contents/occupants from each asset's load entry, e.g. a filled\n        bathtub) where they stand on (or hang from) the frame. Placements come from\n        Rhino objects tagged with an Almond asset id, or from the scene ledger when\n        scene_id is given. Native engine only; the result's \"asset_loads\" lists every\n        placement with its load and carrying members, or why it was not applied.\n    scene_id: scene ledger to read placements from (default: tagged Rhino objects).\n    floor_load_kn_m2: imposed floor load in kN/m2 (e.g. 2.0 for homes, EN 1991-1-1\n        category A) on every bay enclosed by beams on a level; the beams take it by the\n        45-degree rule (two-way, one-way above 2:1). Native engine only. A code floor load\n        already covers movable furniture and people: combine it with asset_loads only for\n        heavy specific items, and set load_kn to 0 to avoid double counting.\n    floor_dead_kn_m2: superimposed dead load in kN/m2 (floor build-up, finishes) on the\n        same bays.\n    design_basis: \"en1990\" (default): deflection at SLS characteristic (G + Q), member\n        checks at ULS 1.35 G + 1.5 Q. G = self weight, floor build-up and the weight of\n        placed items; Q = load_kn, the occupancy floor load, contents and occupants.\n        \"unfactored\" checks both at G + Q (the Karamba route's basis). Native engine.\n    uls_combination: \"6.10\" or \"6.10ab\" (the worse of 6.10a and 6.10b per member). Default:\n        the design code's choice (Eurocode profile: 6.10). A profile that prescribes one\n        expression overrides the request (with a warning).\n    design_code: design code profile for the numbers a code or National Annex sets\n        (gamma_G, gamma_Q, psi_0, xi, gamma_M0, gamma_M1, deflection limit): \"eurocode\"\n        (default, EN recommended values), any profile from list_design_codes, or \"off\"\n        (unfactored G + Q, no partial factors; same as design_basis=\"unfactored\").\n        Results carry \"design_code\" with the values used and any unverified ones.\n    fabrication: hollow steel sections (CHS/RHS) are \"cold_formed\" (default, EN 10219,\n        buckling curve c) or \"hot_finished\" (EN 10210, curve a; a0 for S460). The difference\n        is up to about 23 % in buckling resistance; use hot_finished only when specified.\n    detail: native engine only. Adds \"members\" (per member: role, length, section, ULS design\n        forces N/V/M/T, governing combination and check, slenderness, chi, stress,\n        utilization, SLS deflection and span/deflection ratio, pinned ends) and \"supports\"\n        (reactions Fx..Mz at SLS and each ULS combination). Off by default to keep replies short.\n    connections: \"rigid\" (default: every joint transmits moment) or \"simple\": beams are\n        pinned (major-axis bending released) and braces pinned in both axes where they\n        stop - not where another member carries on in line - while columns stay\n        continuous. Typical bolted steel and timber framing is closer to \"simple\"; rigid\n        joints can flatter beam deflection. A curve's user text almond:release = \"pinned\" |\n        \"pinned_start\" | \"pinned_end\" | \"rigid\" overrides either mode. Native engine.\n    stability: \"auto\" (default): elastic critical load factor alpha_cr for every ULS\n        combination (EN 1993-1-1 5.2.1) and sway imperfections phi = 1/200 x alpha_h x alpha_m\n        (5.3.2) in +/-x and +/-y; alpha_cr < 10 runs a second-order (P-Delta) ULS analysis,\n        alpha_cr <= 1 fails as unstable. \"off\": first-order without imperfections.\nPrefer calling get_construction_guidance BEFORE generating the geometry:\npick a real construction system and size members from its depth/spacing\nrules. This tool cross-checks the analyzed span against that same library\nand appends a \"construction_check\" object (matching_systems with\nfits_span and suggested member depths, plus warnings when the span falls\noutside every curated system's range for this structure_type/material).\n\nReturns:    JSON from the bridge plus the construction_check. Top-level fields: status\n    (\"pass\"|\"fail\"|\"error\"), passed (bool), verdict (text), suggestions,\n    confidence (\"high\"|\"medium\"|\"low\"), warnings, and worst_member_guids\n    (up to 5 Rhino GUIDs of the most over-utilized members — edit those\n    first). The results object carries the numbers: max_deflection_mm,\n    deflection_limit_mm, utilization_ratio, max_stress_mpa, yield_stress_mpa,\n    span_m, analysis_method (\"native\"|\"api\"|\"template\"|\"rule_based\"), reactions_kn\n    (total vertical reaction, api path only), and per_element_utilization —\n    a list of {source_guids, utilization} entries (utilization 1.0 = at\n    capacity) keyed back to the Rhino objects that produced each element.","params":[{"name":"guids","type":"list[str]","required":true,"label":"guids","hint":"GUID는 설명용입니다. 실제 호출에서는 Rhino 문서에서 받은 객체 ID를 사용합니다.","example":["11111111-1111-4111-8111-111111111111"],"original_help":"guids: List of Rhino object GUID strings from execute_rhino_script output."},{"name":"structure_type","type":"str","required":false,"label":"structure_type","hint":"구조 유형 이름. 허용·권장 값은 원본 설명을 따릅니다.","default":"beam","choices":["beam","truss","shell","frame","canopy","gridshell","membrane","highrise"],"original_help":"structure_type: Analysis template to use. Options:\n        \"beam\"       — simple beam bending/deflection\n        \"truss\"      — axial force/buckling analysis\n        \"shell\"      — shell stress/displacement\n        \"frame\"      — moment/shear frame analysis\n        \"canopy\"     — cantilevered canopy\n        \"gridshell\"  — large deformation gridshell\n        \"membrane\"   — form-finding membrane\n        \"highrise\"   — high-rise structural systems"},{"name":"load_kn","type":"float","required":false,"label":"load_kn","hint":"","default":10.0,"original_help":"load_kn: Applied load in kN (default 10.0)."},{"name":"material","type":"str","required":false,"label":"material","hint":"","default":"Steel","original_help":"material: Material type: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\" (default \"Steel\")."},{"name":"engine","type":"str","required":false,"label":"engine","hint":"","default":"auto","choices":["auto","native","karamba"],"original_help":"engine: \"auto\" | \"native\" | \"karamba\" (see above)."},{"name":"fixed_supports","type":"bool","required":false,"label":"fixed_supports","hint":"","default":true,"original_help":"fixed_supports: True = fully fixed supports, False = pinned (rotations free)."},{"name":"self_weight","type":"bool","required":false,"label":"self_weight","hint":"","default":true,"original_help":"self_weight: include member self weight."},{"name":"span_m","type":"float | None","required":false,"label":"span_m","hint":"검토 경간(m).","default":null,"original_help":"span_m, analysis_method (\"native\"|\"api\"|\"template\"|\"rule_based\"), reactions_kn\n    (total vertical reaction, api path only), and per_element_utilization —\n    a list of {source_guids, utilization} entries (utilization 1.0 = at\n    capacity) keyed back to the Rhino objects that produced each element."},{"name":"asset_loads","type":"bool","required":false,"label":"asset_loads","hint":"","default":false,"original_help":"asset_loads: add the gravity loads of placed library assets (estimated self weight\n        plus in-use contents/occupants from each asset's load entry, e.g. a filled\n        bathtub) where they stand on (or hang from) the frame. Placements come from\n        Rhino objects tagged with an Almond asset id, or from the scene ledger when\n        scene_id is given. Native engine only; the result's \"asset_loads\" lists every\n        placement with its load and carrying members, or why it was not applied."},{"name":"scene_id","type":"str","required":false,"label":"scene_id","hint":"Scene을 생성하거나 조회해 얻은 ID입니다.","default":"","original_help":"scene_id: scene ledger to read placements from (default: tagged Rhino objects).\n    floor_load_kn_m2: imposed floor load in kN/m2 (e.g. 2.0 for homes, EN 1991-1-1\n        category A) on every bay enclosed by beams on a level; the beams take it by the\n        45-degree rule (two-way, one-way above 2:1). Native engine only. A code floor load\n        already covers movable furniture and people: combine it with asset_loads only for\n        heavy specific items, and set load_kn to 0 to avoid double counting.\n    floor_dead_kn_m2: superimposed dead load in kN/m2 (floor build-up, finishes) on the\n        same bays."},{"name":"floor_load_kn_m2","type":"float","required":false,"label":"floor_load_kn_m2","hint":"","default":0.0,"original_help":"floor_load_kn_m2: imposed floor load in kN/m2 (e.g. 2.0 for homes, EN 1991-1-1\n        category A) on every bay enclosed by beams on a level; the beams take it by the\n        45-degree rule (two-way, one-way above 2:1). Native engine only. A code floor load\n        already covers movable furniture and people: combine it with asset_loads only for\n        heavy specific items, and set load_kn to 0 to avoid double counting.\n    floor_dead_kn_m2: superimposed dead load in kN/m2 (floor build-up, finishes) on the\n        same bays."},{"name":"floor_dead_kn_m2","type":"float","required":false,"label":"floor_dead_kn_m2","hint":"","default":0.0,"original_help":"floor_dead_kn_m2: superimposed dead load in kN/m2 (floor build-up, finishes) on the\n        same bays."},{"name":"design_basis","type":"str","required":false,"label":"design_basis","hint":"","default":"en1990","choices":["en1990","unfactored"],"original_help":"design_basis: \"en1990\" (default): deflection at SLS characteristic (G + Q), member\n        checks at ULS 1.35 G + 1.5 Q. G = self weight, floor build-up and the weight of\n        placed items; Q = load_kn, the occupancy floor load, contents and occupants.\n        \"unfactored\" checks both at G + Q (the Karamba route's basis). Native engine."},{"name":"uls_combination","type":"str | None","required":false,"label":"uls_combination","hint":"","default":null,"original_help":"uls_combination: \"6.10\" or \"6.10ab\" (the worse of 6.10a and 6.10b per member). Default:\n        the design code's choice (Eurocode profile: 6.10). A profile that prescribes one\n        expression overrides the request (with a warning)."},{"name":"connections","type":"str","required":false,"label":"connections","hint":"","default":"rigid","choices":["rigid","simple"],"original_help":"connections: \"rigid\" (default: every joint transmits moment) or \"simple\": beams are\n        pinned (major-axis bending released) and braces pinned in both axes where they\n        stop - not where another member carries on in line - while columns stay\n        continuous. Typical bolted steel and timber framing is closer to \"simple\"; rigid\n        joints can flatter beam deflection. A curve's user text almond:release = \"pinned\" |\n        \"pinned_start\" | \"pinned_end\" | \"rigid\" overrides either mode. Native engine."},{"name":"stability","type":"str","required":false,"label":"stability","hint":"","default":"auto","choices":["auto","off"],"original_help":"stability: \"auto\" (default): elastic critical load factor alpha_cr for every ULS\n        combination (EN 1993-1-1 5.2.1) and sway imperfections phi = 1/200 x alpha_h x alpha_m\n        (5.3.2) in +/-x and +/-y; alpha_cr < 10 runs a second-order (P-Delta) ULS analysis,\n        alpha_cr <= 1 fails as unstable. \"off\": first-order without imperfections."},{"name":"design_code","type":"str","required":false,"label":"design_code","hint":"","default":"eurocode","original_help":"design_code: design code profile for the numbers a code or National Annex sets\n        (gamma_G, gamma_Q, psi_0, xi, gamma_M0, gamma_M1, deflection limit): \"eurocode\"\n        (default, EN recommended values), any profile from list_design_codes, or \"off\"\n        (unfactored G + Q, no partial factors; same as design_basis=\"unfactored\").\n        Results carry \"design_code\" with the values used and any unverified ones."},{"name":"detail","type":"bool","required":false,"label":"detail","hint":"true이면 native 해석의 부재·지점 상세를 추가합니다.","default":false,"original_help":"detail: native engine only. Adds \"members\" (per member: role, length, section, ULS design\n        forces N/V/M/T, governing combination and check, slenderness, chi, stress,\n        utilization, SLS deflection and span/deflection ratio, pinned ends) and \"supports\"\n        (reactions Fx..Mz at SLS and each ULS combination). Off by default to keep replies short."},{"name":"fabrication","type":"str","required":false,"label":"fabrication","hint":"","default":"cold_formed","choices":["cold_formed","hot_finished"],"original_help":"fabrication: hollow steel sections (CHS/RHS) are \"cold_formed\" (default, EN 10219,\n        buckling curve c) or \"hot_finished\" (EN 10210, curve a; a0 for S460). The difference\n        is up to about 23 % in buckling resistance; use hot_finished only when specified."}],"returns":"str","signature":"def validate_structure(guids: list[str], structure_type: str = \"beam\", load_kn: float = 10.0, material: str = \"Steel\", engine: str = \"auto\", fixed_supports: bool = True, self_weight: bool = True, span_m: float | None = None, asset_loads: bool = False, scene_id: str = \"\", floor_load_kn_m2: float = 0.0, floor_dead_kn_m2: float = 0.0, design_basis: str = \"en1990\", uls_combination: str | None = None, connections: str = \"rigid\", stability: str = \"auto\", design_code: str = \"eurocode\", detail: bool = False, fabrication: str = \"cold_formed\") -> str","source":"https://github.com/liangjunglj-cpu/almond-mcp/blob/c42b9210f0feeda2f70699221733470ef82213f2/almond_mcp/server.py","body":"if engine == \"native\" or (engine == \"auto\" and structure_type.lower() not in KARAMBA_ONLY_TYPES):\n    result, note = _native_validation(...)\n# result가 없으면 Karamba 경로의 결과를 받음\n# status=pass/fail이면 construction_check를 추가하고 이력을 기록\nreturn json.dumps(result)","outputs":{"status":"〈pass / fail〉","passed":"〈true / false〉","verdict":"〈판정 문장〉","suggestions":"〈수정 제안〉","confidence":"〈high / medium / low〉","warnings":"〈경고〉","worst_member_guids":["〈문제 부재 GUID〉"],"results":{"analysis_method":"〈native / api / template / rule_based〉","max_deflection_mm":"〈최대 처짐〉","deflection_limit_mm":"〈허용 처짐〉","utilization_ratio":"〈검토비〉","max_stress_mpa":"〈응력〉","yield_stress_mpa":"〈항복 응력〉","span_m":"〈경간〉","per_element_utilization":[{"source_guids":["〈GUID〉"],"utilization":"〈검토비〉"}]},"construction_check":"〈구축 시스템 교차 확인〉"},"branches":[{"label":"engine 입력 오류","when":"지원하지 않는 engine일 때","data":{"status":"error","message":"engine must be 'auto', 'native' or 'karamba'."},"links":[]},{"label":"Karamba + 에셋 하중","when":"engine=karamba인데 asset_loads=true일 때","data":{"status":"error","message":"asset_loads needs the native engine (engine='auto' or 'native')."},"links":[]}],"annotations":null,"links":[{"target":"execute_rhino_script","kind":"before","quote":"Call this AFTER execute_rhino_script","label":"검증할 형상의 GUID 생성","when":"","field":""},{"target":"get_construction_guidance","kind":"before","quote":"Prefer calling get_construction_guidance BEFORE generating the geometry:","label":"구축 방식·예비 치수 먼저 확인","when":"","field":""},{"target":"execute_rhino_script","kind":"description","quote":"If the structure FAILS, modify the design (add supports, increase member size, change material) and call execute_rhino_script + validate_structure again.","label":"문제 부재 수정 후 재검증","when":"구조가 FAIL일 때","field":""}],"success_label":"정상 반환","success_when":"입력이 유효하고 요청이 처리됐을 때","optional_output":"pass/fail일 때 construction_check를 붙입니다. detail=true인 native 결과는 members·supports 상세를 추가합니다. 해석 경로와 선택에 따라 결과 필드가 달라집니다.","response_links":[],"pre_links":[{"target":"execute_rhino_script","kind":"before","quote":"Call this AFTER execute_rhino_script","label":"검증할 형상의 GUID 생성","when":"","field":""},{"target":"get_construction_guidance","kind":"before","quote":"Prefer calling get_construction_guidance BEFORE generating the geometry:","label":"구축 방식·예비 치수 먼저 확인","when":"","field":""},{"target":"execute_rhino_script","kind":"description","quote":"If the structure FAILS, modify the design (add supports, increase member size, change material) and call execute_rhino_script + validate_structure again.","label":"문제 부재 수정 후 재검증","when":"구조가 FAIL일 때","field":""}],"internal_links":[],"outputs_title":"실행에 따라 채워지는 반환 구조","schema":{"type":"object","properties":{"guids":{"type":"array","items":{"type":"string"},"description":"guids: List of Rhino object GUID strings from execute_rhino_script output."},"structure_type":{"type":"string","default":"beam","description":"structure_type: Analysis template to use. Options:\n        \"beam\"       — simple beam bending/deflection\n        \"truss\"      — axial force/buckling analysis\n        \"shell\"      — shell stress/displacement\n        \"frame\"      — moment/shear frame analysis\n        \"canopy\"     — cantilevered canopy\n        \"gridshell\"  — large deformation gridshell\n        \"membrane\"   — form-finding membrane\n        \"highrise\"   — high-rise structural systems"},"load_kn":{"type":"number","default":10.0,"description":"load_kn: Applied load in kN (default 10.0)."},"material":{"type":"string","default":"Steel","description":"material: Material type: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\" (default \"Steel\")."},"engine":{"type":"string","default":"auto","description":"engine: \"auto\" | \"native\" | \"karamba\" (see above)."},"fixed_supports":{"type":"boolean","default":true,"description":"fixed_supports: True = fully fixed supports, False = pinned (rotations free)."},"self_weight":{"type":"boolean","default":true,"description":"self_weight: include member self weight."},"span_m":{"type":["number","null"],"default":null,"description":"span_m, analysis_method (\"native\"|\"api\"|\"template\"|\"rule_based\"), reactions_kn\n    (total vertical reaction, api path only), and per_element_utilization —\n    a list of {source_guids, utilization} entries (utilization 1.0 = at\n    capacity) keyed back to the Rhino objects that produced each element."},"asset_loads":{"type":"boolean","default":false,"description":"asset_loads: add the gravity loads of placed library assets (estimated self weight\n        plus in-use contents/occupants from each asset's load entry, e.g. a filled\n        bathtub) where they stand on (or hang from) the frame. Placements come from\n        Rhino objects tagged with an Almond asset id, or from the scene ledger when\n        scene_id is given. Native engine only; the result's \"asset_loads\" lists every\n        placement with its load and carrying members, or why it was not applied."},"scene_id":{"type":"string","default":"","description":"scene_id: scene ledger to read placements from (default: tagged Rhino objects).\n    floor_load_kn_m2: imposed floor load in kN/m2 (e.g. 2.0 for homes, EN 1991-1-1\n        category A) on every bay enclosed by beams on a level; the beams take it by the\n        45-degree rule (two-way, one-way above 2:1). Native engine only. A code floor load\n        already covers movable furniture and people: combine it with asset_loads only for\n        heavy specific items, and set load_kn to 0 to avoid double counting.\n    floor_dead_kn_m2: superimposed dead load in kN/m2 (floor build-up, finishes) on the\n        same bays."},"floor_load_kn_m2":{"type":"number","default":0.0,"description":"floor_load_kn_m2: imposed floor load in kN/m2 (e.g. 2.0 for homes, EN 1991-1-1\n        category A) on every bay enclosed by beams on a level; the beams take it by the\n        45-degree rule (two-way, one-way above 2:1). Native engine only. A code floor load\n        already covers movable furniture and people: combine it with asset_loads only for\n        heavy specific items, and set load_kn to 0 to avoid double counting.\n    floor_dead_kn_m2: superimposed dead load in kN/m2 (floor build-up, finishes) on the\n        same bays."},"floor_dead_kn_m2":{"type":"number","default":0.0,"description":"floor_dead_kn_m2: superimposed dead load in kN/m2 (floor build-up, finishes) on the\n        same bays."},"design_basis":{"type":"string","default":"en1990","description":"design_basis: \"en1990\" (default): deflection at SLS characteristic (G + Q), member\n        checks at ULS 1.35 G + 1.5 Q. G = self weight, floor build-up and the weight of\n        placed items; Q = load_kn, the occupancy floor load, contents and occupants.\n        \"unfactored\" checks both at G + Q (the Karamba route's basis). Native engine."},"uls_combination":{"type":["string","null"],"default":null,"description":"uls_combination: \"6.10\" or \"6.10ab\" (the worse of 6.10a and 6.10b per member). Default:\n        the design code's choice (Eurocode profile: 6.10). A profile that prescribes one\n        expression overrides the request (with a warning)."},"connections":{"type":"string","default":"rigid","description":"connections: \"rigid\" (default: every joint transmits moment) or \"simple\": beams are\n        pinned (major-axis bending released) and braces pinned in both axes where they\n        stop - not where another member carries on in line - while columns stay\n        continuous. Typical bolted steel and timber framing is closer to \"simple\"; rigid\n        joints can flatter beam deflection. A curve's user text almond:release = \"pinned\" |\n        \"pinned_start\" | \"pinned_end\" | \"rigid\" overrides either mode. Native engine."},"stability":{"type":"string","default":"auto","description":"stability: \"auto\" (default): elastic critical load factor alpha_cr for every ULS\n        combination (EN 1993-1-1 5.2.1) and sway imperfections phi = 1/200 x alpha_h x alpha_m\n        (5.3.2) in +/-x and +/-y; alpha_cr < 10 runs a second-order (P-Delta) ULS analysis,\n        alpha_cr <= 1 fails as unstable. \"off\": first-order without imperfections."},"design_code":{"type":"string","default":"eurocode","description":"design_code: design code profile for the numbers a code or National Annex sets\n        (gamma_G, gamma_Q, psi_0, xi, gamma_M0, gamma_M1, deflection limit): \"eurocode\"\n        (default, EN recommended values), any profile from list_design_codes, or \"off\"\n        (unfactored G + Q, no partial factors; same as design_basis=\"unfactored\").\n        Results carry \"design_code\" with the values used and any unverified ones."},"detail":{"type":"boolean","default":false,"description":"detail: native engine only. Adds \"members\" (per member: role, length, section, ULS design\n        forces N/V/M/T, governing combination and check, slenderness, chi, stress,\n        utilization, SLS deflection and span/deflection ratio, pinned ends) and \"supports\"\n        (reactions Fx..Mz at SLS and each ULS combination). Off by default to keep replies short."},"fabrication":{"type":"string","default":"cold_formed","description":"fabrication: hollow steel sections (CHS/RHS) are \"cold_formed\" (default, EN 10219,\n        buckling curve c) or \"hot_finished\" (EN 10210, curve a; a0 for S460). The difference\n        is up to about 23 % in buckling resistance; use hot_finished only when specified."}},"additionalProperties":false,"required":["guids"]},"nexts":["execute_rhino_script"]},"visualize_structure":{"name":"visualize_structure","title":"구조 거동 표시","group":"structure","summary":"구조 해석을 Rhino 화면에 오버레이로 표시합니다. 결과 응답은 이미지가 아니라 판정·수치 JSON입니다.","doc":"Run a live structural analysis on a line model and SHOW it in every Rhino viewport:\nthe undeformed wireframe, the exaggerated deformed shape coloured blue -> red by\ndisplacement (or by utilization), supports, load arrows and a legend panel with\nmax deflection, the L/limit check and PASS/FAIL. Nothing is baked into the document.\n\nUse it to make structural behaviour visible while designing: model the structural\naxes as curves, include Rhino point objects at the supports, call this tool, then\nfix the members it shows in red (add a column, shorten a cantilever, upsize the\nsection via beam_diameter_mm) and call it again. validate_structure gives the\nauditable verdict; this tool is the visual, iterative view of the same solve.\n\nArgs:\n    guids: Curve GUIDs of the structural axes plus point GUIDs marking supports\n        (see fixed_supports). Without points, the lowest nodes are supported.\n    load_kn: Total imposed load in kN, shared equally by the free nodes (-Z).\n    material: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\".\n    beam_diameter_mm, beam_wall_mm: circular hollow section for every member\n        (default: inferred / CHS 114.3x4).\n    self_weight: include gravity.\n    fixed_supports: True = fully fixed supports, False = pinned (rotations free).\n    deflection_limit_ratio: span/ratio limit, e.g. 250 for L/250. Default: the design code's\n        limit (Eurocode profile: 250).\n    span_m: reference span in meters for the limit (default: longest member).\n        Set it when members are split at every node, e.g. a 6.2 m joist drawn\n        as two 3.1 m segments.\n    color_by: \"displacement\" or \"utilization\".\n    scale: deformation exaggeration; omit for automatic (~6% of span).\n    reveal: 0..1 fraction of members drawn (for staged construction playback).\n    reanalyze: False re-uses the last solve and only changes the display\n        (scale / color_by / reveal / physics / title) - cheap enough to animate.\n    physics: False draws the same members as plain geometry with no analysis\n        overlay (\"physics off\"), for before/after comparisons.\n    display_guids: draw only these members (e.g. one frame line for a section\n        view); the analysis still covers every member in guids.\n    title: legend title.\n    clear: remove the overlay.\n    engine: \"auto\" (default: Almond's native frame solver, no Karamba needed; Karamba\n        when the selection has shells or the bridge cannot export a model),\n        \"native\" or \"karamba\".\n    asset_loads, scene_id: add the loads of placed library assets (native engine), as in\n        validate_structure; loaded points are drawn with load arrows.\n    floor_load_kn_m2, floor_dead_kn_m2: floor area loads on every enclosed bay, as in\n        validate_structure.\n    design_basis, uls_combination, design_code: as in validate_structure; the overlay draws\n        the SLS deflected shape coloured by the ULS utilization envelope.\n    connections: \"rigid\" or \"simple\", as in validate_structure; pinned ends are drawn\n        as small circles.\n    stability: \"auto\" or \"off\", as in validate_structure.\n    view: \"deflection\" (default) or \"buckling\": draw the first buckling mode of the\n        governing ULS combination with its alpha_cr (STABLE >= 10, SWAY-SENSITIVE 1-10,\n        UNSTABLE <= 1) instead of the deflected shape.\n\nReturns JSON: status (\"pass\"|\"fail\"|\"error\"|\"cleared\"), max_displacement_mm,\ndeflection_limit_mm, span_m, max_utilization, scale, per-element\n{source_guids, max_displacement_mm, utilization}, warnings.\nThe native engine reports analysis_method \"native\"; engine=\"karamba\" needs\nKaramba3D 3.1 (the trial caps models at 20 beam elements).","params":[{"name":"guids","type":"list[str] | None","required":false,"label":"guids","hint":"GUID는 설명용입니다. 실제 호출에서는 Rhino 문서에서 받은 객체 ID를 사용합니다.","default":null,"original_help":"guids: Curve GUIDs of the structural axes plus point GUIDs marking supports\n        (see fixed_supports). Without points, the lowest nodes are supported.","example":["11111111-1111-4111-8111-111111111111"]},{"name":"load_kn","type":"float","required":false,"label":"load_kn","hint":"","default":10.0,"original_help":"load_kn: Total imposed load in kN, shared equally by the free nodes (-Z)."},{"name":"material","type":"str","required":false,"label":"material","hint":"","default":"Steel","original_help":"material: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\"."},{"name":"beam_diameter_mm","type":"float | None","required":false,"label":"beam_diameter_mm","hint":"","default":null,"original_help":"beam_d / title) - cheap enough to animate."},{"name":"physics","type":"bool","required":false,"label":"physics","hint":"","default":true,"original_help":"physics: False draws the same members as plain geometry with no analysis\n        overlay (\"physics off\"), for before/after comparisons."},{"name":"display_guids","type":"list[str] | None","required":false,"label":"display_guids","hint":"","default":null,"original_help":"display_guids: draw only these members (e.g. one frame line for a section\n        view); the analysis still covers every member in guids."},{"name":"title","type":"str","required":false,"label":"title","hint":"","default":"","original_help":"title: legend title."},{"name":"clear","type":"bool","required":false,"label":"clear","hint":"true이면 화면의 구조 오버레이를 제거합니다.","default":false,"original_help":"clear: remove the overlay."},{"name":"engine","type":"str","required":false,"label":"engine","hint":"","default":"auto","choices":["auto","native","karamba"],"original_help":"engine: \"auto\" (default: Almond's native frame solver, no Karamba needed; Karamba\n        when the selection has shells or the bridge cannot export a model),\n        \"native\" or \"karamba\"."},{"name":"asset_loads","type":"bool","required":false,"label":"asset_loads","hint":"","default":false,"original_help":"asset_loads, scene_id: add the loads of placed library assets (native engine), as in\n        validate_structure; loaded points are drawn with load arrows.\n    floor_load_kn_m2, floor_dead_kn_m2: floor area loads on every enclosed bay, as in\n        validate_structure."},{"name":"scene_id","type":"str","required":false,"label":"scene_id","hint":"Scene을 생성하거나 조회해 얻은 ID입니다.","default":""},{"name":"floor_load_kn_m2","type":"float","required":false,"label":"floor_load_kn_m2","hint":"","default":0.0,"original_help":"floor_load_kn_m2, floor_dead_kn_m2: floor area loads on every enclosed bay, as in\n        validate_structure."},{"name":"floor_dead_kn_m2","type":"float","required":fals ion-<timestamp>.md"},{"name":"limit","type":"int","required":false,"label":"limit","hint":"한 번에 받을 결과의 최대 개수입니다.","default":50,"original_help":"limit: Maximum number of runs to include (default 50, max 500)."}],"returns":"str","signature":"def export_structural_report(path: str = \"\", limit: int = 50) -> str","source":"https://github.com/liangjunglj-cpu/almond-mcp/blob/c42b9210f0feeda2f70699221733470ef82213f2/almond_mcp/server.py","body":"runs = retrieval_store.list_validation_runs(limit=limit)\ntarget.write_text(_render_validation_report(runs), encoding=\"utf-8\")\nreturn json.dumps({\"status\":\"success\", \"path\":str(target), \"runs\":len(runs), \"latest_method\":runs[0][\"analysis_method\"]})","outputs":{"status":"success","path":"〈저장된 .md 경로〉","runs":"〈포함한 검증 횟수〉","latest_method":"〈최근 해석 방식〉"},"branches":[{"label":"이력 없음","when":"검증 기록이 없을 때","data":{"status":"error","message":"No validation runs recorded yet - call validate_structure first."},"links":[{"target":"validate_structure","kind":"response","quote":"No validation runs recorded yet - call validate_structure first.","label":"먼저 구조 검증 실행","when":"","field":"message"}]}],"annotations":null,"links":[],"success_label":"정상 반환","success_when":"입력이 유효하고 요청이 처리됐을 때","response_links":[],"pre_links":[],"internal_links":[],"outputs_title":"실행에 따라 채워지는 반환 구조","schema":{"type":"object","properties":{"path":{"type":"string","default":"","description":"path: Output file path. Default:\n        <user data dir>/reports/structural-validation-<timestamp>.md"},"limit":{"type":"integer","default":50,"description":"limit: Maximum number of runs to include (default 50, max 500)."}},"additionalProperties":false},"nexts":[]},"capture_conditioning_pass":{"name":"capture_conditioning_pass","title":"경로별 RGB·선·깊이 캡처","group":"structure","summary":"shot에는 경로를 JSON 문자열로 넣습니다. 프레임·카메라 파일을 저장하고 요약 JSON을 받습니다.","doc":"Capture RGB + edge (line drawing) + depth frames along a camera path from the LIVE Rhino\ndocument, as conditioning for geometry-guided video generation (Wan VACE / ControlNet).\nDepth and edges are read from the model itself, not estimated, and every frame's camera is\nrecorded so the generated video can be re-projected against the source geometry.\n\nshot: JSON string describing the camera path (model units, usually mm). One of:\n  {\"type\":\"orbit\",\"center\":[x,y,z],\"radius\":r,\"height\":z,\"frames\":81,\n   \"start_deg\":0,\"end_deg\":90,\"lens\":35,\"target_height\":z}\n  {\"type\":\"track\",\"cam0\":[x,y,z],\"cam1\":[..],\"target0\":[..],\"target1\":[..],\"frames\":81,\"lens\":35}\n  {\"type\":\"keyframes\",\"keyframes\":[{\"camera\":[..],\"target\":[..],\"lens\":35}, ...],\"frames\":81}\nUse 4n+1 frames for Wan models (17, 33, 49, 65, 81). 81 frames = 5 s at 16 fps.\n\nWrites to out_dir: rgb/ edge/ depth/ (f0000.png ...), rgb.mp4 / edge.mp4 / depth.mp4\n(when ffmpeg is available), camera.json (per-frame camera receipt, schema building0.camera/0.1),\nzrange.csv (per-frame depth range), doc.json, summary.json. Depth is grayscale with near = bright\n(Rhino's native convention, what Wan/ControlNet depth expects); set invert_depth for near = dark.\nThe user's viewport camera is restored when the pass finishes. Returns the summary JSON.","params":[{"name":"shot","type":"str","required":true,"label":"shot","hint":"orbit / track / keyframes를 기술한 JSON을 문자열로 전달합니다.","example":"{\"type\": \"orbit\", \"center\": [0, 0, 0], \"radius\": 10000, \"height\": 5000, \"frames\": 17, \"start_deg\": 0, \"end_deg\": 90, \"lens\": 35}"},{"name":"out_dir","type":"str","required":true,"label":"out_dir","hint":"캡처 결과를 쓸 폴더입니다.","example":"C:/captures/shot-01"},{"name":"width","type":"int","required":false,"label":"width","hint":"","default":832},{"name":"height","type":"int","required":false,"label":"height","hint":"","default":480},{"name":"passes","type":"str","required":false,"label":"passes","hint":"","default":"rgb,edge,depth"},{"name":"fps","type":"int","required":false,"label":"fps","hint":"","default":16},{"name":"chunk","type":"int","required":false,"label":"chunk","hint":"","default":16},{"name":"rgb_mode","type":"str","required":false,"label":"rgb_mode","hint":"","default":"Rendered"},{"name":"edge_mode","type":"str","required":false,"label":"edge_mode","hint":"","default":"Technical"},{"name":"invert_depth","type":"bool","required":false,"label":"invert_depth","hint":"","default":false}],"returns":"str","signature":"def capture_conditioning_pass(shot: str, out_dir: str, width: int = 832, height: int = 480, passes: str = \"rgb,edge,depth\", fps: int = 16, chunk: int = 16, rgb_mode: str = \"Rendered\", edge_mode: str = \"Technical\", invert_depth: bool = False) -> str","source":"https://github.com/liangjunglj-cpu/almond-mcp/blob/c42b9210f0feeda2f70699221733470ef82213f2/almond_mcp/server.py","body":"shot_dict = json.loads(shot)\nframes = conditioning.build_path(shot_dict)\nsummary = conditioning.capture_conditioning_pass(frames, out_dir, _send_and_receive, ...)\nreturn json.dumps(summary)","outputs":{"status":"success","out_dir":"〈절대경로〉","frames_requested":"〈요청 프레임 수〉","frames_captured":"〈완료 프레임 수〉","passes":"〈[rgb, edge, depth] 중 요청한 pass〉","resolution":"〈[width, height]〉","fps":"〈입력 fps〉","camera_json":"〈camera.json 경로〉","videos":"〈각 pass의 mp4 경로 또는 null〉","document":"〈문서·단위·뷰·범위〉","errors":[]},"branches":[{"label":"shot 형식 오류","when":"JSON 해석 또는 경로 생성에 실패했을 때","data":{"status":"error","message":"Bad shot description: <error>"},"links":[]},{"label":"일부 프레임만 완료","when":"중간 청크에서 errors가 생겼을 때","data":{"status":"partial","out_dir":"〈절대경로〉","frames_requested":"〈요청 프레임 수〉","frames_captured":"〈완료 프레임 수〉","passes":"〈[rgb, edge, depth] 중 요청한 pass〉","resolution":"〈[width, height]〉","fps":"〈입력 fps〉","camera_json":"〈camera.json 경로〉","videos":"〈각 pass의 mp4 경로 또는 null〉","document":"〈문서·단위·뷰·범위〉","errors":[{"frames":"〈[실패 청크 시작, 끝 프레임]〉","message":"〈오류 내용〉"}]},"links":[]},{"label":"문서 정보 조회 실패","when":"첫 문서 정보 응답이 success가 아닐 때","data":{"status":"error","stage":"doc_info","message":"〈오류 내용〉"},"links":[]}],"annotations":null,"links":[],"success_label":"정상 반환","success_when":"입력이 유효하고 요청이 처리됐을 때","output_source":"https://github.com/liangjunglj-cpu/almond-mcp/blob/c42b9210f0feeda2f70699221733470ef82213f2/almond_mcp/conditioning.py#L426-L444","response_links":[],"pre_links":[],"internal_links":[],"outputs_title":"실행에 따라 채워지는 반환 구조","schema":{"type":"object","properties":{"shot":{"type":"string"},"out_dir":{"type":"string"},"width":{"type":"integer","default":832},"height":{"type":"integer","default":480},"passes":{"type":"string","default":"rgb,edge,depth"},"fps":{"type":"integer","default":16},"chunk":{"type":"integer","default":16},"rgb_mode":{"type":"string","default":"Rendered"},"edge_mode":{"type":"string","default":"Technical"},"invert_depth":{"type":"boolean","default":false}},"additionalProperties":false,"required":["shot","out_dir"]},"nexts":[]},"export_asset_contract":{"name":"export_asset_contract","title":"GLB·계약 파일 내보내기","group":"exchange","summary":"Rhino 객체를 GLB와 .almond.json으로 저장합니다. 치수·재료·앵커 정보와 후속 안내를 받습니다.","doc":"Exports Rhino objects as a portable Almond asset: a GLB plus an asset\ncontract (.almond.json) carrying what the file cannot.\n\nThe contract records real dimensions in mm, the anchor and support plane,\nclearances, and the Almond material_id of every object - so another\napplication (Blender, Unreal, another Rhino) can restore full meaning\neven though glTF drops per-object metadata. Pair with\nimport_asset_contract on the receiving side.\n\nArgs:\n    guids: Rhino object GUIDs to export (from execute_rhino_script).\n    asset_id: Stable id, e.g. \"canopy-pavilion-01\" (letters, digits, . _ -).\n    name: Human-readable name; defaults to asset_id.\n    output_dir: Destination folder. Default: <user data dir>/exchange.\nReturns:\n    JSON with the glb path, contract path, and recorded dimensions.","params":[{"name":"guids","type":"list[str]","required":true,"label":"guids","hint":"GUID는 설명용입니다. 실 function openTool(name,parent=-1){
if(parent>=0&&parent<S.trace.length-1){S.trace=S.trace.slice(0,parent+1);rebuildMemory()}
const idx=S.trace.length;
const isResource=name.startsWith('resource:');
if(isResource){
 const resourceName=name.split(':',2)[1]; if(!R[resourceName])return;
 const res=R[resourceName];let uri=res.uri;
 const vals={asset_id:S.memory.asset_id||A.asset_id,view:'plan',scale:'50'};
 for(const p of (res.params||[])){const value=S.memory[p]||vals[p]||'example';uri=uri.replace('{'+p+'}',String(value))}
 S.trace.push({name:'@resource',resourceName,input:{},output:null,form:{uri},included:{},parentResult:parent>=0,origins:{}});
 }else{
 if(!T[name])return;
 const obj={name,input:{},output:null,form:{},included:{},parentResult:parent>=0,origins:{},branchIndex:-1,resultMode:''};
 for(const a of T[name].params){const mem=S.memory[a.name];
  let v=mem!==undefined?mem:(a.example!==undefined?a.example:(a.required?'':a.default));
  if(v===undefined)v=a.type==='dict'?{}:a.type.startsWith('list[')?[]:'';
  obj.form[a.name]=clone(v);obj.included[a.name]=Boolean(a.required||mem!==undefined||a.example!==undefined||(mainFields[name]||[]).includes(a.name));
  if(mem!==undefined)obj.origins[a.name]=S.origins[a.name];
 }
 S.trace.push(obj);
 }
 if(S.route===null)S.route='direct';
 if(parent>=0){const si=successors(S.trace[parent]).indexOf(name);S.trace[parent].nextX=si<0?760:32+Math.min(2,si)*327+151}
 select('tool-'+idx,true);
}

function harvest(tr,idx){const r=tr.output;if(!r||r.error||r.status==='error')return;const origin=(idx+1)+'번째 '+tr.name+' 응답';if(r.assets?.length){stamp('asset_id',r.assets[0].asset_id,origin);stamp('preview_uri',r.assets[0].preview_uri,origin)}if(r.passport?.asset_id)stamp('asset_id',r.passport.asset_id,origin);if(r.preview_uri)stamp('preview_uri',r.preview_uri,origin);if(r.asset_id)stamp('asset_id',r.asset_id,origin);if(tr.name==='evaluate_generated_asset_fit'&&r.rotation_degrees!==undefined)stamp('rotation_degrees',r.rotation_degrees,origin);if(r.scene?.scene_id)stamp('scene_id',r.scene.scene_id,origin);if(r.room_id)stamp('room_id',r.room_id,origin);if(r.guids){stamp('guids',r.guids,origin);stamp('rhino_guid',r.guids[0],origin)}if(r.imported_guids){stamp('rhino_guid',r.imported_guids[0],origin);stamp('guids',r.imported_guids,origin);for(const k of ['x_mm','y_mm','z_mm','rotation_degrees'])if(k in tr.form)stamp(k,tr.form[k],(idx+1)+'번째 배치 호출의 입력')}if(r.logic_ids?.length)stamp('logic_id',r.logic_ids[0],origin);if(r.recipes?.length)stamp('recipe_id',r.recipes[0].recipe_id,origin);if(r.materials?.length)stamp('material_id',r.materials[0].material_id,origin)}
function rebuildMemory(){S.memory={};S.origins={};S.scene=null;S.rooms={};S.instances={};S.trace.forEach((tr,i)=>{if(tr.output&&tr.name!=='@resource'&&tr.resultMode==='local-example'){if(['create_design_scene','upsert_design_room','register_scene_instance'].includes(tr.name))simulate(tr.name,tr.input);harvest(tr,i)}})}
function run(i){const tr=S.trace[i];try{
const args=requestArgs(tr);checkArgs(T[tr.name],args);S.trace=S.trace.slice(0,i+1);tr.output=null;rebuildMemory();tr.input=clone(args);
tr.resultMode=['recommend_generated_assets','get_generated_asset_passport','evaluate_generated_asset_fit','place_generated_asset','create_design_scene','get_design_scene','upsert_design_room','register_scene_instance','validate_scene_layout','list_library','get_logic_by_id','execute_rhino_script','list_materials','assign_material','search_detail_sources','list_drawing_recipes','get_drawing_recipe','apply_drawing_style'].includes(tr.name)?'local-example':'source-shape';
tr.output=simulate(tr.name,args);tr.branchIndex=-1;harvest(tr,i);select('result-'+i,true);
}catch(error){const e=$('#form-error');if(e)e.textContent='입력 형식 확인: '+(error?.message||'입력값을 다시 확인하세요.');}
}
function syncField(el){
const i=Number(S.selected.replace(/^(desc|tool)-/,'')),tr=S.trace[i];if(!tr||!T[tr.name])return;
const k=el.dataset.param||el.dataset.include,a=T[tr.name].params.find(x=>x.name===k),type=a.type.replace(/\s/g,'');
if(el.dataset.include){tr.included[k]=el.checked;const f=$(`[data-param="${k}"]`);if(f)f.disabled=!el.checked;}
else{let v;if(type==='bool')v=el.checked;
else if(type.startsWith('list[')||type.startsWith('dict')){try{v=JSON.parse(el.value);el.setCustomValidity('');}catch(_){el.setCustomValidity('JSON 형식을 확인하세요.');v=el.value;}}
else if(type.startsWith('int')||type.startsWith('float'))v=el.value===''&&type.includes('None')?null:Number(el.value);
else if(type==='bool|None')v=el.value===''?null:el.value==='true';
else v=el.value;
tr.form[k]=v;delete tr.origins[k];if(type==='bool'){const code=el.parentElement.querySelector('code');if(code)code.textContent=v?'true':'false';}}
const req=$('#request-json');if(req)req.textContent=j(callRequest(tr,i));
}
function syntax(k){const notes={register:'@mcp.tool() → 이 함수를 공개 툴로 등록합니다. 등록할 때 함수 몸체를 실행하는 것은 아닙니다.',name:'def와 함수 이름 → 기본 툴 이름이 됩니다. 에이전트는 이 이름으로 호출합니다.',doc:'함수 바로 아래의 """설명문""" → 호출 전에 받는 description의 재료입니다. Args의 인수 설명도 추출됩니다. 문장에 “다음 툴을 호출하라”고 적어도 그 툴을 자동 실행하지는 않습니다.',type:'asset_id: str → 문자열. width_mm: float → 숫자. = 0 → 생략 시 기본값. 기본값이 없는 인수는 필수입니다. FastMCP가 이 정의를 입력 스키마로 만들고 호출 입력을 검사합니다.',return:'return → 이 함수를 호출한 뒤 받는 실제 값입니다. 반환 타입이 str이고 json.dumps를 쓰면 JSON을 담은 문자열, dict이면 사전 데이터입니다. next_step은 원본 코드가 반환 결과에 넣은 일반 필드입니다.'};$('#syntax-note').textContent=notes[k];document.querySelectorAll('.codeparts button').forEach(b=>b.classList.toggle('active',b.dataset.value===k))}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value,id=b.dataset.id;if(a==='select')select(id);if(a==='route')goRoute(v);if(a==='run')run(+v);if(a==='run-resource'){const i=+v;S.trace[i].output={contents:[{uri:S.trace[i].form.uri,mimeType:R[S.trace[i].resourceName]?.mime||'application/octet-stream',data:'〈해당 URI의 실제 내용〉'}]};select('result-'+i,true)}if(a==='next'){const [i,name]=v.split('|');openTool(name,+i)}if(a==='branch'){const [i,idx]=v.split('|').map(Number),tr=S.trace[i];if(tr){tr.branchIndex=idx;tr.output=idx<0?simulate(tr.name,tr.input):(clone(T[tr.name].branches[idx].data));select('result-'+i,true)}}if(a==='pick-logic'){const [i,value]=v.split('|');if(+i<S.trace.length-1){S.trace=S.trace.slice(0,+i+1);rebuildMemory()}stamp('logic_id',value,(+i+1)+'번째 list_library 응답');openTool('get_logic_by_id',+i)}if(a==='open-direct'){S.route='direct';S.trace=[];S.memory={};S.origins={};S.scene=null;S.rooms={};S.instances={};openTool(v)}if(a==='preset'){const [k,value]=v.split('|'),i=+S.selected.replace('tool-',''),tr=S.trace[i];tr.form[k]=Number(value);tr.included[k]=true;delete tr.origins[k];const el=$(`[data-param="${k}"]`);el.value=value;el.disabled=false;const inc=$(`[data-include="${k}"]`);if(inc)inc.checked=true;syncField(el)}if(a==='syntax')syntax(v)});
document.addEventListener('input',ev=>{if(ev.target.dataset.param)syncField(ev.target);if(ev.target.id==='tool-search'){S.query=ev.target.value;const needle=S.query.trim().toLowerCase();document.querySelectorAll('.tool-group .search-list button').forEach(b=>b.hidden=!!needle&&!b.dataset.search.includes(needle));document.querySelectorAll('.tool-group').forEach(g=>g.hidden=!Array.from(g.querySelectorAll('.search-list button')).some(b=>!b.hidden));}});document.addEventListener('change',ev=>{if(ev.target.dataset.include)syncField(ev.target)});
$('#reset').onclick=()=>{S.trace=[];S.memory={};S.origins={};S.scene=null;S.rooms={};S.instances={};S.route=null;select('guide');$('#viewport').scrollTo({top:0});fit()};$('#catalogBtn').onclick=()=>select('catalog');$('#initialInfo').onclick=()=>select('guide',true);$('#minus').onclick=()=>{S.zoom=Math.max(.45,S.zoom-.1);resizeStage()};$('#plus').onclick=()=>{S.zoom=Math.min(1.6,S.zoom+.1);resizeStage()};$('#fit').onclick=fit;window.addEventListener('resize',fit);
