[project]
name = "almond-mcp"
version = "0.7.0rc2"
description = "Almond - MCP server for Rhino 8 with a semantic scene layer: curated furniture/drawing/diagram libraries, audited Karamba capsules, structured retrieval (SQLite FTS5 + R-tree scene ledger), and isolated document-bound Rhino sessions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "LiangJung" }]
keywords = ["mcp", "rhino", "grasshopper", "karamba", "architecture", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Other Audience",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "fastmcp>=3.0.2",
    "lxml>=6.0.2",
    "mcp>=1.26.0",
    "pydantic>=2.12.5",
    "numpy>=2.0,<3",
    "shapely>=2.1,<3",
    "ezdxf>=1.4,<2",
    "pillow>=11,<13",
    "contourpy>=1.3,<2",
]

[project.scripts]
almond-mcp = "almond_mcp.cli:main"

[dependency-groups]
local = [
    "fastmcp==4.1.0",
    "mcp==2.3.0",
    "mcp-types==2.3.0",
]
dev = [
    "pytest>=8.0",
]

[tool.uv]
default-groups = ["local", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp/almond_mcp"]

# Manifests and audited JSON ship inside the wheel as almond_mcp/data/ so a
# fresh install can scaffold the user data directory. Only the original generated
# model pack is included; downloaded community models remain user-local.
[tool.hatch.build.targets.wheel.force-include]
"src/rhp/Asset_Panel/web" = "almond_mcp/library_ui"
"asset/drawing/DrawingAssetfiles/manifest.json" = "almond_mcp/data/DrawingAssetfiles/manifest.json"
"asset/diagram/DiagramAssetfiles/manifest.json" = "almond_mcp/data/DiagramAssetfiles/manifest.json"
"asset/models/GeneratedAssetfiles/manifest.json" = "almond_mcp/data/GeneratedAssetfiles/manifest.json"
"asset/models/GeneratedAssetfiles/models" = "almond_mcp/data/GeneratedAssetfiles/models"
"asset/models/GeneratedAssetfiles/previews" = "almond_mcp/data/GeneratedAssetfiles/previews"
"asset/models/GeneratedAssetfiles/passport.schema.json" = "almond_mcp/data/GeneratedAssetfiles/passport.schema.json"
"asset/models/GeneratedAssetfiles/README.md" = "almond_mcp/data/GeneratedAssetfiles/README.md"
"asset/models/GeneratedAssetfiles/catalogue.json" = "almond_mcp/data/GeneratedAssetfiles/catalogue.json"
"asset/models/GeneratedAssetfiles/provenance.json" = "almond_mcp/data/GeneratedAssetfiles/provenance.json"
"asset/models/GeneratedAssetfiles/structural-loads.json" = "almond_mcp/data/GeneratedAssetfiles/structural-loads.json"
"asset/models/GeneratedAssetfiles/source-register.json" = "almond_mcp/data/GeneratedAssetfiles/source-register.json"
"asset/models/GeneratedAssetfiles/batches" = "almond_mcp/data/GeneratedAssetfiles/batches"
"asset/drawing/DrawingRecipes" = "almond_mcp/data/DrawingRecipes"
"asset/drawing/Draftingfiles" = "almond_mcp/data/Draftingfiles"
"asset/capsules" = "almond_mcp/data/capsules"
"asset/constructions/Materialfiles/manifest.json" = "almond_mcp/data/Materialfiles/manifest.json"
"asset/constructions/Constructionfiles/manifest.json" = "almond_mcp/data/Constructionfiles/manifest.json"
"asset/history/Historyfiles/manifest.json" = "almond_mcp/data/Historyfiles/manifest.json"

[tool.hatch.build.targets.sdist]
include = [
    "/src/mcp/almond_mcp", "/src/rhp/Asset_Panel/web", "/src/mcp/tests", "/docs", "/asset/capsules", "/asset/drawing/DrawingRecipes",
    "/asset/drawing/Draftingfiles", "/src/mcp/tools/build_drawing_pilot.py",
    "/src/mcp/tools/build_modeling_guides.py",
    "/asset/models/GeneratedAssetfiles/manifest.json", "/asset/models/GeneratedAssetfiles/catalogue.json",
    "/asset/models/GeneratedAssetfiles/provenance.json", "/asset/models/GeneratedAssetfiles/passport.schema.json",
    "/asset/models/GeneratedAssetfiles/structural-loads.json",
    "/asset/models/GeneratedAssetfiles/source-register.json",
    "/asset/models/GeneratedAssetfiles/README.md", "/asset/models/GeneratedAssetfiles/models", "/asset/models/GeneratedAssetfiles/previews",
    "/asset/drawing/DrawingAssetfiles/manifest.json", "/asset/diagram/DiagramAssetfiles/manifest.json",
    "/asset/constructions/Materialfiles/manifest.json", "/asset/constructions/Constructionfiles/manifest.json", "/asset/history/Historyfiles/manifest.json",
    "/src/mcp/tools/build_generated_assets.py", "/src/mcp/tools/enrich_generated_assets.py",
    "/src/mcp/tools/document_generation_sources.py",
    "/src/mcp/tools/run_meshy_batch.py", "/src/mcp/tools/prepare_organic_meshes.py", "/src/mcp/tools/import_organic_batch.py", "/asset/models/GeneratedAssetfiles/batches",
    "/src/rhp/tools/build_archive_bundle.py", "/src/mcp/tools/verify_object_archive_install.py",
    "/src/mcp/tools/render_generated_previews.py", "/src/mcp/tools/verify_release.py",
    "/README.md", "/AGENTS.md", "/SPEC.md", "/LICENSE", "/THIRD-PARTY-NOTICES.md",
    "/src/mcp/SPEC.md", "/src/mcp/AGENTS.md", "/src/mcp/QUERY_OUTPUT.md", "/src/mcp/pytest.ini",
    "/src/cos/SPEC.md", "/src/cos/AGENTS.md", "/src/rhp/SPEC.md", "/src/rhp/AGENTS.md",
    "/src/engine/README.md",
    "/pyproject.toml", "/uv.lock", "/.gitattributes",
]
# Belt and braces on top of .gitignore: downloaded model files and compiled
# bridge binaries must never reach a distribution artifact.
exclude = [
    "asset/models/IkeaFurniturefiles/models",
    "asset/drawing/DrawingAssetfiles/models",
    "asset/diagram/DiagramAssetfiles/models",
    "asset/grasshopper/Grasshopperfiles",
    "dist",
    "src/rhp/RhinoAlmondBridge",
    "src/mcp/tests/runtime",
    "*.sqlite3",
]

[tool.pytest.ini_options]
# Root pytest owns integration checks. Modules have their own test entry points.
testpaths = ["tests"]
pythonpath = ["src/mcp", "src/mcp/runtime", "src/cos", "src/mcp/tests"]
