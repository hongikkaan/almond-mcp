 Rhino through official RhinoCode, using the selected Plan artifact folder as cwd.\n\nRead get_modeling_guide(tool=\"execute_project_python\") for the bundled rhino3d-scripts skill and references. Select a Plan with set_working_plan first. Relative file writes land in its artifact folder. doc and scriptcontext.doc are the bound RhinoDoc; assign a JSON value to result. project_root is absolute and artifact_dir is relative to it. The wrapper applies project/artifact environment variables temporarily and restores cwd, scriptcontext, Undo and redraw. Record useful outputs in Plan/Step refs.\n\nThis replaces the external worker-venv Python process. Rhino's embedded packages may differ; missing dependencies are not automatically installed. RhinoCommon is available. Do not start detached/background writers or switch documents.\nTimeout limits waiting and never kills Rhino. Read get_rhino_execution(request_id) after pending results; never repeat writes just because the CLI returned or timed out.\n\nArgs:\n    code: Synchronous Python 3 source; assign a JSON-safe value to result.\n    timeout_seconds: Integer 1-600, default 60; waiting limit, not execution cancellation.\nReturns:\n    RhinoCode outcome, request_id and selected artifact_dir, with late-result recovery.","summary":"Execute Python 3 inside the bound Rhino through official RhinoCode, using the selected Plan artifact folder as cwd.","path":"src/mcp/runtime/mcp_server.py","line":170,"end":184,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/runtime/mcp_server.py#L170-L184","calls":["runtime.workspace.artifact_path","runtime.execute_rhinocode"],"guards":[{"condition":"not isinstance(code, str) or not code.strip()","line":171},{"condition":"type(timeout_seconds) is not int or not 1 \u003c= timeout_seconds \u003c= 600","line":173},{"condition":"runtime is None or runtime.workspace is None","line":175}],"returns":["result"],"annotations":null,"inputSchema":{"addition e a core, widen a stair) instead of guessed at.\n\nArgs:\n    plate_bounds_mm: Floor plate [min_x, min_y, max_x, max_y] in mm\n        (sets gross area and the diagonal used for exit separation).\n    exits: One entry per exit (stair door or exterior exit door):\n        {\"name\": str, \"x_mm\": float, \"y_mm\": float, \"width_mm\": float}.\n        Positions are the door centers; width is the clear egress width.\n    occupancy: Occupant-load key: business, mercantile, assembly_\n        unconcentrated, classroom, residential, storage.\n    stories: Stories served. Above 1, at least two exits are required\n        and exit width demand uses the stair factor (7.6 mm/occupant)\n        instead of the door factor (5.1).\n    sprinklered: Sprinklered throughout (affects separation fraction,\n        travel-distance and dead-end limits).\n    net_area_m2: Override the occupied area; 0 uses the gross plate area.\n    travel_distances_m: Measured worst-case travel distances (e.g. from\n        drawn egress paths); empty skips the travel check.\n    dead_end_m: Longest dead-end corridor in metres; 0 skips the check.\nReturns:\n    JSON: {passed, occupant_load, checks: [{check, required, provided,\n    passed, basis}], warnings, source_note}.","summary":"Checks a floor plate's means of egress against the construction library's egress rules (BCI A.10-A.13 framework + IBC-typical numeric factors - always verify against the governing code; the response repeats this).","path":"src/mcp/features/egress/tools.py","line":11,"end":120,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/egress/tools.py#L11-L120","calls":["context.construction_library.reference.get"],"guards":[{"condition":"not rules","line":22},{"condition":"len(plate_bounds_mm) != 4","line":24},{"condition":"not exits","line":26},{"condition":"occupancy not in factors","line":37},{"condition":"stories > 1","line":55},{"condition":"len(exits) >= 2","line":70},{"condition":"narrow","line":90},{"condition":"travel_distances_m","line":94},{"condition":"dead_end_m > 0","line":105},{"condition":"cap is None or occupant_load \u003c= cap","line":52},{"condition":"occupancy != 'business'","line":99}],"returns":["json.dumps({'passed': all((c['passed'] for c in checks)), 'occupancy': occupancy, 'occupant_load': occupant_load, 'area_m2': round(area_m2, 1), 'gross_area_m2': round(gross_m2, 1), 'checks': checks, 'warnings': warnings, 'source_note': rules.get('source_note', '')})","json.dumps(error_payload('egress_rules missing from the construction manifest.'))","json.dumps(error_payload('plate_bounds_mm must be [min_x, min_y, max_x, max_y].'))","json.dumps(error_payload('exits must not be empty.'))","json.dumps(error_payload(f\"Unknown occupancy '{occupancy}'. Known: {', '.join(sorted(factors))}\"))"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"dead_end_m":{"default":0.0,"description":"Longest dead-end corridor in metres; 0 skips the check.","type":"number"},"exits":{"description":"One entry per exit (stair door or exterior exit door):\n{\"name\": str, \"x_mm\": float, \"y_mm\": float, \"width_mm\": float}.\nPositions are the door centers; width is the clear egress width.","items":{"additionalProperties":true,"type":"object"},"type":"array"},"net_area_m2":{"default":0.0,"description":"Override the occupied area; 0 uses the gross plate area.","type":"number"},"occupancy":{"default":"business","description":"Occupant-load key: business, mercantile, assembly_\nunconcentrated, classroom, residential, storage.","type":"string"},"plate_bounds_mm":{"description":"Floor plate [min_x, min_y, max_x, max_y] in mm\n(sets gross area and the diagonal used for exit separation).","items":{"type":"number"},"type":"array"},"sprinklered":{"default":true,"description":"Sprinklered throughout (affects separation fraction,\ntravel-distance and dead-end limits).","type":"boolean"},"stories":{"default":1,"description":"St cp/features/grasshopper/tools.py","line":108,"end":135,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/grasshopper/tools.py#L108-L135","calls":["context.indexer.index.get"],"guards":[{"condition":"not file_map","line":113},{"condition":"target_json and (not target_file)","line":121}],"returns":["json.dumps(project({'error': read_instruction(__file__, 'response-713').format(logic_id)}, field_groups))","json.dumps(project(json.loads(physics_context.model_dump_json()), field_groups))","json.dumps(project({'logic_id': logic_id, 'source': target_json, 'metadata': data}, field_groups))","json.dumps(project({'error': f\"Failed to parse '{target_file}': {str(e)}\"}, field_groups))","json.dumps(project({'error': f'Failed to read JSON sidecar: {e}'}, field_groups))"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"field_groups":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"default":null},"include_ids":{"default":false,"type":"boolean"},"logic_id":{"description":"The filename (without extension) of the Grasshopper file.\n      Use list_library() first to see available IDs.\n      Examples: catenary, bending, 01_simplebeam","type":"string"}},"required":["logic_id"],"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"list_capsules":{"name":"list_capsules","title":"Grasshopper 캡슐 목록","group":"grasshopper","doc":"Lists Grasshopper capsules: GH definitions with a typed, audited input/output contract that can be executed via run_gh_definition.\n\nCall this FIRST to discover what capsules exist before calling run_gh_definition.\nEach entry is a compact card with capsule_id, capability, structure_type, audited flag, and the reserved ALMOND_IN_* / ALMOND_OUT_* port names. Only capsules with audited=true can actually run; audited=false capsules are retrieval context only (read them via get_logic_by_id instead).\n\nArgs:\n    capability: Optional filter: \"analyze\", \"generate\", \"form_find\", or \"aggregate\".\n    audited_only: When true, list only capsules that run_gh_definition will accept.\nReturns:\n    JSON with total and a list of compact capsule cards.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds ports, definition, source, paths, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","summary":"Lists Grasshopper capsules: GH definitions with a typed, audited input/output contract that can be executed via run_gh_definition.","path":"src/mcp/features/grasshopper/tools.py","line":141,"end":151,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/grasshopper/tools.py#L141-L151","calls":["context.retrieval_store.search_capsules"],"guards":[],"returns":["json.dumps(project({'capsule_library_dir': context.CAPSULE_LIBRARY_DIR, **page}, field_groups))"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"audited_only":{"default":false,"description":"When true, list only capsules that run_gh_definition will accept.","type":"boolean"},"capability":{"default":"","description":"Optional filter: \"analyze\", \"generate\", \"form_find\", or \"aggregate\".","type":"string"},"field_groups":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"default":null},"include_ids":{"default":false,"type":"boolean"}},"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"run_gh_definition":{"name":"run_gh_definition","title":"Grasshopper 캡슐 실행","group":"grasshopper","doc":"Runs an audited Grasshopper capsule (GH definition + typed contract) through the Rhino bridge and returns its declared outputs.\n\nWorkflow: call list_capsules() first to pick a capsule_id and see its input/ output port names. Create any geometry with execute_rhino_script, then pass the returned GUIDs here. Inputs are validated client-side against the capsule manifest before anything is sent to Rhino, so errors from this tool name the exact port at fault.\n\nInput value forms (keyed by the exact ALMOND_IN_* port name):\n  - Geometry ports (point/curve/mesh/brep and their [] list forms):\n    {\"guids\": [\"\u003crhino-object-guid>\", ...]} referencing objects already in the Rhino document.\n  - number / integer / string / bool ports: the raw JSON value.\n  - number[] / integer[] / string[] ports: a flat JSON list.\nUnits are declared per port in the manifest — supply values in those units; nothing is guessed or auto-converted client-side. Optional inputs may be omitted; the capsule's declared defaults then apply inside the definition.\n\nOnly audited capsules run. audited=false means the GHX has no verified ALMOND_IN_*/ALMOND_OUT_* harness params yet; this tool refuses it (see asset/capsules/AUTHORING.md for how to harness one).\n\nThe response's \"outputs\" object is keyed by ALMOND_OUT_* names; interpret each value using the manifest's semantics field (e.g. max_nodal_displacement, per_element_utilization) and declared units. The response also carries analysis_method (api|template|rule_based), confidence (high|medium|low), warnings, and baked_guids — report method and confidence honestly; rule_based/low means an estimate, not FEA.\n\nArgs:\n    capsule_id: Stable capsule identifier from list_capsules (e.g. \"karamba_beam_v1\").\n    inputs: Object mapping ALMOND_IN_* port names to values (forms above).\n    seed: Optional integer seed for stochastic definitions; omit for deterministic ones.\n    timeout_s: Solver budget in seconds (default 60, max 600).\nReturns:\n    JSON with status, capsule_id, outputs, baked_guids, analysis_method,\n    confidence, warnings, and error — or a validation error naming the\n    offending input and the valid port names.","summary":"Runs an audited Grasshopper capsule (GH definition + typed contract) through the Rhino bridge and returns its declared outputs.","path":"src/mcp/features/grasshopper/tools.py","line":156,"end":246,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/grasshopper/tools.py#L156-L246","calls":["context.retrieval_store.get_capsule","context.retrieval_store.search_capsules","context._send_and_receive"],"guards":[{"condition":"not manifest","line":163},{"condition":"not manifest.get('audited')","line":173},{"condition":"not isinstance(inputs, dict)","line":179},{"condition":"unknown","line":190},{"condition":"missing","line":201},{"condition":"problems","line":213},{"condition":"not (isinstance(timeout_s, (int, float)) and (not isinstance(timeout_s, bool)) and (timeout_s == timeout_s) and (0 \u003c timeout_s \u003c= 600))","line":220},{"condition":"problem","line":211}],"returns":["json.dumps({'status': 'error', 'message': read_instruction(__file__, 'response-714').format(capsule_id), 'available_capsules': [capsule['capsule_id'] for capsule in listing['capsules']]})","json.dumps(error_payload(f\"Capsule '{capsule_id}' is not audited: its definition has no verified ALMOND_IN_*/ALMOND_OUT_* harness params, so run_gh_definition refuses to execute it. It remains available as retrieval context (get_logic_by_id). See asset/capsules/AUTHORING.md for how to harness and audit the definition.\"))","json.dumps(error_payload('inputs must be an object keyed by ALMOND_IN_* port names.'))","json.dumps({'status': 'error', 'message': f\"Unknown input name(s) for '{capsule_id}': {', '.join(unknown)}.\", 'valid_inputs': valid_names})","json.dumps({'status': 'error', 'message': f\"Missing required input(s) for '{capsule_id}': {', '.join(missing)}.\", 'valid_inputs': valid_names})","json.dumps({'status': 'error', 'message': 'Input validation failed: ' + ' '.join(problems), 'valid_inputs': valid_names})","json.dumps(error_payload('timeout_s must be a number between 0 (exclusive) and 600 seconds.'))","context._send_and_receive(payload, timeout=float(timeout_s) + 15.0)","json.dumps(error_payload(f\"Capsule '{capsule_id}' timed out (>{timeout_s}s solver budget).\"))","json.dumps(error_payload('Connection refused. Is the RhinoAlmondBridge plugin loaded in Rhino?'))","json.dumps(error_payload(f'Bridge error: {e}'))"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"capsule_id":{"description":"Stable capsule identifier from list_capsules (e.g. \"karamba_beam_v1\").","type":"string"},"inputs":{"additionalProperties":true,"description":"Object mapping ALMOND_IN_* port names to values (forms above).","type":"object"},"seed":{"anyOf":[{"type":"integer"},{"type":"null"}],"default":null,"description":"Optional integer seed for stochastic definitions; omit for deterministic ones."},"timeout_s":{"default":60.0,"description":"Solver budget in seconds (default 60, max 600).","type":"number"}},"required":["capsule_id","inputs"],"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"validate_structure":{"name":"validate_structure","title":"구조 검증","group":"structure","doc":"Analyze the specified Rhino geometry under the supplied loads, supports and calculation assumptions.\n\nengine=\"auto\" (default) analyses line models (beams, columns, trusses, frames) with Almond's built-in 3D frame solver: analysis_method \"native\", confidence \"high\", no Karamba install needed. It is a linear-elastic first-order frame analysis with EN 1993-1-1 member checks (elastic moduli; flexural buckling with L_cr = member length; no lateral-torsional buckling), benchmarked against closed-form results and live Karamba runs. Models with shells, and shell/gridshell/membrane structure types, go to Karamba. engine=\"karamba\" forces the Karamba route, which tries three pathways in strict order of confidence and always tells you which one ran:\n    analysis_method \"api\"        — direct Karamba 3.1 API solve, confidence \"high\" analysis_method \"template\"   — audited capsule GHX template,  confidence \"medium\" analysis_method \"rule_based\" — heuristic span/slenderness rules, confidence \"low\" The verdict string names the method (e.g. \"[RULE-BASED ESTIMATE, LOW CONFIDENCE] ...\").\nTreat rule_based/low results as estimates, NOT finite element analysis, and say so when reporting to the user.\n\nResults locate demand and capacity issues in the analyzed system. The cause and appropriate design change depend on the members' connections, supports and load path.\n\nArgs:\n    guids: Current Rhino object GUID strings in the analysis scope.\n    structure_type: Analysis template to use. Options:\n        \"beam\"       — simple beam bending/deflection\n        \"truss\"      — axial force/buckling analysis\n        \"shell\"      — shell stress/displacement\n        \"frame\"      — moment/shear frame analysis\n        \"canopy\"     — cantilevered canopy\n        \"gridshell\"  — large deformation gridshell\n        \"membrane\"   — form-finding membrane\n        \"highrise\"   — high-rise structural systems\n    load_kn: Applied load in kN (default 10.0).\n    material: Material type: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\" (default \"Steel\").\n    engine: \"auto\" | \"native\" | \"karamba\" (see above).\n    fixed_supports: True = fully fixed supports, False = pinned (rotations free).\n    self_weight: include member self weight.\n    span_m: structural span in meters for the L/250 limit when members are split at\n        every node (e.g. a 6.2 m joist drawn as two 3.1 m segments). Native engine only.\n    asset_loads: add the gravity loads of placed library assets (estimated self weight\n        plus in-use contents/occupants from each asset's load entry, e.g. a filled\n        bathtub) where they stand on (or hang from) the frame. Placements come from\n        Rhino objects tagged with an Almond asset id, or from the scene ledger when\n        scene_id is given. Native engine only; the result's \"asset_loads\" lists every\n        placement with its load and carrying members, or why it was not applied.\n    floor_load_kn_m2: imposed floor load in kN/m2 (e.g. 2.0 for homes, EN 1991-1-1\n        category A) on every bay enclosed by beams on a level; the beams take it by the\n        45-degree rule (two-way, one-way above 2:1). Native engine only. A code floor load\n        already covers movable furniture and people: combine it with asset_loads only for\n        heavy specific items, and set load_kn to 0 to avoid double counting.\n    floor_dead_kn_m2: superimposed dead load in kN/m2 (floor build-up, finishes) on the\n        same bays.\n    design_basis: \"en1990\" (default): deflection at SLS characteristic (G + Q), member\n        checks at ULS 1.35 G + 1.5 Q. G = self weight, floor build-up and the weight of\n        placed items; Q = load_kn, the occupancy floor load, contents and occupants.\n        \"unfactored\" checks both at G + Q (the Karamba route's basis). Native engine.\n    uls_combination: \"6.10\" or \"6.10ab\" (the worse of 6.10a and 6.10b per member). Default:\n        the design code's choice (Eurocode profile: 6.10). A profile that prescribes one\n        expression overrides the request (with a warning).\n    design_code: design code profile for the numbers a code or National Annex sets\n        (gamma_G, gamma_Q, psi_0, xi, gamma_M0, gamma_M1, deflection limit): \"eurocode\"\n        (default, EN recommended values), any profile from list_design_codes, or \"off\"\n        (unfactored G + Q, no partial factors; same as design_basis=\"unfactored\").\n        Results carry \"design_code\" with the values used and any unverified ones.\n    fabrication: hollow steel sections (CHS/RHS) are \"cold_formed\" (default, EN 10219,\n        buckling curve c) or \"hot_finished\" (EN 10210, curve a; a0 for S460). The difference\n        is up to about 23 % in buckling resistance; use hot_finished only when specified.\n    detail: native engine only. Adds \"members\" (per member: role, length, section, ULS design\n        forces N/V/M/T, governing combination and check, slenderness, chi, stress,\n        utilization, SLS deflection and span/deflection ratio, pinned ends) and \"supports\"\n        (reactions Fx..Mz at SLS and each ULS combination). Off by default to keep replies short.\n    connections: \"rigid\" (default: every joint transmits moment) or \"simple\": beams are\n        pinned (major-axis bending released) and braces pinned in both axes where they\n        stop - not where another member carries on in line - while columns stay\n        continuous. Typical bolted steel and timber framing is closer to \"simple\"; rigid\n        joints can flatter beam deflection. A curve's user text almond:release = \"pinned\" |\n        \"pinned_start\" | \"pinned_end\" | \"rigid\" overrides either mode. Native engine.\n    stability: \"auto\" (default): elastic critical load factor alpha_cr for every ULS\n        combination (EN 1993-1-1 5.2.1) and sway imperfections phi = 1/200 x alpha_h x alpha_m\n        (5.3.2) in +/-x and +/-y; alpha_cr \u003c 10 runs a second-order (P-Delta) ULS analysis,\n        alpha_cr \u003c= 1 fails as unstable. \"off\": first-order without imperfections.\nThe tool also compares the analyzed span with the construction-system library\nand appends a \"construction_check\" object (matching_systems with\nfits_span and suggested member depths, plus warnings when the span falls\noutside every curated system's range for this structure_type/material).\n\nReturns:\n    JSON from the bridge plus the construction_check. Top-level fields: status\n    (\"pass\"|\"fail\"|\"error\"), passed (bool), verdict (text), suggestions,\n    confidence (\"high\"|\"medium\"|\"low\"), warnings, and worst_member_guids\n    (up to 5 Rhino GUIDs of the most over-utilized members). The results\n    object carries the numbers: max_deflection_mm,\n    deflection_limit_mm, utilization_ratio, max_stress_mpa, yield_stress_mpa,\n    span_m, analysis_method (\"native\"|\"api\"|\"template\"|\"rule_based\"), reactions_kn\n    (total vertical reaction, api path only), and per_element_utilization —\n    a list of {source_guids, utilization} entries (utilization 1.0 = at\n    capacity) keyed back to the Rhino objects that produced each element.","summary":"Analyze the specified Rhino geometry under the supplied loads, supports and calculation assumptions.","path":"src/mcp/features/structure/tools.py","line":23,"end":128,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/structure/tools.py#L23-L128","calls":["context._floor_spec","native_structure.combinations","context._asset_load_spec","context._native_validation","context._send_and_receive","context.retrieval_store.record_validation_run","context.construction_library.assess_span"],"guards":[{"condition":"engine not in ('auto', 'native', 'karamba')","line":44},{"condition":"not fixed_supports","line":53},{"condition":"not self_weight","line":55},{"condition":"err","line":61},{"condition":"asset_loads","line":71},{"condition":"engine == 'native' or (engine == 'auto' and structure_type.lower() not in KARAMBA_ONLY_TYPES)","line":77},{"condition":"result is None","line":85},{"condition":"(connections or 'rigid').lower() not in native_structure.CONNECTIONS","line":65},{"condition":"(stability or 'auto').lower() not in ('auto', 'off')","line":67},{"condition":"engine == 'karamba'","line":72},{"condition":"err","line":75},{"condition":"isinstance(result, str)","line":83},{"condition":"note and isinstance(result, dict)","line":98},{"condition":"(spec or floor) and isinstance(result, dict)","line":100},{"condition":"note and isinstance(result, dict) and ((design_basis or '').lower() == 'en1990')","line":103},{"condition":"isinstance(result, dict) and result.get('status') in ('pass', 'fail')","line":112},{"condition":"isinstance(results_block, dict)","line":115},{"condition":"check.get('warnings')","line":120}],"returns":["json.dumps(result)","json.dumps(error_payload(\"engine must be 'auto', 'native' or 'karamba'.\"))","json.dumps(error_payload(err))","json.dumps(error_payload(str(e)))","json.dumps(error_payload(\"asset_loads needs the native engine (engine='auto' or 'native').\"))","result","json.dumps(error_payload('Structural validation timed out (>60s).'))","json.dumps(error_payload('Connection refused. Is the RhinoAlmondBridge plugin loaded in Rhino?'))","json.dumps(error_payload(f'Bridge error: {e}'))","response"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"asset_loads":{"default":false,"description":"add the gravity loads of placed library assets (estimated self weight\nplus in-use contents/occupants from each asset's load entry, e.g. a filled\nbathtub) where they stand on (or hang from) the frame. Placements come from\nRhino objects tagged with an Almond asset id, or from the scene ledger when\nscene_id is given. Native engine only; the result's \"asset_loads\" lists every\nplacement with its load and carrying members, or why it was not applied.","type":"boolean"},"connections":{"default":"rigid","description":"\"rigid\" (default: every joint transmits moment) or \"simple\": beams are\npinned (major-axis bending released) and braces pinned in both axes where they\nstop - not where another member carries on in line - while columns stay\ncontinuous. Typical bolted steel and timber framing is closer to \"simple\"; rigid\njoints can flatter beam deflection. A curve's user text almond:release = \"pinned\" |\n\"pinned_start\" | \"pinned_end\" | \"rigid\" overrides either mode. Native engine.","type":"string"},"design_basis":{"default":"en1990","description":"\"en1990\" (default): deflection at SLS characteristic (G + Q), member\nchecks at ULS 1.35 G + 1.5 Q. G = self weight, floor build-up and the weight of\nplaced items; Q = load_kn, the occupancy floor load, contents and occupants.\n\"unfactored\" checks both at G + Q (the Karamba route's basis). Native engine.","type":"string"},"design_code":{"default":"eurocode","description":"design code profile for the numbers a code or National Annex sets\n(gamma_G, gamma_Q, psi_0, xi, gamma_M0, gamma_M1, deflection limit): \"eurocode\"\n(default, EN recommended values), any profile from list_design_codes, or \"off\"\n(unfactored G + Q, no partial factors; same as design_basis=\"unfactored\").\nResults carry \"design_code\" with the values used and any unverified ones.","type":"string"},"detail":{"default":false,"description":"native engine only. Adds \"members\" (per member: role, length, section, ULS design\nforces N/V/M/T, governing combination and check, slenderness, chi, stress,\nutilization, SLS deflection and span/deflection ratio, pinned ends) and \"supports\"\n(reactions Fx..Mz at SLS and each ULS combination). Off by default to keep replies short.","type":"boolean"},"engine":{"default":"auto","description":"\"auto\" | \"native\" | \"karamba\" (see above).","type":"string"},"fabrication":{"default":"cold_formed","description":"hollow steel sections (CHS/RHS) are \"cold_formed\" (default, EN 10219,\nbuckling curve c) or \"hot_finished\" (EN 10210, curve a; a0 for S460). The difference\nis up to about 23 % in buckling resistance; use hot_finished only when specified.","type":"string"},"fixed_supports":{"default":true,"description":"True = fully fixed supports, False = pinned (rotations free).","type":"boolean"},"floor_dead_kn_m2":{"default":0.0,"description":"superimposed dead load in kN/m2 (floor build-up, finishes) on the\nsame bays.","type":"number"},"floor_load_kn_m2":{"default":0.0,"description":"imposed floor load in kN/m2 (e.g. 2.0 for homes, EN 1991-1-1\ncategory A) on every bay enclosed by beams on a level; the beams take it by the\n45-degree rule (two-way, one-way above 2:1). Native engine only. A code floor load\nalready covers movable furniture and people: combine it with asset_loads only for\nheavy specific items, and set load_kn to 0 to avoid double counting.","type":"number"},"guids":{"description":"Current Rhino object GUID strings in the analysis scope.","items":{"type":"string"},"type":"array"},"load_kn":{"default":10.0,"description":"Applied load in kN (default 10.0).","type":"number"},"material":{"default":"Steel","description":"Material type: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\" (default \"Steel\").","type":"string"},"self_weight":{"default":true,"description":"include member self weight.","type":"boolean"},"span_m":{"anyOf":[{"type":"number"},{"type":"null"}],"default":null,"description":"structural span in meters for the L/250 limit when members are split at\nevery node (e.g. a 6.2 m joist drawn as two 3.1 m segments). Native engine only."},"stability":{"default":"auto","description":"\"auto\" (default): elastic critical load factor alpha_cr for every ULS\ncombination (EN 1993-1-1 5.2.1) and sway imperfections phi = 1/200 x alpha_h x alpha_m\n(5.3.2) in +/-x and +/-y; alpha_cr \u003c 10 runs a second-order (P-Delta) ULS analysis,\nalpha_cr \u003c= 1 fails as unstable. \"off\": first-order without imperfections.","type":"string"},"structure_type":{"default":"beam","description":"Analysis template to use. Options:\n\"beam\"       — simple beam bending/deflection\n\"truss\"      — axial force/buckling analysis\n\"shell\"      — shell stress/displacement\n\"frame\"      — moment/shear frame analysis\n\"canopy\"     — cantilevered canopy\n\"gridshell\"  — large deformation gridshell\n\"membrane\"   — form-finding membrane\n\"highrise\"   — high-rise structural systems","type":"string"},"uls_combination":{"anyOf":[{"type":"string"},{"type":"null"}],"default":null,"description":"\"6.10\" or \"6.10ab\" (the worse of 6.10a and 6.10b per member). Default:\nthe design code's choice (Eurocode profile: 6.10). A profile that prescribes one\nexpression overrides the request (with a warning)."}},"required":["guids"],"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"list_design_codes":{"name":"list_design_codes","title":"구조 설계 기준 목록","group":"structure","doc":"Lists the design code profiles validate_structure / visualize_structure accept as design_code.\n\nA profile holds the numbers a design code or National Annex sets (load factors gamma_G, gamma_Q, psi_0, xi; the ULS expression; material factors gamma_M0, gamma_M1; the deflection limit; suggested imposed floor loads), each with its source clause and a verified flag.\n\"eurocode\" (EN recommended values) is built in and the default; \"off\" is unfactored mechanics.\nPractices add National Annex profiles as JSON files in user_dir (see src/mcp/features/structure/PROFILES-SPEC.md).\nUnverified values are allowed but flagged in every result that uses them.\n\nReturns JSON: default, profiles [{id, name, basis, origin, verified, unverified, uls_expression, uls_default, deflection_limit_ratio, imposed_floor_kn_m2}], problems (files that failed validation), user_dir.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds parameters, source, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","summary":"Lists the design code profiles validate_structure / visualize_structure accept as design_code.","path":"src/mcp/features/structure/tools.py","line":208,"end":210,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/structure/tools.py#L208-L210","calls":[],"guards":[],"returns":["json.dumps(project(design_codes.listing(), field_groups))"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"field_groups":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"default":null},"include_ids":{"default":false,"type":"boolean"}},"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"visualize_structure":{"name":"visualize_structure","title":"구조 거동 표시","group":"structure","doc":"Run a live structural analysis on a line model and SHOW it in every Rhino viewport:\nthe undeformed wireframe, the exaggerated deformed shape coloured blue -> red by displacement (or by utilization), supports, load arrows and a legend panel with max deflection, the L/limit check and PASS/FAIL. Nothing is baked into the document.\n\nUse it to make structural behaviour visible while designing: model the structural axes as curves, include Rhino point objects at the supports, call this tool, then fix the members it shows in red (add a column, shorten a cantilever, upsize the section via beam_diameter_mm) and call it again. validate_structure gives the auditable verdict; this tool is the visual, iterative view of the same solve.\n\nArgs:\n    guids: Curve GUIDs of the structural axes plus point GUIDs marking supports\n        (see fixed_supports). Without points, the lowest nodes are supported.\n    load_kn: Total imposed load in kN, shared equally by the free nodes (-Z).\n    material: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\".\n    beam_diameter_mm, beam_wall_mm: circular hollow section for every member\n        (default: inferred / CHS 114.3x4).\n    self_weight: include gravity.\n    fixed_supports: True = fully fixed supports, False = pinned (rotations free).\n    deflection_limit_ratio: span/ratio limit, e.g. 250 for L/250. Default: the design code's\n        limit (Eurocode profile: 250).\n    span_m: reference span in meters for the limit (default: longest member).\n        Set it when members are split at every node, e.g. a 6.2 m joist drawn\n        as two 3.1 m segments.\n    color_by: \"displacement\" or \"utilization\".\n    scale: deformation exaggeration; omit for automatic (~6% of span).\n    reveal: 0..1 fraction of members drawn (for staged construction playback).\n    reanalyze: False re-uses the last solve and only changes the display\n        (scale / color_by / reveal / physics / title) - cheap enough to animate.\n    physics: False draws the same members as plain geometry with no analysis\n        overlay (\"physics off\"), for before/after comparisons.\n    display_guids: draw only these members (e.g. one frame line for a section\n        view); the analysis still covers every member in guids.\n    title: legend title.\n    clear: remove the overlay.\n    engine: \"auto\" (default: Almond's native frame solver, no Karamba needed; Karamba\n        when the selection has shells or the bridge cannot export a model),\n        \"native\" or \"karamba\".\n    asset_loads: add the loads of placed library assets (native engine), as in\n        validate_structure; loaded points are drawn with load arrows.\n    floor_load_kn_m2, floor_dead_kn_m2: floor area loads on every enclosed bay, as in\n        validate_structure.\n    design_basis, uls_combination, design_code: as in validate_structure; the overlay draws\n        the SLS deflected shape coloured by the ULS utilization envelope.\n    connections: \"rigid\" or \"simple\", as in validate_structure; pinned ends are drawn\n        as small circles.\n    stability: \"auto\" or \"off\", as in validate_structure.\n    view: \"deflection\" (default) or \"buckling\": draw the first buckling mode of the\n        governing ULS combination with its alpha_cr (STABLE >= 10, SWAY-SENSITIVE 1-10,\n        UNSTABLE \u003c= 1) instead of the deflected shape.\n\nReturns JSON: status (\"pass\"|\"fail\"|\"error\"|\"cleared\"), max_displacement_mm,\ndeflection_limit_mm, span_m, max_utilization, scale, per-element\n{source_guids, max_displacement_mm, utilization}, warnings.\nThe native engine reports analysis_method \"native\"; engine=\"karamba\" needs\nKaramba3D 3.1 (the trial caps models at 20 beam elements).","summary":"Run a live structural analysis on a line model and SHOW it in every Rhino viewport:\nthe undeformed wireframe, the exaggerated deformed shape coloured blue -> red by displacement (or by utilization), supports, load arrows and a legend panel with max deflection, the L/limit check and PASS/FAIL. Nothing is baked into the document.","path":"src/mcp/features/structure/tools.py","line":215,"end":329,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/structure/tools.py#L215-L329","calls":["context._bridge_call","context._floor_spec","context._asset_load_spec","context._native_view","context.set_state","native_structure.combinations","native_structure.design_profile"],"guards":[{"condition":"not clear and (not guids)","line":245},{"condition":"color_by not in ('displacement', 'utilization')","line":247},{"condition":"engine not in ('auto', 'native', 'karamba')","line":250},{"condition":"deflection_limit_ratio is None","line":252},{"condition":"beam_diameter_mm is not None","line":271},{"condition":"scale is not None","line":274},{"condition":"span_m is not None","line":276},{"condition":"display_guids","line":278},{"condition":"title","line":280},{"condition":"not clear and reanalyze","line":285},{"condition":"asset_loads and (not clear) and reanalyze","line":301},{"condition":"not clear and engine != 'karamba' and (not (not reanalyze and context._VIEW_ENGINE == 'api'))","line":307},{"condition":"clear","line":318},{"condition":"note","line":322},{"condition":"err","line":287},{"condition":"engine == 'karamba'","line":302},{"condition":"err","line":305},{"condition":"not reanalyze and context._VIEW_ENGINE == 'native'","line":308},{"condition":"reply is not None","line":315},{"condition":"reanalyze","line":320},{"condition":"(connections or 'rigid').lower() not in native_structure.CONNECTIONS","  the analysis still covers every member in guids."},"engine":{"default":"auto","description":"\"auto\" (default: Almond's native frame solver, no Karamba needed; Karamba\nwhen the selection has shells or the bridge cannot export a model),\n\"native\" or \"karamba\".","type":"string"},"fabrication":{"default":"cold_formed","type":"string"},"fixed_supports":{"default":true,"description":"True = fully fixed supports, False = pinned (rotations free).","type":"boolean"},"floor_dead_kn_m2":{"default":0.0,"type":"number"},"floor_load_kn_m2":{"default":0.0,"type":"number"},"guids":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"default":null,"description":"Curve GUIDs of the structural axes plus point GUIDs marking supports\n(see fixed_supports). Without points, the lowest nodes are supported."},"load_kn":{"default":10.0,"description":"Total imposed load in kN, shared equally by the free nodes (-Z).","type":"number"},"material":{"default":"Steel","description":"\"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\".","type":"string"},"physics":{"default":true,"description":"False draws the same members as plain geometry with no analysis\noverlay (\"physics off\"), for before/after comparisons.","type":"boolean"},"reanalyze":{"default":true,"description":"False re-uses the last solve and only changes the display\n(scale / color_by / reveal / physics / title) - cheap enough to animate.","type":"boolean"},"reveal":{"default":1.0,"description":"0..1 fraction of members drawn (for staged construction playback).","type":"number"},"scale":{"anyOf":[{"type":"number"},{"type":"null"}],"default":null,"description":"deformation exaggeration; omit for automatic (~6% of span)."},"self_weight":{"default":true,"description":"include gravity.","type":"boolean"},"span_m":{"anyOf":[{"type":"number"},{"type":"null"}],"default":null,"description":"reference span in meters for the limit (default: longest member).\nSet it when members are split at every node, e.g. a 6. ult"],"type":"object","x-fastmcp-wrap-result":true}},"analyze_block_reculviely":{"name":"analyze_block_reculviely","title":"블록 구조 분석","group":"context","doc":"Read nested block structure or resolve a block occurrence without modifying the document.\n\nRequests and responses are bounded to 256 KiB of UTF-8 JSON. Unknown, unsupported and truncated observations remain unverified. Requires Bridge block_analysis=1.\n\nArgs:\n    mode: outline traverses objects and nested definitions; resolve-block finds\n        candidates for the current editing context along an explicit occurrence path.\n    options: outline accepts ids or path, otherwise scope (selected/viewport/document),\n        depth and output budgets. field_groups is a nonempty list of summary, objects,\n        annotations and transforms; the default is a compact summary. include_geometry\n        and annotations explicitly request their details. Narrow IDs/path/depth after\n        truncation; max_items also bounds eligible visits (reason=max_visits).\n        resolve-block accepts only path: 1..65 GUIDs from the top-level instance inward.\n    expected_model_path: Usually omitted; the runtime supplies the bound document path.\n    include_ids: Include IDs when needed; supplied target IDs are not repeated.\nReturns:\n    JSON with status, mode, document identity/units/tolerance and data, or an explicit error.","summary":"Read nested block structure or resolve a block occurrence without modifying the document.","path":"src/mcp/features/context/tools.py","line":115,"end":162,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/context/tools.py#L115-L162","calls":["context._send_and_receive"],"guards":[{"condition":"mode not in ('outline', 'resolve-block') or not isinstance(options, dict) or (not isinstance(expected_model_path, str)) or (not expected_model_path.strip())","line":120},{"condition":"mode == 'outline' and 'field_groups' in options and (not isi nclude_geometry\nand annotations explicitly request their details. Narrow IDs/path/depth after\ntruncation; max_items also bounds eligible visits (reason=max_visits).\nresolve-block accepts only path: 1..65 GUIDs from the top-level instance inward.","type":"object"}},"required":["mode","options"],"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"get_rhino_objects":{"name":"get_rhino_objects","title":"현재 객체 관찰","group":"context","doc":"읽기 전용으로 일반 모델 객체의 범위·속성·그룹·형상을 조회한다. `scope`는 현재 문서 가시 객체 `visible`(기본값), `selected`, 명시 GUID `ids`, 숨긴 객체를 포함한 `document` 중 선택한다. `object_ids`는 `ids`에서만 1..4096개를 받는다. 그룹이나 블록 내부로 자동 확장하지 않는다.\n\n`result_mode=\"summary\"`는 필터된 집합에서 실제 객체가 있는 레이어·객체 유형·형상 종류별 개수와 가시 수만 반환한다. `objects`(기본값)는 개별 객체를 반환한다. 필요한 정보가 정해져 있으면 `fields`로 골라 받는다. `fields=[\"id\"]`는 별도의 `include_ids` 설정 없이 GUID만 반환하며, `id`, `name`, `layer_path`, `object_type`, `geometry_kind`, `geometry_crc`, `visible`, `selected`, `hidden`, `locked`, `bounds`, `groups`, `user_dictionary`를 조합할 수 있다. 생략하면 기존 기본 정보를 반환하고 GUID는 `include_ids=true`일 때 포함한다. 요약·필드 선택·면 페이지와 유형 필터는 Bridge `object_observation>=2`가 필요하다.\n\n`filters` 조건은 AND로 결합한다. `layer_paths`는 전체 레이어 경로 1..64개의 정확한 일치, `object_types`는 조회된 `object_type` 이름 1..32개, `name_contains`는 이름 부분 문자열이며 대소문자를 구분하지 않는다. `user_dictionary`는 `{source: \"attributes\" 또는 \"geometry\", key: 키, any_of: [값들]}` 조건 배열이다. scalar 또는 배열의 원소와 정확히 비교하며 문자열을 임의로 분할하거나 층 정보를 추론하지 않는다. 메타데이터 필터를 건축 요소의 정체성과 동일시하지 않는다.\n\n예: `get_rhino_objects(scope=\"document\", filters={\"user_dictionary\":[{\"source\":\"attributes\",\"key\":\"Floor\",\"any_of\":[\"층A\"]}]}, fields=[\"id\",\"user_dictionary\"])`는 Floor의 scalar 값 또는 배열 원소가 `\"층A\"`인 객체를 조회한다. 층 이름은 실제 값으로 바꾼다. 키의 존재나 필터 일치는 실제 층 소속의 정확성을 보증하지 않는다. 배열 쓰기는 `get_modeling_guide(tool=\"execute_rhino_script\")`의 예를 따른다.\n\n기본 객체 응답은 문서 가시성·선택 여부·bbox·원본 `geometry_crc`·두 UserDictionary·그룹을 포함한다. 그룹의 `members_outside_match_count`와 문서의 `visible_outside_match_count`는 조회 범위 밖의 관계를 드러낸다. `visible`은 Rhino의 문서/레이어 가시성으로, 화면의 픽셀·가림·clipping 결과를 보증하지 않는다.\n\n`include_geometry=true`면 Brep의 유효성·solid·manifold·체적과 면 정보를 추가한다. 기하 정보도 `fields`의 `geometry_valid`, `solid`, `manifold`, `volume`, `face_count`, `faces`로 선택할 수 있으며 명시한 fields가 우선한다. `faces`에는 원본 ID·CRC와 `face_page`를 함께 반환한다. `face_limit`은 1..128, `face_offset`은 면 시작 위치다. 다음 면 페이지는 `scope=\"ids\"`, 대상 ID들과 이전 `geometry_crc`를 담은 `expected_geometry_crcs={GUID: CRC}`로 요청하며 형상이 바뀌면 거절한다. 면의 `face_edit_supported`는 사전 판별이며 실제 편집 성공 보장은 아니다.\n\n바깥 `offset`/`limit`(1..200), `next_offset`, `complete`는 객체 또는 요약행의 페이지이고, 각 객체의 `face_page`는 그 객체의 면 페이지다. 응답은 256 KiB, 문서 스캔은 100000개로 제한하며 초과하면 범위·필드·페이지 크기를 줄여 조회한다. 가시 범위와 그룹의 범위 밖 관계는 실제로 반환된 필드에 근거해 읽는다.\n\n명시적 `status=\"error\"`는 같은 상세 JSON을 유지하면서 MCP `isError=true`로 반환한다. 미완료 페이지를 오류나 전체 검증 완료로 바꾸지 않는다.","summary":"읽기 전용으로 일반 모델 객체의 범위·속성·그룹·형상을 조회한다. `scope`는 현재 문서 가시 객체 `visible`(기본값), `selected`, 명시 GUID `ids`, 숨긴 객체를 포함한 `document` 중 선택한다. `object_ids`는 `ids`에서만 1..4096개를 받는다. 그룹이나 블록 내부로 자동 확장하지 않는다.","path":"src/mcp/features/context/tools.py","line":169,"end":182,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/context/tools.py#L169-L182","calls":["object_queries.query"],"guards":[],"returns":["_observation_result(object_queries.query(context._send_and_receive, scope=scope, ids=[] if object_ids is None else object_ids, filters={} if filters is None else filters, include_geometry=include_geometry, offset=offset, limit=limit, expected_model_path=expected_model_path, result_mode=result_mode, fields=fields, face_offset=face_offset, face_limit=face_limit, expected_geometry_crcs=expected_geometry_crcs, include_ids=include_ids))"],"annotations":{"destructiveHint":false,"readOnlyHint":true},"inputSchema":{"additionalProperties":false,"properties":{"expected_geometry_crcs":{"anyOf":[{"additionalProperties":{"type":"integer"},"type":"object"},{"type":"null"}],"default":null},"expected_model_path":{"default":"","type":"string"},"face_limit":{"default":128,"type":"integer"},"face_offset":{"default":0,"type":"integer"},"fields":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"default":null},"filters":{"anyOf":[{"additionalProperties":true,"type":"object"},{"type":"null"}],"default":null},"include_geometry":{"default":false,"type":"boolean"},"include_ids":{"default":false,"type":"boolean"},"limit":{"default":50,"type":"integer"},"object_ids":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"default":null},"offset":{"default":0,"type":"integer"},"result_mode":{"default":"objects","type":"string"},"scope":{"default":"visible","type":"string"}},"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"get_object_intersections":{"name":"get_object_intersections","title":"객체의 실제 교차 조회","group":"context","doc":"명시 GUID 1..512개의 닫힌 Brep·Extrusion·방향이 정해진 manifold Mesh의 체적 교차를 읽기 전용으로 검사한다. Component 등록은 필요 없다. `max_pairs`(1..64)는 한 페이지의 후보쌍 계산 수다. `include_blocks=true`면 중첩 블록의 배치 변환을 적용한 구성원도 검사하며 정의는 수정하지 않는다. Disjoint Mesh는 문서에서 분해·재결합할 필요가 없다. Brep/Mesh 혼합 쌍은 임시 메싱에 의한 근사임을 결과에 표시한다.\n\n`next_cursor`를 같은 대상과 함께 전달하면 나머지 후보를 이어 검사한다. 형상·범위가 바뀌면 cursor가 거절된다. 페이지 결과를 합쳐 읽고, `pagination_complete`는 후보 열거의 끝, `complete`는 이번 응답만으로 전체 범위가 확인됐는지를 뜻한다. 미지원·판정 불명·미검사는 무교차가 아니다. 각 쌍의 `a.handle`, `b.handle`, `pair_state`는 ID 표시 옵션과 무관하게 반환되며 `show_object_intersection`·`resolve_object_intersection`의 입력으로 쓴다. 그룹은 대상을 자동 추가하지 않는다.\n\n명시적 `status=\"error\"`는 MCP `isError=true`와 일치시킨다. 정상 페이지의 `unknown`·`complete=false`·`next_cursor`는 그대로 보존한다.","summary":"명시 GUID 1..512개의 닫힌 Brep·Extrusion·방향이 정해진 manifold Mesh의 체적 교차를 읽기 전용으로 검사한다. Component 등록은 필요 없다. `max_pairs`(1..64)는 한 페이지의 후보쌍 계산 수다. `include_blocks=true`면 중첩 블록의 배치 변환을 적용한 구성원도 검사하며 정의는 수정하지 않는다. Disjoint Mesh는 문서에서 분해·재결합할 필요가 없다. Brep/Mesh 혼합 쌍은 임시 메싱에 의한 근사임을 결과에 표시한다.","path":"src/mcp/features/context/tools.py","line":189,"end":194,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/context/tools.py#L189-L194","calls":["object_queries.intersections"],"guards":[],"returns":["_observation_result(object_queries.intersections(context._send_and_receive, ids=object_ids, max_pairs=max_pairs, expected_model_path=expected_model_path, include_blocks=include_blocks, cursor=cursor, include_ids=include_ids))"],"annotations":{"destructiveHint":false,"readOnlyHint":true},"inputSchema":{"additionalProperties":false,"properties":{"cursor":{"default":"","type":"string"},"expected_model_path":{"default":"","type":"string"},"include_blocks":{"default":false,"type":"boolean"},"include_ids":{"default":false,"type":"boolean"},"max_pairs":{"default":64,"type":"integer"},"object_ids":{"items":{"type":"string"},"type":"array"}},"required":["object_ids"],"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"capture_rhino_inspection":{"name":"capture_rhino_inspection","title":"검토용 화면 캡처","group":"context","doc":"지정한 여러 시점과 객체집합을 하나의 PNG에 담으며 Rhino 문서를 바꾸지 않는 캡처다. `views`는 1..16개 tile로, 각 항목은 `object_ids`, `direction`, `display_mode`, `label`을 받는다. tile별 명시 `object_ids`는 서로 다른 최상위 GUID 1..512개이며, 생략 또는 `[]`는 기존 문서 가시 범위다. 모든 tile에 같은 집합을 쓰면 최상위 `object_ids`(1..4096개)를 한 번 전달한다. 이 공통 집합의 `[]`는 오류이며 문서 전체로 확대하지 않는다. 공통 집합과 비어 있지 않은 tile별 집합은 혼용하지 않는다. 공통 집합에는 `inspection_shared_scope=1`이 필요하며 응답 `shared_scope`의 전체 GUID·총수와 tile의 `scope.shared_scope_ref`가 대응한다. 현재 선택·카메라·숨김 상태를 바꾸지 않는다.\n\n기본 카메라는 연결 문서의 활성 모델뷰다. `model_view_id`에 기존 모델 viewport GUID를 지정하면 활성 Layout·Detail을 유지한 채 그 모델뷰를 복사한다(`inspection_model_view=1` 필요). Layout이 활성인데 모델뷰를 지정하지 않으면 `layout_not_supported`다. `editor.mode=\"model\"`, `stable=true`가 필요하며 group/block 편집이나 미확인 상태는 `editing_context_unverified`다. Layout 용지는 `get_rhino_viewport_image(view=Layout_GUID)`로 캡처한다.\n\n`direction`은 `current`, `top`, `bottom`, `front`, `back`, `left`, `right`, `iso_ne`, `iso_nw`, `iso_se`, `iso_sw`, `below_ne`, `below_nw`, `below_se`, `below_sw` 중 선택한다. 필요한 시점만 요청한다. `display_mode` 생략 시 현재 모드를 쓰며, 이름이 중복되면 `get_rhino_context(sections=[\"display_modes\"], include_ids=true)`에서 확인한 GUID를 사용한다. 각 tile의 메타데이터와 오류를 읽고 이미지의 실제 범위를 확인한다.\n\n`width`/`height`는 tile 픽셀 크기(128..2048, 기본 640×480), `columns`는 배치 열 수다. 합계 16M 픽셀과 PNG 4 MiB를 넘으면 크기나 tile 수를 줄인다. 명시 필터에서 블록 인스턴스·블록 내부 객체는 지원하지 않으며 해당 tile 오류로 보고한다. 필터를 생략한 전체 범위에서는 블록을 원래대로 표시한다.\n\n최상위 `complete`는 요청한 tile의 캡처 성공 여부, `scope.complete`는 요청 GUID가 문서 가시 범위에 포함됐는지를 뜻한다. 실제 픽셀 노출이나 설계 적합성을 보증하지 않는다. 부분 성공이면 정상 이미지와 tile별 오류를 함께 읽고, 조회 preview나 일부 GUID만 캡처한 결과를 전체 범위로 해석하지 않는다.\n\nPNG는 이미지 content를 유지하면서 관리된 파일로도 저장한다. `image_file`은 상대 경로·bytes·SHA256·plan/connection 보존 수명 또는 저장 실패를 별도로 반환한다. 요청은 256 KiB, 이미지 외 메타데이터는 512 KiB 이내이며 상한 초과를 조용히 잘라내지 않는다.","summary":"지정한 여러 시점과 객체집합을 하나의 PNG에 담으며 Rhino 문서를 바꾸지 않는 캡처다. `views`는 1..16개 tile로, 각 항목은 `object_ids`, `direction`, `display_mode`, `label`을 받는다. tile별 명시 `object_ids`는 서로 다른 최상위 GUID 1..512개이며, 생략 또는 `[]`는 기존 문서 가시 범위다. 모든 tile에 같은 집합을 쓰면 최상위 `object_ids`(1..4096개)를 한 번 전달한다. 이 공통 집합의 `[]`는 오류이며 문서 전체로 확대하지 않는다. 공통 집합과 비어 있지 않은 tile별 집합은 혼용하지 않는다. 공통 집합에는 `inspection_shared_scope=1`이 필요하며 응답 `shared_scope`의 전체 GUID·총수와 tile의 `scope.shared_scope_ref`가 대응한다. 현재 선택·카메라·숨김 상태를 바꾸지 않는다.","path":"src/mcp/features/context/tools.py","line":199,"end":214,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/context/tools.py#L199-L214","calls":[],"guards":[{"condition":"columns is not None","line":208},{"condition":"model_view_id != ''","line":210},{"condition":"object_ids is not None","line":212}],"returns":["execute(context._send_and_receive, payload, path)","_viewport_result(error_payload(str(exc), error_code='invalid_arguments'))"],"annotations":{"destructiveHint":false,"readOnlyHint":false},"inputSchema":{"additionalProperties":false,"properties":{"columns":{"anyOf":[{"type":"integer"},{"type":"null"}],"default":null},"expected_model_path":{"default":"","type":"string"},"height":{"default":480,"type":"integer"},"model_view_id":{"default":"","type":"string"},"object_ids":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"default":null},"views":{"items":{"additionalProperties":true,"type":"object"},"type":"array"},"width":{"default":640,"type":"integer"}},"required":["views"],"type":"object"},"outputSchema":null},"get_rhino_viewport_image":{"name":"get_rhino_viewport_image","title":"뷰포트 이미지","group":"context","doc":"Return a Rhino viewport, Named View or Layout as a PNG image, without activating it.\n\nOmit view to capture the current view. Pass view=\"a\" to list viewports, named_views, and layouts, with only name and guid for each entry. Then pass the desired GUID as view.\nNames need not be unique. Named Views render the saved camera off screen using Shaded by default; they never replace the visible viewport. Layouts capture the paper area, including its details, not the surrounding workspace. A current Layout also captures its paper, even when a detail is active.\n\nFor capture resolution and Layout print appearance, follow [BASIC-INSTRUCTIONS.md](../../BASIC-INSTRUCTIONS.md#get_rhino_viewport_image-화면으로-관찰하기).\nThe validated PNG is saved under the selected Plan's artifacts/captures, or connection-owned scratch when no Plan is selected. image_file reports a project-relative path, bytes, SHA256 and lifetime; storage failure leaves the image available. Capture does not change camera, selection or Undo state, or prove geometric correctness. A failed or oversized image is an error, never a silently resized image.\n\nArgs:\n    view: Empty for current view, \"a\" for the grouped list, or a listed GUID.\n    scale_percent: Integer from 1 to 100; default 75. Choose sufficient resolution for the intended reading. Controls pixels, not a Layout Detail's drawing scale.\n    width, height: Optional explicit output pixels, both 128..2048 with scale_percent=100.\n        Supported for model view/Named View/group/block with capture_output_size=1;\n        the live window is not resized. Layouts reject these options and retain 144 dpi.\n    include_usage: False returns the image and file metadata. True also returns dimensions and an\n        illustrative token estimate (32px patches x 1.2, without provider resizing).\n        Actual usage depends on the client's model and detail setting, which MCP\n        does not supply. PNG compression reduces bytes, not pixel-token counts.\n    display_mode: Installed display mode name or GUID. Empty preserves the current\n        model viewport mode; Named View/group/block captures default to Shaded. List\n        available modes with get_rhino_context(sections=[\"display_modes\"], include_ids=true).\n        Realtime rendering modes such as Raytraced are rejected; this tool does not\n        wait for asynchronous rendering to finish.\n    labels: True by default. Transient pixels show top-level group name/GUID, block\n        instance name/GUID and ungrouped object GUID, without creating document objects.\n        At most 200 labels; explicit smaller targets/depth narrow a truncated overlay.\n    depth: 1..8, default 1; higher values expose nested entity labels.\n    target_kind: view (default), group or block. group/block frame target bounds in a\n        detached viewport and label that target; surrounding geometry stays visible.\n    target_id: Persistent group GUID or block instance GUID for group/block; leave view\n        empty. Definition GUIDs are not block instance targets.\n    Layouts retain each detail's mode, reject a mode override, and explicitly warn that\n        detail labels are unavailable; capture a Named View/model viewport for labels.\nReturns:\n    One MCP PNG image and image_file metadata, optional warnings/usage, or the grouped name/GUID list for view=\"a\".\n    Images are limited to 16 megapixels and 4 MiB. PNG files are additive writes, so capture-capable tools do not advertise MCP readOnlyHint; the Rhino document remains unchanged.","summary":"Return a Rhino viewport, Named View or Layout as a PNG image, without activating it.","path":"src/mcp/features/context/tools.py","line":225,"end":296,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/context/tools.py#L225-L296","calls":["context._send_and_receive"],"guards":[{"condition":"not isinstance(view, str) or type(scale_percent) is not int or (not 1 \u003c= scale_percent \u003c= 100) or (type(include_usage) is not bool)","line":230},{"condition":"not isinstance(display_mode, str) or len(display_mode) > 512 or type(labels) is not bool or (type(depth) is not int) or (not 1 \u003c= depth \u003c= 8) or (target_kind not in ('view', 'group', 'block')) or (not isinstance(target_id, str))","line":236},{"condition":"target_kind == 'view'","line":242},{"condition":"explicit_size and (type(width) is not int or type(height) is not int or (not 128 \u003c= width \u003c= 2048) or (not 128 \u003c= height \u003c= 2048) or (scale_percent != 100) or (view == 'a'))","line":255},{"condition":"view not in ('', 'a')","line":261},{"condition":"explicit_size","line":273},{"condition":"not isinstance(response, dict)","line":290},{"condition":"target_id","line":243},{"condition":"explicit_size","line":276},{"condition":"view","line":248},{"condition":"not isinstance(observed, dict) or observed.get('status') != 'success' or observed.get('capabilities', {}).get('capture_output_size') != 1","line":279}],"returns":["_capture_result(response, view, scale_percent, include_usage, requested_size=(width, height) if explicit_size else None)","_viewport_result(error_payload('view must be a string, scale_percent an integer from 1 to 100, and include_usage a boolean.', error_code='invalid_arguments'))","_viewport_result(error_payload('Use a display mode name/GUID, boolean labels, depth 1..8 and target_kind view/group/block.', error_code='invalid_arguments'))","_viewport_result(error_payload('Explicit width and height must both be 128..2048 pixels with scale_percent=100; they cannot list views.', error_code='invalid_arguments'))","_viewport_result(error_payload('The viewport response must be a JSON object.', error_code='invalid_capture_response'))","_viewport_result(error_payload('Use view for a viewport/Named View/Layout GUID.', error_code='invalid_arguments'))","_viewport_result(error_payload(f'Could not capture the live Rhino viewport: {exc}', error_code='bridge_error'))","_viewport_result(error_payload('Group/block captures require target_id as a GUID and an empty view.', error_code='invalid_arguments'))","_viewport_result(error_payload(\"Omit view for the active viewport, use 'a' to list views, or pass a listed GUID.\", error_code='invalid_arguments'))","_viewport_result(error_payload('Load a Bridge with capture_output_size=1 before requesting explicit pixels.', error_code='unsupported_capture_size'))"],"annotations":{"destructiveHint":false,"readOnlyHint":false},"inputSchema":{"additionalProperties":false,"properties":{"depth":{"default":1,"description":"1..8, default 1; higher values expose nested entity labels.","type":"integer"},"display_mode":{"default":"","description":"Installed display mode name or GUID. Empty preserves the current\nmodel viewport mode; Named View/group/block captures default to Shaded. List\navailable modes with get_rhino_context(sections=[\"display_modes\"], include_ids=true).\nRealtime rendering modes such as Raytraced are rejected; this tool does not\nwait for asynchronous rendering to finish.","type":"string"},"height":{"anyOf":[{"type":"integer"},{"type":"null"}],"default":null},"include_usage":{"default":false,"description":"False returns the image and file metadata. True also returns dimensions and an\nillustrative token estimate (32px patches x 1.2, without provider resizing).\nActual usage depends on the client's model and detail setting, which MCP\ndoes not supply. PNG compression reduces bytes, not pixel-token counts.","type":"boolean"},"labels":{"default":true,"description":"True by default. Transient pixels show top-level group name/GUID, block\ninstance name/GUID and ungrouped object GUID, without creating document objects.\nAt most 200 labels; explicit smaller targets/depth narrow a truncated overlay.","type":"boolean"},"scale_percent":{"default":75,"description":"Integer from 1 to 100; default 75. Choose sufficient resolution for the intended reading. Controls pixels, not a Layout Detail's drawing scale.","type":"integer"},"target_id":{"default":"","description":"Persistent group GUID or block instance GUID for group/block; leave view\nempty. Definition GUIDs are not block instance targets.","type":"string"},"target_kind":{"default":"view","description":"view (default), group or block. group/block frame target bounds in a\ndetached viewport and label that target; surrounding geometry stays visible.","type":"string"},"view":{"default":"","description":"Empty for current view, \"a\" for the grouped list, or a listed GUID.","type":"string"},"width":{"anyOf":[{"type":"integer"},{"type":"null"}],"default":null}},"type":"object"},"outputSchema":null},"capture_conditioning_pass":{"name":"capture_conditioning_pass","title":"경로별 RGB·선·깊이 캡처","group":"capture","doc":"Capture RGB + edge (line drawing) + depth frames along a camera path from the LIVE Rhino document, as conditioning for geometry-guided video generation (Wan VACE / ControlNet).\nDepth and edges are read from the model itself, not estimated, and every frame's camera is recorded so the generated video can be re-projected against the source geometry.\n\nThe shot JSON describes a camera path in model units, usually mm, using one of these forms.\n  {\"type\":\"orbit\",\"center\":[x,y,z],\"radius\":r,\"height\":z,\"frames\":81, \"start_deg\":0,\"end_deg\":90,\"lens\":35,\"target_height\":z} {\"type\":\"track\",\"cam0\":[x,y,z],\"cam1\":[..],\"target0\":[..],\"target1\":[..],\"frames\":81,\"lens\":35} {\"type\":\"keyframes\",\"keyframes\":[{\"camera\":[..],\"target\":[..],\"lens\":35}, ...],\"frames\":81} Use 4n+1 frames for Wan models (17, 33, 49, 65, 81). 81 frames = 5 s at 16 fps.\n\nWrites to out_dir: rgb/ edge/ depth/ (f0000.png ...), rgb.mp4 / edge.mp4 / depth.mp4 (when ffmpeg is available), camera.json (per-frame camera receipt, schema building0.camera/0.1), zrange.csv (per-frame depth range), doc.json, summary.json. Depth is grayscale with near = bright (Rhino's native convention, what Wan/ControlNet depth expects); set invert_depth for near = dark.\nCamera restoration is best effort after the pass. Returns the summary JSON.","summary":"Capture RGB + edge (line drawing) + depth frames along a camera path from the LIVE Rhino document, as conditioning for geometry-guided video generation (Wan VACE / ControlNet).\nDepth and edges are read from the model itself, not estimated, and every frame's camera is recorded so the generated video can be re-projected against the source geometry.","path":"src/mcp/features/capture/tools.py","line":13,"end":39,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/capture/tools.py#L13-L39","calls":["conditioning.build_path","conditioning.capture_conditioning_pass"],"guards":[],"returns":["json.dumps(summary)","json.dumps(error_payload(f'Bad shot description: {e}'))","json.dumps(error_payload('Connection refused. Is the RhinoAlmondBridge plugin loaded in Rhino?'))","json.dumps(error_payload(f'Conditioning pass failed: {e}'))"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"chunk":{"default":16,"type":"integer"},"edge_mode":{"default":"Technical","type":"string"},"fps":{"default":16,"type":"integer"},"height":{"default":480,"type":"integer"},"in
