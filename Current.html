set_contract":{"name":"export_asset_contract","title":"GLB·계약 파일 내보내기","group":"exchange","doc":"Exports Rhino objects as a portable Almond asset: a GLB plus an asset contract (.almond.json) carrying what the file cannot.\n\nThe contract records real dimensions in mm, the anchor and support plane, clearances, and the Almond material_id of every object - so another application (Blender, Unreal, another Rhino) can restore full meaning even though glTF drops per-object metadata. Pair with import_asset_contract on the receiving side.\n\nArgs:\n    guids: Rhino object GUIDs to export (from execute_rhino_script).\n    asset_id: Stable id, e.g. \"canopy-pavilion-01\" (letters, digits, . _ -).\n    name: Human-readable name; defaults to asset_id.\n    output_dir: Destination folder. Default: \u003cuser data dir>/exchange.\nReturns:\n    JSON with the glb path, contract path, and recorded dimensions.","summary":"Exports Rhino objects as a portable Almond asset: a GLB plus an asset contract (.almond.json) carrying what the file cannot.","path":"src/mcp/features/exchange/tools.py","line":163,"end":223,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/exchange/tools.py#L163-L223","calls":["context._material_groups","context.exchange.contract_paths","context.exchange.build_contract","context._send_and_receive"],"guards":[{"condition":"not guids","line":169},{"condition":"result.get('status') != 'success'","line":188},{"condition":"not bounds","line":192}],"returns":["json.dumps({'status': 'success', 'asset_id': asset_id, 'glb_path': str(glb_path), 'contract_path': str(contract_path), 'dimensions_mm': contract['dimensions_mm'], 'materials': material_groups, 'next_step': read_instruction(__file__, 'response-672')})","json.dumps(error_payload('At least one GUID is required.'))","json.dumps(result)","json.dumps(error_payload('Export returned no bounds.'))","json.dumps(error_payload(str(exc)))","json.dumps(error_payload('Rhino bridge is unavailable.'))","json.dumps(error_payload(f'GLB export failed: {exc}'))"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"asset_id":{"description":"Stable id, e.g. \"canopy-pavilion-01\" (letters, digits, . _ -).","type":"string"},"guids":{"description":"Rhino object GUIDs to export (from execute_rhino_script).","items":{"type":"string"},"type":"array"},"name":{"default":"","description":"Human-readable name; defaults to asset_id.","type":"string"},"output_dir":{"default":"","description":"Destination folder. Default: \u003cuser data dir>/exchange.","type":"string"}},"required":["guids","asset_id"],"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"import_asset_contract":{"name":"import_asset_contract","title":"계약 파일 가져오기","group":"exchange","doc":"Imports an Almond asset contract (from Blender, Unreal, or another Rhino) into the open Rhino document, restoring everything the file format drops.\n\nRuns the full receive sequence: import the GLB, collapse the duplicate materials glTF creates, restore canonical PBR values from the Almond material library (glTF round trips shift base colours), re-attach the almond:* metadata keyed off the surviving material name, place the asset at the requested point using the contract's anchor, and verify the measured size against the contract's recorded dimensions.\n\nArgs:\n    contract_path: Path to a .almond.json contract file.\n    x_mm, y_mm, z_mm: Placement point in millimetres (contract anchor).\n    rotation_degrees: Rotation about world Z.\n    layer: Destination layer, created if absent.\nReturns:\n    JSON with counts restored/deduplicated and a dimension_check comparing\n    what landed against the contract.","summary":"Imports an Almond asset contract (from Blender, Unreal, or another Rhino) into the open Rhino document, restoring everything the file format drops.","path":"src/mcp/features/exchange/tools.py","line":275,"end":287,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/exchange/tools.py#L275-L287","calls":["context.exchange.load_contract","context._receive_contract"],"guards":[],"returns":["json.dumps(context._receive_contract(contract, x_mm, y_mm, z_mm, rotation_degrees, layer))","json.dumps(error_payload(str(exc)))"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"contract_path":{"description":"Path to a .almond.json contract file.","type":"string"},"layer":{"default":"ALMOND-EXCHANGE","description":"Destination layer, created if absent.","type":"string"},"rotation_degrees":{"default":0,"description":"Rotation about world Z.","type":"number"},"x_mm":{"default":0,"type":"number"},"y_mm":{"default":0,"type":"number"},"z_mm":{"default":0,"type":"number"}},"required":["contract_path"],"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"get_blender_helper_script":{"name":"get_blender_helper_script","title":"Blender용 코드 받기","group":"exchange","doc":"Returns Python to run inside Blender (via blender-mcp's execute_code) so Blender participates in the Almond workflow without a dedicated bridge.\n\nActions:\n    \"export\"    - export the current Blender selection as an Almond asset contract + GLB (measured from evaluated mesh data, because Blender inflates curve bounding boxes).\n    \"materials\" - create Almond library materials in Blender (sRGB values converted to linear) and assign them to named objects, tagging both with almond:* properties.\n\nArgs:\n    action: \"export\" or \"materials\".\n    asset_id, name, output_dir: for \"export\" (output_dir defaults to the\n        Almond exchange folder).\n    material_id, object_names: for \"materials\".\nReturns:\n    JSON with a \"script\" field to pass to Blender's execute_code.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds notes, audit, or all; the requested manifest/parsed logic/script remains in the default payload.\ninclude_ids independently enables handles; audit enables timestamps.","summary":"Returns Python to run inside Blender (via blender-mcp's execute_code) so Blender participates in the Almond workflow without a dedicated bridge.","path":"src/mcp/features/exchange/tools.py","line":377,"end":401,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/exchange/tools.py#L377-L401","calls":["context.material_library.get","context.exchange.blender_material_script","context.exchange.blender_export_script"],"guards":[{"condition":"action == 'export'","line":382},{"condition":"action == 'materials'","line":392},{"condition":"not asset_id","line":383},{"condition":"not material","line":394},{"condition":"not object_names","line":396}],"returns":["json.dumps(project(error_payload('action must be \"export\" or \"materials\".'), field_groups))","json.dumps(project({'status': 'success', 'action': 'export', 'script': context.exchange.blender_export_script(asset_id, name or asset_id, target), 'note': read_instruction(__file__, 'response-677')}, field_groups))","json.dumps(project({'status': 'success', 'action': 'materials', 'script': script}, field_groups))","json.dumps(project(error_payload('asset_id is required for export.'), field_groups))","json.dumps(project(error_payload(read_instruction(__file__, 'response-679').format(material_id)), field_groups))","json.dumps(project(error_payload('object_names is required.'), field_groups))"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"action":{"description":"\"export\" or \"materials\".","type":"string"},"asset_id":{"default":"","type":"string"},"field_groups":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"default":null},"include_ids":{"default":false,"type":"boolean"},"material_id":{"default":"","type":"string"},"name":{"default":"","type":"string"},"object_names":{"anyOf":[{"items":{"type":"string"},"type":"array"},{"type":"null"}],"default":null},"output_dir":{"default":"","type":"string"}},"required":["action"],"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"get_modeling_policy":{"name":"get_modeling_policy","title":"모델링 정책 조회","group":"modeling","doc":"Return JSON-defined object/group metadata keys and material-layer naming rules.\n\nNames are free. Do not automatically write Almond management UserStrings on objects.\nExisting keys describe compatibility data, not a checklist to fill. Preserve existing user metadata and asset provenance; ordinary naming, layer and material properties are independent of management UserStrings.","summary":"Return JSON-defined object/group metadata keys and material-layer naming rules.","path":"src/mcp/features/modeling/tools.py","line":20,"end":21,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/modeling/tools.py#L20-L21","calls":[],"guards":[],"returns":["{'status': 'success', 'policy': modeling_policy.POLICY}"],"annotations":{"destructiveHint":false,"readOnlyHint":true},"inputSchema":{"additionalProperties":false,"properties":{},"type":"object"},"outputSchema":{"additionalProperties":true,"type":"object"}},"execute_rhino_script":{"name":"execute_rhino_script","title":"코드를 입력해서 실행","group":"modeling","doc":"Execute source or a complete macro in the bound Rhino through official RhinoCode.\n\nPython 3 is the default. Read get_modeling_guide(tool=\"execute_rhino_script\") for this contract and the bundled rhino3d-scripts skill, API maps and loading guidance.\nNo separate skill installation is required. The wrapper binds doc/scriptcontext, owns Undo and redraw, and restores cwd/environment even after an exception.\nUse document tolerance, explicit object IDs and validated geometry before replacing or deleting originals. Batch loops belong in synchronous source with per-item results.\n\npython/python2 assign JSON-compatible values directly, for example result = {\"changed\": 2}.\nUse dict/list for structured results; json.dumps returns text instead. The first response includes up to 20 items per array or top-level list field, or 4096 characters for a top-level string; remaining data is paged.\ncsharp/csharp-script are C# statement bodies with doc and result_json, not the former class/Run format. command accepts one fully specified macro without adding !, Pause or dialogs. All modes require StartScriptServer in the bound Rhino; there is no legacy Bridge executor fallback.\nFixed queries and audited internal recipes keep their existing native paths.\n\nproject_root is absolute; artifact_dir is relative to it. General scripts run with project root as cwd. Use execute_project_python for the selected Plan folder as cwd.\nDo not assume worker-venv packages exist in Rhino's embedded Python. Return only measurements needed for the decision, collecting related work in one script.\n\nA waiting response includes request_id. Use get_rhino_execution when that execution is still pending, more result pages are needed, or output/diagnostics remain to be checked.\nA completed response with the needed result requires no follow-up read. CLI exit, print output and a timeout are not completion evidence. A completed exception may have partial changes; result_error does not roll them back. Never automatically retry uncertain work, open a different document or schedule detached document edits.\n\nWhen Floor metadata is requested, use the object's actual level labels, not the Scene's full level range. For multiple levels, write a typed string array; for one level, a string. This Python example uses an already identified `object_id` and nonempty `floor_names` list, preserving unrelated attributes:\n\n```python\nimport System\nobj = doc.Objects.FindId(System.Guid(object_id))\nif obj is None or obj.IsReference or obj.IsLocked:\n    raise ValueError(\"Floor target must be an editable local object\")\nattrs = obj.Attributes.Duplicate()\nvalue = floor_names[0] if len(floor_names) == 1 else System.Array[System.String](floor_names)\nattrs.UserDictionary.Set(\"Floor\", value)\nif not doc.Objects.ModifyAttributes(obj.Id, attrs, True):\n    raise RuntimeError(\"Floor update failed\")\nstored = doc.Objects.FindId(obj.Id).Attributes.UserDictionary[\"Floor\"]\nresult = {\"object_id\": str(obj.Id), \"Floor\": str(stored) if len(floor_names) == 1 else list(stored)}\n```\n\nArgs:\n    script: Synchronous Python source, C# statement body or complete command macro.\n    language: python (default Python 3), python2, csharp, csharp-script or command; every mode uses official RhinoCode.\n    timeout_seconds: Integer 1-600, default 60; waiting limit only. Retrieve the same request after timeout.\nReturns:\n    JSON execution outcome and result with a recoverable request_id; pending or failed calls preserve completion evidence.","summary":"Execute source or a complete macro in the bound Rhino through official RhinoCode.","path":"src/mcp/features/modeling/tools.py","line":26,"end":46,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/modeling/tools.py#L26-L46","calls":[],"guards":[{"condition":"not isinstance(script, str) or not script.strip()","line":28},{"condition":"not isinstance(language, str) or language not in {'csharp', 'python', 'python2', 'csharp-script', 'command'}","line":31},{"condition":"type(timeout_seconds) is not int or not 1 \u003c= timeout_seconds \u003c= 600","line":35},{"condition":"execute is None","line":39}],"returns":["json.dumps(execute(script, 'csharp-script' if language == 'csharp' else language, timeout_seconds), ensure_ascii=False)","json.dumps(error_payload('script must be nonempty source or a command.', error_code='invalid_arguments'))","json.dumps(error_payload('language must be csharp, python, python2, csharp-script or command.', error_code='invalid_arguments'))","json.dumps(error_payload('timeout_seconds must be an integer from 1 to 600.', error_code='invalid_arguments'))","json.dumps({**error_payload('RhinoCode execution requires a bound Almond runtime and StartScriptServer in its Rhino.', error_code='rhinocode_unavailable'), 'mutation_state': 'not_started'})"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"language":{"default":"python","description":"python (default Python 3), python2, csharp, csharp-script or command; every mode uses official RhinoCode.","type":"string"},"script":{"description":"Synchronous Python source, C# statement body or complete command macro.","type":"string"},"timeout_seconds":{"default":60,"description":"Integer 1-600, default 60; waiting limit only. Retrieve the same request after timeout.","type":"integer"}},"required":["script"],"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"edit_planar_face":{"name":"edit_planar_face","title":"평면 면 편집","group":"modeling","doc":"Translate one planar face of an existing closed Brep with Rhino's PushPull Extend.\nUse when extending or retracting that face preserves the intended element and its connections. The selected face and every adjacent face must be planar. This tool supports unlocked top-level model-space Breps, not extrusion conversions or block interiors; finish group/block editing first. It requires Bridge face_edit=1 and Rhino 8.16+.\n\nPass object_id, face_index and expected_geometry_crc from the same current geometry observation. A changed CRC rejects the edit before replacement. translation is an XYZ vector in document units; its component normal to the face must exceed document tolerance. The helper prepares a duplicate and checks valid closed manifold geometry, orientation and finite positive volume before replacing the original under its same GUID. Object attributes, groups, geometry UserStrings and the geometry UserDictionary are preserved. Other custom geometry user data is rejected before editing because its preservation cannot be verified by this operation.\n\nThe existing native executor owns Undo and completion. A confirmed result returns edited=true, the new geometry_crc, before/after volumes and face counts. Face indices may change; observe faces again before another edit. This reports the geometric edit, not construction suitability, clearance from neighbours or a saved document. Choose the observations needed to assess the intended change. An unconfirmed result must be inspected before retrying; timeout and result_error do not prove the edit was undone.","summary":"Translate one planar face of an existing closed Brep with Rhino's PushPull Extend.\nUse when extending or retracting that face preserves the intended element and its connections. The selected face and every adjacent face must be planar. This tool supports unlocked top-level model-space Breps, not extrusion conversions or block interiors; finish group/block editing first. It requires Bridge face_edit=1 and Rhino 8.16+.","path":"src/mcp/features/modeling/tools.py","line":51,"end":59,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/modeling/tools.py#L51-L59","calls":["face_edit.request","face_edit.dispatch"],"guards":[],"returns":["json.dumps(face_edit.dispatch(payload, context._send_and_receive), ensure_ascii=False)","json.dumps({**error_payload(str(exc), error_code='invalid_arguments'), 'mutation_state': 'not_started'})"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"expected_geometry_crc":{"type":"integer"},"expected_model_path":{"default":"","type":"string"},"face_index":{"type":"integer"},"object_id":{"type":"string"},"translation":{"items":{"anyOf":[{"type":"number"},{"type":"integer"}]},"type":"array"}},"required":["object_id","face_index","expected_geometry_crc","translation"],"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"edit_planar_faces":{"name":"edit_planar_faces","title":"평면 면 일괄 편집","group":"modeling","doc":"Edit one planar face on each of 1..32 distinct Breps in one native call and Undo record.\nUse the batch when the targets and face movements are already identified together.\nEach `edits` item contains `object_id`, `face_index`, `expected_geometry_crc` and `translation`, with the same geometry and preservation contract as `edit_planar_face`.\nRequires Bridge `face_edit_batch=1`. Repeated object IDs are rejected because an edit can change that object's face indices; observe its result before choosing another face.\n\nAll replacements are prepared and checked before the first document change. A preparation failure leaves every original unchanged. A replacement failure stops the batch and returns per-item `applied`, `failed`, `unknown` or `not_attempted` outcomes and `applied_count`.\nCompleted edits remain in the single Undo record; it is not an automatic rollback.\nPartial or uncertain execution is not a request to repeat the whole batch. Inspect the reported objects and reconcile any unknown outcome before deciding the next edit.","summary":"Edit one planar face on each of 1..32 distinct Breps in one native call and Undo record.\nUse the batch when the targets and face movements are already identified together.\nEach `edits` item contains `object_id`, `face_index`, `expected_geometry_crc` and `translation`, with the same geometry and preservation contract as `edit_planar_face`.\nRequires Bridge `face_edit_batch=1`. Repeated object IDs are rejected because an edit can change that object's face indices; observe its result before choosing another face.","path":"src/mcp/features/modeling/tools.py","line":64,"end":70,"url":"https://github.com/hongikkaan/almond-mcp/blob/a63f3f05020f108f60ba08a775e2a643efde6637/src/mcp/features/modeling/tools.py#L64-L70","calls":["face_edit.batch_request","face_edit.dispatch"],"guards":[],"returns":["json.dumps(face_edit.dispatch(payload, context._send_and_receive, batch=True), ensure_ascii=False)","json.dumps({**error_payload(str(exc), error_code='invalid_arguments'), 'mutation_state': 'not_started'})"],"annotations":null,"inputSchema":{"additionalProperties":false,"properties":{"edits":{"items":{"additionalProperties":true,"type":"object"},"type":"array"},"expected_model_path":{"default":"","type":"string"}},"required":["edits"],"type":"object"},"outputSchema":{"properties":{"result":{"type":"string"}},"required":["result"],"type":"object","x-fastmcp-wrap-result":true}},"save_rhino_document":{"name":"save_rhino_document","title":"Rhino 문서 저장","group":"modeling","doc":"Save the current connection's existing .3dm file without a command, prompt or Enter.\nUse after an authorized editing batch when the file should be saved. It saves the whole bound document to its existing path; there is no SaveAs or arbitrary path input.\nActive or uncertain group/block editing, a mismatched document and a read-only file are rejected before writing. A confirmed response returns saved=true and the actual modified flag. An unconfirmed response is not failure proof: never automatically repeat the save or clear the connection's native-completion protection.","summary":"Save the current connection's existing .3dm file without a command, prompt or Enter.\nUse after an authorized editing batch when the file should be saved. It saves the whole bound document to its existing path; there is no SaveAs or arbitrary path input.\nActive or uncertain group/block editing, a mismatched document and a read-only file are rejected before writing. A confirmed response returns saved=true and the actual modified flag. An unconfirmed response is not failure proof: n IDs without adding automatic dimensions.\n\nFor structural members, also declare what the object IS in construction terms: structural_role (e.g. \"joist\", \"girder\", \"stud\", \"truss_chord\") and construction_system (a system_id from get_construction_guidance).\nAn explicit structural_role retains its legacy user-text key. A system is stored as the typed construction_reference described below. If the chosen material_id is not a typical finish for the declared system, the response carries a warning (it still applies).\n\nfloor is a user-supplied level label. construction_detail is a readable label; construction_reference optionally identifies a known source as {\"kind\": \"construction_system\", \"id\": \"\u003csystem_id>\"}. These source records are preliminary system guidance, not verified construction details. The old construction_system argument is accepted and produces the same typed reference.\nA source name supplies the detail label when no explicit label is given.\n\nTwo effects, independently switchable:\n- apply_render_material: creates/reuses a physically-based Rhino material using the library name and assigns it per object, so GLB export (publish_to_chestnut) and Datasmith carry real PBR channels. The object's layer is always preserved. If false, no native material is changed or created.\n- attach_metadata: defaults to false; ordinary material application writes no object management UserStrings. Set true only for an explicit request to attach metadata. It writes only material_id when a native material is applied, plus supplied floor/detail/reference metadata. PBR channels remain on the native material. A metadata-only call preserves the current material identity and writes only the supplied metadata.\n\nUnspecified metadata and asset provenance are preserved. Requires a Bridge with modeling_materials=2; older Bridges are rejected before any mutation.\nWorks on breps, meshes, and block instances (an instance's material applies to definition geometry set ck 추가"]],"branches":["status만 읽지 말고 problems와 live_verified를 함께 확인합니다."],"source":"src/mcp/features/components/store.py:637"},"remove_ontological_component":{"summary":"Component의 의미 등록을 해제합니다. 반환을 upsert의 전체 ack와 동일하게 가정하지 않습니다.","fields":[["status","success"],["component.component_id / rhino_group_id","해제한 의미 단위와 그룹"],["component.status / live_verified","unregistered / true"]],"branches":["이 반환에는 availability·object_count가 없습니다.","일반 오류만으로 native 변경 여부를 추정하지 않습니다."],"source":"src/mcp/features/components/store.py:595"},"get_component_intersections":{"summary":"현재 대상의 실제 solid overlap을 페이지 단위로 조사합니다. 경계상자 후보와 실제 교차 결과를 구분합니다.","fields":[["pairs","쌍별 a/b occurrence handle, pair_state, overlap, regions"],["has_positive_overlap","true: 이번 페이지 양의 교차 / false: 전체 complete이며 없음 / null: 미확정"],["complete","첫 페이지부터 모든 후보 평가 + unsupported·unknown 없음"],["pagination_complete","마지막 후보 페이지 도달 여부. complete와 다름"],["next_cursor / remaining_candidate_pairs","후속 요청과 남은 후보"],["unsupported_objects / unknown_pair_count","결론을 제한하는 미지원·미확정 관찰"]],"branches":["include_ids=false여도 pairs의 handle과 pair_state는 다음 작업에 필요하므로 보존됩니다.","Component 범위는 현재 effective_object_ids 합집합의 모든 distinct pair입니다.","max_pairs는 1–64, include_blocks 기본 false입니다."],"source":"src/mcp/features/components/native/IntersectionAnalysis.cs:191"},"show_object_intersection":{"summary":"관찰한 쌍의 handle·pair_state로 교차 형상을 뷰포트에 미리 표시합니다. 문서 형상을 추가하지 않습니다.","fields":[["status / displayed","요청 결과와 실제 표시 여부"],["cleared","clear=true 성공 시 true, displayed=false"],["display_reason","표시할 수 없는 이유"],["pair 관찰 필드","원 쌍의 교차·형상 상태 증거"]],"branches":["형상이 바뀌면 stale reference를 거절합니다.","불명확한 교차나 반환 solid가 없는 경우 가짜 preview를 만들지 않습니다."],"source":"src/mcp/features/components/native/IntersectionTools.cs:112"},"resolve_object_intersection":{"summary":"관찰된 keep solid를 유지하고 trim solid에서 차감합니다. trim의 ID와 문서 속성은 보존합니다.","fields":[["result.edited / operation","true / subtract_keep_from_trim"],["result.keep_id / trim_id","검증된 keep과 trim 대상"],["result.previous_geometry_crc / geometry_crc","변경 전후 형상 CRC"],["result.object_id_preserved / geometry_kind","객체 ID 보존과 결과 형상 종류"],["mutation_state / requires_reconciliation","결과 검증 실패 시 unknown / true"]],"branches":["edited·대상 ID·CRC 변화 검증이 실패하면 intersection_resolution_unconfirmed입니다.","block occurrence, mixed Brep/Mesh, 미보존 user data, textured Mesh 등은 편집하지 않습니다.","타임아웃은 롤백이 아닙니다. 재시도 전에 현재 형상을 관찰합니다."],"source":"src/mcp/features/components/intersection_queries.py:1"},"focus_components":{"summary":"Component 객체를 선택·격리하고 확대합니다. 읽기 전용 조회가 아니라 선택·가시성·뷰를 바꿉니다.","fields":[["status / model_path / viewport_id","현재 문서·뷰 작업 결과"],["selected_ids / component_ids","대상 객체와 의미 단위"],["isolated / zoom_selected","격리·확대 여부"],["locked_context_remains_visible","잠긴 주변 객체는 남아 있음"],["restore_visibility_command","Unisolate"]],"branches":["전송 후 실패는 변경 여부 미확정일 수 있습니다."],"source":"src/mcp/features/components/native/ComponentOperations.cs:92"}},"translations":{"project_info":"선택된 프로젝트 정보를 읽습니다. sections의 기본값은 [\"project\", \"document\", \"artifacts\"]이며, runtime과 instructions는 선택 사항입니다. document 섹션은 이 호출 안에서 현재 열려 있는 실제 문서를 확인하므로, 이를 확인하기 위해서만 get_rhino_context를 다시 호출하지 마세요. 프로젝트 루트는 유일한 절대 경로이며 실제로 ALMOND_PROJECT_ROOT에 설정됩니다. 다른 경로는 이 루트를 기준으로 한 상대 경로입니다. 관리형 도구는 루트와 선택된 산출물 폴더를 자동으로 적용하므로, worker는 상대 경로를 전달합니다.\n이미 알고 있는 문맥을 재사용하세요. 최초 연결/재연결, 문서가 변경되었다는 증거, 누락된 프로젝트/경로 정보, 또는 사용자 요청이 있을 때만 새로 조회하세요.\n새 지시가 들어왔다는 사실만으로는 새로 조회할 이유가 되지 않습니다.","get_rhino_execution":"공식 RhinoCode 실행을 다시 실행하지 않고 읽습니다. 이 연결의 가장 최근 실행을 읽으려면 request_id를 생략하고, 특정 실행을 읽으려면 반환받은 정확한 요청 ID를 전달하세요.\n완료된 성공 실행을 읽으면 기본적으로 요청한 결과/로그, 페이지 정보, 요청 ID와 처리 결과가 반환됩니다. operation 식별 정보, native/CLI 세부 정보, Undo, 파일/해시 및 runtime 완료 증거를 보려면 include_diagnostics=true로 설정하세요.\n대기 중, 불확실, 실패, 부분 완료, 0이 아닌 CLI 종료 코드 및 결과 표시 오류 응답은 include_diagnostics가 false여도 상세 증거를 유지합니다.\n대기 중이거나 마무리 중인 작업은 소유권을 유지합니다. 완료로 인정하려면 정확한 최종 Rhino 수신 확인과 CLI 프로세스 종료가 모두 필요합니다. 타임아웃이나 프로세스 종료만으로는 완료가 입증되지 않습니다. CLI 수명주기가 아직 확인되지 않아 completed가 false인 동안에도 native_completed는 검증된 Rhino 결과를 보여줄 수 있습니다.\n늦게 도착한 정확한 결과는 CLI에만 해당하는 불확실성을 해소할 수 있습니다. 관련 없는 native 불확실성은 계속 차단됩니다. include_result는 결과 조회 여부를 제어하고, result_fields는 최상위 필드를 선택하며, offset/limit는 Rhino를 다시 호출하지 않고 보존된 결과의 행을 페이지 단위로 읽습니다(문자열인 경우에는 문자 단위).\n완료 여부, 필요한 결과 데이터, 로그 또는 진단 정보가 아직 확인되지 않았다면 다시 읽으세요. 필요한 결과가 들어 있는 완료 응답이면 충분합니다. include_stdout의 기본값은 false입니다. 명시적으로 작성한 코드의 결과에 대해 include_ids의 기본값은 true입니다. 요청 식별 정보는 항상 유지되며, operation 식별 정보는 진단 정보와 함께 제공됩니다.\n페이지 정보는 마지막 페이지에도 유지됩니다. 실행 파일은 이 연결이 정리될 때까지 사용할 수 있습니다. 외부 클라이언트에서는 connection_id로 현재 추적 중인 실제 연결을 대조합니다. 클라이언트 프로세스가 다시 시작된 후에는 connection_id를 생략하고 정확한 request_id를 전달하여 기록된 세션에서 보존된 증거를 읽으세요. 이 복구 전용 경로는 재연결하거나 Rhino 작업을 실행하지 않습니다.\n기록된 세션 저장소가 원래 위치에 남아 있는 동안에는 원래 모델 파일의 이름이 바뀌거나 파일이 삭제된 뒤에도 보존된 증거를 읽을 수 있습니다.","set_working_plan":"이 연결에서 사용할 Plan과 선택적 Step을 선택하거나 재개합니다. 기존 산출물 폴더를 재사용합니다. 처음 사용할 때는 artifact_name(폴더 이름 하나) 또는 Plan의 goal로 기록된 상대 경로 tmp/YYMMDD_name을 만듭니다. 실제 디렉터리는 파일이 필요할 때만 생성됩니다. Plan/Step 상태는 완료되어 있거나 선형 순서일 필요가 없습니다. 다른 worker도 Plan에서 같은 경로와 참조를 확인합니다. 기존 폴더 이름을 바꾸려면 rename_artifact_folder를 사용하세요. RhinoCode 프로젝트 Python은 이 디렉터리를 cwd로 사용하고, Rhino C#은 RhinoAlmondBridge.ManagedFiles.Output(\"relative-name\")을 사용합니다.","rename_artifact_folder":"Plan의 산출물 폴더 이름을 변경합니다. 기본 대상은 현재 선택된 Plan입니다. 이름 하나를 전달하면 YYMMDD_ 접두사가 자동으로 적용됩니다. 관리형 쓰기 작업은 이름 변경과 직렬화됩니다. 현재 Plan/Step의 파일 참조를 함께 갱신하면서 변경 불가능한 revision 이력은 유지합니다. 기존 대상 경로는 절대 덮어쓰지 않습니다.","execute_project_python":"공식 RhinoCode를 통해 바인딩된 Rhino 내부에서 Python 3를 실행하며, 선택된 Plan 산출물 폴더를 cwd로 사용합니다.\n\n번들로 제공되는 rhino3d-scripts 스킬과 참고 자료를 읽으려면 get_modeling_guide(tool=\"execute_project_python\")을 호출하세요. 먼저 set_working_plan으로 Plan을 선택하세요. 상대 경로 파일 쓰기는 해당 산출물 폴더에 저장됩니다. doc와 scriptcontext.doc는 바인딩된 RhinoDoc이며, result에 JSON 값을 대입하세요. project_root는 절대 경로이고 artifact_dir는 이를 기준으로 한 상대 경로입니다. wrapper는 프로젝트/산출물 환경 변수를 일시적으로 적용하고, cwd, scriptcontext, Undo 및 다시 그리기 상태를 복원합니다. 유용한 출력은 Plan/Step 참조에 기록하세요.\n\n이 방식은 외부 worker-venv Python 프로세스를 대체합니다. Rhino의 내장 패키지는 다를 수 있으며, 누락된 의존성은 자동으로 설치되지 않습니다. RhinoCommon을 사용할 수 있습니다. 분리된 프로세스나 백그라운드 쓰기 작업을 시작하거나 문서를 전환하지 마세요.\n타임아웃은 기다리는 시간만 제한하며 Rhino를 종료하지 않습니다. pending 결과 뒤에는 get_rhino_execution(request_id)을 읽으세요. CLI가 반환되었거나 타임아웃되었다는 이유만으로 쓰기를 반복하지 마세요.\n\n인수:\n    code: 동기식 Python 3 소스입니다. result에 JSON으로 안전하게 표현할 수 있는 값을 대입하세요.\n    timeout_seconds: 1–600 사이의 정수이며 기본값은 60입니다. 실행 취소가 아니라 대기 시간의 한도입니다.\n반환:\n    RhinoCode 처리 결과, request_id 및 선택된 artifact_dir를 반환하며, 늦게 도착한 결과를 복구할 수 있습니다.","publish_objects_to_chestnut":"지정한 Rhino 객체들을 하나의 GLB로 내보내고 Chestnut에 게시합니다.\n\nexecute_rhino_script 이후에(선택적으로 validate_structure 이후에도) 사용하고, 반환된 객체 GUID를 전달하세요. asset_id를 재사용하면 이미 해당 에셋을 참조하는 배치들은 변경하지 않은 채 기존 Chestnut 에셋을 갱신합니다.\n\n인수:\n    guids: 내보낼 Rhino 객체 GUID입니다. 관련 없는 문서 객체는 제외됩니다.\n    asset_name: Chestnut에 표시할 사람이 읽기 쉬운 이름입니다.\n    asset_id: 연결된 갱신에 사용할 선택적 고정 ID입니다. 생략하면 Rhino 문서와 GUID로부터 결정적으로 생성됩니다.\n    body_type: 건축물은 \"static\", 고정되지 않은 소품은 \"dynamic\", 스크립트로 구동하는 객체는 \"kinematic\"입니다.\n    collider: 충돌체의 의도된 형식입니다. \"box\", \"convex\", \"compound\" 또는 \"trimesh\"입니다. Chestnut은 현재 필요한 경우 box로 대체합니다.\n    preserve_scale: 모델을 1미터짜리 전시용 소품으로 정규화하지 않고 Rhino의 실제 세계 치수를 유지합니다.\n    mass: 킬로그램 단위의 물리 질량입니다. 정적 물체는 항상 0을 사용합니다.\n반환:\n    고정된 Chestnut 에셋 ID, URL, 메타데이터, 그리고 작업이 에셋을 새로 만들었는지 갱신했는지를 포함한 JSON입니다.","publish_to_chestnut":"의미에 따른 안전한 기본값을 사용하여 Rhino 객체를 Chestnut에 게시합니다.\n\n일반적인 사용에는 이 게시 도구를 우선 사용합니다. 충돌체, 축척, 질량 및 강체 세부 설정을 감춥니다. 사용자가 “저것을 Chestnut에 게시해 줘”와 같이 말할 때 호출하세요.\n\n인수:\n    guids: execute_rhino_script가 반환한 Rhino 객체 GUID입니다.\n    asset_name: 사람이 읽기 쉬운 에셋 이름입니다.\n    behavior: 선택적 의미 프리셋입니다.\n        \"auto\"         — 이름으로 건축물인지 움직일 수 있는 객체인지 추론\n        \"architecture\" — 고정된 건물, 지형, 구조물 또는 둘러싸는 구조\n        \"object\"       — 중력의 영향을 받는 움직일 수 있는 물리 소품\n        \"animated\"     — 스크립트로 구동하는 문, 승강기, 플랫폼 또는 기구\n    asset_id: 선택적 고정 연결 ID입니다. 결정적인 Rhino 연결을 사용하려면 생략하세요.","check_egress":"구축 라이브러리의 피난 규칙에 따라 층 바닥판의 피난 수단을 검사합니다(BCI A.10–A.13 체계 + IBC에서 일반적으로 사용하는 수치 계수 — 반드시 적용되는 법규와 대조해 확인해야 하며, 응답에도 이 점을 반복해서 명시합니다).\n\n코어/출구를 배치한 후, 상세 설계에 들어가기 전에 호출하세요. 출구 수, 출구 이격, 피난 폭, 이동 거리 및 막다른 구간을 한 번에 검증하고 충족하지 못한 요구사항을 명시합니다. 따라서 추측하는 대신 배치를 수정할 수 있습니다(출구 추가, 코어 이동, 계단 폭 확대).\n\n인수:\n    plate_bounds_mm: mm 단위의 층 바닥판 [min_x, min_y, max_x, max_y]입니다(총면적과 출구 이격에 사용하는 대각선 길이를 정합니다).\n    exits: 출구(계단 출입문 또는 외부 출입문)마다 하나씩 입력합니다.\n        {\"name\": str, \"x_mm\": float, \"y_mm\": float, \"width_mm\": float}.\n        위치는 문의 중심이고, 폭은 유효 피난 폭입니다.\n    occupancy: 재실 인원 산정 키입니다. business, mercantile, assembly_unconcentrated, classroom, residential, storage.\n    stories: 해당 피난 수단이 담당하는 층수입니다. 1보다 크면 출구가 최소 두 개 필요하며, 필요한 출구 폭에는 문 계수(5.1) 대신 계단 계수(재실자당 7.6 mm)를 사용합니다.\n    sprinklered: 전 구역에 스프링클러가 설치되어 있는지입니다(이격 비율, 이동 거리 및 막다른 구간 한도에 영향을 줍니다).\n    net_area_m2: 재실 면적을 덮어씁니다. 0이면 바닥판 총면적을 사용합니다.\n    travel_distances_m: 측정한 최악 조건의 이동 거리입니다(예: 그려진 피난 경로에서 측정). 비어 있으면 이동 거리 검사를 건너뜁니다.\n    dead_end_m: 가장 긴 막다른 복도의 길이로, 미터 단위입니다. 0이면 검사를 건너뜁니다.\n반환:\n    JSON: {passed, occupant_load, checks: [{check, required, provided, passed, basis}], warnings, source_note}.","list_project_files":"Rhino를 읽지 않고 프로젝트 파일 이름과 고정된 파일 참조를 나열합니다.\nlimit는 1–500이고 offset은 음수가 아니어야 합니다. 저장된 모델 여러 개가 같은 파일 이름을 가질 때 Scene 또는 Phase의 project_file_id를 선택하려면 include_ids=true로 설정하세요.","create_phase":"Plan을 정리하기 위한 Phase를 생성합니다. Rhino 형상을 편집하지 않습니다.\nfile_name에는 파일 이름만 허용하며 project_files 참조로 해석됩니다. 중복 이름에는 project_file_id를 사용하세요. status는 pending, running, completed, failed, blocked 또는 paused이며, Plan 및 Step의 상태와 같은 선택지를 공유합니다.","get_phase":"Phase의 이름, 상태, 설명 및 Plan 수를 읽습니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 전달한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 description, scope, audit 또는 all을 추가하며, 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 독립적으로 켜고, audit은 타임스탬프 표시를 켭니다.","list_phases":"정리용 Phase들을 총수 및 명시적인 잘림 표시와 함께 나열합니다. limit는 1–500입니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 전달한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 description, scope, audit 또는 all을 추가하며, 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 독립적으로 켜고, audit은 타임스탬프 표시를 켭니다.","update_phase":"Phase의 정리 정보를 갱신합니다. 생략한 필드는 기존 값을 유지합니다.\nstatus는 Plan과 같은 선택지를 사용합니다. file_name=''는 파일 참조를 해제하며, project_file_id는 모델 이름을 바꾸거나 모델을 옮기지 않고 기존 파일을 선택합니다.","create_plan":"선택적인 정리용 Phase 안에 Plan을 생성합니다. 작업은 어떤 순서로든 일시 중지, 전환, 재개할 수 있으며 Plan은 선형적인 완료 순서를 요구하지 않습니다.\nscope는 planning_scopes에서 선택합니다. 내장값은 house, interior, structure, drawing 및 component입니다. 사용자 정의 행은 이 template_scope 값들 중 하나를 선택합니다.\ncomponent 템플릿은 inspect_context, design, model, validate를 사용합니다. scene_ids는 문맥이며, component_ids는 해당 Scene들에 속해 있어야 한다는 조건 없이 대상을 명시적으로 연결합니다.\n기존 호환용 scene_id와 scene_ids를 함께 전달하면 scene_id는 scene_ids의 첫 항목과 일치해야 합니다.\nPlan은 상태와 증거를 기록하며, Step을 실행하지 않고 편집 권한을 부여하지도 않습니다.\ndepends_on은 다른 Phase의 작업도 포함할 수 있는 관련 Plan 또는 Phase ID의 배열입니다. 존재 여부, 완료 여부, 순환, 자기 참조 또는 실행 순서를 강제하지 않습니다. [\"plan_a\", \"phase_b\"]를 사용하고, \"plan_a, phase_b\"처럼 쓰지 마세요.","get_plan":"현재 Plan 또는 변경 불가능한 저장 revision을 읽습니다. 기존 기준선 revision 0도 포함됩니다.\ninclude_ids=true가 아니면 ID(Step의 component_ids 포함)가 숨겨집니다.\n입력한 plan_id는 반복해서 반환하지 않습니다. artifact_dir와 artifact_refs는 작업 파일의 위치를 가리킵니다.\n\n스냅샷에는 Plan 메타데이터, Step 상태 및 핸들이 들어 있으며, Rhino 형상 백업이 아닙니다. 요청한 revision이 없을 때 현재 상태로 대신 반환하지 않습니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 전달한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 steps, references, artifacts, audit 또는 all을 추가하며, 기본값은 요약입니다.\nsteps에는 각 Step의 input_refs와 output_refs가 포함됩니다. references는 대상/문맥 관계를, artifacts는 Plan 작업 파일을 추가합니다.\ninclude_ids는 핸들 표시를 독립적으로 켜고, audit은 타임스탬프 표시를 켭니다.","list_plans":"간결한 Plan 요약을 나열합니다. 선택적으로 Phase, 문맥 Scene 또는 상태로 필터링할 수 있습니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 전달한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 references, artifacts, audit 또는 all을 추가하며, 기본값은 요약입니다. Step 상세는 get_plan(field_groups=[\"steps\"])을 사용하세요.\ninclude_ids는 핸들 표시를 독립적으로 켜고, audit은 타임스탬프 표시를 켭니다.","update_plan":"Plan 메타데이터와 연결을 원자적으로 갱신하고, 새로운 저장 revision을 기록합니다.\n\n생략한 필드는 기존 값을 유지합니다. []는 참조를 지우고, phase_id=''는 Phase 연결을 해제합니다. expected_revision은 Plan을 변경하지 않은 채 오래된 상태에 기반한 갱신을 거절합니다.\n참조는 문맥과 명시적인 대상을 제공하는 것이지, 형상을 편집할 권한을 주는 것이 아닙니다.\ndepends_on은 다른 Phase도 포함할 수 있는 관련 Plan/Phase ID의 자유로운 배열입니다.\nstatus는 pending, running, paused, completed, failed 또는 blocked일 수 있으며, 관련 작업의 완료를 요구하지 않습니다. artifact_refs는 작업 파일을 기록합니다.","list_plan_revisions":"저장된 Plan revision을 최신순으로 나열하며, 작업 라벨과 잘림 메타데이터를 함께 제공합니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 전달한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 audit 또는 all을 추가하며, 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 독립적으로 켜고, audit은 타임스탬프 표시를 켭니다.","update_step":"Step의 상태, 증거 및 선택적인 명시적 Component 대상을 기록합니다.\n생략한 참조는 기존 값을 유지하고 []는 지웁니다. 반환된 Plan에서 Step의 component_ids=null은 Plan 대상을 상속한다는 뜻이고, 명시적인 []는 아무 대상도 선택하지 않는다는 뜻입니다. Scene 참조는 선택 범위를 확장하지 않습니다. 상태는 pending, running, paused, completed, failed 또는 blocked일 수 있습니다. 의존 관계는 참조이지 실행 허용 조건이 아닙니다. 어떤 Step이든 다른 Step과 무관하게 일시 중지하거나 재개할 수 있으며, 강제적인 완료는 필요하지 않습니다.\nexpected_revision은 오래된 상태에 기반한 갱신을 거절합니다. 여기서는 어떤 Rhino 작업도 실행하지 않습니다.\n같은 Step 상태를 다시 전달하면서 참조나 대상을 바꾸는 경우에는 paused/completed를 포함하여 Plan 상태를 유지합니다. 실제로 Step 상태가 바뀔 때만 Plan 상태를 다시 계산합니다.","resolve_targets":"등록된 Step 대상을 해석합니다. Step에 별도 지정이 없으면 Plan 대상을 해석합니다.\n\n명시적으로 비어 있는 Step 선택은 그대로 비어 있습니다. 문맥 Scene은 대상을 확장하지 않습니다. 반환된 그룹/문서 식별 정보는 live_verified=false이므로, 편집하기 전에 현재 Rhino 상태와 사용자 의도를 확인하세요. 이 호출은 권한을 부여하지 않습니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 전달한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 references, geometry, scope, audit 또는 all을 추가하며, 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 독립적으로 켜고, audit은 타임스탬프 표시를 켭니다.","get_selection_references":"현재 선택을 읽고, 등록된 Component, Plan 및 Step의 ID와 이름을 한 번의 호출로 반환합니다. 명시적인 ID 조회이므로 ID는 항상 포함됩니다.\nStep에 직접 지정된 대상과 상속한 Plan 대상을 구분하며 상위 Component들도 포함합니다. Scene 문맥으로 대상을 만들어내지 않습니다. 선택은 현재의 실제 선택이지만, 관계는 등록된 메타데이터이지 native 소유권을 새로 대조한 결과는 아닙니다. 미등록 객체와 잘린 선택/Plan 결과는 명시적으로 보고합니다.\nfield_groups는 steps, references, geometry, artifacts, description, scope, audit 또는 all을 추가하며, 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 독립적으로 켜고, audit은 타임스탬프 표시를 켭니다.","list_design_scenes":"Plan이나 현재 문서를 조회하지 않고 프로젝트 전체의 Scene 이름을 나열합니다.\nname은 대소문자를 구분하지 않는 부분 문자열이고, file_name은 선택적인 정확 일치 필터입니다.\n결과는 limit(1–200)와 offset으로 제한되며 total과 truncated가 포함됩니다.\n기본값은 이름만 반환하는 것입니다. field_groups는 scope(file_name, units), audit(created_at, updated_at), state(revision) 또는 all을 추가합니다. include_ids는 Scene 핸들 표시를 독립적으로 켭니다.","create_design_scene":"주택 또는 인테리어 생성을 위한 영구적인 Scene 핸들을 생성합니다.\nfile_name은 project_files 참조로 해석되며, project_file_id는 기존 항목을 선택합니다.\nScene 메타데이터는 로컬에 남아 있고, 모델 문맥에 반복해서 넣는 대신 ID로 조회합니다.","get_design_scene":"Scene 요약을 반환합니다. scope는 file_name을 추가합니다(기록되지 않은 경우 빈 값). include_ids=true가 아니면 ID가 숨겨지며, 입력한 scene_id는 반복해서 반환하지 않습니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 전달한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 scope(file_name/units/model_path), state(revision), geometry(bounds/component), audit(타임스탬프) 또는 all을 추가합니다.","update_design_scene":"file_name 또는 project_file_id로 Scene의 project_files 참조를 설정합니다. file_name=''는 참조를 해제합니다.\n파일 이름에는 폴더가 들어가면 안 됩니다. 중복 이름에는 list_project_files에서 받은 project_file_id가 필요합니다. 메타데이터만 변경하며, Rhino 문서의 이름을 바꾸거나 문서를 옮기지 않습니다.","get_scene_objects":"Scene에 등록된 의미 그룹들의 현재 Rhino 구성 객체를 하나의 집합으로 읽습니다.\n저장된 실제 문서, 안정적인 편집 상태 및 최대 64개의 등록 그룹이 필요합니다.\nexpected_model_path는 선택적으로 바인딩된 모델을 검증합니다. 개별 객체를 DB에 등록하는 일은 없습니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 전달한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 scope(file_name/units/model_path), state(revision), geometry(bounds/component), audit(타임스탬프) 또는 all을 추가합니다.\nlimit(1–200), offset 및 truncated로 현재 객체 페이지의 범위를 제한합니다.","get_retrieval_status":"로컬 구조화 검색 시스템에 대한 간결한 진단 정보를 반환합니다.\n이 진단은 본질적으로 범위가 제한되어 있습니다. 에셋 레코드가 아니라 고정된 스칼라 개수·상태와 설정된 인덱스 이름을 반환합니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하십시오. 입력으로 제공한 대상 ID는 반복해서 반환하지 않습니다.","get_rhino_context":"UI 스레드에서 선택한 실제 Rhino 문맥을 읽습니다. sections에는 document, selection, viewport, editor, display_modes를 지정할 수 있으며 기본값은 [\"document\"]입니다. 요청하지 않은 section은 수집하지 않습니다.\nDocument/selection/viewport 응답에는 격리 상태를 즉시 알 수 있도록 간결한 editor의 mode/target/stable도 포함됩니다. 제공자의 증거와 경고를 보려면 editor를 요청하십시오. sections=[]는 기능 지원 여부만 조회하는 호출에서 editor 관찰을 건너뜁니다.\neditor는 mode(model/group/block/unknown), 알려진 대상과 stable을 보고합니다. 정상적인 model 상태임이 검증된 경우에만 stable입니다. 활성 격리, 전환 중인 상태, 지원되지 않는 editor 버전은 불안정한 상태입니다. 알 수 없는 대상 식별자는 null로 남겨 두며 선택 항목에서 추론하지 않습니다.\ndisplay_modes는 설치된 모드의 이름/GUID를 최대 128개 나열합니다. Shaded, Dark, CadWhite는 실제로 설치되어 있을 때만 선택할 수 있습니다. 사용자 정의 모드의 별칭을 만들어 내지 마십시오.\n\n문서 식별 정보·경로, 단위·허용오차, 객체·레이어 개수, 범위가 제한된 선택 요약, 카메라·표시 메타데이터를 포함합니다. 이 조회는 레이어, 형상, 치수 또는 Undo 기록을 만들지 않습니다. 사용할 수 없는 값은 경고와 함께 null로 반환합니다.\n개수와 현재 뷰는 문맥 정보이며 형상 또는 가시성 검증이 아닙니다.\n작업에 필요한 문맥만 요청하십시오. project_info가 이미 실제 문서를 검증하므로, 그 문서가 실제로 열려 있는지 확인하려는 목적만으로 이 호출을 반복하지 마십시오.\n\n인수:\n    selection_limit: 선택 객체 요약의 최대 개수이며 0부터 200까지입니다. total/truncated는 여전히 보고합니다.\n    recursive: 기본값은 False이며, 완전하게 선택된 최상위 그룹과 블록 인스턴스를 요약합니다.\n        True이면 depth까지만 중첩 멤버를 펼칩니다. 일부만 선택된 그룹은 객체 선택으로 남습니다.\n    depth: 1..8이며 기본값은 1입니다. include_ids=true가 아니면 ID는 생략됩니다.\n    include_image: False이면 JSON만 반환합니다. True이면 먼저 JSON 텍스트를 반환하고,\n        동일한 native UI 호출에서 얻은 현재 PNG를 반환합니다. 캡처 실패 시 image_error를 통해\n        사용할 수 있는 문맥을 보존합니다. image_file은 동일한 PNG의 관리 파일을 보고하거나,\n        성공한 이미지를 제거하지 않은 채 별도의 저장 오류를 보고합니다.\n반환:\n    status, document, selection, viewport, warnings를 담은 JSON 또는 명시적인 오류입니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하십시오. 입력으로 제공한 대상 ID는 반복해서 반환하지 않습니다.","analyze_block_reculviely":"문서를 수정하지 않고 중첩 블록 구조를 읽거나 블록 배치 인스턴스를 해석합니다.\n\n요청과 응답은 UTF-8 JSON 256 KiB로 제한됩니다. 알 수 없거나 지원되지 않거나 잘린 관찰 결과는 검증되지 않은 상태로 남습니다. Bridge block_analysis=1이 필요합니다.\n\n인수:\n    mode: outline은 객체와 중첩 정의를 순회합니다. resolve-block은 명시적인 배치 경로를 따라\n        현재 편집 문맥에 해당하는 후보를 찾습니다.\n    options: outline은 ids 또는 path를 받고, 그렇지 않으면 scope(selected/viewport/document),\n        depth, 출력 예산을 받습니다. field_groups는 summary, objects, annotations,\n        transforms로 이루어진 비어 있지 않은 목록이며, 기본값은 간결한 요약입니다. include_geometry와\n        annotations는 해당 상세를 명시적으로 요청합니다. 결과가 잘리면 ID/path/depth 범위를 좁히십시오.\n        max_items는 방문 가능한 항목 수도 제한합니다(reason=max_visits).\n        resolve-block은 path만 받습니다. 최상위 인스턴스에서 안쪽으로 이어지는 1..65개의 GUID입니다.\n    expected_model_path: 보통 생략합니다. 런타임이 연결된 문서 경로를 제공합니다.\n    include_ids: 필요할 때 ID를 포함합니다. 입력으로 제공한 대상 ID는 반복해서 반환하지 않습니다.\n반환:\n    status, mode, 문서 식별 정보·단위·허용오차와 data를 담은 JSON 또는 명시적인 오류입니다.","get_rhino_objects":"읽기 전용으로 일반 모델 객체의 범위·속성·그룹·형상을 조회한다. `scope`는 현재 문서 가시 객체 `visible`(기본값), `selected`, 명시 GUID `ids`, 숨긴 객체를 포함한 `document` 중 선택한다. `object_ids`는 `ids`에서만 1..4096개를 받는다. 그룹이나 블록 내부로 자동 확장하지 않는다.\n\n`result_mode=\"summary\"`는 필터된 집합에서 실제 객체가 있는 레이어·객체 유형·형상 종류별 개수와 가시 수만 반환한다. `objects`(기본값)는 개별 객체를 반환한다. 필요한 정보가 정해져 있으면 `fields`로 골라 받는다. `fields=[\"id\"]`는 별도의 `include_ids` 설정 없이 GUID만 반환하며, `id`, `name`, `layer_path`, `object_type`, `geometry_kind`, `geometry_crc`, `visible`, `selected`, `hidden`, `locked`, `bounds`, `groups`, `user_dictionary`를 조합할 수 있다. 생략하면 기존 기본 정보를 반환하고 GUID는 `include_ids=true`일 때 포함한다. 요약·필드 선택·면 페이지와 유형 필터는 Bridge `object_observation>=2`가 필요하다.\n\n`filters` 조건은 AND로 결합한다. `layer_paths`는 전체 레이어 경로 1..64개의 정확한 일치, `object_types`는 조회된 `object_type` 이름 1..32개, `name_contains`는 이름 부분 문자열이며 대소문자를 구분하지 않는다. `user_dictionary`는 `{source: \"attributes\" 또는 \"geometry\", key: 키, any_of: [값들]}` 조건 배열이다. scalar 또는 배열의 원소와 정확히 비교하며 문자열을 임의로 분할하거나 층 정보를 추론하지 않는다. 메타데이터 필터를 건축 요소의 정체성과 동일시하지 않는다.\n\n예: `get_rhino_objects(scope=\"document\", filters={\"user_dictionary\":[{\"source\":\"attributes\",\"key\":\"Floor\",\"any_of\":[\"층A\"]}]}, fields=[\"id\",\"user_dictionary\"])`는 Floor의 scalar 값 또는 배열 원소가 `\"층A\"`인 객체를 조회한다. 층 이름은 실제 값으로 바꾼다. 키의 존재나 필터 일치는 실제 층 소속의 정확성을 보증하지 않는다. 배열 쓰기는 `get_modeling_guide(tool=\"execute_rhino_script\")`의 예를 따른다.\n\n기본 객체 응답은 문서 가시성·선택 여부·bbox·원본 `geometry_crc`·두 UserDictionary·그룹을 포함한다. 그룹의 `members_outside_match_count`와 문서의 `visible_outside_match_count`는 조회 범위 밖의 관계를 드러낸다. `visible`은 Rhino의 문서/레이어 가시성으로, 화면의 픽셀·가림·clipping 결과를 보증하지 않는다.\n\n`include_geometry=true`면 Brep의 유효성·solid·manifold·체적과 면 정보를 추가한다. 기하 정보도 `fields`의 `geometry_valid`, `solid`, `manifold`, `volume`, `face_count`, `faces`로 선택할 수 있으며 명시한 fields가 우선한다. `faces`에는 원본 ID·CRC와 `face_page`를 함께 반환한다. `face_limit`은 1..128, `face_offset`은 면 시작 위치다. 다음 면 페이지는 `scope=\"ids\"`, 대상 ID들과 이전 `geometry_crc`를 담은 `expected_geometry_crcs={GUID: CRC}`로 요청하며 형상이 바뀌면 거절한다. 면의 `face_edit_supported`는 사전 판별이며 실제 편집 성공 보장은 아니다.\n\n바깥 `offset`/`limit`(1..200), `next_offset`, `complete`는 객체 또는 요약행의 페이지이고, 각 객체의 `face_page`는 그 객체의 면 페이지다. 응답은 256 KiB, 문서 스캔은 100000개로 제한하며 초과하면 범위·필드·페이지 크기를 줄여 조회한다. 가시 범위와 그룹의 범위 밖 관계는 실제로 반환된 필드에 근거해 읽는다.\n\n명시적 `status=\"error\"`는 같은 상세 JSON을 유지하면서 MCP `isError=true`로 반환한다. 미완료 페이지를 오류나 전체 검증 완료로 바꾸지 않는다.","get_object_intersections":"명시 GUID 1..512개의 닫힌 Brep·Extrusion·방향이 정해진 manifold Mesh의 체적 교차를 읽기 전용으로 검사한다. Component 등록은 필요 없다. `max_pairs`(1..64)는 한 페이지의 후보쌍 계산 수다. `include_blocks=true`면 중첩 블록의 배치 변환을 적용한 구성원도 검사하며 정의는 수정하지 않는다. Disjoint Mesh는 문서에서 분해·재결합할 필요가 없다. Brep/Mesh 혼합 쌍은 임시 메싱에 의한 근사임을 결과에 표시한다.\n\n`next_cursor`를 같은 대상과 함께 전달하면 나머지 후보를 이어 검사한다. 형상·범위가 바뀌면 cursor가 거절된다. 페이지 결과를 합쳐 읽고, `pagination_complete`는 후보 열거의 끝, `complete`는 이번 응답만으로 전체 범위가 확인됐는지를 뜻한다. 미지원·판정 불명·미검사는 무교차가 아니다. 각 쌍의 `a.handle`, `b.handle`, `pair_state`는 ID 표시 옵션과 무관하게 반환되며 `show_object_intersection`·`resolve_object_intersection`의 입력으로 쓴다. 그룹은 대상을 자동 추가하지 않는다.\n\n명시적 `status=\"error\"`는 MCP `isError=true`와 일치시킨다. 정상 페이지의 `unknown`·`complete=false`·`next_cursor`는 그대로 보존한다.","capture_rhino_inspection":"지정한 여러 시점과 객체집합을 하나의 PNG에 담으며 Rhino 문서를 바꾸지 않는 캡처다. `views`는 1..16개 tile로, 각 항목은 `object_ids`, `direction`, `display_mode`, `label`을 받는다. tile별 명시 `object_ids`는 서로 다른 최상위 GUID 1..512개이며, 생략 또는 `[]`는 기존 문서 가시 범위다. 모든 tile에 같은 집합을 쓰면 최상위 `object_ids`(1..4096개)를 한 번 전달한다. 이 공통 집합의 `[]`는 오류이며 문서 전체로 확대하지 않는다. 공통 집합과 비어 있지 않은 tile별 집합은 혼용하지 않는다. 공통 집합에는 `inspection_shared_scope=1`이 필요하며 응답 `shared_scope`의 전체 GUID·총수와 tile의 `scope.shared_scope_ref`가 대응한다. 현재 선택·카메라·숨김 상태를 바꾸지 않는다.\n\n기본 카메라는 연결 문서의 활성 모델뷰다. `model_view_id`에 기존 모델 viewport GUID를 지정하면 활성 Layout·Detail을 유지한 채 그 모델뷰를 복사한다(`inspection_model_view=1` 필요). Layout이 활성인데 모델뷰를 지정하지 않으면 `layout_not_supported`다. `editor.mode=\"model\"`, `stable=true`가 필요하며 group/block 편집이나 미확인 상태는 `editing_context_unverified`다. Layout 용지는 `get_rhino_viewport_image(view=Layout_GUID)`로 캡처한다.\n\n`direction`은 `current`, `top`, `bottom`, `front`, `back`, `left`, `right`, `iso_ne`, `iso_nw`, `iso_se`, `iso_sw`, `below_ne`, `below_nw`, `below_se`, `below_sw` 중 선택한다. 필요한 시점만 요청한다. `display_mode` 생략 시 현재 모드를 쓰며, 이름이 중복되면 `get_rhino_context(sections=[\"display_modes\"], include_ids=true)`에서 확인한 GUID를 사용한다. 각 tile의 메타데이터와 오류를 읽고 이미지의 실제 범위를 확인한다.\n\n`width`/`height`는 tile 픽셀 크기(128..2048, 기본 640×480), `columns`는 배치 열 수다. 합계 16M 픽셀과 PNG 4 MiB를 넘으면 크기나 tile 수를 줄인다. 명시 필터에서 블록 인스턴스·블록 내부 객체는 지원하지 않으며 해당 tile 오류로 보고한다. 필터를 생략한 전체 범위에서는 블록을 원래대로 표시한다.\n\n최상위 `complete`는 요청한 tile의 캡처 성공 여부, `scope.complete`는 요청 GUID가 문서 가시 범위에 포함됐는지를 뜻한다. 실제 픽셀 노출이나 설계 적합성을 보증하지 않는다. 부분 성공이면 정상 이미지와 tile별 오류를 함께 읽고, 조회 preview나 일부 GUID만 캡처한 결과를 전체 범위로 해석하지 않는다.\n\nPNG는 이미지 content를 유지하면서 관리된 파일로도 저장한다. `image_file`은 상대 경로·bytes·SHA256·plan/connection 보존 수명 또는 저장 실패를 별도로 반환한다. 요청은 256 KiB, 이미지 외 메타데이터는 512 KiB 이내이며 상한 초과를 조용히 잘라내지 않는다.","get_rhino_viewport_image":"Rhino 뷰포트, Named View 또는 Layout을 활성화하지 않고 PNG 이미지로 반환합니다.\n\nview를 생략하면 현재 뷰를 캡처합니다. view=\"a\"를 전달하면 viewports, named_views, layouts 목록을 반환하며 각 항목에는 name과 guid만 포함합니다. 그런 다음 원하는 GUID를 view로 전달하십시오.\n이름은 고유하지 않을 수 있습니다. Named View는 기본적으로 Shaded를 사용하여 저장된 카메라를 화면 밖에서 렌더링하며, 보이는 뷰포트를 교체하지 않습니다. Layout은 주변 작업 공간이 아니라 detail을 포함한 용지 영역을 캡처합니다. 현재 뷰가 Layout이면 detail이 활성 상태이더라도 용지를 캡처합니다.\n\n캡처 해상도와 Layout 인쇄 표시 방식은 [BASIC-INSTRUCTIONS.md](../../BASIC-INSTRUCTIONS.md#get_rhino_viewport_image-화면으로-관찰하기)를 따르십시오.\n검증된 PNG는 선택한 Plan의 artifacts/captures에 저장하며, Plan을 선택하지 않았으면 연결이 소유하는 임시 작업 공간에 저장합니다. image_file은 프로젝트 상대 경로, bytes, SHA256, 보존 수명을 보고합니다. 저장에 실패해도 이미지는 사용할 수 있습니다. 캡처는 카메라, 선택 또는 Undo 상태를 바꾸지 않으며 형상의 정확성을 입증하지 않습니다. 실패한 이미지나 크기 상한을 넘는 이미지는 오류이며, 알리지 않고 크기를 줄인 이미지로 대체하지 않습니다.\n\n인수:\n    view: 현재 뷰는 빈 값, 분류된 목록은 \"a\", 또는 목록에서 확인한 GUID입니다.\n    scale_percent: 1부터 100까지의 정수이며 기본값은 75입니다. 읽으려는 내용에 충분한 해상도를\n        선택하십시오. 픽셀을 제어하며 Layout Detail의 도면 축척을 제어하는 것은 아닙니다.\n    width, height: 선택적인 명시 출력 픽셀 크기이며, 둘 다 128..2048이고 scale_percent=100이어야 합니다.\n        capture_output_size=1일 때 model view/Named View/group/block에서 지원합니다.\n        실제 창의 크기는 바꾸지 않습니다. Layout은 이 옵션을 거절하고 144 dpi를 유지합니다.\n    include_usage: False이면 이미지와 파일 메타데이터를 반환합니다. True이면 치수와 설명용 토큰\n        추정치(32px 패치 수 × 1.2, 제공자의 리사이징을 적용하지 않음)도 반환합니다.\n        실제 사용량은 클라이언트의 모델과 detail 설정에 따라 달라지며, MCP는 이를 제공하지 않습니다.\n        PNG 압축은 바이트 수를 줄일 뿐 픽셀에 따른 토큰 수를 줄이지 않습니다.\n    display_mode: 설치된 표시 모드의 이름 또는 GUID입니다. 빈 값이면 현재 모델 뷰포트 모드를\n        유지합니다. Named View/group/block 캡처의 기본값은 Shaded입니다. 사용할 수 있는 모드는\n        get_rhino_context(sections=[\"display_modes\"], include_ids=true)로 나열합니다.\n        Raytraced 같은 실시간 렌더링 모드는 거절합니다. 이 도구는 비동기 렌더링이 끝날 때까지\n        기다리지 않습니다.\n    labels: 기본값은 True입니다. 문서 객체를 만들지 않고 일시적인 픽셀 표시로 최상위 그룹 이름/GUID,\n        블록 인스턴스 이름/GUID, 그룹에 속하지 않은 객체의 GUID를 보여 줍니다.\n        레이블은 최대 200개입니다. 오버레이가 잘리면 더 작은 대상이나 depth를 명시하여 범위를 좁히십시오.\n    depth: 1..8이며 기본값은 1입니다. 값이 높을수록 중첩 엔티티의 레이블을 노출합니다.\n    target_kind: view(기본값), group 또는 block입니다. group/block은 분리된 뷰포트에서 대상 경계에\n        맞춰 화면을 구성하고 대상에 레이블을 붙입니다. 주변 형상은 계속 보입니다.\n    target_id: group/block의 경우 영구적인 그룹 GUID 또는 블록 인스턴스 GUID를 지정하고 view는\n        비워 두십시오. 정의 GUID는 블록 인스턴스 대상이 아닙니다.\n    Layout은 각 detail의 모드를 유지하고 모드 재정의를 거절하며, detail 레이블을 사용할 수 없다는\n        경고를 명시적으로 표시합니다. 레이블이 필요하면 Named View/모델 뷰포트를 캡처하십시오.\n반환:\n    하나의 MCP PNG 이미지와 image_file 메타데이터, 선택적인 warnings/usage를 반환하거나,\n    view=\"a\"이면 분류된 이름/GUID 목록을 반환합니다.\n    이미지는 16메가픽셀과 4 MiB로 제한됩니다. PNG 파일은 추가로 기록되므로 캡처 가능한 도구는\n    MCP readOnlyHint를 표방하지 않습니다. Rhino 문서는 변경되지 않습니다.","capture_conditioning_pass":"형상 유도 영상 생성(Wan VACE / ControlNet)의 조건 입력으로 사용하기 위해, 실제 Rhino 문서의 카메라 경로를 따라 RGB + edge(선화) + depth 프레임을 캡처합니다.\n깊이와 윤곽선은 추정하지 않고 모델 자체에서 읽습니다. 각 프레임의 카메라를 기록하므로 생성된 영상을 원본 형상에 다시 투영할 수 있습니다.\n\nshot JSON은 모델 단위(보통 mm)로 카메라 경로를 기술하며 다음 형식 중 하나를 사용합니다.\n  {\"type\":\"orbit\",\"center\":[x,y,z],\"radius\":r,\"height\":z,\"frames\":81, \"start_deg\":0,\"end_deg\":90,\"lens\":35,\"target_height\":z} {\"type\":\"track\",\"cam0\":[x,y,z],\"cam1\":[..],\"target0\":[..],\"target1\":[..],\"frames\":81,\"lens\":35} {\"type\":\"keyframes\",\"keyframes\":[{\"camera\":[..],\"target\":[..],\"lens\":35}, ...],\"frames\":81}\nWan 모델에서는 4n+1개의 프레임(17, 33, 49, 65, 81)을 사용하십시오. 81프레임은 16 fps에서 5초입니다.\n\nout_dir에 기록하는 항목: rgb/ edge/ depth/ (f0000.png ...), rgb.mp4 / edge.mp4 / depth.mp4 (ffmpeg를 사용할 수 있을 때), camera.json(프레임별 카메라 기록, schema building0.camera/0.1), zrange.csv(프레임별 깊이 범위), doc.json, summary.json. 깊이는 회색조이며 가까울수록 밝습니다(Rhino의 기본 규약이며 Wan/ControlNet depth가 기대하는 방식). 가까울수록 어둡게 하려면 invert_depth를 설정하십시오.\n캡처 패스가 끝난 뒤 카메라 복원은 가능한 범위에서 최선으로 수행합니다. 요약 JSON을 반환합니다.","upsert_ontological_component":"현재 Rhino 그룹에 ontological_component 의미 단위를 등록합니다.\n\nobject_ids는 직접 소유하는 최상위 객체를 지정합니다(child_component_ids에 기존 자식이 들어 있으면 []일 수도 있습니다). child_component_ids=None은 기존 자식을 보존하고, []는 명시적으로 자식 연결을 해제합니다. 각 객체에는 직접 소유하는 Component가 정확히 하나 있으며, 각 자식은 같은 문서 안에서 부모를 최대 하나만 가질 수 있고 순환 관계는 허용하지 않습니다. 현재 그룹 멤버가 진실의 원천입니다. 기존 그룹의 멤버십과 순서를 DB 레코드로 복구하지 않습니다. 일반 그룹/블록은 자동으로 의미 단위가 되지 않습니다.\nobject_ids를 생략하거나 null을 전달하면 rhino_group_id 또는 기존 component_id의 그룹 바인딩에서 직접 소유 객체를 추론합니다. 이 경우 component_registry=2에 더해 component_group_inference=1이 필요합니다. Native는 같은 작업 안에서 실제 그룹과 선언된 자식 멤버를 읽고 검증합니다. 자식 멤버는 자신의 소유권을 유지합니다. 존재하지 않는 그룹은 거절하며 추론을 통해 만들지 않습니다. 명시적인 []는 여전히 직접 소유 객체가 없다는 뜻입니다. 이름, Scene 문맥, 의미상의 자식 연결은 추론하지 않습니다.\n모든 Component에는 기존 Scene이 적어도 하나 필요합니다. scene_ids를 생략하면 기존 연결을 유지합니다. 문서 전용 비공개 레지스트리는 객체 관리 속성을 기록하지 않습니다. 정확히 일치하는 일반 그룹이 고유하게 하나 있으면 이를 채택합니다. 일치 대상이 모호하면 해당 GUID가 필요합니다. 형상은 복사하거나 중복 생성하지 않습니다. 응답은 간결한 확인 응답입니다.\n기존 그룹의 경우 name은 현재 Rhino 이름과 같아야 합니다. Rhino 그룹 테이블 변경은 Undo 추적 대상이 아니므로 이 도구는 이름 변경을 거절합니다. 등록을 Undo하면 원래 객체 멤버십을 복원하고 의미 등록을 제거합니다. 비어 있는 그룹 테이블 항목은 남을 수 있습니다. 새 그룹 이름이 충돌하면 자동으로 접미사를 붙인 그룹을 만드는 대신 변경 전에 거절합니다. 멤버십을 자동 복구하거나 Undo된 등록을 자동으로 재실행하지 마십시오. 먼저 의도한 Rhino 구조를 검토하십시오.\nexpected_model_path는 현재 활성화된 저장 문서와 일치해야 합니다. Native 결과가 불확실하면 관찰하고 sync_ontological_component를 수행하십시오. 변경 작업을 다시 실행하지 마십시오.","get_ontological_component":"ontological_component 요약을 읽거나 해당 단위의 실제 Rhino 그룹을 관찰합니다.\n\nlive=True는 Rhino 또는 장부를 바꾸지 않고 현재 멤버/이름을 관찰합니다.\n캐시 조회에는 그룹 요약만 포함되며(geometry_available=false), 멤버 ID나 객체별 형상은 포함하지 않습니다.\nrecursive=false가 기본값입니다. 중첩 구조를 반영한 유효 형상이 필요할 때만 true를 요청하십시오.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하십시오. 입력으로 제공한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 references, geometry, scope, audit 또는 all을 추가합니다. 기본값은 요약입니다.\naudit는 타임스탬프를 활성화합니다.","list_ontological_components":"간결한 캐시 ontological_components 목록을 나열하며, 선택적으로 scene_id로 범위를 제한할 수 있습니다.\nrecursive=false이면 해당 범위의 루트들을 나열하고, true이면 등록된 자식들도 포함합니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하십시오. 입력으로 제공한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 references, geometry, scope, audit 또는 all을 추가합니다. 기본값은 요약입니다.\ninclude_ids는 핸들을 독립적으로 활성화하고, audit는 타임스탬프를 활성화합니다.","sync_ontological_component":"현재 안정된 Rhino 문서의 실제 그룹에 맞춰 DB 레코드를 한 번 정렬합니다.\n\n하나의 component_id, component_ids, 하나의 scene_id를 사용하거나, 대상을 생략하여 연결된 문서를 대상으로 삼습니다(자손을 포함해 최대 64개의 등록). 형상, 그룹, 멤버십/순서, 이름, 객체 속성은 바꾸지 않습니다. 그룹/블록 편집 중이거나 격리 상태를 알 수 없으면 정렬을 거절합니다. 그룹이 없어도 형상을 다시 만들지 않으며 Rhino Undo를 위해 바인딩/이력을 유지합니다. 관련 없는 유효하지 않은 바인딩은 개별적으로 보고합니다. 간결한 응답은 checked/changed/unavailable 개수와 조치할 수 있는 문제들을 제공합니다. 완전한 native snapshot은 내부에 남습니다. 변경이 없는 정렬을 반복해도 revision을 만들지 않습니다. 불확실한 변경 작업을 다시 실행하지 마십시오.","remove_ontological_component":"Rhino 형상, 일반 그룹, 기존의 모든 객체 속성을 보존하면서 ontological_component 의미 등록을 해제합니다. Rhino Undo/Redo는 문서 전용 비공개 의미 바인딩을 복원하거나 제거합니다.\n\n루트 Component에는 자식이 있을 수 있습니다. 자식들은 루트가 되고, 자신의 객체 소유권, 등록된 Rhino 그룹, Scene 연결을 유지합니다. 자신의 부모가 아직 있는 Component는 먼저 부모와의 연결을 해제해야 합니다. 제거할 Component에 대한 Plan/Step 참조는 먼저 지워야 합니다. 형상을 삭제하거나 복사하지 않습니다.","get_component_intersections":"1–32개 Component의 현재 재귀적 멤버 사이에서 실제 solid 겹침을 검사합니다.\n\n현재 그룹 멤버를 해석하고 최대 max_pairs(1–64)개의 후보 쌍을 검사합니다.\n닫힌 Brep, Extrusion, 방향이 정해진 manifold Mesh를 지원합니다. include_blocks는 정의를 바꾸지 않고 변환이 적용된 중첩 배치 인스턴스를 추가합니다. 분리된 부분으로 이루어진 Mesh는 문서에서 분리된 형상 데이터로 평가하므로 문서를 분할/결합할 필요가 없습니다. Brep/Mesh 혼합 관찰은 임시 Mesh 근사를 사용했음을 보고합니다.\n계속하려면 같은 범위와 함께 next_cursor를 전달하십시오. 형상/범위가 바뀌면 cursor를 거절합니다. 페이지 결과를 누적해서 읽으십시오. pagination_complete는 열거의 끝을 나타내고, complete는 이번 응답만으로 전체 범위가 확인되는지를 나타냅니다.\n지원되지 않거나 알 수 없는 작업이 있으면 겹침이 없다는 결론을 내릴 수 없습니다.\n쌍의 a.handle, b.handle, pair_state는 결과를 미리보기 또는 차감 작업에 연결합니다.\n쌍의 핸들과 상태는 항상 반환합니다. include_ids=true는 다른 ID를 추가합니다. 입력으로 제공한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 references, geometry, scope, audit 또는 all을 추가합니다. 기본값은 요약입니다.\ninclude_ids는 핸들을 독립적으로 활성화하고, audit는 타임스탬프를 활성화합니다.","show_object_intersection":"문서 형상을 추가하지 않고, 관찰된 하나의 겹침을 활성 모델 뷰포트에서 미리 보여 줍니다.\n\n교차 쌍에서 받은 a.handle, b.handle, pair_state를 각각 a, b, pair_state로 전달하십시오. 이름, 레이어, 영역 측정값이 표시에 함께 제공됩니다. 형상이 바뀌면 오래된 참조를 거절하고 기존 미리보기를 지웁니다. 블록 배치 인스턴스도 표시할 수 있습니다. clear=true는 핸들이나 상태를 요구하지 않고 미리보기를 제거합니다.\n겹침을 알 수 없는 경우나 체적이 양수이지만 반환된 solid가 없는 경우에 미리보기를 만들어 내지 않습니다.","resolve_object_intersection":"선택한 keep solid를 trim solid에서 차감하며, trim 객체의 ID와 속성을 보존합니다.\n\n반환받은 배치 인스턴스 핸들과 pair_state를 전달하십시오. keep은 변경하지 않습니다.\n문서 수준의 Brep/Extrusion 쌍과 닫힌 Mesh 쌍을 지원합니다. 서로 떨어진 부분을 포함하는 Mesh 결과는 하나의 Mesh 객체로 유지됩니다. 블록/연결된 소스의 멤버, Mesh/Brep 혼합 편집, 텍스처가 있는 Mesh, 보존할 수 없는 형상 사용자 데이터, 대상 전체를 삭제하거나 여러 Brep를 만드는 결과는 편집하지 않고 보고합니다. 타임아웃은 롤백이 아닙니다. 다시 시도할지 결정하기 전에 미확정 결과를 관찰하십시오.","focus_components":"Component를 선택하고 격리한 뒤 확대합니다. 사용법과 동작은 BASIC-INSTRUCTIONS.md를 참조하십시오.","get_modeling_guide":"모델링 전에 BASIC을 읽거나, 한 도구의 상세 사용 지침을 가져옵니다.\n\n처음 사용할 때 tool을 생략하면 BASIC-INSTRUCTIONS.md와 사용 가능한 공개 도구 이름을 읽습니다.\n전체 설명을 읽으려면 tool=\"assign_material\"과 같이 정확한 도구 이름을 전달합니다.\n이 호출은 지정한 도구를 실행하지 않고 정적 지침을 읽습니다. 같은 guide_version에서 이미 읽은 지침은 다시 사용합니다. 외부 커넥터 관리 도구는 연결 지침을 사용합니다. BASIC은 참고 자료에 직접 링크합니다.\n\n인수:\n    tool: 공개 Almond 도구의 정확한 이름입니다. 비어 있으면 BASIC과 사용 가능한 도구 이름을 반환합니다.","get_construction_guidance":"구축 시스템, 그 구성 요소와 조립 지침을 조회합니다.\n매개변수는 Ching의 Building Construction Illustrated(4판)에서 추린 내용으로, 시스템별 경간 범위, 깊이 경험칙(깊이 = 경간/N), 부재 간격, 요소 역할과 조립 참고 사항을 담습니다.\n\n경간/깊이 규칙은 예비 치수 산정을 지원하며, 해당 프로젝트의 구조적 적합성을 입증하지 않습니다. 각 시스템은 structural_material(validate_structure의 용어)과 render_material_ids(assign_material의 용어)를 명시합니다.\n\n인수:\n    query: 자유 텍스트 필터입니다(예: \"glulam\", \"longspan\", \"bearing wall\").\n    category: \"floor\", \"wall\", \"roof\", \"foundation\"입니다(비어 있으면 전체).\n    material: \"Wood\", \"Steel\", \"Concrete\" — validate_structure의 이름입니다.\n    structure_type: validate_structure의 유형입니다(\"beam\", \"truss\", \"shell\", \"frame\", \"canopy\", \"gridshell\", \"membrane\", \"highrise\").\n    span_m: 0보다 크면 반환된 각 시스템이 fits_span과 경간비 규칙에서 산정한 권장 부재 깊이를 보고합니다.\n    include_reference_data: load_kn 입력을 선택할 때 사용할 용도별 활하중(kPa)과 재료 밀도(kg/m3)도 반환합니다.\n반환:\n    JSON: {total, systems: [...], reference?}. 벽 시스템의 span_range_m은 비지지 높이 범위입니다(span_axis \"vertical\").\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정합니다. 입력으로 제공한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 rules, narrative, source, metadata, audit 또는 all을 추가하며, 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 독립적으로 켜며, audit은 타임스탬프를 표시합니다.","get_typology_narrative":"프로젝트 스토리텔링을 위한 건축 유형 서술입니다. Ching, Jarzombek, Prakash의 A Global History of Architecture에서 선례, 시대와 도시적 역할을 추려 페이지 참조(gha_ref)와 함께 제공합니다.\n\n항목은 역사적 맥락과 선례 사이의 관계를 제공합니다. 프로젝트별 부재 치수, 하중 또는 구조 내력을 산정할 근거는 포함하지 않습니다.\n\n인수:\n    query: 자유 텍스트입니다(예: \"courtyard\", \"skyscraper\", \"timber hall\").\n    construction_system: 구축 라이브러리의 system_id(예: \"steel-column-frame\")와 관련된 항목으로 필터링합니다.\n    structure_type: validate_structure 유형으로 필터링합니다(\"shell\", \"truss\", \"frame\", \"membrane\" 등).\n    limit: 반환할 최대 항목 수입니다(기본값 5).\n반환:\n    JSON: {total, entries: [{typology_id, name, era, region, narrative, precedents, related_construction_systems, urban_role, gha_ref, tags}], source}.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정합니다. 입력으로 제공한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 rules, narrative, source, metadata, audit 또는 all을 추가하며, 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 독립적으로 켜며, audit은 타임스탬프를 표시합니다.","search_detail_sources":"선별된 무료 건축 자료 출처 디렉터리 여섯 곳을 오프라인으로 검색합니다.\n제목, 태그와 형식을 매칭합니다. 검색어가 비어 있으면 모든 출처를 나열합니다. 한국어 검색어는 보존되며, 일부 카탈로그 용어는 영어로 확장됩니다. 결과에는 query_terms, expanded_terms와 각 출처의 matched_terms가 포함됩니다.\n한국어 자료가 필요한 경우가 아니라면 영어 검색어를 우선 사용합니다.\n링크, 형식과 권리 관련 참고 사항을 반환하며 외부 콘텐츠를 가져오지는 않습니다.\n결과는 조사 후보이지, 출처 귀속이 확정된 입력 자료나 인증된 상세가 아닙니다.\nDETAIL 구독 접근 권한은 필요하지 않습니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정합니다. 입력으로 제공한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 rules, narrative, source, metadata, audit 또는 all을 추가하며, 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 독립적으로 켜며, audit은 타임스탬프를 표시합니다.","export_asset_contract":"Rhino 객체를 이식 가능한 Almond 에셋으로 내보냅니다. GLB와 함께, 파일 형식 자체에 담을 수 없는 내용을 담는 에셋 계약 파일(.almond.json)을 생성합니다.\n\n계약에는 실제 치수(mm), 앵커와 지지 평면, 여유 공간, 각 객체의 Almond material_id가 기록됩니다. 따라서 glTF가 객체별 메타데이터를 버리더라도 다른 애플리케이션(Blender, Unreal 또는 다른 Rhino)에서 전체 의미를 복원할 수 있습니다. 수신 측에서는 import_asset_contract와 함께 사용합니다.\n\n인수:\n    guids: 내보낼 Rhino 객체 GUID입니다(execute_rhino_script에서 받음).\n    asset_id: 안정적인 ID입니다. 예: \"canopy-pavilion-01\"(문자, 숫자, . _ -).\n    name: 사람이 읽기 쉬운 이름입니다. 기본값은 asset_id입니다.\n    output_dir: 대상 폴더입니다. 기본값: \u003cuser data dir>/exchange.\n반환:\n    GLB 경로, 계약 파일 경로와 기록된 치수를 담은 JSON입니다.","import_asset_contract":"Blender, Unreal 또는 다른 Rhino에서 만든 Almond 에셋 계약을 열려 있는 Rhino 문서로 가져와, 파일 형식이 버린 정보를 모두 복원합니다.\n\n전체 수신 절차를 실행합니다. GLB를 가져오고, glTF가 만든 중복 재료를 통합하며, Almond 재료 라이브러리의 정규 PBR 값을 복원합니다(glTF 왕복 변환은 기본 색상을 바꿉니다). 살아남은 재료 이름을 키로 almond:* 메타데이터를 다시 부착하고, 계약의 앵커를 사용해 요청한 지점에 에셋을 배치한 다음, 실측 크기를 계약에 기록된 치수와 비교해 검증합니다.\n\n인수:\n    contract_path: .almond.json 계약 파일의 경로입니다.\n    x_mm, y_mm, z_mm: 밀리미터 단위의 배치점입니다(계약의 앵커).\n    rotation_degrees: 월드 Z축 주위의 회전입니다.\n    layer: 대상 레이어입니다. 없으면 생성합니다.\n반환:\n    복원/중복 제거 개수와 실제 가져온 결과를 계약과 비교하는 dimension_check를 담은 JSON입니다.","get_blender_helper_script":"Blender가 전용 브리지 없이 Almond 워크플로우에 참여할 수 있도록, Blender 안에서 실행할 Python을 반환합니다(blender-mcp의 execute_code 사용).\n\n작업:\n    \"export\" — 현재 Blender 선택을 Almond 에셋 계약 + GLB로 내보냅니다. Blender가 곡선의 경계상자를 부풀리므로, 평가된 메시 데이터에서 치수를 측정합니다.\n    \"materials\" — Blender에 Almond 라이브러리 재료를 만들고(sRGB 값을 선형 값으로 변환), 이름으로 지정한 객체에 할당한 뒤 양쪽에 almond:* 속성을 붙입니다.\n\n인수:\n    action: \"export\" 또는 \"materials\"입니다.\n    asset_id, name, output_dir: \"export\"용입니다(output_dir의 기본값은 Almond 교환 폴더).\n    material_id, object_names: \"materials\"용입니다.\n반환:\n    Blender의 execute_code에 전달할 \"script\" 필드를 담은 JSON입니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정합니다. 입력으로 제공한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 notes, audit 또는 all을 추가합니다. 요청한 manifest/해석된 로직/스크립트는 기본 반환 데이터에 그대로 남습니다.\ninclude_ids는 핸들 표시를 독립적으로 켜며, audit은 타임스탬프를 표시합니다.","get_modeling_policy":"JSON으로 정의된 객체/그룹 메타데이터 키와 재료·레이어 명명 규칙을 반환합니다.\n\n이름은 자유롭게 정할 수 있습니다. 객체에 Almond 관리용 UserStrings를 자동으로 기록하지 마세요.\n기존 키는 호환성 데이터를 설명하며, 채워 넣어야 하는 체크리스트가 아닙니다. 기존 사용자 메타데이터와 에셋 출처 정보를 보존합니다. 일반 이름·레이어·재료 속성은 관리용 UserStrings와 독립적입니다.","execute_rhino_script":"공식 RhinoCode를 통해 바인딩된 Rhino에서 소스 코드 또는 완전한 매크로를 실행합니다.\n\n기본값은 Python 3입니다. 이 계약과 함께 제공되는 rhino3d-scripts 스킬, API 맵과 로딩 지침을 읽으려면 get_modeling_guide(tool=\"execute_rhino_script\")를 호출합니다.\n별도의 스킬 설치는 필요하지 않습니다. 래퍼는 doc/scriptcontext를 바인딩하고 Undo와 화면 다시 그리기를 관리하며, 예외가 발생해도 cwd/환경을 복원합니다.\n원본을 교체하거나 삭제하기 전에 문서 허용오차, 명시적인 객체 ID와 검증된 형상을 사용합니다. 배치 루프는 항목별 결과를 반환하는 동기식 소스 코드에 포함합니다.\n\npython/python2에서는 JSON과 호환되는 값을 직접 할당합니다. 예: result = {\"changed\": 2}.\n구조화된 결과에는 dict/list를 사용합니다. json.dumps는 대신 텍스트를 반환합니다. 첫 응답은 각 배열 또는 최상위 목록 필드마다 최대 20개 항목, 최상위 문자열의 경우 4096자를 포함하며, 나머지 데이터는 페이지로 나뉩니다.\ncsharp/csharp-script는 doc와 result_json을 사용하는 C# 문장 본문이며, 이전의 class/Run 형식이 아닙니다. command는 !, Pause 또는 대화상자를 추가하지 않고 완전히 지정된 매크로 하나를 받습니다. 모든 모드에는 바인딩된 Rhino에서 StartScriptServer가 필요하며, 구형 Bridge 실행기로 대체하는 경로는 없습니다.\n고정 조회와 검증된 내부 recipe는 기존 native 경로를 유지합니다.\n\nproject_root는 절대 경로이며 artifact_dir은 그 기준 상대 경로입니다. 일반 스크립트는 프로젝트 루트를 cwd로 실행합니다. 선택한 Plan 폴더를 cwd로 쓰려면 execute_project_python을 사용합니다.\nworker-venv의 패키지가 Rhino 내장 Python에도 있다고 가정하지 마세요. 판단에 필요한 측정값만 반환하고, 관련 작업은 하나의 스크립트로 모읍니다.\n\n대기 중 응답에는 request_id가 포함됩니다. 해당 실행이 아직 pending이거나 결과의 추가 페이지가 필요하거나 출력/진단을 더 확인해야 할 때 get_rhino_execution을 사용합니다.\n필요한 결과를 포함한 완료 응답에는 후속 조회가 필요하지 않습니다. CLI 종료, print 출력과 타임아웃은 완료 증거가 아닙니다. 예외와 함께 완료된 실행에는 일부 변경이 남을 수 있으며, result_error는 이를 되돌리지 않습니다. 불확실한 작업을 자동 재시도하거나, 다른 문서를 열거나, 분리된 문서 편집 작업을 예약하지 마세요.\n\nFloor 메타데이터가 요청되면 Scene의 전체 레벨 범위가 아니라 해당 객체의 실제 레벨 이름을 사용합니다. 여러 레벨이면 타입이 지정된 문자열 배열, 한 레벨이면 문자열을 기록합니다. 다음 Python 예시는 이미 식별된 `object_id`와 비어 있지 않은 `floor_names` 목록을 사용하며 관련 없는 속성은 보존합니다:\n\n```python\nimport System\nobj = doc.Objects.FindId(System.Guid(object_id))\nif obj is None or obj.IsReference or obj.IsLocked:\n    raise ValueError(\"Floor target must be an editable local object\")\nattrs = obj.Attributes.Duplicate()\nvalue = floor_names[0] if len(floor_names) == 1 else System.Array[System.String](floor_names)\nattrs.UserDictionary.Set(\"Floor\", value)\nif not doc.Objects.ModifyAttributes(obj.Id, attrs, True):\n    raise RuntimeError(\"Floor update failed\")\nstored = doc.Objects.FindId(obj.Id).Attributes.UserDictionary[\"Floor\"]\nresult = {\"object_id\": str(obj.Id), \"Floor\": str(stored) if len(floor_names) == 1 else list(stored)}\n```\n\n인수:\n    script: 동기식 Python 소스 코드, C# 문장 본문 또는 완전한 명령 매크로입니다.\n    language: python(기본값 Python 3), python2, csharp, csharp-script 또는 command입니다. 모든 모드는 공식 RhinoCode를 사용합니다.\n    timeout_seconds: 1–600의 정수이며 기본값은 60입니다. 대기 한도일 뿐입니다. 타임아웃 뒤에는 같은 요청을 다시 조회합니다.\n반환:\n    복구 가능한 request_id와 함께 JSON 실행 결과 및 반환값을 제공합니다. pending 또는 실패한 호출은 완료 증거를 보존합니다.","edit_planar_face":"Rhino의 PushPull Extend를 사용해 기존 닫힌 Brep의 평면 면 하나를 평행 이동합니다.\n해당 면을 확장하거나 후퇴시켜도 의도한 요소와 연결이 유지되는 경우 사용합니다. 선택한 면과 인접한 모든 면이 평면이어야 합니다. 이 도구는 잠금 해제된 모델 공간의 최상위 Brep를 지원하며, extrusion 변환이나 블록 내부는 지원하지 않습니다. 먼저 그룹/블록 편집을 마칩니다. Bridge face_edit=1과 Rhino 8.16 이상이 필요합니다.\n\n동일한 현재 형상 관찰에서 받은 object_id, face_index와 expected_geometry_crc를 전달합니다. CRC가 바뀌면 교체 전에 편집을 거절합니다. translation은 문서 단위의 XYZ 벡터이며, 면의 법선 방향 성분이 문서 허용오차를 초과해야 합니다. helper는 복제본을 준비하고 유효한 닫힌 manifold 형상, 방향과 유한한 양의 체적을 검사한 뒤, 같은 GUID를 유지하며 원본을 교체합니다. 객체 속성, 그룹, 형상 UserStrings와 형상의 UserDictionary를 보존합니다. 다른 사용자 정의 형상 데이터는 이 작업으로 보존을 검증할 수 없으므로 편집 전에 거절합니다.\n\n기존 native 실행기가 Undo와 완료를 관리합니다. 확정된 결과는 edited=true, 새 geometry_crc, 변경 전후의 체적과 면 개수를 반환합니다. 면 인덱스가 바뀔 수 있으므로, 다시 편집하기 전에 면을 다시 관찰합니다. 이는 기하 편집을 보고하는 것이지, 구축 적합성·주변 요소와의 여유 공간·문서 저장을 보고하는 것이 아닙니다. 의도한 변경을 평가하는 데 필요한 관찰을 선택합니다. 미확정 결과는 재시도 전에 검사해야 합니다. 타임아웃과 result_error는 편집이 취소되었다는 증거가 아닙니다.","edit_planar_faces":"서로 다른 1–32개 Brep 각각의 평면 면 하나를 한 번의 native 호출과 Undo 기록으로 편집합니다.\n대상과 면 이동을 이미 함께 식별했다면 배치를 사용합니다.\n각 `edits` 항목에는 `object_id`, `face_index`, `expected_geometry_crc`, `translation`을 포함하며, `edit_planar_face`와 동일한 형상 및 보존 계약이 적용됩니다.\nBridge `face_edit_batch=1`이 필요합니다. 편집이 해당 객체의 면 인덱스를 바꿀 수 있으므로 중복 객체 ID는 거절합니다. 다른 면을 고르기 전에 그 결과를 관찰합니다.\n\n첫 문서 변경 전에 모든 교체 형상을 준비하고 검사합니다. 준비가 실패하면 모든 원본은 변경되지 않습니다. 교체가 실패하면 배치를 중지하고 항목별 `applied`, `failed`, `unknown` 또는 `not_attempted` 결과와 `applied_count`를 반환합니다.\n완료된 편집은 하나의 Undo 기록에 남으며, 자동 롤백이 아닙니다.\n부분 완료나 불확실한 실행은 전체 배치를 반복하라는 요청이 아닙니다. 다음 편집을 결정하기 전에 보고된 객체를 검사하고 미확정 결과를 확인·조정합니다.","save_rhino_document":"명령, 프롬프트 또는 Enter 없이 현재 연결의 기존 .3dm 파일을 저장합니다.\n승인된 편집 배치 후 파일을 저장해야 할 때 사용합니다. 바인딩된 문서 전체를 기존 경로에 저장하며, SaveAs나 임의 경로 입력은 없습니다.\n진행 중이거나 불확실한 그룹/블록 편집, 일치하지 않는 문서와 읽기 전용 파일은 쓰기 전에 거절합니다. 확정된 응답은 saved=true와 실제 modified 플래그를 반환합니다. 미확정 응답은 실패의 증거가 아닙니다. 저장을 자동 반복하거나 연결의 native 완료 보호를 해제하지 마세요.","setup_modeling":"현재 Rhino 문서에 재료를 등록하거나 구축 레이어를 생성합니다.\n\noperation=\"materials\"는 읽기 쉬운 이름으로 선별된 PBR 라이브러리를 등록합니다.\n이름이 일치하는 경우 overwrite=true는 PBR 채널을 갱신하고, false는 보존합니다. 생략하면 Rhino에서 한 번 Yes/No를 선택합니다. Cancel은 아무것도 변경하지 않습니다.\n\noperation=\"layers\"는 M/category/system.name/element.role 경로를 생성하거나 재사용하고, 재료와 일치하는 표시/인쇄 색상을 할당합니다. 시스템은 첫 번째 render_material_ids recipe를 사용합니다. connection/reinforcement/decking에는 아연도금 강재를, Wood subfloor/sheathing에는 자작나무 합판을 사용합니다. 이는 설정 기본값이며 구축 manifest가 제공하는 역할 매핑은 아닙니다. 컨테이너 레이어는 회색입니다. 이름이 일치하는 기존 재료를 재사용하며, overwrite는 operation=\"materials\"에만 적용됩니다. 어떤 객체도 이동하거나 메타데이터를 기록하지 않습니다.\n\nBridge modeling_materials=2가 필요합니다. 전체 작업은 하나의 Undo 단계입니다.\n성공은 API 실행을 보고하며, 시각적 검토나 3DM 저장을 뜻하지 않습니다. 불확실한 결과는 재시도 전에 검사해야 합니다.","list_materials":"Rhino를 변경하지 않고 assign_material이 사용하는 선별된 PBR 재료 라이브러리를 나열합니다.\n\n각 항목에는 metallic/roughness PBR 채널, 가져온 뒤 결정적으로 다시 매핑하기 위한 Unreal 재료 슬롯 이름(ue_material_slot), 태그가 들어 있습니다. 재료는 객체 레이어를 정의하지 않습니다. setup_modeling이 구축 라이브러리에서 M/category/system/role 레이어를 별도로 생성합니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정합니다. 입력으로 제공한 대상 ID는 반복해서 반환하지 않습니다.\nfield_groups는 display, physical, metadata, source, paths, audit 또는 all을 추가하며, 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 독립적으로 켜며, audit은 타임스탬프를 표시합니다.","assign_material":"명시적으로 지정한 Rhino 객체에 선별된 PBR 재료와 그 정규 M:: 레이어를 할당합니다.\n컴파일된 helper는 선택한 재료/레이어만 필요할 때 생성하고 기존 항목은 재사용합니다. 자동 치수를 추가하지 않고 적용된 GUID를 반환합니다.\n\n구조 부재에서는 그 객체가 구축 관점에서 무엇인지도 선언합니다. structural_role(예: \"joist\", \"girder\", \"stud\", \"truss_chord\")과 construction_system(get_construction_guidance에서 받은 system_id)을 지정합니다.\n명시적으로 제공한 structural_role은 기존 user-text 키를 유지합니다. 시스템은 아래에 설명한 타입 지정 construction_reference로 저장됩니다. 선택한 material_id가 선언한 시스템의 일반적인 마감이 아니면 응답에 경고가 들어가지만, 적용은 그대로 수행합니다.\n\nfloor는 사용자가 제공하는 레벨 이름입니다. construction_detail은 읽기 쉬운 이름이며, construction_reference는 선택적으로 {\"kind\": \"construction_system\", \"id\": \"\u003csystem_id>\"} 형태로 알려진 출처를 식별합니다. 이 출처 기록은 예비 시스템 지침이지 검증된 구축 상세가 아닙니다. 예전 construction_system 인수도 허용되며 동일한 타입 지정 참조를 만듭니다.\n명시적인 이름이 없으면 출처 이름이 상세 이름으로 사용됩니다.\n\n두 가지 효과는 독립적으로 켜고 끌 수 있습니다:\n- apply_render_material: 라이브러리 이름을 사용하는 물리 기반 Rhino 재료를 생성하거나 재사용하고 객체별로 할당합니다. 따라서 GLB 내보내기(publish_to_chestnut)와 Datasmith가 실제 PBR 채널을 전달합니다. 객체의 레이어는 항상 보존합니다. false이면 native 재료를 변경하거나 생성하지 않습니다.\n- attach_metadata: 기본값은 false입니다. 일반 재료 적용은 객체 관리용 UserStrings를 기록하지 않습니다. 메타데이터 부착을 명시적으로 요청받은 경우에만 true로 설정합니다. native 재료가 적용되면 material_id만 기록하며, 여기에 입력으로 제공한 floor/detail/reference 메타데이터를 기록합니다. PBR 채널은 native 재료에 남습니다. 메타데이터만 처리하는 호출은 현재 재료 식별성을 보존하고 입력으로 제공한 메타데이터만 기록합니다.\n\n지정하지 않은 메타데이터와 에셋 출처 정보는 보존됩니다. modeling_materials=2인 Bridge가 필요합니다. 이전 Bridge는 어떤 변경도 하기 전에 거절합니다.\nBrep, 메시와 블록 인스턴스에서 작동합니다. 인스턴스의 재료는 'by parent'로 설정된 정의 형상에 적용되며, 메타데이터는 명시적으로 켠 경우에만 인스턴스 자체에 부착됩니다. 필요한 재료 ID를 아직 모르면 list_materials를 조회합니다.","list_library":"Grasshopper 라이브러리에서 사용 가능한 모든 물리 로직 원형을 나열합니다.\nget_logic_by_id를 호출하기 전에 이 도구를 먼저 사용하여 어떤 로직 ID를 사용할 수 있는지 확인하세요.\n\n반환:\n    사용 가능한 로직 ID의 JSON 목록(예: [\"catenary\", \"bending\", \"01_simplebeam\"]).\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 ports, definition, source, paths, audit 또는 all을 추가할 수 있습니다. 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","get_logic_by_id":"특정 Kangaroo2 또는 Karamba3D 원형의 해석된 물리 컨텍스트를 가져옵니다.\nGrasshopper 바이너리 파일에서 추출한 감지된 컴포넌트, 설명 및 메타데이터를 반환합니다.\n\n인수:\n    logic_id: Grasshopper 파일의 파일명(확장자 제외).\n              사용 가능한 ID를 확인하려면 먼저 list_library()를 사용하세요.\n              예: catenary, bending, 01_simplebeam\n반환:\n    감지된 물리 컴포넌트와 컨텍스트가 담긴 JSON 문자열, 또는 오류.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 ports, definition, source, paths, audit 또는 all을 추가할 수 있습니다. 요청한 manifest/해석된 로직/스크립트는 기본 응답 데이터에 남습니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","list_capsules":"Grasshopper 캡슐을 나열합니다. 캡슐은 타입이 지정되고 검증된 입출력 계약을 갖춘 GH 정의이며, run_gh_definition으로 실행할 수 있습니다.\n\nrun_gh_definition을 호출하기 전에 이 도구를 먼저 호출하여 어떤 캡슐이 있는지 확인하세요.\n각 항목은 capsule_id, capability, structure_type, audited 플래그, 예약된 ALMOND_IN_* / ALMOND_OUT_* 포트 이름이 담긴 간결한 카드입니다. audited=true인 캡슐만 실제 실행할 수 있습니다. audited=false인 캡슐은 조회용 컨텍스트로만 사용하며, 대신 get_logic_by_id로 읽으세요.\n\n인수:\n    capability: 선택적 필터: \"analyze\", \"generate\", \"form_find\" 또는 \"aggregate\".\n    audited_only: true이면 run_gh_definition이 허용하는 캡슐만 나열합니다.\n반환:\n    total과 간결한 캡슐 카드 목록이 담긴 JSON.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 ports, definition, source, paths, audit 또는 all을 추가할 수 있습니다. 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","run_gh_definition":"검증된 Grasshopper 캡슐(GH 정의 + 타입이 지정된 계약)을 Rhino 브리지를 통해 실행하고, 선언된 출력을 반환합니다.\n\n작업 순서: 먼저 list_capsules()를 호출하여 capsule_id를 고르고 입출력 포트 이름을 확인하세요. 필요한 형상은 execute_rhino_script로 만든 뒤 반환된 GUID를 여기에 전달하세요. Rhino에 어떤 것도 보내기 전에 클라이언트 측에서 입력을 캡슐 manifest와 대조하여 검증하므로, 이 도구의 오류는 문제가 있는 정확한 포트 이름을 알려줍니다.\n\n입력값 형식(정확한 ALMOND_IN_* 포트 이름을 키로 사용):\n  - 형상 포트(point/curve/mesh/brep 및 각각의 [] 목록 형식):\n    {\"guids\": [\"\u003crhino-object-guid>\", ...]} — 이미 Rhino 문서에 있는 객체를 참조합니다.\n  - number / integer / string / bool 포트: 가공하지 않은 JSON 값.\n  - number[] / integer[] / string[] 포트: 중첩되지 않은 JSON 목록.\n단위는 manifest에서 포트마다 선언됩니다. 해당 단위로 값을 제공하세요. 클라이언트 측에서는 어떤 단위도 추측하거나 자동 변환하지 않습니다. 선택적 입력은 생략할 수 있으며, 그러면 정의 내부에서 캡슐에 선언된 기본값이 적용됩니다.\n\n검증된 캡슐만 실행됩니다. audited=false는 GHX에 검증된 ALMOND_IN_*/ALMOND_OUT_* 입출력 연결 매개변수가 아직 없다는 뜻이므로 이 도구는 실행을 거절합니다(연결 구성 방법은 asset/capsules/AUTHORING.md 참조).\n\n응답의 \"outputs\" 객체는 ALMOND_OUT_* 이름을 키로 사용합니다. 각 값은 manifest의 semantics 필드(예: max_nodal_displacement, per_element_utilization)와 선언된 단위에 따라 해석하세요. 응답에는 analysis_method(api|template|rule_based), confidence(high|medium|low), warnings, baked_guids도 포함됩니다. 방법과 신뢰도를 사실대로 보고하세요. rule_based/low는 추정값이지 유한요소해석(FEA)이 아닙니다.\n\n인수:\n    capsule_id: list_capsules에서 얻은 안정적인 캡슐 식별자(예: \"karamba_beam_v1\").\n    inputs: ALMOND_IN_* 포트 이름을 값에 대응시키는 객체(위 형식 참조).\n    seed: 확률적 정의를 위한 선택적 정수 시드. 결정론적 정의에서는 생략하세요.\n    timeout_s: 해석기에 허용하는 시간(초, 기본값 60, 최댓값 600).\n반환:\n    status, capsule_id, outputs, baked_guids, analysis_method,\n    confidence, warnings, error가 담긴 JSON — 또는 문제가 있는 입력과\n    유효한 포트 이름을 알려주는 검증 오류.","validate_structure":"제공한 하중, 지점 및 계산 가정에 따라 지정한 Rhino 형상을 해석합니다.\n\nengine=\"auto\"(기본값)는 Almond에 내장된 3D 골조 해석기로 선 모델(보, 기둥, 트러스, 골조)을 해석합니다. analysis_method는 \"native\", confidence는 \"high\"이며 Karamba 설치가 필요하지 않습니다. 이는 EN 1993-1-1 부재 검토를 포함한 선형탄성 1차 골조 해석입니다(탄성 단면계수, L_cr = 부재 길이를 적용한 휨좌굴, 횡비틀림좌굴 제외). 폐형식 해석 결과 및 실제 Karamba 실행 결과와 비교 검증되었습니다. 쉘이 포함된 모델과 shell/gridshell/membrane 구조 유형은 Karamba로 전달됩니다. engine=\"karamba\"는 Karamba 경로를 강제로 사용하며, 신뢰도 순서에 따라 다음 세 경로를 엄격히 순차적으로 시도하고 어떤 경로가 실행되었는지 항상 알려줍니다.\n    analysis_method \"api\"        — Karamba 3.1 API를 직접 사용한 해석, confidence \"high\"\n    analysis_method \"template\"   — 검증된 캡슐 GHX 템플릿, confidence \"medium\"\n    analysis_method \"rule_based\" — 경험적 경간/세장비 규칙, confidence \"low\"\n판정 문자열에는 사용한 방법이 표시됩니다(예: \"[RULE-BASED ESTIMATE, LOW CONFIDENCE] ...\").\nrule_based/low 결과는 유한요소해석이 아니라 추정값으로 취급하고, 사용자에게 보고할 때도 그 사실을 밝히세요.\n\n결과는 해석된 시스템에서 요구 성능과 내력의 문제 위치를 보여줍니다. 원인과 적절한 설계 변경은 부재의 연결, 지점 및 하중 전달 경로에 따라 달라집니다.\n\n인수:\n    guids: 해석 범위에 속한 현재 Rhino 객체 GUID 문자열.\n    structure_type: 사용할 해석 템플릿. 선택 항목:\n        \"beam\"       — 단순 보의 휨/처짐\n        \"truss\"      — 축력/좌굴 해석\n        \"shell\"      — 쉘의 응력/변위\n        \"frame\"      — 골조의 모멘트/전단력 해석\n        \"canopy\"     — 캔틸레버 캐노피\n        \"gridshell\"  — 대변형 그리드쉘\n        \"membrane\"   — 형상 찾기 막 구조\n        \"highrise\"   — 고층 구조 시스템\n    load_kn: 적용 하중(kN, 기본값 10.0).\n    material: 재료 유형: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\"(기본값 \"Steel\").\n    engine: \"auto\" | \"native\" | \"karamba\"(위 설명 참조).\n    fixed_supports: True = 완전 고정 지점, False = 힌지 지점(회전 자유).\n    self_weight: 부재 자중을 포함합니다.\n    span_m: 부재가 각 절점에서 분할되어 있을 때 L/250 한계에 사용할 구조 경간(미터)\n        (예: 6.2 m 장선을 3.1 m 구간 두 개로 그린 경우). native 엔진에만 적용됩니다.\n    asset_loads: 배치된 라이브러리 에셋이 골조 위에 놓이거나 골조에 매달린 위치에 중력 하중을 추가합니다.\n        각 에셋의 하중 항목에 따른 추정 자중과 사용 중 내용물/사용자 하중을 합산합니다\n        (예: 물이 찬 욕조). 배치 정보는 Almond asset id 태그가 있는 Rhino 객체에서 가져오거나,\n        scene_id가 주어지면 Scene 장부에서 가져옵니다. native 엔진에만 적용됩니다.\n        결과의 \"asset_loads\"는 모든 배치에 대해 하중과 이를 지지하는 부재를 나열하거나,\n        적용하지 않은 이유를 나열합니다.\n    floor_load_kn_m2: 한 층에서 보로 둘러싸인 모든 구획에 적용할 바닥 활하중(kN/m2)\n        (예: 주거용 2.0, EN 1991-1-1 category A). 보에는 45도 규칙으로 하중을 배분합니다\n        (양방향, 종횡비가 2:1을 넘으면 일방향). native 엔진에만 적용됩니다.\n        규정상의 바닥 활하중에는 이미 이동식 가구와 사람이 포함되어 있으므로,\n        asset_loads와 함께 사용하는 경우에는 무거운 특정 물품만 추가하고 중복 산정을 피하도록 load_kn을 0으로 설정하세요.\n    floor_dead_kn_m2: 같은 구획에 적용할 추가 고정하중(kN/m2, 바닥 구성층과 마감).\n    design_basis: \"en1990\"(기본값): 처짐은 SLS 특성 조합(G + Q), 부재 검토는 ULS 1.35 G + 1.5 Q로 수행합니다.\n        G = 자중, 바닥 구성층, 배치된 물품의 중량.\n        Q = load_kn, 재실에 따른 바닥 활하중, 내용물과 사용자 하중.\n        \"unfactored\"는 두 검토 모두 G + Q로 수행합니다(Karamba 경로의 기준). native 엔진에 적용됩니다.\n    uls_combination: \"6.10\" 또는 \"6.10ab\"(부재별로 6.10a와 6.10b 중 더 불리한 값).\n        기본값은 설계 기준이 선택한 식입니다(Eurocode profile: 6.10).\n        특정 식을 규정한 profile은 경고와 함께 요청값보다 우선 적용됩니다.\n    design_code: 규정 또는 국가부속서가 정하는 수치(gamma_G, gamma_Q, psi_0, xi, gamma_M0,\n        gamma_M1, 처짐 한계)의 설계 기준 profile. \"eurocode\"(기본값, EN 권장값),\n        list_design_codes의 임의 profile, 또는 \"off\"를 사용합니다\n        (계수를 적용하지 않은 G + Q, 부분계수 없음. design_basis=\"unfactored\"와 동일).\n        결과에는 사용한 값과 검증되지 않은 값을 담은 \"design_code\"가 포함됩니다.\n    fabrication: 강재 중공 단면(CHS/RHS)은 \"cold_formed\"(기본값, EN 10219, 좌굴곡선 c)\n        또는 \"hot_finished\"(EN 10210, 좌굴곡선 a, S460은 a0)입니다.\n        좌굴 내력 차이가 최대 약 23%에 이르므로, 명시된 경우에만 hot_finished를 사용하세요.\n    detail: native 엔진에만 적용됩니다. \"members\"를 추가합니다(부재별 역할, 길이, 단면,\n        ULS 설계력 N/V/M/T, 지배 조합과 검토, 세장비, chi, 응력, 이용률,\n        SLS 처짐과 경간/처짐 비, 힌지 단부). 또한 \"supports\"를 추가합니다\n        (SLS 및 각 ULS 조합의 반력 Fx..Mz). 응답을 짧게 유지하기 위해 기본값은 꺼짐입니다.\n    connections: \"rigid\"(기본값: 모든 접합부가 모멘트를 전달) 또는 \"simple\".\n        simple에서는 보가 끝나는 위치에서 보를 힌지로 처리하고(주축 휨 해제),\n        가새가 끝나는 위치에서는 두 축 모두 힌지로 처리합니다. 다른 부재가 일직선으로 이어지는 지점에는\n        이 해제를 적용하지 않으며 기둥은 연속 상태를 유지합니다.\n        일반적인 볼트 접합 강구조와 목구조는 \"simple\"에 더 가깝습니다.\n        강접합은 보의 처짐을 실제보다 작게 보이게 할 수 있습니다.\n        곡선의 사용자 텍스트 almond:release = \"pinned\" | \"pinned_start\" | \"pinned_end\" | \"rigid\"는\n        어느 모드보다도 우선 적용됩니다. native 엔진에 적용됩니다.\n    stability: \"auto\"(기본값): 모든 ULS 조합에 대한 탄성 임계 하중계수 alpha_cr\n        (EN 1993-1-1 5.2.1)와 +/-x, +/-y 방향의 횡변위 초기결함\n        phi = 1/200 x alpha_h x alpha_m(5.3.2)를 적용합니다.\n        alpha_cr \u003c 10이면 2차(P-Delta) ULS 해석을 수행하고,\n        alpha_cr \u003c= 1이면 불안정으로 실패 처리합니다.\n        \"off\": 초기결함을 적용하지 않는 1차 해석.\n이 도구는 해석 경간을 구축 시스템 라이브러리와도 비교하고 \"construction_check\" 객체를 덧붙입니다.\n여기에는 fits_span 및 권장 부재 깊이를 포함한 matching_systems와,\n경간이 해당 structure_type/material에 대해 선별된 모든 시스템의 범위를 벗어나는 경우의 경고가 담깁니다.\n\n반환:\n    브리지의 JSON과 construction_check. 최상위 필드: status(\"pass\"|\"fail\"|\"error\"),\n    passed(bool), verdict(텍스트), suggestions, confidence(\"high\"|\"medium\"|\"low\"),\n    warnings, worst_member_guids(이용률이 가장 크게 초과된 부재의 Rhino GUID 최대 5개).\n    results 객체에는 다음 수치가 담깁니다: max_deflection_mm, deflection_limit_mm,\n    utilization_ratio, max_stress_mpa, yield_stress_mpa, span_m,\n    analysis_method(\"native\"|\"api\"|\"template\"|\"rule_based\"),\n    reactions_kn(전체 수직 반력, api 경로에만 적용), per_element_utilization.\n    per_element_utilization은 각 요소를 만들어 낸 Rhino 객체에 다시 연결되는\n    {source_guids, utilization} 항목의 목록입니다(utilization 1.0 = 내력 한계).","list_design_codes":"validate_structure / visualize_structure가 design_code로 받는 설계 기준 profile을 나열합니다.\n\nprofile에는 설계 기준 또는 국가부속서가 정하는 수치(하중계수 gamma_G, gamma_Q, psi_0, xi, ULS 식, 재료계수 gamma_M0, gamma_M1, 처짐 한계, 권장 바닥 활하중)가 담기며, 각 수치에는 출처 조항과 verified 플래그가 붙습니다.\n\"eurocode\"(EN 권장값)는 내장되어 있고 기본값입니다. \"off\"는 계수를 적용하지 않는 역학 계산입니다.\n설계사무소는 국가부속서 profile을 JSON 파일로 user_dir에 추가합니다(src/mcp/features/structure/PROFILES-SPEC.md 참조).\n검증되지 않은 값도 허용하지만, 이를 사용하는 모든 결과에 미검증 표시가 붙습니다.\n\n반환 JSON: default, profiles [{id, name, basis, origin, verified, unverified, uls_expression, uls_default, deflection_limit_ratio, imposed_floor_kn_m2}], problems(검증에 실패한 파일), user_dir.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 parameters, source, audit 또는 all을 추가할 수 있습니다. 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","visualize_structure":"선 모델에 대해 실시간 구조 해석을 수행하고 모든 Rhino 뷰포트에 표시합니다.\n변형 전 와이어프레임, 변위(또는 이용률)에 따라 파랑에서 빨강으로 색칠한 확대 변형 형상, 지점, 하중 화살표, 최대 처짐·L/limit 검토·PASS/FAIL이 담긴 범례 패널을 표시합니다. 어떤 것도 문서 객체로 생성하지 않습니다.\n\n설계 중 구조 거동을 눈으로 확인하는 데 사용하세요. 구조 중심축을 곡선으로 모델링하고 지점 위치에 Rhino 점 객체를 포함한 뒤 이 도구를 호출하세요. 빨간색으로 표시된 부재를 수정하고(기둥 추가, 캔틸레버 단축, beam_diameter_mm로 단면 확대) 다시 호출하세요. validate_structure는 근거를 추적할 수 있는 판정을 제공하고, 이 도구는 같은 해석 결과를 시각적으로 반복 검토하는 화면을 제공합니다.\n\n인수:\n    guids: 구조 중심축의 곡선 GUID와 지점을 표시하는 점 GUID(fixed_supports 참조).\n        점이 없으면 가장 낮은 절점들이 지지됩니다.\n    load_kn: 전체 활하중(kN). 자유 절점에 균등하게 분배됩니다(-Z 방향).\n    material: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\".\n    beam_diameter_mm, beam_wall_mm: 모든 부재에 적용할 원형 중공 단면\n        (기본값: 추론된 단면 / CHS 114.3x4).\n    self_weight: 중력을 포함합니다.\n    fixed_supports: True = 완전 고정 지점, False = 힌지 지점(회전 자유).\n    deflection_limit_ratio: 경간/비율 한계. 예: L/250이면 250.\n        기본값은 설계 기준의 한계입니다(Eurocode profile: 250).\n    span_m: 한계 산정용 기준 경간(미터, 기본값: 가장 긴 부재).\n        부재가 모든 절점에서 분할된 경우 설정하세요.\n        예: 6.2 m 장선을 3.1 m 구간 두 개로 그린 경우.\n    color_by: \"displacement\" 또는 \"utilization\".\n    scale: 변형 확대 배율. 생략하면 자동 설정됩니다(경간의 약 6%).\n    reveal: 그릴 부재의 비율, 0..1(단계별 시공 재생용).\n    reanalyze: False이면 마지막 해석을 재사용하고 표시만 변경합니다\n        (scale / color_by / reveal / physics / title). 애니메이션에 사용할 만큼 비용이 작습니다.\n    physics: False이면 해석 오버레이 없이 같은 부재를 일반 형상으로 표시합니다\n        (\"physics off\"). 전후 비교용입니다.\n    display_guids: 이 부재들만 그립니다(예: 단면 검토용 한 줄의 골조).\n        해석은 여전히 guids의 모든 부재를 포함합니다.\n    title: 범례 제목.\n    clear: 오버레이를 제거합니다.\n    engine: \"auto\"(기본값: Almond의 native 골조 해석기, Karamba 불필요.\n        선택에 쉘이 포함되거나 브리지가 모델을 내보낼 수 없으면 Karamba 사용),\n        \"native\" 또는 \"kara
