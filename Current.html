mba\".\n    asset_loads: validate_structure와 같이 배치된 에셋의 하중을 추가합니다(native 엔진).\n        하중이 작용하는 점에는 하중 화살표가 표시됩니다.\n    floor_load_kn_m2, floor_dead_kn_m2: validate_structure와 같이 모든 둘러싸인 구획에 적용할 바닥 면하중.\n    design_basis, uls_combination, design_code: validate_structure와 같습니다.\n        오버레이는 ULS 이용률 포락값으로 색칠한 SLS 처짐 형상을 표시합니다.\n    connections: validate_structure와 같이 \"rigid\" 또는 \"simple\".\n        힌지 단부는 작은 원으로 표시합니다.\n    stability: validate_structure와 같이 \"auto\" 또는 \"off\".\n    view: \"deflection\"(기본값) 또는 \"buckling\".\n        buckling에서는 처짐 형상 대신 지배 ULS 조합의 첫 번째 좌굴 모드와 alpha_cr를 표시합니다\n        (STABLE >= 10, SWAY-SENSITIVE 1-10, UNSTABLE \u003c= 1).\n\n반환 JSON: status(\"pass\"|\"fail\"|\"error\"|\"cleared\"), max_displacement_mm,\ndeflection_limit_mm, span_m, max_utilization, scale,\n요소별 {source_guids, max_displacement_mm, utilization}, warnings.\nnative 엔진은 analysis_method \"native\"를 보고합니다. engine=\"karamba\"에는 Karamba3D 3.1이 필요합니다\n(체험판은 모델을 보 요소 20개로 제한합니다).","export_structural_report":"저장된 validate_structure 이력을 Markdown 보고서로 만듭니다.\n\n성공한 모든 validate_structure 호출은 로컬 상태 데이터베이스에 기록됩니다(입력, 해석 방법, 신뢰도, 수치, 경고). 이 도구는 해석 경로와 통과 기준에 대한 설명과 함께 이 기록을 최신순으로 .md 파일에 씁니다.\n\n인수:\n    path: 출력 파일 경로. 기본값:\n        \u003cuser data dir>/reports/structural-validation-\u003ctimestamp>.md\n    limit: 포함할 최대 실행 횟수(기본값 50, 최댓값 500).\n반환:\n    보고서 경로와 실행 횟수가 담긴 JSON.","list_drawing_recipes":"레이어, 선 굵기, 투영 및 내보내기에 대한 검증된 recipe를 간결하게 나열합니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 scales, parameters, source, audit 또는 all을 추가할 수 있습니다. 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","get_drawing_recipe":"기본적으로 검증된 도면 recipe 하나의 요약을 반환합니다. 레이어/스타일 및 검토 준비 설정을 보려면 field_groups=[\"parameters\"]를 요청하세요.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 scales, parameters, source, audit 또는 all을 추가할 수 있습니다. 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","apply_drawing_style":"검증된 도면 recipe에 정의된 Rhino 레이어 계층, 출력 선 굵기, 색상 및 선 종류를 생성하거나 갱신합니다.\nA4 평면/단면 recipe는 동일하게 연결된 문서에서 인쇄 검토를 준비하기 위한, 아직 실행하지 않은 rhinocode CLI 명령 템플릿을 반환할 수 있습니다. 이 도구는 PrintDisplay를 검사하거나 변경하지 않습니다.\nrecipe에는 양수 길이와 명시적인 is_solid 값을 가진 linetype_segments를 지정할 수 있습니다. 이름이 충돌하는 패턴이나 잘못된 명시적 segment는 레이어를 변경하기 전에 거절하고, 이름과 내용이 일치하는 패턴은 재사용합니다.\nsegment가 없는 recipe는 기존의 이름 기반 동작을 유지합니다.","import_drawing_hatch_patterns":"인덱스에 등록된 도면 에셋의 AutoCAD 스타일 .pat 해치 정의를 활성 Rhino 문서의 해치 패턴 테이블로 가져옵니다.\n\n이 도구는 관리되는 asset/drawing/DrawingAssetfiles manifest에서 확인된 .pat 파일만 허용하며, 배치 도구와 동일한 보안 경계를 적용합니다.","list_drawing_assets":"변환을 기다리는 기존 형식의 소스를 포함하여, 공통 3DM 모델 및 2D 모음을 나열합니다.\n\n기존 drawing 도구 이름은 가져온 모델과 생성된 모델을 모두 다룹니다. 다이어그램 에셋은 별도로 유지됩니다. source_only/needs_conversion 항목은 배치 전에 prepare_drawing_asset과 3DM 등록이 필요하며, 해당 asset_id를 유지해야 합니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 dimensions, source, paths, drawing, metadata, audit 또는 all을 추가할 수 있습니다. 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","search_drawing_assets":"텍스트, 분류 및 실측 치수로 공통 모델/2D 모음을 검색합니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 dimensions, source, paths, drawing, metadata, audit 또는 all을 추가할 수 있습니다. 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","get_drawing_asset":"모델/2D 에셋 하나의 출처 이력, 표현, 사용 가능 여부 및 변환 또는 갱신 상태를 반환합니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 dimensions, source, paths, drawing, metadata, audit 또는 all을 추가할 수 있습니다. 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","prepare_drawing_asset":"조립 구조, 레이어, 재료 및 원점을 보존하면서 소스 사본을 3DM으로 준비합니다.\n\ninspect에는 source_file이 필요하며, 작업 중인 Plan의 산출물 디렉터리에 실측한 최상위 구성 요소와 이미지를 반환합니다. 메시 교환 파일(OBJ/STL/PLY/OFF/GLB/glTF)에는 input_units가 필요합니다. 3DM의 단위는 보존됩니다. 한계: 입력 100 MB, 최상위 객체 10,000개, 미리보기 블록 깊이 32단계. 관리 경로는 프로젝트 기준 상대 경로입니다.\nnormalize는 선택 사항입니다. 이미지를 확인한 뒤 review={vision_reviewed:true,inspected_sha256:...,rotation_degrees_xyz:[...],translation:[...],remove:[{object_id,reason}]}를 제공하세요. 생략한 변환은 항등 변환이며, translation은 소스 문서 단위를 사용합니다. 명시적으로 지정한 최상위 객체만 제거합니다. 블록 정의, 레이어 및 객체 이름은 그대로 유지됩니다.\nverify는 현재 준비된 3DM을 다시 열고 최종 이미지를 반환합니다. review={vision_reviewed:true,final_sha256:...,name:...,asset_id:...}를 포함한 두 번째 verify는 그 revision에 대한 검토를 기록합니다. 이후 register_drawing_asset에서 preparation_job=job_dir로 source_3dm을 게시합니다. 별도로 준비한 3DM은 직접 등록할 수 있습니다.\nstatus는 Rhino를 실행하지 않고 보고서를 다시 읽습니다. field_groups로 parts, previews, provenance 또는 all을 추가할 수 있습니다. offset/limit는 parts를 페이지로 나누며, include_ids=true는 편집 핸들을 표시합니다. 결과가 확인되지 않은 작업은 재실행이 아니라 상태 대조·정리가 필요합니다. 미리보기는 형상을 설명하고 고밀도 메시를 표본으로 표시합니다. 텍스처, PBR 채널 또는 객체가 의도한 정면을 검증하지는 않습니다.","register_drawing_asset":"3DM 모델을 등록하고, 하나의 버전 관리 게시 작업에서 평면/정면/우측 도면을 파생 생성합니다.\n\n표준 Rhino 단위를 사용하는 3DM의 절대 경로를 제공하세요. 단위, 원점, 블록 구조 및 레이어는 보존되며, AABB 입력 없이 치수를 mm로 측정합니다. 선택 인수 preparation_job은 파일 해시에 연결된 이미지 검토와 원본 소스를 첨부합니다. 이를 제공하지 않으면 등록은 시각적 검토를 했음을 확인하지 않습니다.\nnative 추출은 메시, Brep, extrusion, surface, SubD 및 포함된 중첩 블록을 최대 100 MB/250k 삼각형까지 지원합니다. 외부 블록 종속성은 별도 검증이 필요하며, 이를 알리지 않고 포함하거나 게시하지 않습니다.\n소스를 복사하고, mm 단위의 실물 크기 DXF, 1:50/1:100 SVG, 크기가 맞는 경우 A3 시트를 작성합니다. 이들은 메시 실루엣이며 은선이나 시공 상세가 아닙니다. SKP나 GLB와 같은 소스를 3DM으로 변환할 때 기존 모델 ID를 유지하세요. 다이어그램 ID는 별도로 유지됩니다.\n이미 등록된 ID에는 replace_existing=true가 필요합니다. 대체 작업은 정식 소스 경로를 유지하며, 그 경로를 공유하는 링크 인스턴스에 영향을 줄 수 있습니다. 이전 소스 바이트, 도면 및 manifest 백업은 보존됩니다. 기존 링크 에셋의 소스를 편집한 경우에는 refresh_asset을 사용하세요. 게시 시 이 MCP의 인덱스가 갱신되며, 다른 클라이언트는 다시 연결할 때 새로 읽습니다.","refresh_asset":"링크된 소스 경로를 유지하면서, 편집된 등록 3DM을 다시 측정하고 2D 표현을 재생성합니다.\n\n라이브러리 3DM의 편집 내용을 저장한 뒤 asset_id를 제공하세요. 치수, 소스 해시 및 도면 패키지를 함께 게시하고, 이전 패키지, manifest 백업 및 소스 revision 사본을 보존합니다. 소스 단위, 원점, 레이어 및 블록은 바뀌지 않습니다. 이 도구는 Rhino 인스턴스를 저장하거나 다시 불러오지 않습니다. 이후 Rhino에서 해당 인스턴스의 링크 소스를 갱신할 수 있습니다. 게시에는 성공했지만 인덱스 갱신에 실패했다면, 해당 revision은 이미 적용된 상태입니다.","get_asset_drawing":"등록된 3DM에 연결된 도면과 치수, 또는 기존 파일럿 패키지를 가져옵니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 dimensions, source, paths, drawing, metadata, audit 또는 all을 추가할 수 있습니다. 요청한 manifest/해석된 로직/스크립트는 기본 응답 데이터에 남습니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","generate_asset_drawing_views":"소스 메타데이터와 함께 평면/정면/우측 메시 실루엣, 실물 크기 DXF, 축척이 적용된 SVG 및 크기가 맞는 경우 A3 SVG 시트를 생성합니다. 새로운 로컬 drawing-runs 폴더에 씁니다.\n등록된 3DM의 asset_id 또는 사용자 지정 source_glb의 절대 경로 중 하나를 선택하세요. 사용자 지정 교환 파일에는 input_units가 반드시 필요하며 mm 또는 m을 사용합니다. up_axis는 y 또는 z입니다. Scales의 기본값은 [50,100]입니다.\n등록된 3DM은 native 형상 추출을 사용합니다. 사용자 지정 GLB에는 정적·비압축 삼각형이 필요합니다(최대 100 MB/250k 삼각형). 기존 generated ID는 먼저 3DM으로 변환해야 합니다. 등록된 소스를 편집한 뒤 저장된 도면과 측정값을 갱신해야 할 때는 refresh_asset을 사용하세요.\n은선 생성, 시공 방식 추론 또는 제품의 정면 인식은 하지 않습니다.\n선택적인 항목별 source_references에는 source_id/title/url/publisher/locator/accessed_on/relationship/used_for/terms_url이 필요합니다. 이들은 이 도면에 첨부된 참조를 설명하며, 과거 생성 작업에 사용한 입력을 소급하여 나타내는 것이 아닙니다.","audit_asset_drawing":"내보낸 파일과 소스 형상의 변경 여부를 검사합니다. 사용자 지정 패키지의 오래된 상태 여부를 검사하려면 현재 source_glb가 필요합니다. 라이브러리 에셋은 자동으로 찾아 연결합니다.","place_drawing_asset":"공통 모델/2D 에셋을 배치합니다. 3DM 모델은 활성 문서의 레이어를 사용하는 링크 블록으로 배치합니다.\n\nx/y/z와 반환된 bounds는 활성 문서 단위를 사용하며, scale은 무차원 값입니다. Rhino는 소스 3DM의 단위를 문서 단위로 변환합니다. 소스 원점이 배치 기준점입니다. 라이브러리 3DM을 편집한 뒤 저장하고 refresh_asset을 실행하세요. 소스는 바뀌었지만 메타데이터가 오래된 상태이면 needs_refresh를 반환합니다. 일반 문서 블록을 에셋으로 변환하지는 않습니다. 기존 비3DM 소스는 배치 전에 준비 및 등록이 필요합니다. 파일은 관리되는 모델 라이브러리에서 찾아 연결합니다.","search_asset_repository":"통합 모델/도면 아카이브를 검색합니다. kind: all, model 또는 element.\n\n안정적인 ID, 파일 사용 가능 여부, 치수 및 MCP 리소스 URI를 반환합니다.\nDrawing-ready는 패키지 파일이 현재 3DM과 대조 검증되었다는 뜻입니다. drawing_status는 missing, stale, invalid, source_requires_conversion을 구분합니다. SKP와 GLB 같은 비3DM 모델은 명시적으로 3DM으로 변환하기 전까지 소스 전용 상태로 남으며, 기존 2D 파일은 계속 사용할 수 있습니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 dimensions, source, paths, drawing, metadata, audit 또는 all을 추가할 수 있습니다. 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","list_diagram_assets":"사용 가능한 벡터 및 CAD 다이어그램 에셋(사람, 나무, 기호)을 나열합니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 dimensions, drawing, metadata, source, paths, audit 또는 all을 추가할 수 있습니다. 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","search_diagram_assets":"다이어그램 에셋 라이브러리를 검색합니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 dimensions, drawing, metadata, source, paths, audit 또는 all을 추가할 수 있습니다. 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","get_diagram_asset":"다이어그램 에셋 하나의 메타데이터를 반환합니다.\nID와 GUID는 기본적으로 생략됩니다. 필요하면 include_ids=true로 설정하세요. 입력으로 제공한 대상 ID는 응답에서 반복하지 않습니다.\nfield_groups로 dimensions, drawing, metadata, source, paths, audit 또는 all을 추가할 수 있습니다. 기본값은 요약입니다.\ninclude_ids는 핸들 표시를 별도로 활성화하고, audit는 타임스탬프 표시를 활성화합니다.","place_diagram_asset":"인덱스에 등록된 다이어그램 에셋(SVG, DWG, DXF)을 배치합니다."},"guideSnapshot":{"tools":{"list_drawing_assets":{"text":"Lists the common 3DM model and 2D collection, including legacy sources awaiting conversion.\n\nThe historical drawing tool names cover imported and generated models. Diagram assets remain separate. source_only/needs_conversion entries require prepare_drawing_asset and 3DM registration before placement; retain their asset_id.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds dimensions, source, paths, drawing, metadata, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/assets/tools-explain.md","sha256":"f4b6b7ab022ffa47fe7637d97b6cad64b069b94d307e0431bff40b4fc35a9ff2"}]},"search_drawing_assets":{"text":"Searches the common model/2D collection by text, category and measured dimensions.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds dimensions, source, paths, drawing, metadata, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/assets/tools-explain.md","sha256":"f4b6b7ab022ffa47fe7637d97b6cad64b069b94d307e0431bff40b4fc35a9ff2"}]},"get_drawing_asset":{"text":"Returns one model/2D asset's provenance, representations, availability and conversion or refresh status.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds dimensions, source, paths, drawing, metadata, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/assets/tools-explain.md","sha256":"f4b6b7ab022ffa47fe7637d97b6cad64b069b94d307e0431bff40b4fc35a9ff2"}]},"prepare_drawing_asset":{"text":"Prepare a source copy as a 3DM while preserving its assembly, layers, materials and origin.\n\ninspect requires source_file and returns measured top-level parts and images in the working Plan's artifact directory. Mesh interchange files (OBJ/STL/PLY/OFF/GLB/glTF) require input_units. 3DM units are preserved. Limits: 100 MB input, 10,000 top-level objects, 32 preview block levels. Managed paths are project-relative.\nnormalize is optional: after viewing the images, supply review={vision_reviewed:true,inspected_sha256:...,rotation_degrees_xyz:[...],translation:[...],remove:[{object_id,reason}]}. Omitted transforms are identity; translation uses source document units. Only named top-level objects are removed. Block definitions, layers and object names remain intact.\nverify reopens the current prepared 3DM and returns final images. A second verify with review={vision_reviewed:true,final_sha256:...,name:...,asset_id:...} records review of that revision; register_drawing_asset then publishes source_3dm with preparation_job=job_dir. An independently prepared 3DM can be registered directly.\nstatus rereads reports without executing Rhino. field_groups adds parts, previews, provenance or all; offset/limit pages parts, include_ids=true exposes edit handles. Unconfirmed operations require reconciliation rather than replay. Previews describe shape and sample dense meshes; they do not verify textures, PBR channels or the object's intended front.","source_refs":[{"path":"src/mcp/features/assets/tools-explain.md","sha256":"f4b6b7ab022ffa47fe7637d97b6cad64b069b94d307e0431bff40b4fc35a9ff2"}]},"register_drawing_asset":{"text":"Register a 3DM model and derive plan/front/right drawings in one versioned publication.\n\nSupply an absolute 3DM path with standard Rhino units. Units, origin, block structure and layers are preserved; dimensions are measured in mm without AABB input. preparation_job optionally attaches hash-bound image review and the original source. Without it, registration does not attest visual review.\nNative extraction supports meshes, Breps, extrusions, surfaces, SubD and embedded nested blocks up to 100 MB/250k triangles. External block dependencies require separate verification and are not silently embedded or published.\nCopies the source and writes full-size mm DXF, SVG at 1:50/1:100 and A3 sheets where they fit. These are mesh silhouettes, not hidden lines or construction details. Retain existing model IDs when converting sources such as SKP or GLB to 3DM; Diagram IDs remain separate.\nExisting registered IDs require replace_existing=true. A replacement retains the canonical source path and can affect linked instances sharing it; prior source bytes, drawings and manifest backups are retained. Source edits to an existing linked asset use refresh_asset. Publication refreshes this MCP's index; other clients reload on reconnect.","source_refs":[{"path":"src/mcp/features/assets/tools-explain.md","sha256":"f4b6b7ab022ffa47fe7637d97b6cad64b069b94d307e0431bff40b4fc35a9ff2"}]},"refresh_asset":{"text":"Remeasure an edited registered 3DM and regenerate its 2D representations while retaining the linked source path.\n\nSupply asset_id after saving edits to its library 3DM. Publishes dimensions, source hash and a drawing package together; preserves prior packages, manifest backups and a source revision copy. Source units, origin, layers and blocks remain unchanged. The tool does not save or reload Rhino instances; their linked source can then be updated in Rhino. If publication succeeded but index refresh failed, the revision is already applied.","source_refs":[{"path":"src/mcp/features/assets/tools-explain.md","sha256":"f4b6b7ab022ffa47fe7637d97b6cad64b069b94d307e0431bff40b4fc35a9ff2"}]},"get_asset_drawing":{"text":"Retrieve a registered 3DM's linked drawings and dimensions, or a legacy pilot package.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds dimensions, source, paths, drawing, metadata, audit, or all; the requested manifest/parsed logic/script remains in the default payload.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/assets/tools-explain.md","sha256":"f4b6b7ab022ffa47fe7637d97b6cad64b069b94d307e0431bff40b4fc35a9ff2"}]},"generate_asset_drawing_views":{"text":"Generate plan/front/right mesh silhouettes with source metadata, full-size DXF, scaled SVG and A3 SVG sheets where they fit. Writes a NEW local drawing-runs folder.\nChoose a registered 3DM asset_id OR an absolute custom source_glb path. Custom interchange files REQUIRE input_units mm or m; up_axis y or z. Scales default to [50,100].\nRegistered 3DMs use native geometry extraction; custom GLBs require static, uncompressed triangles (max 100 MB/250k triangles). Legacy generated IDs require 3DM conversion first. Use refresh_asset when an edited registered source needs its stored drawings and measurements updated.\nNo hidden lines, inferred construction or product-front recognition.\nOptional item-level source_references require source_id/title/url/publisher/locator/accessed_on/relationship/used_for/terms_url. They describe references attached to this drawing, never retroactive generation inputs.","source_refs":[{"path":"src/mcp/features/assets/tools-explain.md","sha256":"f4b6b7ab022ffa47fe7637d97b6cad64b069b94d307e0431bff40b4fc35a9ff2"}]},"audit_asset_drawing":{"text":"Check exported files and whether source geometry changed. Custom packages need the current source_glb to check staleness; library assets resolve automatically.","source_refs":[{"path":"src/mcp/features/assets/tools-explain.md","sha256":"f4b6b7ab022ffa47fe7637d97b6cad64b069b94d307e0431bff40b4fc35a9ff2"}]},"place_drawing_asset":{"text":"Places a common model/2D asset; 3DM models use a linked block with active document layers.\n\nx/y/z and returned bounds use active document units; scale is dimensionless. Rhino converts source 3DM units to document units. The source origin is the placement anchor. Edit the library 3DM, then refresh_asset after saving; a changed source with stale metadata returns needs_refresh. Ordinary document blocks are not converted to assets. Legacy non-3DM sources require preparation and registration before placement. Files resolve from the controlled model library.","source_refs":[{"path":"src/mcp/features/assets/tools-explain.md","sha256":"f4b6b7ab022ffa47fe7637d97b6cad64b069b94d307e0431bff40b4fc35a9ff2"}]},"search_asset_repository":{"text":"Search the unified model/drawing archive. kind: all, model or element.\n\nReturns stable IDs, file availability, dimensions and MCP resource URIs.\nDrawing-ready means the package files verify against the current 3DM. drawing_status distinguishes missing, stale, invalid and source_requires_conversion. Non-3DM models such as SKP and GLB remain source-only until explicitly converted to 3DM; existing 2D files remain usable.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds dimensions, source, paths, drawing, metadata, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/assets/tools-explain.md","sha256":"f4b6b7ab022ffa47fe7637d97b6cad64b069b94d307e0431bff40b4fc35a9ff2"}]},"capture_conditioning_pass":{"text":"Capture RGB + edge (line drawing) + depth frames along a camera path from the LIVE Rhino document, as conditioning for geometry-guided video generation (Wan VACE / ControlNet).\nDepth and edges are read from the model itself, not estimated, and every frame's camera is recorded so the generated video can be re-projected against the source geometry.\n\nThe shot JSON describes a camera path in model units, usually mm, using one of these forms.\n  {\"type\":\"orbit\",\"center\":[x,y,z],\"radius\":r,\"height\":z,\"frames\":81, \"start_deg\":0,\"end_deg\":90,\"lens\":35,\"target_height\":z} {\"type\":\"track\",\"cam0\":[x,y,z],\"cam1\":[..],\"target0\":[..],\"target1\":[..],\"frames\":81,\"lens\":35} {\"type\":\"keyframes\",\"keyframes\":[{\"camera\":[..],\"target\":[..],\"lens\":35}, ...],\"frames\":81} Use 4n+1 frames for Wan models (17, 33, 49, 65, 81). 81 frames = 5 s at 16 fps.\n\nWrites to out_dir: rgb/ edge/ depth/ (f0000.png ...), rgb.mp4 / edge.mp4 / depth.mp4 (when ffmpeg is available), camera.json (per-frame camera receipt, schema building0.camera/0.1), zrange.csv (per-frame depth range), doc.json, summary.json. Depth is grayscale with near = bright (Rhino's native convention, what Wan/ControlNet depth expects); set invert_depth for near = dark.\nCamera restoration is best effort after the pass. Returns the summary JSON.","source_refs":[{"path":"src/mcp/features/capture/tools-explain.md","sha256":"8c33b999fd028c880ffe312a2e1dbe95c9e083651c95825b1210ba3de541b42e"}]},"upsert_ontological_component":{"text":"Register an ontological_component meaning unit in a current Rhino group.\n\nobject_ids names DIRECT top-level owners (possibly [] when child_component_ids contains existing children). child_component_ids=None preserves existing children; [] explicitly detaches them. Each object has exactly one direct Component owner, and each child at most one parent in the same document without cycles. Current group members are truth; existing group membership and order are never repaired from DB records. Ordinary groups/blocks are not automatically meaning units.\nOmit object_ids or pass null to infer direct owners from rhino_group_id, or from an existing component_id's group binding. This requires component_group_inference=1 in addition to component_registry=2. Native reads and validates the actual group and declared child members in the same operation; child members retain their ownership. Missing groups are rejected, never created through inference. Explicit [] still means no direct owners. Name, Scene context and semantic child links are not inferred.\nEvery Component needs at least one existing Scene; omitting scene_ids preserves an existing association. The document-private registry writes no object management attributes. A unique exact ordinary group is adopted; ambiguous matches need its GUID. Geometry is not copied or duplicated. Replies are compact acknowledgements.\nFor an existing group, name must equal its current Rhino name; this tool refuses renames because Rhino group-table changes are not Undo-tracked. Registration Undo restores original object membership and removes meaning; an empty group-table entry may remain. A new group name collision refuses before mutation rather than creating an automatically suffixed group. Never repair membership or replay an undone registration automatically; review the intended Rhino structure first.\nexpected_model_path must match the active saved document. After an uncertain native result, inspect and sync_ontological_component; do not replay the mutation.","source_refs":[{"path":"src/mcp/features/components/tools-explain.md","sha256":"014d3b85978c32dd039d68d994528341eb7ee0f795b51eb62fb226837b2d0526"}]},"get_ontological_component":{"text":"Read an ontological_component summary or inspect its actual Rhino group.\n\nlive=True observes current members/name without changing Rhino or the ledger.\nCached reads contain group summaries only (geometry_available=false), never member IDs or per-object geometry.\nrecursive=false is the default; request true only for effective nested geometry.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds references, geometry, scope, audit, or all; default is summary.\naudit enables timestamps.","source_refs":[{"path":"src/mcp/features/components/tools-explain.md","sha256":"014d3b85978c32dd039d68d994528341eb7ee0f795b51eb62fb226837b2d0526"}]},"list_ontological_components":{"text":"List compact cached ontological_components, optionally scoped by scene_id.\nrecursive=false lists roots in that scope; true also includes registered children.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds references, geometry, scope, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/components/tools-explain.md","sha256":"014d3b85978c32dd039d68d994528341eb7ee0f795b51eb62fb226837b2d0526"}]},"sync_ontological_component":{"text":"Align DB records with actual groups in the current stable Rhino document once.\n\nUse one component_id, component_ids, one scene_id, or omit targets for the bound document (up to 64 registrations including descendants). Geometry, groups, membership/order, names and object attributes never change. Group/block editing or unknown isolation refuses alignment. Missing groups retain bindings/history for Rhino Undo without recreating geometry. Unrelated invalid bindings are reported individually. The compact reply gives checked/changed/unavailable counts and actionable problems; complete native snapshots remain internal. Repeated unchanged alignment creates no revision. Never replay an uncertain mutation.","source_refs":[{"path":"src/mcp/features/components/tools-explain.md","sha256":"014d3b85978c32dd039d68d994528341eb7ee0f795b51eb62fb226837b2d0526"}]},"remove_ontological_component":{"text":"Unregister ontological_component meaning while preserving Rhino geometry, ordinary groups and all existing object attributes. Rhino Undo/Redo restores or removes the document-private semantic binding.\n\nA root Component may have children; they become roots and keep their object ownership, registered Rhino groups and Scene links. A Component that still has its own parent must first be detached. Plan/Step references to the removed Component must be cleared first. No geometry is deleted or copied.","source_refs":[{"path":"src/mcp/features/components/tools-explain.md","sha256":"014d3b85978c32dd039d68d994528341eb7ee0f795b51eb62fb226837b2d0526"}]},"get_component_intersections":{"text":"Inspect actual solid overlaps among the current recursive members of 1-32 Components.\n\nResolves current group members and tests at most max_pairs (1-64) candidate pairs.\nClosed Breps, Extrusions and oriented manifold Meshes are supported; include_blocks adds transformed nested occurrences without changing definitions. Disjoint meshes are evaluated as detached geometry; no document split/join is needed. Mixed Brep/Mesh observations report their temporary mesh approximation.\nPass next_cursor with the same scope to continue; geometry/scope changes reject the cursor. Accumulate page results: pagination_complete ends enumeration, while complete describes whether this response alone establishes the whole scope.\nUnsupported or unknown work prevents a no-overlap conclusion.\nPair a.handle, b.handle and pair_state connect the result to preview or subtraction.\nPair handles and state are always returned. include_ids=true adds other IDs; supplied target IDs are not repeated.\nfield_groups adds references, geometry, scope, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/components/tools-explain.md","sha256":"014d3b85978c32dd039d68d994528341eb7ee0f795b51eb62fb226837b2d0526"}]},"show_object_intersection":{"text":"Preview one inspected overlap in the active model viewport without adding document geometry.\n\nPass a.handle, b.handle and pair_state from an intersection pair as a, b and pair_state. Names, layers and region measurements accompany the display. Changed geometry rejects stale references and clears an existing preview. Block occurrences can be shown. clear=true removes the preview without requiring handles or state.\nAn unknown overlap or a positive volume with no returned solid has no fabricated preview.","source_refs":[{"path":"src/mcp/features/components/tools-explain.md","sha256":"014d3b85978c32dd039d68d994528341eb7ee0f795b51eb62fb226837b2d0526"}]},"resolve_object_intersection":{"text":"Subtract the selected keep solid from the trim solid, preserving the trim object's ID and attributes.\n\nPass the returned occurrence handles and pair_state; keep remains unchanged.\nSupports document-level Brep/Extrusion pairs and closed Mesh pairs. Disjoint mesh results remain one Mesh object. Block/linked-source members, mixed Mesh/Brep edits, textured meshes, unpreservable geometry user data and results deleting the whole target or creating multiple Breps are reported without editing. A timeout is not rollback: inspect an unconfirmed result before deciding whether to try again.","source_refs":[{"path":"src/mcp/features/components/tools-explain.md","sha256":"014d3b85978c32dd039d68d994528341eb7ee0f795b51eb62fb226837b2d0526"}]},"focus_components":{"text":"Select, isolate and zoom to Components. See BASIC-INSTRUCTIONS.md for usage and behavior.","source_refs":[{"path":"src/mcp/features/components/tools-explain.md","sha256":"014d3b85978c32dd039d68d994528341eb7ee0f795b51eb62fb226837b2d0526"}]},"get_retrieval_status":{"text":"Returns compact diagnostics for the local structured retrieval system.\nThis is an intrinsically bounded diagnostic: fixed scalar counts/status and configured index names, not asset records.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.","source_refs":[{"path":"src/mcp/features/context/tools-explain.md","sha256":"26681afcd80c87cc497a6c869f404974d3971f466104b5c42e223cc15b08b954"}]},"get_rhino_context":{"text":"Read selected LIVE Rhino context on the UI thread. sections accepts document, selection, viewport, editor and display_modes; default is [\"document\"]. Unrequested sections are not collected.\nDocument/selection/viewport responses also contain compact editor mode/target/stable so isolation is immediately visible. Request editor for provider evidence and warnings; sections=[] skips editor observation for capability-only calls.\neditor reports mode (model/group/block/unknown), the known target and stable. Only a verified normal model is stable; active isolation, transitions and unsupported editor versions are unstable. Unknown target identity remains null, never inferred from selection.\ndisplay_modes lists at most 128 installed mode names/GUIDs. Shaded, Dark and CadWhite are choices only if actually installed; do not invent aliases for custom modes.\n\nIncludes document identity/path, units/tolerances, object/layer counts, a bounded selection summary and camera/display metadata. This query does not create layers, geometry, dimensions or an Undo record. Unavailable values are null with warnings.\nCounts and the current view are context, not a geometric or visibility validation.\nRequest only the context needed for the task. project_info already verifies the live document; do not repeat this call merely to check whether that document is live.\n\nArgs:\n    selection_limit: Maximum selected object summaries, from 0 to 200; total/truncated are still reported.\n    recursive: False by default: summarize complete top-level groups and block instances.\n        True expands nested members only to depth; partial groups remain object selections.\n    depth: 1..8, default 1. IDs are omitted unless include_ids=true.\n    include_image: False keeps the JSON-only response. True returns JSON text first and\n        the current PNG from the same native UI call. An image_error preserves available\n        context when capture fails. image_file reports the same PNG's managed file, or a\n        separate storage error without removing a successful image.\nReturns:\n    JSON with status, document, selection, viewport and warnings, or an explicit error.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.","source_refs":[{"path":"src/mcp/features/context/tools-explain.md","sha256":"26681afcd80c87cc497a6c869f404974d3971f466104b5c42e223cc15b08b954"}]},"analyze_block_reculviely":{"text":"Read nested block structure or resolve a block occurrence without modifying the document.\n\nRequests and responses are bounded to 256 KiB of UTF-8 JSON. Unknown, unsupported and truncated observations remain unverified. Requires Bridge block_analysis=1.\n\nArgs:\n    mode: outline traverses objects and nested definitions; resolve-block finds\n        candidates for the current editing context along an explicit occurrence path.\n    options: outline accepts ids or path, otherwise scope (selected/viewport/document),\n        depth and output budgets. field_groups is a nonempty list of summary, objects,\n        annotations and transforms; the default is a compact summary. include_geometry\n        and annotations explicitly request their details. Narrow IDs/path/depth after\n        truncation; max_items also bounds eligible visits (reason=max_visits).\n        resolve-block accepts only path: 1..65 GUIDs from the top-level instance inward.\n    expected_model_path: Usually omitted; the runtime supplies the bound document path.\n    include_ids: Include IDs when needed; supplied target IDs are not repeated.\nReturns:\n    JSON with status, mode, document identity/units/tolerance and data, or an explicit error.","source_refs":[{"path":"src/mcp/features/context/tools-explain.md","sha256":"26681afcd80c87cc497a6c869f404974d3971f466104b5c42e223cc15b08b954"}]},"get_rhino_objects":{"text":"\n읽기 전용으로 일반 모델 객체의 범위·속성·그룹·형상을 조회한다. `scope`는 현재 문서 가시 객체 `visible`(기본값), `selected`, 명시 GUID `ids`, 숨긴 객체를 포함한 `document` 중 선택한다. `object_ids`는 `ids`에서만 1..4096개를 받는다. 그룹이나 블록 내부로 자동 확장하지 않는다.\n\n`result_mode=\"summary\"`는 필터된 집합에서 실제 객체가 있는 레이어·객체 유형·형상 종류별 개수와 가시 수만 반환한다. `objects`(기본값)는 개별 객체를 반환한다. 필요한 정보가 정해져 있으면 `fields`로 골라 받는다. `fields=[\"id\"]`는 별도의 `include_ids` 설정 없이 GUID만 반환하며, `id`, `name`, `layer_path`, `object_type`, `geometry_kind`, `geometry_crc`, `visible`, `selected`, `hidden`, `locked`, `bounds`, `groups`, `user_dictionary`를 조합할 수 있다. 생략하면 기존 기본 정보를 반환하고 GUID는 `include_ids=true`일 때 포함한다. 요약·필드 선택·면 페이지와 유형 필터는 Bridge `object_observation>=2`가 필요하다.\n\n`filters` 조건은 AND로 결합한다. `layer_paths`는 전체 레이어 경로 1..64개의 정확한 일치, `object_types`는 조회된 `object_type` 이름 1..32개, `name_contains`는 이름 부분 문자열이며 대소문자를 구분하지 않는다. `user_dictionary`는 `{source: \"attributes\" 또는 \"geometry\", key: 키, any_of: [값들]}` 조건 배열이다. scalar 또는 배열의 원소와 정확히 비교하며 문자열을 임의로 분할하거나 층 정보를 추론하지 않는다. 메타데이터 필터를 건축 요소의 정체성과 동일시하지 않는다.\n\n예: `get_rhino_objects(scope=\"document\", filters={\"user_dictionary\":[{\"source\":\"attributes\",\"key\":\"Floor\",\"any_of\":[\"층A\"]}]}, fields=[\"id\",\"user_dictionary\"])`는 Floor의 scalar 값 또는 배열 원소가 `\"층A\"`인 객체를 조회한다. 층 이름은 실제 값으로 바꾼다. 키의 존재나 필터 일치는 실제 층 소속의 정확성을 보증하지 않는다. 배열 쓰기는 `get_modeling_guide(tool=\"execute_rhino_script\")`의 예를 따른다.\n\n기본 객체 응답은 문서 가시성·선택 여부·bbox·원본 `geometry_crc`·두 UserDictionary·그룹을 포함한다. 그룹의 `members_outside_match_count`와 문서의 `visible_outside_match_count`는 조회 범위 밖의 관계를 드러낸다. `visible`은 Rhino의 문서/레이어 가시성으로, 화면의 픽셀·가림·clipping 결과를 보증하지 않는다.\n\n`include_geometry=true`면 Brep의 유효성·solid·manifold·체적과 면 정보를 추가한다. 기하 정보도 `fields`의 `geometry_valid`, `solid`, `manifold`, `volume`, `face_count`, `faces`로 선택할 수 있으며 명시한 fields가 우선한다. `faces`에는 원본 ID·CRC와 `face_page`를 함께 반환한다. `face_limit`은 1..128, `face_offset`은 면 시작 위치다. 다음 면 페이지는 `scope=\"ids\"`, 대상 ID들과 이전 `geometry_crc`를 담은 `expected_geometry_crcs={GUID: CRC}`로 요청하며 형상이 바뀌면 거절한다. 면의 `face_edit_supported`는 사전 판별이며 실제 편집 성공 보장은 아니다.\n\n바깥 `offset`/`limit`(1..200), `next_offset`, `complete`는 객체 또는 요약행의 페이지이고, 각 객체의 `face_page`는 그 객체의 면 페이지다. 응답은 256 KiB, 문서 스캔은 100000개로 제한하며 초과하면 범위·필드·페이지 크기를 줄여 조회한다. 가시 범위와 그룹의 범위 밖 관계는 실제로 반환된 필드에 근거해 읽는다.\n\n명시적 `status=\"error\"`는 같은 상세 JSON을 유지하면서 MCP `isError=true`로 반환한다. 미완료 페이지를 오류나 전체 검증 완료로 바꾸지 않는다.\n","source_refs":[{"path":"src/mcp/features/context/tools-explain.md","sha256":"26681afcd80c87cc497a6c869f404974d3971f466104b5c42e223cc15b08b954"}]},"get_object_intersections":{"text":"\n명시 GUID 1..512개의 닫힌 Brep·Extrusion·방향이 정해진 manifold Mesh의 체적 교차를 읽기 전용으로 검사한다. Component 등록은 필요 없다. `max_pairs`(1..64)는 한 페이지의 후보쌍 계산 수다. `include_blocks=true`면 중첩 블록의 배치 변환을 적용한 구성원도 검사하며 정의는 수정하지 않는다. Disjoint Mesh는 문서에서 분해·재결합할 필요가 없다. Brep/Mesh 혼합 쌍은 임시 메싱에 의한 근사임을 결과에 표시한다.\n\n`next_cursor`를 같은 대상과 함께 전달하면 나머지 후보를 이어 검사한다. 형상·범위가 바뀌면 cursor가 거절된다. 페이지 결과를 합쳐 읽고, `pagination_complete`는 후보 열거의 끝, `complete`는 이번 응답만으로 전체 범위가 확인됐는지를 뜻한다. 미지원·판정 불명·미검사는 무교차가 아니다. 각 쌍의 `a.handle`, `b.handle`, `pair_state`는 ID 표시 옵션과 무관하게 반환되며 `show_object_intersection`·`resolve_object_intersection`의 입력으로 쓴다. 그룹은 대상을 자동 추가하지 않는다.\n\n명시적 `status=\"error\"`는 MCP `isError=true`와 일치시킨다. 정상 페이지의 `unknown`·`complete=false`·`next_cursor`는 그대로 보존한다.\n","source_refs":[{"path":"src/mcp/features/context/tools-explain.md","sha256":"26681afcd80c87cc497a6c869f404974d3971f466104b5c42e223cc15b08b954"}]},"capture_rhino_inspection":{"text":"\n지정한 여러 시점과 객체집합을 하나의 PNG에 담으며 Rhino 문서를 바꾸지 않는 캡처다. `views`는 1..16개 tile로, 각 항목은 `object_ids`, `direction`, `display_mode`, `label`을 받는다. tile별 명시 `object_ids`는 서로 다른 최상위 GUID 1..512개이며, 생략 또는 `[]`는 기존 문서 가시 범위다. 모든 tile에 같은 집합을 쓰면 최상위 `object_ids`(1..4096개)를 한 번 전달한다. 이 공통 집합의 `[]`는 오류이며 문서 전체로 확대하지 않는다. 공통 집합과 비어 있지 않은 tile별 집합은 혼용하지 않는다. 공통 집합에는 `inspection_shared_scope=1`이 필요하며 응답 `shared_scope`의 전체 GUID·총수와 tile의 `scope.shared_scope_ref`가 대응한다. 현재 선택·카메라·숨김 상태를 바꾸지 않는다.\n\n기본 카메라는 연결 문서의 활성 모델뷰다. `model_view_id`에 기존 모델 viewport GUID를 지정하면 활성 Layout·Detail을 유지한 채 그 모델뷰를 복사한다(`inspection_model_view=1` 필요). Layout이 활성인데 모델뷰를 지정하지 않으면 `layout_not_supported`다. `editor.mode=\"model\"`, `stable=true`가 필요하며 group/block 편집이나 미확인 상태는 `editing_context_unverified`다. Layout 용지는 `get_rhino_viewport_image(view=Layout_GUID)`로 캡처한다.\n\n`direction`은 `current`, `top`, `bottom`, `front`, `back`, `left`, `right`, `iso_ne`, `iso_nw`, `iso_se`, `iso_sw`, `below_ne`, `below_nw`, `below_se`, `below_sw` 중 선택한다. 필요한 시점만 요청한다. `display_mode` 생략 시 현재 모드를 쓰며, 이름이 중복되면 `get_rhino_context(sections=[\"display_modes\"], include_ids=true)`에서 확인한 GUID를 사용한다. 각 tile의 메타데이터와 오류를 읽고 이미지의 실제 범위를 확인한다.\n\n`width`/`height`는 tile 픽셀 크기(128..2048, 기본 640×480), `columns`는 배치 열 수다. 합계 16M 픽셀과 PNG 4 MiB를 넘으면 크기나 tile 수를 줄인다. 명시 필터에서 블록 인스턴스·블록 내부 객체는 지원하지 않으며 해당 tile 오류로 보고한다. 필터를 생략한 전체 범위에서는 블록을 원래대로 표시한다.\n\n최상위 `complete`는 요청한 tile의 캡처 성공 여부, `scope.complete`는 요청 GUID가 문서 가시 범위에 포함됐는지를 뜻한다. 실제 픽셀 노출이나 설계 적합성을 보증하지 않는다. 부분 성공이면 정상 이미지와 tile별 오류를 함께 읽고, 조회 preview나 일부 GUID만 캡처한 결과를 전체 범위로 해석하지 않는다.\n\nPNG는 이미지 content를 유지하면서 관리된 파일로도 저장한다. `image_file`은 상대 경로·bytes·SHA256·plan/connection 보존 수명 또는 저장 실패를 별도로 반환한다. 요청은 256 KiB, 이미지 외 메타데이터는 512 KiB 이내이며 상한 초과를 조용히 잘라내지 않는다.\n","source_refs":[{"path":"src/mcp/features/context/tools-explain.md","sha256":"26681afcd80c87cc497a6c869f404974d3971f466104b5c42e223cc15b08b954"}]},"get_rhino_viewport_image":{"text":"Return a Rhino viewport, Named View or Layout as a PNG image, without activating it.\n\nOmit view to capture the current view. Pass view=\"a\" to list viewports, named_views, and layouts, with only name and guid for each entry. Then pass the desired GUID as view.\nNames need not be unique. Named Views render the saved camera off screen using Shaded by default; they never replace the visible viewport. Layouts capture the paper area, including its details, not the surrounding workspace. A current Layout also captures its paper, even when a detail is active.\n\nFor capture resolution and Layout print appearance, follow [BASIC-INSTRUCTIONS.md](../../BASIC-INSTRUCTIONS.md#get_rhino_viewport_image-화면으로-관찰하기).\nThe validated PNG is saved under the selected Plan's artifacts/captures, or connection-owned scratch when no Plan is selected. image_file reports a project-relative path, bytes, SHA256 and lifetime; storage failure leaves the image available. Capture does not change camera, selection or Undo state, or prove geometric correctness. A failed or oversized image is an error, never a silently resized image.\n\nArgs:\n    view: Empty for current view, \"a\" for the grouped list, or a listed GUID.\n    scale_percent: Integer from 1 to 100; default 75. Choose sufficient resolution for the intended reading. Controls pixels, not a Layout Detail's drawing scale.\n    width, height: Optional explicit output pixels, both 128..2048 with scale_percent=100.\n        Supported for model view/Named View/group/block with capture_output_size=1;\n        the live window is not resized. Layouts reject these options and retain 144 dpi.\n    include_usage: False returns the image and file metadata. True also returns dimensions and an\n        illustrative token estimate (32px patches x 1.2, without provider resizing).\n        Actual usage depends on the client's model and detail setting, which MCP\n        does not supply. PNG compression reduces bytes, not pixel-token counts.\n    display_mode: Installed display mode name or GUID. Empty preserves the current\n        model viewport mode; Named View/group/block captures default to Shaded. List\n        available modes with get_rhino_context(sections=[\"display_modes\"], include_ids=true).\n        Realtime rendering modes such as Raytraced are rejected; this tool does not\n        wait for asynchronous rendering to finish.\n    labels: True by default. Transient pixels show top-level group name/GUID, block\n        instance name/GUID and ungrouped object GUID, without creating document objects.\n        At most 200 labels; explicit smaller targets/depth narrow a truncated overlay.\n    depth: 1..8, default 1; higher values expose nested entity labels.\n    target_kind: view (default), group or block. group/block frame target bounds in a\n        detached viewport and label that target; surrounding geometry stays visible.\n    target_id: Persistent group GUID or block instance GUID for group/block; leave view\n        empty. Definition GUIDs are not block instance targets.\n    Layouts retain each detail's mode, reject a mode override, and explicitly warn that\n        detail labels are unavailable; capture a Named View/model viewport for labels.\nReturns:\n    One MCP PNG image and image_file metadata, optional warnings/usage, or the grouped name/GUID list for view=\"a\".\n    Images are limited to 16 megapixels and 4 MiB. PNG files are additive writes, so capture-capable tools do not advertise MCP readOnlyHint; the Rhino document remains unchanged.","source_refs":[{"path":"src/mcp/features/context/tools-explain.md","sha256":"26681afcd80c87cc497a6c869f404974d3971f466104b5c42e223cc15b08b954"}]},"list_diagram_assets":{"text":"Lists available vector and CAD diagram assets (people, trees, symbols).\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds dimensions, drawing, metadata, source, paths, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/diagrams/tools-explain.md","sha256":"1272325e94654759dbf85adc0ab5518dc5fedb859ff7f70b63da4f8fae0e7922"}]},"search_diagram_assets":{"text":"Searches the diagram asset library.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds dimensions, drawing, metadata, source, paths, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/diagrams/tools-explain.md","sha256":"1272325e94654759dbf85adc0ab5518dc5fedb859ff7f70b63da4f8fae0e7922"}]},"get_diagram_asset":{"text":"Returns one diagram asset's metadata.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds dimensions, drawing, metadata, source, paths, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/diagrams/tools-explain.md","sha256":"1272325e94654759dbf85adc0ab5518dc5fedb859ff7f70b63da4f8fae0e7922"}]},"place_diagram_asset":{"text":"Places an indexed diagram asset (SVG, DWG, DXF).","source_refs":[{"path":"src/mcp/features/diagrams/tools-explain.md","sha256":"1272325e94654759dbf85adc0ab5518dc5fedb859ff7f70b63da4f8fae0e7922"}]},"list_drawing_recipes":{"text":"Lists compact audited layer, lineweight, projection, and export recipes.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds scales, parameters, source, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/drawings/tools-explain.md","sha256":"9870382880fa62de011579b6b609d850b8ba474b11803b0fe4a212a225d6d957"}]},"get_drawing_recipe":{"text":"Returns one audited drawing recipe summary by default. Request field_groups=[\"parameters\"] for layer/style and review-preparation settings.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds scales, parameters, source, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/drawings/tools-explain.md","sha256":"9870382880fa62de011579b6b609d850b8ba474b11803b0fe4a212a225d6d957"}]},"apply_drawing_style":{"text":"Creates or updates the Rhino layer hierarchy, plot weights, colours, and linetypes defined by an audited drawing recipe.\nThe A4 plan/section recipe can return an unexecuted rhinocode CLI command template for print-review preparation on the same connected document; this tool does not inspect or change PrintDisplay.\nRecipes may specify linetype_segments with positive lengths and explicit is_solid values. Conflicting named patterns or malformed explicit segments are rejected before layer changes; matching named patterns are reused.\nRecipes without segments retain their existing name-based behaviour.","source_refs":[{"path":"src/mcp/features/drawings/tools-explain.md","sha256":"9870382880fa62de011579b6b609d850b8ba474b11803b0fe4a212a225d6d957"}]},"import_drawing_hatch_patterns":{"text":"Imports the AutoCAD-style .pat hatch definitions of an indexed drawing asset into the active Rhino document's hatch pattern table.\n\nThe tool accepts only .pat files resolved from the controlled asset/drawing/DrawingAssetfiles manifest, mirroring the placement tools' security boundary.","source_refs":[{"path":"src/mcp/features/drawings/tools-explain.md","sha256":"9870382880fa62de011579b6b609d850b8ba474b11803b0fe4a212a225d6d957"}]},"check_egress":{"text":"Checks a floor plate's means of egress against the construction library's egress rules (BCI A.10-A.13 framework + IBC-typical numeric factors - always verify against the governing code; the response repeats this).\n\nCall AFTER laying out cores/exits and BEFORE detailing: it verifies exit count, exit separation, egress width, travel distances and dead ends in one pass, and names the failing requirement so the layout can be fixed (add an exit, move a core, widen a stair) instead of guessed at.\n\nArgs:\n    plate_bounds_mm: Floor plate [min_x, min_y, max_x, max_y] in mm\n        (sets gross area and the diagonal used for exit separation).\n    exits: One entry per exit (stair door or exterior exit door):\n        {\"name\": str, \"x_mm\": float, \"y_mm\": float, \"width_mm\": float}.\n        Positions are the door centers; width is the clear egress width.\n    occupancy: Occupant-load key: business, mercantile, assembly_\n        unconcentrated, classroom, residential, storage.\n    stories: Stories served. Above 1, at least two exits are required\n        and exit width demand uses the stair factor (7.6 mm/occupant)\n        instead of the door factor (5.1).\n    sprinklered: Sprinklered throughout (affects separation fraction,\n        travel-distance and dead-end limits).\n    net_area_m2: Override the occupied area; 0 uses the gross plate area.\n    travel_distances_m: Measured worst-case travel distances (e.g. from\n        drawn egress paths); empty skips the travel check.\n    dead_end_m: Longest dead-end corridor in metres; 0 skips the check.\nReturns:\n    JSON: {passed, occupant_load, checks: [{check, required, provided,\n    passed, basis}], warnings, source_note}.","source_refs":[{"path":"src/mcp/features/egress/tools-explain.md","sha256":"2f583e7b4d4b3c5b5db1f31a0f1acb99c00860263364bd001bc7f07166d5c640"}]},"export_asset_contract":{"text":"Exports Rhino objects as a portable Almond asset: a GLB plus an asset contract (.almond.json) carrying what the file cannot.\n\nThe contract records real dimensions in mm, the anchor and support plane, clearances, and the Almond material_id of every object - so another application (Blender, Unreal, another Rhino) can restore full meaning even though glTF drops per-object metadata. Pair with import_asset_contract on the receiving side.\n\nArgs:\n    guids: Rhino object GUIDs to export (from execute_rhino_script).\n    asset_id: Stable id, e.g. \"canopy-pavilion-01\" (letters, digits, . _ -).\n    name: Human-readable name; defaults to asset_id.\n    output_dir: Destination folder. Default: \u003cuser data dir>/exchange.\nReturns:\n    JSON with the glb path, contract path, and recorded dimensions.","source_refs":[{"path":"src/mcp/features/exchange/tools-explain.md","sha256":"f1298ff006ea7e6d4bfdfadaa2b44fe90fd246bd6e5211515a23a9db229071e1"}]},"import_asset_contract":{"text":"Imports an Almond asset contract (from Blender, Unreal, or another Rhino) into the open Rhino document, restoring everything the file format drops.\n\nRuns the full receive sequence: import the GLB, collapse the duplicate materials glTF creates, restore canonical PBR values from the Almond material library (glTF round trips shift base colours), re-attach the almond:* metadata keyed off the surviving material name, place the asset at the requested point using the contract's anchor, and verify the measured size against the contract's recorded dimensions.\n\nArgs:\n    contract_path: Path to a .almond.json contract file.\n    x_mm, y_mm, z_mm: Placement point in millimetres (contract anchor).\n    rotation_degrees: Rotation about world Z.\n    layer: Destination layer, created if absent.\nReturns:\n    JSON with counts restored/deduplicated and a dimension_check comparing\n    what landed against the contract.","source_refs":[{"path":"src/mcp/features/exchange/tools-explain.md","sha256":"f1298ff006ea7e6d4bfdfadaa2b44fe90fd246bd6e5211515a23a9db229071e1"}]},"get_blender_helper_script":{"text":"Returns Python to run inside Blender (via blender-mcp's execute_code) so Blender participates in the Almond workflow without a dedicated bridge.\n\nActions:\n    \"export\"    - export the current Blender selection as an Almond asset contract + GLB (measured from evaluated mesh data, because Blender inflates curve bounding boxes).\n    \"materials\" - create Almond library materials in Blender (sRGB values converted to linear) and assign them to named objects, tagging both with almond:* properties.\n\nArgs:\n    action: \"export\" or \"materials\".\n    asset_id, name, output_dir: for \"export\" (output_dir defaults to the\n        Almond exchange folder).\n    material_id, object_names: for \"materials\".\nReturns:\n    JSON with a \"script\" field to pass to Blender's execute_code.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds notes, audit, or all; the requested manifest/parsed logic/script remains in the default payload.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/exchange/tools-explain.md","sha256":"f1298ff006ea7e6d4bfdfadaa2b44fe90fd246bd6e5211515a23a9db229071e1"}]},"list_library":{"text":"Lists all available physics logic archetypes in the Grasshopper library.\nUse this tool first to discover what logic IDs are available before calling get_logic_by_id.\n\nReturns:\n    JSON list of logic IDs available (e.g., [\"catenary\", \"bending\", \"01_simplebeam\"]).\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds ports, definition, source, paths, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/grasshopper/tools-explain.md","sha256":"d45f5b458aab16fe947ec09da8957367e68f414b4d64942e508af642c658a0c5"}]},"get_logic_by_id":{"text":"Retrieves parsed physics context for a specific Kangaroo2 or Karamba3D archetype.\nReturns detected components, descriptions, and metadata extracted from the Grasshopper binary file.\n\nArgs:\n    logic_id: The filename (without extension) of the Grasshopper file.\n              Use list_library() first to see available IDs.\n              Examples: catenary, bending, 01_simplebeam\nReturns:\n    JSON string with detected physics components and context, or error.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds ports, definition, source, paths, audit, or all; the requested manifest/parsed logic/script remains in the default payload.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/grasshopper/tools-explain.md","sha256":"d45f5b458aab16fe947ec09da8957367e68f414b4d64942e508af642c658a0c5"}]},"list_capsules":{"text":"Lists Grasshopper capsules: GH definitions with a typed, audited input/output contract that can be executed via run_gh_definition.\n\nCall this FIRST to discover what capsules exist before calling run_gh_definition.\nEach entry is a compact card with capsule_id, capability, structure_type, audited flag, and the reserved ALMOND_IN_* / ALMOND_OUT_* port names. Only capsules with audited=true can actually run; audited=false capsules are retrieval context only (read them via get_logic_by_id instead).\n\nArgs:\n    capability: Optional filter: \"analyze\", \"generate\", \"form_find\", or \"aggregate\".\n    audited_only: When true, list only capsules that run_gh_definition will accept.\nReturns:\n    JSON with total and a list of compact capsule cards.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds ports, definition, source, paths, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/grasshopper/tools-explain.md","sha256":"d45f5b458aab16fe947ec09da8957367e68f414b4d64942e508af642c658a0c5"}]},"run_gh_definition":{"text":"Runs an audited Grasshopper capsule (GH definition + typed contract) through the Rhino bridge and returns its declared outputs.\n\nWorkflow: call list_capsules() first to pick a capsule_id and see its input/ output port names. Create any geometry with execute_rhino_script, then pass the returned GUIDs here. Inputs are validated client-side against the capsule manifest before anything is sent to Rhino, so errors from this tool name the exact port at fault.\n\nInput value forms (keyed by the exact ALMOND_IN_* port name):\n  - Geometry ports (point/curve/mesh/brep and their [] list forms):\n    {\"guids\": [\"\u003crhino-object-guid>\", ...]} referencing objects already in the Rhino document.\n  - number / integer / string / bool ports: the raw JSON value.\n  - number[] / integer[] / string[] ports: a flat JSON list.\nUnits are declared per port in the manifest — supply values in those units; nothing is guessed or auto-converted client-side. Optional inputs may be omitted; the capsule's declared defaults then apply inside the definition.\n\nOnly audited capsules run. audited=false means the GHX has no verified ALMOND_IN_*/ALMOND_OUT_* harness params yet; this tool refuses it (see asset/capsules/AUTHORING.md for how to harness one).\n\nThe response's \"outputs\" object is keyed by ALMOND_OUT_* names; interpret each value using the manifest's semantics field (e.g. max_nodal_displacement, per_element_utilization) and declared units. The response also carries analysis_method (api|template|rule_based), confidence (high|medium|low), warnings, and baked_guids — report method and confidence honestly; rule_based/low means an estimate, not FEA.\n\nArgs:\n    capsule_id: Stable capsule identifier from list_capsules (e.g. \"karamba_beam_v1\").\n    inputs: Object mapping ALMOND_IN_* port names to values (forms above).\n    seed: Optional integer seed for stochastic definitions; omit for deterministic ones.\n    timeout_s: Solver budget in seconds (default 60, max 600).\nReturns:\n    JSON with status, capsule_id, outputs, baked_guids, analysis_method,\n    confidence, warnings, and error — or a validation error naming the\n    offending input and the valid port names.","source_refs":[{"path":"src/mcp/features/grasshopper/tools-explain.md","sha256":"d45f5b458aab16fe947ec09da8957367e68f414b4d64942e508af642c658a0c5"}]},"get_modeling_guide":{"text":"Read BASIC before modeling, or fetch one tool's detailed usage instructions.\n\nOmit tool to read BASIC-INSTRUCTIONS.md and available public tool names at first use.\nPass an exact tool name, for example tool=\"assign_material\", for its full explanation.\nThis reads static instructions without executing the named tool. Reuse instructions already read for the same guide_version. External connector management tools use connection instructions. BASIC links reference material directly.\n\nArgs:\n    tool: Exact public Almond tool name; empty returns BASIC and available tool names.","source_refs":[{"path":"src/mcp/features/guidance/tools-explain.md","sha256":"f8b048a01dd8e324a5e4596fbf3f1dfad8a9875965980758203926e908df6cf8"}]},"get_construction_guidance":{"text":"Look up construction systems, their constituent elements and assembly guidance.\nParameters are distilled from Ching's Building Construction Illustrated (4th ed.): per-system span ranges, depth rules of thumb (depth = span/N), member spacing, element roles, and assembly notes.\n\nSpan/depth rules support preliminary sizing; they do not establish a project's structural adequacy. Each system names its structural_material (validate_structure vocabulary) and render_material_ids (assign_material vocabulary).\n\nArgs:\n    query: Free-text filter (e.g. \"glulam\", \"longspan\", \"bearing wall\").\n    category: \"floor\", \"wall\", \"roof\", \"foundation\" (empty = all).\n    material: \"Wood\", \"Steel\", \"Concrete\" - validate_structure names.\n    structure_type: validate_structure type (\"beam\", \"truss\", \"shell\",\n        \"frame\", \"canopy\", \"gridshell\", \"membrane\", \"highrise\").\n    span_m: If > 0, each returned system reports fits_span and\n        suggested member depths from its span-ratio rules.\n    include_reference_data: Also return occupancy live loads (kPa) and\n        material densities (kg/m3) for choosing load_kn inputs.\nReturns:\n    JSON: {total, systems: [...], reference?} - for wall systems\n    span_range_m is the unsupported height range (span_axis \"vertical\").\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds rules, narrative, source, metadata, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/guidance/tools-explain.md","sha256":"f8b048a01dd8e324a5e4596fbf3f1dfad8a9875965980758203926e908df6cf8"}]},"get_typology_narrative":{"text":"Architectural typology narratives for project storytelling - precedents, eras, and urban roles distilled from Ching, Jarzombek & Prakash's A Global History of Architecture, with page references (gha_ref).\n\nEntries provide historical context and precedent relationships. They contain no project-specific basis for member sizing, loads or structural capacity.\n\nArgs:\n    query: Free text (e.g. \"courtyard\", \"skyscraper\", \"timber hall\").\n    construction_system: Filter to entries related to a construction\n        library system_id (e.g. \"steel-column-frame\").\n    structure_type: Filter by validate_structure type (\"shell\",\n        \"truss\", \"frame\", \"membrane\", ...).\n    limit: Maximum entries returned (default 5).\nReturns:\n    JSON: {total, entries: [{typology_id, name, era, region, narrative,\n    precedents, related_construction_systems, urban_role, gha_ref,\n    tags}], source}.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds rules, narrative, source, metadata, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/guidance/tools-explain.md","sha256":"f8b048a01dd8e324a5e4596fbf3f1dfad8a9875965980758203926e908df6cf8"}]},"search_detail_sources":{"text":"Search six curated free architectural source directories offline.\nMatches titles, tags and formats; an empty query lists all sources. Korean terms are preserved and selected catalogue terms expand to English. Results include query_terms, expanded_terms and each source's matched_terms.\nPrefer English search terms unless Korean sources are needed.\nReturns links, formats and rights notes; no external content is fetched.\nResults are research candidates, not attributed inputs or certified details.\nDETAIL subscription access is not required.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds rules, narrative, source, metadata, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/guidance/tools-explain.md","sha256":"f8b048a01dd8e324a5e4596fbf3f1dfad8a9875965980758203926e908df6cf8"}]},"get_modeling_policy":{"text":"Return JSON-defined object/group metadata keys and material-layer naming rules.\n\nNames are free. Do not automatically write Almond management UserStrings on objects.\nExisting keys describe compatibility data, not a checklist to fill. Preserve existing user metadata and asset provenance; ordinary naming, layer and material properties are independent of management UserStrings.","source_refs":[{"path":"src/mcp/features/modeling/tools-explain.md","sha256":"0ec8c4a7070dd1c23ec1e5f4e9cab18d235548367894dfe590ba47ebba143ad9"}]},"execute_rhino_script":{"text":"Execute source or a complete macro in the bound Rhino through official RhinoCode.\n\nPython 3 is the default. Read get_modeling_guide(tool=\"execute_rhino_script\") for this contract and the bundled rhino3d-scripts skill, API maps and loading guidance.\nNo separate skill installation is required. The wrapper binds doc/scriptcontext, owns Undo and redraw, and restores cwd/environment even after an exception.\nUse document tolerance, explicit object IDs and validated geometry before replacing or deleting originals. Batch loops belong in synchronous source with per-item results.\n\npython/python2 assign JSON-compatible values directly, for example result = {\"changed\": 2}.\nUse dict/list for structured results; json.dumps returns text instead. The first response includes up to 20 items per array or top-level list field, or 4096 characters for a top-level string; remaining data is paged.\ncsharp/csharp-script are C# statement bodies with doc and result_json, not the former class/Run format. command accepts one fully specified macro without adding !, Pause or dialogs. All modes require StartScriptServer in the bound Rhino; there is no legacy Bridge executor fallback.\nFixed queries and audited internal recipes keep their existing native paths.\n\nproject_root is absolute; artifact_dir is relative to it. General scripts run with project root as cwd. Use execute_project_python for the selected Plan folder as cwd.\nDo not assume worker-venv packages exist in Rhino's embedded Python. Return only measurements needed for the decision, collecting related work in one script.\n\nA waiting response includes request_id. Use get_rhino_execution when that execution is still pending, more result pages are needed, or output/diagnostics remain to be checked.\nA completed response with the needed result requires no follow-up read. CLI exit, print output and a timeout are not completion evidence. A completed exception may have partial changes; result_error does not roll them back. Never automatically retry uncertain work, open a different document or schedule detached document edits.\n\nWhen Floor metadata is requested, use the object's actual level labels, not the Scene's full level range. For multiple levels, write a typed string array; for one level, a string. This Python example uses an already identified `object_id` and nonempty `floor_names` list, preserving unrelated attributes:\n\n```python\nimport System\nobj = doc.Objects.FindId(System.Guid(object_id))\nif obj is None or obj.IsReference or obj.IsLocked:\n    raise ValueError(\"Floor target must be an editable local object\")\nattrs = obj.Attributes.Duplicate()\nvalue = floor_names[0] if len(floor_names) == 1 else System.Array[System.String](floor_names)\nattrs.UserDictionary.Set(\"Floor\", value)\nif not doc.Objects.ModifyAttributes(obj.Id, attrs, True):\n    raise RuntimeError(\"Floor update failed\")\nstored = doc.Objects.FindId(obj.Id).Attributes.UserDictionary[\"Floor\"]\nresult = {\"object_id\": str(obj.Id), \"Floor\": str(stored) if len(floor_names) == 1 else list(stored)}\n```\n\nArgs:\n    script: Synchronous Python source, C# statement body or complete command macro.\n    language: python (default Python 3), python2, csharp, csharp-script or command; every mode uses official RhinoCode.\n    timeout_seconds: Integer 1-600, default 60; waiting limit only. Retrieve the same request after timeout.\nReturns:\n    JSON execution outcome and result with a recoverable request_id; pending or failed calls preserve completion evidence.","source_refs":[{"path":"src/mcp/features/modeling/tools-explain.md","sha256":"0ec8c4a7070dd1c23ec1e5f4e9cab18d235548367894dfe590ba47ebba143ad9"},{"path":"src/mcp/features/modeling/rhino3d-scripts/INTEGRATION.md","sha256":"737243612cc0a71b910e5ca54bda68458a770549369a1bade39fe42e7213441d"},{"path":"src/mcp/features/modeling/rhino3d-scripts/SKILL.md","sha256":"6618e636ac83c50a034a477e2ce6b2c0b2f4d8a0fc9dfd4ea0d676a8d32c4c80"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/macros-and-loading.md","sha256":"14a0822d61d74c34694b753aa727b08b6802aaaf89ff4d40e65746e784b595cd"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/rhinocommon-map.md","sha256":"e9baa208601cd5edfa824aa576d314bdf19d48b9e29b8e5e636bc3a2867094e0"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/rhinoscriptsyntax-cheatsheet.md","sha256":"8abd85be2b9e915ebeeec5538d62043e676f59c74d34fb438021a6f852e3eac0"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/vbscript-quirks.md","sha256":"0a9163940db6ac3618ce2ab6df8ae845b802ac303862b6b38375fd41a4536364"}],"scripting_skill":{"name":"rhino3d-scripts","sources":[{"path":"src/mcp/features/modeling/rhino3d-scripts/INTEGRATION.md","sha256":"737243612cc0a71b910e5ca54bda68458a770549369a1bade39fe42e7213441d","text":"# Almond에서 사용하는 Rhino 3D Scripting Skill\n\n이 묶음은 사용자가 설치한 `rhino3d-scripts`의 본문·네 참고자료·MIT LICENSE를 그대로 포함한다. `get_modeling_guide(tool=\"execute_rhino_script\")` 또는 `get_modeling_guide(tool=\"execute_project_python\")`은 이 자료를 같은 guide snapshot으로 반환한다. 개인 skill 폴더나 네트워크 조회는 실행 시 필요하지 않다.\n\n원본: https://github.com/github/awesome-copilot/tree/main/skills/rhino3d-scripts 공식 실행 명세: https://developer.rhino3d.com/guides/scripting/advanced-cli/ 포함본: 2026-10-30 사용자 로컬 설치본. upstream 원본과 동일한 revision이라는 뜻은 아니다.\n\n## 이 도구에 적용하는 실행 방식\n\n- 새 코드는 Python 3이 기본이다. `doc`은 연결된 실제 RhinoDoc이며 `scriptcontext.doc`도 같은 문서다. Python은 `result = {\"changed\": 2}`처럼 JSON 호환 값을 직접 할당한다.\n  구조화 결과는 dict/list로 반환하고, C# statement body는 JSON 문자열 `result_json`에 결과를 넣는다. 첫 결과의 행·문자 예산과 후속 조회 조건은 위 실행 도구 설명을 따른다.\n  `csharp`와 `csharp-script`는 같은 ScriptEditor C# 경로다.\n  이전 `class Script { public static ... Run(RhinoDoc doc) }` 공개 실행 형식은 사용하지 않는다.\n- 두 공개 도구 모두 공식 RhinoCode → ScriptEditor에서 실행한다. 프로젝트 Python의 cwd는 선택한 Plan 산출물 폴더, 일반 Rhino 스크립트의 cwd는 프로젝트 루트다.\n  `project_root`는 절대경로, `artifact_dir`는 프로젝트 상대경로다. 필요하면 `os.path.join(project_root, artifact_dir, \"result.json\")`으로 출력한다.\n  `ALMOND_PROJECT_ROOT`, `ALMOND_MODEL_PATH`, `ALMOND_ARTIFACT_DIR`은 실행 중에만 바인딩된다.\n- 외부 MCP venv의 Python 패키지가 Rhino Python에 설치되어 있다고 가정하지 않는다.\n  누락된 의존성을 자동 설치하지 않는다. RhinoCommon은 Rhino 내장 Python에서 사용한다.\n- 실행기는 `list --json`에서 PID·프로세스 시작 시각·저장 문서 경로에 대응하는 exact `pipeId`를 선택한다. Almond A–J 슬롯 문자는 RhinoCode instance ID가 아니다.\n- 실행 전과 Rhino UI thread 진입 후에 대상 문서를 확인한다. Undo record와 redraw는 실행기가 관리하고 `finally`에서 cwd·환경·scriptcontext·redraw를 복구한다.\n  코드가 추가 Undo record를 만들거나 별도 thread에서 문서를 수정하지 않는다.\n- 반환의 `completed`와 결과를 확인한다. 대기 중이거나 필요한 결과 페이지·로그가 남으면 같은 `request_id`를 조회한다. CLI 프로세스 종료만으로 완료를 판정하지 않으며, timeout은 대기 한도이므로 코드를 종료하거나 반복하지 않는다.\n- 스킬의 대화형 선택 예제는 명시 GUID 입력으로 바꿔 사용한다. `rs.GetObject`, `Pause`, dialog는 자동 실행에 넣지 않는다. macro에 `!`를 자동 추가하지 않는다. 스킬의 일반 매크로 권고보다 기존 사용자 명령 보존과 이 연결의 완료 계약을 우선한다.\n- 원문에 있는 ScriptEditor의 VBScript 지원 설명은 이 실행기에 적용하지 않는다.\n  VBScript는 별도 legacy LoadScript/RunScript 표면이며 공개 RhinoCode 언어로 제공하지 않는다.\n  Python `rs.Command`는 한 번에 한 명령을 사용하며 `! ` 조합을 넣지 않는다.\n- 문서 공차 `doc.ModelAbsoluteTolerance`, GUID 변환, 실제 Geometry 타입, `Guid.Empty` 확인은 참고자료를 따른다. 긴 반복은 `Rhino.RhinoApp.EscapeKeyPressed`를 확인한다.\n  Boolean 결과의 null/빈 배열/유효닫힘 여부와 체적을 구분하고, 결과 검증 전 원본을 Replace/Delete하지 않는다. 유효닫힘만으로 중첩 제거를 성공 판정하지 않는다.\n\n## 내부 호출과 공개 도구의 경계\n\n재료·레이어 설정, 자산 배치·교환, 화면 capture의 감사된 C# recipe는 공개 실행 도구를 호출하지 않는다. 이들은 기존 private Bridge 전송·반환값·ManagedFiles 계약을 유지한다.\n공개 코드 실행에서 그 경로로 fallback하지 않는다. 고정 조회와 native helper도 그대로다.\n이 경계 덕분에 공개 실행 도구 교체가 내부 도구의 `guids`·재료 결과·파일 관리를 바꾸지 않는다.\n"},{"path":"src/mcp/features/modeling/rhino3d-scripts/SKILL.md","sha256":"6618e636ac83c50a034a477e2ce6b2c0b2f4d8a0fc9dfd4ea0d676a8d32c4c80","text":"---\nname: rhino3d-scripts\ndescription: 'Authoring and debugging scripts for Rhinoceros 3D (Rhino 8 and later). Use when asked to write RhinoScript (VBScript / .rvb / .vbs), RhinoPython, or RhinoCommon-based scripts; automate Rhino modeling tasks; build command macros; manipulate Rhino geometry, layers, blocks, or document objects; pick objects from the viewport; control redraw and undo; or load and run scripts from the Rhino Script Editor. Covers `rhinoscriptsyntax`, `scriptcontext`, the `Rhino.*` RhinoCommon namespaces (`Rhino.Geometry`, `Rhino.DocObjects`, `Rhino.Input`, `Rhino.UI`, `Rhino.Display`, `Rhino.FileIO`), and the Rhino 8 unified Script Editor.'\n---\n\n# Rhino 3D Scripting Skill\n\nWrite production-quality scripts for Rhinoceros 3D. Covers the three scripting surfaces (RhinoScript/VBScript, RhinoPython, direct RhinoCommon .NET) and the Rhino 8+ Script Editor.\n\n## When to Use This Skill\n\n- User asks to write, edit, or debug a `.rvb`, `.vbs`, or `.py` Rhino script\n- User wants a Rhino **command macro** or wants to automate a sequence of Rhino commands\n- User wants to manipulate geometry, layers, blocks, materials, viewports, or annotations from code\n- User mentions `rhinoscriptsyntax`, `scriptcontext`, `RhinoCommon`, `Rhino.Geometry`, `RhinoDoc`, or the Script Editor\n- User wants to pick objects, prompt for input, or build a small UI inside Rhino\n- User asks how to load, run, or distribute a script (startup scripts, aliases, toolbar buttons)\n\n## Choosing a Scripting Surface\n\nPick the surface based on the task, not preference. Recommend Python by default for new work.\n\n| Surface | When to choose | File ext |\n|---|---|---|\n| **RhinoPython** (`rhinoscriptsyntax` + RhinoCommon) | Default for new scripts. Best ecosystem, readable, full RhinoCommon access. | `.py` |\n| **RhinoScript** (VBScript) | Maintaining legacy `.rvb`/`.vbs` files; integrating with VBA/COM. | `.rvb`, `.vbs` |\n| **RhinoCommon (C#/.NET) via Script Editor** | Performance-critical loops, complex geometry, leveraging .NET libraries. | `.cs` |\n| **Command macro** | Pure sequence of existing Rhino commands; no logic. | toolbar/alias |\n\nA macro is **not** a script — it is a string of command-line input (e.g. `! _-Line 0,0,0 10,0,0 _Enter`). Use a script the moment you need a variable, loop, or conditional.\n\n## Prerequisites\n\n- Rhino 7 or later (Rhino 8 strongly recommended — unified Script Editor supports Python 3, VB, and C# in one window).\n- Script Editor: type `_ScriptEditor` (Rhino 8) or `_EditPythonScript` / `_EditScript` (older).\n- Run a saved file from the command line with `_-RunPythonScript` or `_LoadScript` + `_RunScript`.\n\n## Core Patterns\n\n### Python: minimal scaffold\n\n```python\nimport rhinoscriptsyntax as rs\nimport scriptcontext as sc\nimport Rhino\n\ndef main():\n    obj_id = rs.GetObject(\"Select a curve\", filter=rs.filter.curve, preselect=True)\n    if not obj_id:\n        return\n    length = rs.CurveLength(obj_id)\n    print(\"Length: {0:.4f}\".format(length))\n\nif __name__ == \"__main__\":\n    main()\n```\n\n### Python: working with RhinoCommon directly\n\n```python\nimport Rhino\nimport scriptcontext as sc\n\ndoc = sc.doc  # Rhino.RhinoDoc.ActiveDoc\ntol = doc.ModelAbsoluteTolerance\n\ncircle = Rhino.Geometry.Circle(Rhino.Geometry.Point3d(0, 0, 0), 5.0)\ncurve_id = doc.Objects.AddCircle(circle)\ndoc.Views.Redraw()\n```\n\n### VBScript: minimal scaffold\n\n```vbscript\nOption Explicit\n\nCall Main()\n\nSub Main()\n    Dim strObject\n    strObject = Rhino.GetObject(\"Select a curve\", 4)  ' 4 = curve filter\n    If IsNull(strObject) Then Exit Sub\n    Rhino.Print \"Length: \" & Rhino.CurveLength(strObject)\nEnd Sub\n```\n\n### Picking objects with a custom filter (Python, RhinoCommon)\n\n```python\nimport Rhino\nimport scriptcontext as sc\n\ngo = Rhino.Input.Custom.GetObject()\ngo.SetCommandPrompt(\"Select breps\")\ngo.GeometryFilter = Rhino.DocObjects.ObjectType.Brep\ngo.SubObjectSelect = False\ngo.GetMultiple(1, 0)\nif go.CommandResult() != Rhino.Commands.Result.Success:\n    pass\nelse:\n    ids = [go.Object(i).ObjectId for i in range(go.ObjectCount)]\n```\n\n## Step-by-Step Workflows\n\n### Bulk-modify many objects fast\n\n1. Disable redraw: `rs.EnableRedraw(False)`.\n2. Wrap mutations in a single undo record: `undo = doc.BeginUndoRecord(\"My Op\")` … `doc.EndUndoRecord(undo)`.\n3. Use RhinoCommon directly inside the loop (skip `rhinoscriptsyntax` overhead).\n4. Re-enable redraw and call `doc.Views.Redraw()` in a `try`/`finally` so a crash never leaves the viewport frozen.\n\n### Distribute a script to a teammate\n\n1. Save the `.py` / `.rvb` somewhere on disk.\n2. Add the folder to `Options → Files → Search paths` so Rhino can find it by name.\n3. Create a toolbar button or alias whose macro is:\n   - Python: `! _-RunPythonScript \"MyScript.py\"`\n   - RhinoScript: `! _-LoadScript \"MyScript.rvb\" _-RunScript MySubName`\n4. The leading `!` cancels any running command; `-` runs the command in script (no-dialog) mode.\n\n### Run code at Rhino startup\n\n1. Place a `.rvb`/`.py` in a search path.\n2. `Tools → Options → RhinoScript` (or `Python`) → add to **Startup** list. The file executes once per session.\n\n## Gotchas\n\n- **`rhinoscriptsyntax` returns GUIDs, RhinoCommon returns objects.** Mixing them is fine, but `doc.Objects.Find(guid)` is the bridge from a `rs.*` id to a `RhinoObject`.\n- **Coordinates differ by surface.** Python uses `(x, y, z)` tuples *or* `Rhino.Geometry.Point3d`; VBScript uses 3-element `Array(x, y, z)`. Never pass a Python list to a VBScript helper through COM.\n- **`Option Explicit` is off by default in VBScript.** Typos silently create new variables. Always add `Option Explicit` at the top of `.rvb` files.\n- **VBScript has no block scope.** All `Dim`s inside a `Sub` are hoisted to the top of the procedure. Loop counters leak.\n- **`Nothing`, `Empty`, and `Null` are different** in VBScript. Use `IsNull` for `Rhino.GetObject` failure, `IsEmpty` for uninitialized `Variant`, `Is Nothing` for object refs.\n- **Parentheses change calling semantics in VBScript.** `Call Foo(a, b)` and `Foo a, b` are valid; `Foo(a, b)` (no `Call`, with parens) is **not** a call to a Sub — it’s a syntax error for multi-arg subs and a forced `ByVal` for single-arg.\n- **Tolerance is per-document.** Always read `doc.ModelAbsoluteTolerance` rather than hardcoding `0.001`; users work in mm, m, inches, etc.\n- **Long loops should poll `Rhino.RhinoApp.EscapeKeyPressed`** so the user can cancel. Otherwise Rhino appears frozen.\n- **GUID strings vs `System.Guid`.** `rhinoscriptsyntax` accepts either; RhinoCommon wants `System.Guid`. Convert with `System.Guid(str_id)` if needed.\n- **Don’t call `doc.Views.Redraw()` inside a tight loop.** Toggle redraw once outside the loop.\n- **`.rvb` is just `.vbs` renamed** with a Rhino-specific extension so Rhino’s `LoadScript` recognizes it. Same VBScript engine.\n- **`Rhino.RhinoApp.IsHeadless` may not exist on older Rhino 8 builds.** Use `getattr(Rhino.RhinoApp, \"IsHeadless\", None)` and check for `None` before using. Fall back to a heuristic (e.g. `sc.doc.Views.Count == 0`) or assume GUI present.\n- **`RhinoMath` is at `Rhino.RhinoMath`, not `Rhino.DocObjects.RhinoMath`.** Accessing `Rhino.DocObjects.RhinoMath` raises `AttributeError`.\n- **`doc.Objects.AddBrep()` returns `System.Guid.Empty` on failure.** In Rhino 8 CPython the `System` namespace may not be directly importable; check the return value as a string: `str(obj_id) == \"00000000-0000-0000-0000-000000000000\"`.\n- **`rhinoscriptsyntax` has no type stubs.** Static analysers (Pylance/Pyright) flag `import rhinoscriptsyntax as rs` as unresolvable. Suppress with `# type: ignore` on the import line; the module is always available at Rhino runtime.\n- **Never name a script after a Python standard-library module** (e.g. `random.py`, `math.py`, `os.py`). IronPython 2.7 (`_-RunPythonScript`) resolves the script directory before stdlib, so any `import random` inside the stdlib (e.g. `tempfile` imports `random` internally) will find your file instead and fail with `Cannot import name \u003cX>`. CPython 3 (`rhinocode`) is unaffected because it resolves stdlib first. Rename the script or avoid importing modules that pull in the shadowed name.\n- **Em dashes and other non-ASCII characters silently break `_-RunPythonScript` (IronPython 2.7).** `rhinocode script` uses CPython 3 (UTF-8 by default) so the same file works there, making the failure non-obvious. IronPython 2.7 raises `SyntaxError: Non-ASCII character '\\xe2'` at the first offending byte. The most common culprit is the **em dash** (`--` auto-converted to `--` by many editors). Add `# -*- coding: utf-8 -*-` as line 1 of every script that must run under both runtimes, and replace typographic characters with ASCII equivalents: em dash `--`, arrow `->`, multiplication `x`.\n\n## Troubleshooting\n\n| Symptom | Fix |\n|---|---|\n| `rs.GetObject` returns `None` immediately | The user pressed Escape, or your `filter` excludes everything. Re-check `rs.filter.*` flags. |\n| “Unable to find script” when running by name | The folder isn’t in `Options → Files → Search paths`. |\n| VBScript `Type mismatch` on coordinates | You passed a 2-element array. Rhino requires 3-element `Array(x, y, z)`. |\n| Python `ImportError: No module named Rhino` | You’re running CPython outside Rhino. RhinoCommon is only available in Rhino’s embedded Python (or via `rhino3dm` for read-only file work). |\n| Created geometry doesn’t appear | You forgot `doc.Views.Redraw()`, or `rs.EnableRedraw(False)` was never re-enabled. |\n| Undo undoes only the last object of a batch | Wrap the batch in `BeginUndoRecord` / `EndUndoRecord`. |\n| Script works alone but fails as a startup script | Startup runs before any document is open — return early or skip document-dependent work when `sc.doc is None`. |\n| `rs.Command(\"...\")` returns `False` | The macro string is malformed. Prefix with `!` and `-`, end every prompt with `_Enter` or a value. |\n| `AttributeError: type object 'RhinoApp' has no attribute 'IsHeadless'` | Property added in a later Rhino 8 build. Use `getattr(Rhino.RhinoApp, \"IsHeadless\", None)` and guard against `None`. |\n| `rhinocode script` ignores arguments after the script path | rhinocode concatenates extra tokens onto the file URI. Pass data via a temp file or a Rhino dialog instead. See `references/macros-and-loading.md`. |\n| `Cannot import name \u003cX>` inside stdlib (e.g. `tempfile`, `
