function validate(tr){const t=T[tr.name],errors=Object.entries(tr.invalid).filter(([k])=>k in tr.args).map(([k,v])=>k+': '+v);for(const k of t.inputSchema.required||[])if(!(k in tr.args))errors.push(k+': 필수 인수 누락');for(const [k,v]of Object.entries(tr.args)){const p=t.inputSchema.properties[k],type=typ(p);if(v===null){if(!p.anyOf?.some(x=>x.type==='null'))errors.push(k+': null 불가');continue}if(type==='integer'&&!Number.isInteger(v)||type==='number'&&(typeof v!=='number'||!Number.isFinite(v))||type==='array'&&!Array.isArray(v)||type==='object'&&(typeof v!=='object'||Array.isArray(v)))errors.push(k+': '+type+' 타입 필요')}return errors}
function symbolShape(tr){const n=tr.name,a=tr.args;if(n==='get_modeling_guide')return guideValue(a.tool||'');if(['create_plan','update_plan','update_step'].includes(n))return {status:'success',plan:{plan_id:'〈실제 반환된 plan_id〉',revision:n==='create_plan'?1:'〈저장 후 revision〉'}};if(['create_phase','update_phase'].includes(n))return {status:'success',phase:{phase_id:'〈실제 반환된 phase_id〉'}};if(['create_design_scene','update_design_scene'].includes(n))return {status:'success',scene:{scene_id:'〈실제 반환된 scene_id〉',revision:'〈현재 revision〉'}};if(n==='list_library'){const v={total_entries:'〈실제 항목 수〉',logic_names:['〈실제 로직 이름〉']};if(a.include_ids)v.logic_ids=['〈실제 로직 ID〉'];if(a.field_groups?.some(x=>['all','paths'].includes(x)))v.library_dir='〈실제 라이브러리 경로〉';return v}if(n==='set_working_plan')return {status:'success',plan_id:a.plan_id,step_id:a.step_id||'',artifact_dir:'〈Plan 소유 tmp/YYMMDD_name〉'};if(n==='audit_asset_drawing')return {status:'〈success 또는 error〉',source_geometry:'〈not_checked / current / source_file_current / stale〉',asset_id:'〈대상 asset_id〉',checked_files:'〈파일 수〉',failures:['〈문제 내용 — 없으면 빈 배열〉']};if(n==='get_rhino_execution')return {request_id:'〈실제 request_id〉',completed:'〈true / false〉',status:'〈실행 상태〉',mutation_state:'〈변경 상태〉',result:'〈include_result 요청에 따른 실제 결과〉'};if(n==='show_object_intersection'&&a.clear===true)return {status:'success',displayed:false,cleared:true};return null}
function guideValue(tool){const g=D.guideSnapshot,base={status:'success',guide_version:g.guide_version};if(tool){if(!g.tools[tool])return {error:'ValueError',message:'Unknown Almond tool. Call get_modeling_guide() for available tools.'};return {...base,tool_name:tool,...g.tools[tool]}}return {...base,text:g.basic,source_refs:g.basic_refs,tools:Object.keys(g.tools).sort()}}
function guideBody(tr){const basicRequest=tr.name==='project_info'&&tr.args.sections?.includes('instructions');if(tr.name!=='get_modeling_guide'&&!basicRequest)return '';const tool=basicRequest?'':tr.args.tool||'',v=guideValue(tool);if(v.error)return `<div class="box amber"><b>현재 코드의 오류 분기</b><p>${esc(v.message)}</p></div>`;let out=`<details open><summary>${tool?esc(tool)+' · 반환 text 전문 (한국어 번역)':'BASIC-INSTRUCTIONS.md · 반환 '+(basicRequest?'instructions':'text')+' 전문'}</summary><div class="explain">${esc(tool?D.translations[tool]:v.text)}</div></details>`;if(tool)out+=`<details><summary>반환 text 원문 전문</summary><div class="explain">${esc(v.text)}</div></details>`;out+=`<details><summary>source_refs · 원문 파일과 해시</summary><pre>${esc(j(v.source_refs))}</pre></details>`;if(v.scripting_skill)out+=`<details><summary>함께 반환되는 scripting_skill · ${v.scripting_skill.sources.length}개 원문 전문</summary>${v.scripting_skill.sources.map(f=>`<details><summary>${esc(f.path)}</summary><div class="explain">${esc(f.text)}</div></details>`).join('')}</details>`;return out}
function resultPanel(i){S.seq=i;const tr=S.trace[i],t=T[tr.name],h=H[tr.name];if(!tr.open){inputPanel(i);return}S.selected='result-'+i;S.view='result';const shape=symbolShape(tr);$('#panel').innerHTML=`<div class="kicker">tools/call 응답 · 현재 반환 구조</div><h2>${esc(t.title)}</h2><div class="name">${t.name}</div><span class="pill green">${t.name==='get_modeling_guide'?'고정 커밋의 정적 반환 본문':'현재 코드의 반환 필드 · 실제 실행값 아님'}</span><p class="sub">${t.name==='get_modeling_guide'?'아래 안내 본문과 해시는 해당 커밋의 실제 소스에서 읽은 값입니다. 현재 서버를 호출한 결과는 아닙니다.':'입력 JSON은 아래에 유지됩니다. 데이터 값·적용 성공 여부는 실제 Rhino/저장소/파일 상태에 따라 결정됩니다.'}</p>${guideBody(tr)}${shape?`<details ${t.name==='get_modeling_guide'?'':'open'}><summary>${t.name==='get_modeling_guide'?'정적 반환 데이터 전체 JSON':'반환 데이터 모양 · 기호 값 예시'}</summary><pre>${esc(j(shape))}</pre></details>`:''}${fields(h)}${branches(h)}${planningInfo(tr)}<details><summary>이 호출에 작성한 입력</summary><pre>${esc(j(req(tr)))}</pre></details><details><summary>MCP 외부 출력 스키마</summary><p class="sub">result:string wrapper와 그 안의 JSON 데이터 필드는 별개입니다. null 스키마는 반환값이 없다는 뜻이 아닙니다.</p><pre>${esc(j(t.outputSchema??null))}</pre></details><details><summary>현재 함수의 관련 내부 호출</summary>${t.calls.map(c=>`<p><code>${esc(c)}</code></p>`).join('')||'<p class="sub">별도 context/runtime 호출 없음</p>'}</details><details><summary>코드의 분기 조건 (${t.guards.length}개)</summary>${t.guards.map(g=>`<p><code>${esc(g.condition)}</code><br>${link(t.path,g.line,'L'+g.line+' ↗')}</p>`).join('')}</details><button class="secondary" id="back-input">입력값 다시 보기</button>${nextButtons(tr.name)}<p>${guideLink(t)}</p>${h.source?`<p>${helperLink(h.source)}</p>`:''}`;graph();topPanel()}
function planningInfo(tr){if(!['create_plan','get_plan','update_step'].includes(tr.name))return '';const scope=tr.args.scope||'house';const steps=D.templates[scope];return `<details ${tr.name==='create_plan'?'open':''}><summary>현재 scope별 Step 템플릿과 상태 처리</summary>${tr.name==='create_plan'&&steps?`<p>scope=<code>${esc(scope)}</code> · ${steps.length}개 Step를 pending으로 저장합니다. 작업 자체를 자동 실행하지 않습니다.</p><pre>${esc(j(steps.map(s=>({step_id:s[0],kind:s[1],depends_on:s[2]}))))}</pre>`:`<p>${Object.keys(D.templates).join(' · ')} 템플릿이 현재 store에 있습니다.</p>`}<p>expected_revision은 선택적 충돌 검사입니다. update_step의 상태 집계는 failed → blocked → 모두 completed → running → paused → 일부 completed → pending 순서입니다. depends_on 기록이 실행 순서를 강제하는 것은 아닙니다.</p>${link('src/mcp/features/planning/store.py',499)}</details>`}
function nextButtons(n){let names=S.route&&routeTools[S.route]?.includes(n)?routeTools[S.route]:[];if(!names.length){const r=routes.find(r=>routeTools[r[0]].includes(n));if(r)names=routeTools[r[0]]}return names.length?`<h3>관련 호출 선택 · 자동 실행 아님</h3>${names.filter(x=>x!==n).map(x=>`<button class="secondary" data-name="${x}">${esc(T[x].title)}<small>${x}</small></button>`).join('')}`:''}
function resource(n){const r=R.find(x=>x.name===n);S.resource=n;S.view='resource';$('#panel').innerHTML=`<div class="kicker">resources/read</div><h2>리소스 읽기</h2><div class="name">${esc(r.uri)}</div><div class="box"><b>${esc(r.mime)}</b><p>URI를 받은 것만으로 파일을 읽은 것은 아닙니다. 실제 값을 URI의 {…} 자리에 넣어 별도 요청합니다.</p></div><pre>${esc(j({jsonrpc:'2.0',id:1,method:'resources/read',params:{uri:r.uri}}))}</pre><h3>현재 반환 처리</h3>${r.returns.map(x=>`<pre>${esc(x)}</pre>`).join('')}<p>${guideLink(r)}</p><button class="secondary" id="resource-back">전체 툴·리소스로 돌아가기</button>`;topPanel()}
function reset(){S.trace=[];S.seq=0;S.query='';S.route=null;intro();$('#viewport').scrollTop=0;fit()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.name)choose(b.dataset.name);else if(b.dataset.resource)resource(b.dataset.resource);else if(b.dataset.action){const a=b.dataset.action,id=b.dataset.id,v=b.dataset.value;if(a==='route'){S.route=v;choose(routes.find(r=>r[0]===v)[2])}else if(a==='tool'||a==='desc')inputPanel(+v);else if(a==='result')resultPanel(+v);else if(id==='catalog')catalog();else intro()}else if(b.id==='catalogBtn'||b.id==='resource-back')catalog();else if(b.id==='reset')reset();else if(b.id==='plus'){S.zoom=Math.min(1.5,S.zoom+.1);resize()}else if(b.id==='minus'){S.zoom=Math.max(.4,S.zoom-.1);resize()}else if(b.id==='fit')fit();else if(b.id==='show-result'){const tr=S.trace[S.seq],errors=validate(tr);$('#inputError').textContent=errors.join('\n');if(errors.length)return;tr.open=true;resultPanel(S.seq)}else if(b.id==='back-input')inputPanel(S.seq)});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='tool-search'){S.query=el.value;catalogGroups();return}if(!el.dataset.arg)return;const tr=S.trace[S.seq],k=el.dataset.arg;try{let v=el.value;if(el.dataset.type==='json')v=JSON.parse(v);else if(['integer','number'].includes(el.dataset.type)){if(!v.trim())throw Error('숫자가 필요합니다');v=Number(v);if(!Number.isFinite(v))throw Error('유한한 숫자가 필요합니다')}else if(el.tagName==='SELECT')v=v==='true';tr.args[k]=v;delete tr.invalid[k];$('#request-json').textContent=j(req(tr));$('#inputError').textContent=''}catch(err){tr.invalid[k]=err.message;$('#inputError').textContent=k+': '+err.message}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.enable){const tr=S.trace[S.seq],k=el.dataset.enable;if(el.checked)tr.args[k]=sample(tr.name,k,T[tr.name].inputSchema.properties[k]);else{delete tr.args[k];delete tr.invalid[k]}document.getElementById('input-'+k).disabled=!el.checked;$('#request-json').textContent=j(req(tr))}else if(el.dataset.arg&&el.tagName==='SELECT'){const tr=S.trace[S.seq];tr.args[el.dataset.arg]=el.value==='true';$('#request-json').textContent=j(req(tr))}});
// Persist this local page's exploration state, never call the MCP server.
const STORAGE_KEY='almond-current-flow:state:v1:'+location.pathname;
let restoringState=true,saveTimer,storageWarningShown=false;
function detailKey(el){
  const parts=[];
  for(let node=el;node&&node.id!=='panel';node=node.parentElement){
    if(node.tagName==='DETAILS')parts.unshift(node.querySelector(':scope > summary')?.textContent.trim()||'');
    if(node.classList.contains('field'))parts.unshift('arg:'+node.querySelector('[data-arg]')?.dataset.arg);
  }
  return JSON.stringify(parts);
}
function captureUI(){
  const panel=$('#panel'),viewport=$('#viewport');
  return {
    panel:{top:panel.scrollTop,left:panel.scrollLeft},
    viewport:{top:viewport.scrollTop,left:viewport.scrollLeft},
    window:{top:window.scrollY,left:window.scrollX},
    details:[...panel.querySelectorAll('details')].map(el=>[detailKey(el),el.open]),
    inputs:[...panel.querySelectorAll('[data-arg]')].map(el=>[el.dataset.arg,el.value]),
    innerScroll:[...panel.querySelectorAll('pre,textarea,.explain')].map(el=>({top:el.scrollTop,left:el.scrollLeft}))
  };
}
function saveState(){
  if(restoringState)return;
  clearTimeout(saveTimer);
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,state:S,ui:captureUI()}));}
  catch(error){if(!storageWarningShown){storageWarningShown=true;toast('브라우저 저장 공간을 사용할 수 없어 마지막 상태를 저장하지 못했습니다.');}}
}
function scheduleSave(){if(!restoringState){clearTimeout(saveTimer);saveTimer=setTimeout(saveState,100);}}
function restoreUI(ui={}){
  const panel=$('#panel'),viewport=$('#viewport'),details=new Map(ui.details||[]);
  for(const el of panel.querySelectorAll('details'))if(details.has(detailKey(el)))el.open=details.get(detailKey(el));
  for(const [key,value]of ui.inputs||[]){const el=[...panel.querySelectorAll('[data-arg]')].find(el=>el.dataset.arg===key);if(el)el.value=value;}
  if(S.view==='input'&&S.trace[S.seq]){
    const tr=S.trace[S.seq];$('#inputError').textContent=Object.entries(tr.invalid||{}).filter(([key])=>key in tr.args).map(([key,value])=>key+': '+value).join('\n');
  }
  const inner=[...panel.querySelectorAll('pre,textarea,.explain')];
  (ui.innerScroll||[]).forEach((pos,i)=>{if(inner[i]){inner[i].scrollTop=pos.top;inner[i].scrollLeft=pos.left;}});
  for(const [el,pos]of [[viewport,ui.viewport],[panel,ui.panel]])if(pos){el.scrollTo({top:pos.top||0,left:pos.left||0,behavior:'instant'});}
  if(ui.window)window.scrollTo({top:ui.window.top||0,left:ui.window.left||0,behavior:'instant'});
}
function restoreState(){
  let saved;
  try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');}catch(error){return false;}
  if(saved?.version!==1||!saved.state)return false;
  const state=saved.state;
  if(!Array.isArray(state.trace)||!state.trace.every(tr=>T[tr.name]&&tr.args&&typeof tr.args==='object'&&!Array.isArray(tr.args)))return false;
  if(!['guide','catalog','input','result','resource'].includes(state.view))return false;
  if(['input','result'].includes(state.view)&&(!Number.isInteger(state.seq)||!state.trace[state.seq]))return false;
  if(state.view==='resource'&&!R.some(r=>r.name===state.resource))return false;
  Object.assign(S,state);
  S.zoom=Number.isFinite(S.zoom)?Math.max(.4,Math.min(1.5,S.zoom)):1;
  S.query=typeof S.query==='string'?S.query:'';
  S.trace.forEach(tr=>{tr.invalid=tr.invalid&&typeof tr.invalid==='object'?tr.invalid:{};});
  try{
    if(S.view==='catalog')catalog();
    else if(S.view==='input')inputPanel(S.seq);
    else if(S.view==='result')resultPanel(S.seq);
    else if(S.view==='resource'){graph();resource(S.resource);}
    else intro();
  }catch(error){S.trace=[];S.seq=0;S.query='';S.route=null;return false;}
  requestAnimationFrame(()=>{restoreUI(saved.ui);requestAnimationFrame(()=>{restoreUI(saved.ui);restoringState=false;});});
  return true;
}
window.addEventListener('resize',()=>{resize();scheduleSave();});
for(const event of ['click','input','change'])document.addEventListener(event,scheduleSave);
document.addEventListener('toggle',scheduleSave,true);
document.addEventListener('scroll',scheduleSave,true);
window.addEventListener('pagehide',saveState);
window.addEventListener('beforeunload',saveState);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveState();});
if(!restoreState()){intro();fit();restoringState=false;saveState();}

</script></body></html>
