your shell.\n- **`os.getcwd()` is the server's working directory**, not the directory you called rhinocode\n  from. Do not rely on it for output paths; pass the path explicitly.\n- **`print()` output IS piped back** to the calling terminal — use it freely for status messages.\n\n### Passing data into a script\n\nrhinocode does not support positional arguments after the script path — any extra tokens are\nconcatenated onto the file URI, causing a \"file does not exist\" error. Workarounds:\n\n|Channel|How|Notes|\n|---|---|---|\n|Temp file|Caller writes a file to a known location; script reads and deletes it.|Use a path derived from `__file__` (see below), not `%TEMP%` — the server may resolve a different temp dir.|\n|Rhino dialog|Script calls `rhinoscriptsyntax.ListBox` / `GetString`|Always works; user sees a prompt in Rhino.|\n\n### `__file__` is a URI\n\nWhen running via rhinocode, `__file__` is set as a `file:///` URI with URL-encoded characters\n(spaces become `%20`). Decode it before using it as a filesystem path:\n\n```python\nimport os, sys, urllib.parse\n\ndef _script_dir():\n    raw = __file__\n    if raw.startswith(\"file:///\"):\n        raw = urllib.parse.unquote(raw[len(\"file:///\"):])\n        if sys.platform == \"win32\":\n            raw = raw.replace(\"/\", os.sep)\n    return os.path.dirname(os.path.abspath(raw))\n```\n"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/rhinocommon-map.md","sha256":"e9baa208601cd5edfa824aa576d314bdf19d48b9e29b8e5e636bc3a2867094e0","text":"# RhinoCommon Namespace Map\n\nUse this to decide which `Rhino.*` namespace to import for a task. All of these are accessible from Python with `import Rhino`.\n\n## Document & Object Model\n\n| Need | Namespace | Key types |\n|---|---|---|\n| The active document, units, tolerances, undo | `Rhino` | `RhinoDoc`, `RhinoApp` |\n| Reading/writing objects in the doc | `Rhino.DocObjects` | `RhinoObject`, `ObjectAttributes`, `Layer`, `ObjectType` |\n| Tables (layers, materials, blocks, dim styles) | `Rhino.DocObjects.Tables` | `LayerTable`, `InstanceDefinitionTable`, `MaterialTable` |\n| Custom per-object user data | `Rhino.DocObjects.Custom` | `UserData` |\n| File I/O (.3dm, import/export) | `Rhino.FileIO` | `File3dm`, `File3dmObject` |\n\n## Geometry\n\n| Need | Namespace | Key types |\n|---|---|---|\n| Points, vectors, transforms | `Rhino.Geometry` | `Point3d`, `Vector3d`, `Transform`, `Plane`, `BoundingBox` |\n| Curves | `Rhino.Geometry` | `Curve`, `NurbsCurve`, `PolylineCurve`, `LineCurve`, `ArcCurve` |\n| Surfaces & breps | `Rhino.Geometry` | `Surface`, `NurbsSurface`, `Brep`, `BrepFace`, `Extrusion` |\n| Meshes | `Rhino.Geometry` | `Mesh`, `MeshFace`, `MeshNgon` |\n| SubD | `Rhino.Geometry` | `SubD`, `SubDFace`, `SubDEdge` |\n| Geometry collections (vertices, edges, faces lists) | `Rhino.Geometry.Collections` | `MeshVertexList`, `BrepEdgeList` |\n| Intersections | `Rhino.Geometry.Intersect` | `Intersection`, `CurveIntersections` |\n| Mesh refinement | `Rhino.Geometry.MeshRefinements` | |\n| Space morphs (bend, twist, etc.) | `Rhino.Geometry.Morphs` | `BendSpaceMorph`, `TwistSpaceMorph` |\n\n## User Interaction\n\n| Need | Namespace | Key types |\n|---|---|---|\n| Prompts, getters, command results | `Rhino.Input` / `Rhino.Input.Custom` | `RhinoGet`, `GetObject`, `GetPoint`, `GetOption` |\n| Commands (when building a plugin) | `Rhino.Commands` | `Command`, `Result` |\n| Forms, dialogs, panels | `Rhino.UI` | `Dialog`, `Panels`, `RhinoEtoExtensions` |\n| UI controls / data sources | `Rhino.UI.Controls` | |\n| Gumball | `Rhino.UI.Gumball` | |\n\n## Display & Rendering\n\n| Need | Namespace | Key types |\n|---|---|---|\n| Viewports, display conduits, draw overlays | `Rhino.Display` | `DisplayPipeline`, `DisplayConduit`, `RhinoViewport` |\n| Render content (materials, environments) | `Rhino.Render` | `RenderContent`, `RenderMaterial`, `RenderTexture` |\n| Render mesh customization | `Rhino.Render.CustomRenderMeshes` | |\n| Post effects | `Rhino.Render.PostEffects` | |\n\n## Runtime & Plugins\n\n| Need | Namespace | Key types |\n|---|---|---|\n| Plugin lifecycle, settings | `Rhino.PlugIns` | `PlugIn`, `FileImportPlugIn`, `FileExportPlugIn` |\n| In-process Rhino (run Rhino from external .NET) | `Rhino.Runtime.InProcess` | `RhinoCore` |\n| Native interop (pointers, marshalling) | `Rhino.Runtime.InteropWrappers` | |\n| User notifications (toasts) | `Rhino.Runtime.Notifications` | |\n\n## Common Patterns\n\n```python\nimport Rhino\nimport scriptcontext as sc\nimport System.Drawing\n\ndoc = sc.doc                                          # Rhino.RhinoDoc\ntol = doc.ModelAbsoluteTolerance                      # float\nview = doc.Views.ActiveView                           # Rhino.Display.RhinoView\nlayer_index = doc.Layers.Add(\"MyLayer\", System.Drawing.Color.Red)\n\n# Find a Rhino object from a rhinoscriptsyntax GUID\nrhobj = doc.Objects.Find(guid)                        # Rhino.DocObjects.RhinoObject\ngeom  = rhobj.Geometry                                # Rhino.Geometry.GeometryBase\n\n# Add geometry with attributes\nattrs = Rhino.DocObjects.ObjectAttributes()\nattrs.LayerIndex = layer_index\nattrs.Name = \"example\"\nnew_id = doc.Objects.AddCurve(curve, attrs)\n```\n\n## Undo\n\n```python\nundo_serial = doc.BeginUndoRecord(\"Batch Op\")\ntry:\n    # ... many doc.Objects.* calls ...\n    pass\nfinally:\n    doc.EndUndoRecord(undo_serial)\n    doc.Views.Redraw()\n```\n"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/rhinoscriptsyntax-cheatsheet.md","sha256":"8abd85be2b9e915ebeeec5538d62043e676f59c74d34fb438021a6f852e3eac0","text":"# `rhinoscriptsyntax` Cheatsheet\n\n```python\nimport rhinoscriptsyntax as rs\n```\n\n## User Input\n\n| Function | Returns |\n|---|---|\n| `rs.GetObject(message, filter, preselect, select)` | GUID or `None` |\n| `rs.GetObjects(message, filter)` | list of GUIDs |\n| `rs.GetPoint(message, base_point)` | `Point3d` or `None` |\n| `rs.GetString(message, default, strings)` | str |\n| `rs.GetInteger`, `rs.GetReal` | int / float |\n| `rs.GetBoolean(message, items, defaults)` | list of bools |\n\nCommon `rs.filter.*` flags (OR them together):\n\n```\npoint=1, point_cloud=2, curve=4, surface=8, polysurface=16,\nmesh=32, light=256, annotation=512, instance_reference=4096,\ntext_dot=8192, grip=16384, detail=32768, hatch=65536,\nmorph_control=131072, sub_d=262144\n```\n\n## Creating Geometry\n\n| Function | Notes |\n|---|---|\n| `rs.AddPoint(point)` | |\n| `rs.AddLine(start, end)` | |\n| `rs.AddPolyline(points)` | `points` is a list of 3-tuples |\n| `rs.AddCircle(plane_or_center, radius)` | |\n| `rs.AddArc(plane, radius, angle_deg)` | angle in **degrees** |\n| `rs.AddCurve(points, degree=3)` | NURBS through control points |\n| `rs.AddInterpCurve(points, degree=3)` | NURBS through points |\n| `rs.AddSphere(center, radius)` | |\n| `rs.AddBox(corners)` | `corners` = 8 points |\n| `rs.AddPlanarSrf(curves)` | returns list |\n| `rs.AddLoftSrf(curves, ...)` | returns list of GUIDs |\n| `rs.AddExtrusion(profile, path)` / `rs.ExtrudeCurveStraight` | |\n\n## Object Properties\n\n| Function | Purpose |\n|---|---|\n| `rs.ObjectLayer(id [, layer])` | get/set |\n| `rs.ObjectColor(id [, color])` | RGB tuple |\n| `rs.ObjectName(id [, name])` | |\n| `rs.ObjectType(id)` | int matching `rs.filter.*` |\n| `rs.IsCurve / IsSurface / IsBrep / IsMesh / IsPoint(id)` | |\n| `rs.DeleteObject(id)` / `rs.DeleteObjects(ids)` | |\n| `rs.CopyObject(id, translation)` | |\n| `rs.MoveObject(id, translation)` | |\n| `rs.RotateObject(id, center, angle, axis=None, copy=False)` | angle in degrees |\n| `rs.ScaleObject(id, origin, scale)` | scale is a 3-tuple |\n\n## Curves\n\n| Function | |\n|---|---|\n| `rs.CurveLength(id)` | |\n| `rs.CurveDomain(id)` | `(t0, t1)` |\n| `rs.EvaluateCurve(id, t)` | `Point3d` |\n| `rs.CurveStartPoint / CurveEndPoint(id)` | |\n| `rs.CurveClosestPoint(id, point)` | parameter `t` |\n| `rs.DivideCurve(id, segments, create_points=False, return_points=True)` | |\n| `rs.IsCurveClosed / IsCurvePlanar(id)` | |\n\n## Layers\n\n| Function | |\n|---|---|\n| `rs.AddLayer(name, color=None, visible=True, locked=False, parent=None)` | |\n| `rs.CurrentLayer([layer])` | |\n| `rs.LayerNames()` | list |\n| `rs.LayerVisible(name [, visible])` | |\n| `rs.DeleteLayer(name)` | |\n| `rs.ObjectsByLayer(name)` | list of GUIDs |\n\n## Document & View\n\n| Function | |\n|---|---|\n| `rs.UnitAbsoluteTolerance()` | |\n| `rs.UnitSystem()` | int (`rs.unit_system_*`) |\n| `rs.EnableRedraw(enable)` | **toggle this around bulk ops** |\n| `rs.Redraw()` | force one redraw |\n| `rs.ViewNames()` / `rs.CurrentView([name])` | |\n| `rs.ZoomExtents(view=None, all=False)` | |\n\n## Selection\n\n| Function | |\n|---|---|\n| `rs.SelectedObjects()` | list |\n| `rs.SelectObject(id)` / `rs.SelectObjects(ids)` | |\n| `rs.UnselectAllObjects()` | |\n| `rs.InvertSelectedObjects()` | |\n\n## Macros from Script\n\n`rs.Command(command_string, echo=True)` runs a macro exactly as if typed at the command line. Always prefix `!` (cancel) and `-` (no dialog):\n\n```python\nrs.Command(\"! _-Line 0,0,0 10,0,0\", echo=False)\n```\n"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/vbscript-quirks.md","sha256":"0a9163940db6ac3618ce2ab6df8ae845b802ac303862b6b38375fd41a4536364","text":"# VBScript Quirks for RhinoScript\n\nThings that bite when writing `.rvb` / `.vbs` files and aren’t obvious to anyone whose mental model is C-family or Python.\n\n## Always Start With `Option Explicit`\n\nWithout it, mistyping a variable name silently creates a new `Variant` set to `Empty`. Every `.rvb` file should begin:\n\n```vbscript\nOption Explicit\n```\n\n## No Block Scope\n\nAll `Dim` declarations inside a `Sub`/`Function` are hoisted to the top. A `Dim` inside an `If` block is visible after the `If` ends. Loop counters survive the loop.\n\n## `Nothing` vs `Empty` vs `Null`\n\n| Sentinel | Test with | Meaning |\n|---|---|---|\n| `Empty` | `IsEmpty(x)` | `Dim`’d but never assigned |\n| `Null` | `IsNull(x)` | Explicit “no value” — what `Rhino.GetObject` returns on cancel |\n| `Nothing` | `x Is Nothing` | An **object** reference that points to nothing — only for `Set` variables |\n\nWrong sentinel → silently false.\n\n## Parentheses Change Semantics\n\n```vbscript\nFoo a, b              ' Call a Sub or Function (return value discarded)\nCall Foo(a, b)        ' Call a Sub or Function (return value discarded)\nx = Foo(a, b)         ' Call a Function and capture the return\nFoo(a, b)             ' SYNTAX ERROR for multi-arg subs\n\nFoo(x)                ' Calls Foo passing x BY VALUE, even if Foo declares ByRef\nFoo x                 ' Honors Foo's ByRef declaration\n```\n\nIf a Sub modifies its argument and your change isn’t taking effect — you wrapped the argument in parentheses.\n\n## `ByRef` Is the Default\n\nUnlike most languages, VBScript passes arguments **by reference by default**. Functions can mutate their callers’ variables. Be explicit:\n\n```vbscript\nSub Increment(ByRef n)\n    n = n + 1\nEnd Sub\n```\n\n## Arrays Are 0-Based But Have `UBound`, Not `Length`\n\n```vbscript\nDim arr(2)            ' Three elements: arr(0), arr(1), arr(2)\nFor i = 0 To UBound(arr)\n    arr(i) = i * 10\nNext\n```\n\n`Dim arr(n)` creates `n+1` elements. `ReDim Preserve arr(newSize)` resizes (only the last dimension of a multi-dim array).\n\n## `Set` Is Required for Object Assignment\n\n```vbscript\nSet fso = CreateObject(\"Scripting.FileSystemObject\")    ' correct\nfso = CreateObject(\"Scripting.FileSystemObject\")        ' RUNTIME ERROR\n```\n\nAny time the right-hand side is an object (COM object, RegExp, Dictionary), you must use `Set`.\n\n## Error Handling Is Manual\n\n```vbscript\nOn Error Resume Next\nRhino.AddCircle Array(0,0,0), -1\nIf Err.Number \u003c> 0 Then\n    Rhino.Print \"Failed: \" & Err.Description\n    Err.Clear\nEnd If\nOn Error GoTo 0           ' Restore normal error behavior\n```\n\n`On Error Resume Next` suppresses **all** errors until `On Error GoTo 0`. Forgetting to restore is a common bug.\n\n## Points Are 3-Element Arrays\n\nRhino expects `Array(x, y, z)`. A 2-element array (`Array(x, y)`) raises a type-mismatch error.\n\n```vbscript\nDim pt\npt = Array(1.0, 2.0, 3.0)\nRhino.AddPoint pt\n```\n\n## String Concatenation Uses `&`, Not `+`\n\n`+` on strings works only if **both** sides are strings. If one side is a number, `+` does numeric addition and throws a type-mismatch. Always use `&`:\n\n```vbscript\nRhino.Print \"Count: \" & n\n```\n\n## `For Each` Needs a `Variant`\n\n```vbscript\nDim item\nFor Each item In someCollection\n    ' ...\nNext\n```\n\nThe loop variable must be `Variant`. You cannot `Dim item As Long` (VBScript has no typed `Dim`).\n"}]}}},"basic":"---\nname: rhino-almond\ndescription: \"Inspect and edit Rhino architecture with Almond MCP: project context, Phase/Task/Step, Scene/ontological-component, modeling, drafting, and verification.\"\n---\n\n# Rhino Almond\n\nAlmond MCP를 사용해 Rhino 건축 모델과 도면을 조사·편집한다. 아래 도구명은 공통 이름이며 연결 방식에 따라 필요한 인자가 다를 수 있다. 실제 호출은 현재 연결의 schema를 따른다.\n\n1. 최초 사용 시\n- `get_modeling_guide()`로 이 문서 전문과 조회 가능한 도구명을 읽는다. \n- 같은 `guide_version`에서 이미 읽은 지침은 재사용한다.\n\n2. 툴 정보 추가 조회\n- 개별 도구의 사용법이 불확실하면 `get_modeling_guide(tool=\"assign_material\")`처럼 정확한 도구명으로 설명을 조회한다. \n\n**Attitude**\n이 툴을 사용하는 작업은 건축설계이며, 모델링 파일이 설계내용이기도 할 뿐만 아니라 작업 도구 역시 develop 중이다. 따라서 기존의 것들은 각각의 역할과 형성 맥락을 살피되, 존재한다는 이유만으로 유지하거나 어느 한쪽이 항상 옳다고 전제하지 않는다. 전반적인 작업 뿐만 아니라 설계 내용의 충돌은, 현재 설계 의도와 작업 목적을 기준으로 하여 주체적으로 추론·고찰하여 필요한 부분을 정합한다. 판단한 작업의 방향성이 사용자의 지시/방향성과 충돌하면 자신의 고찰/추론/결정을 폐기하는 대신, 사용자에게 논의를 요청하여 그 내용과 제안을 설명하고 서로간의 어긋난 방향성을 사용자 주도 하에 align한다.\n\n## 목차\n\n- [기본 세팅](#기본-세팅)\n  - [템플릿·재료·구축 레이어](#템플릿재료구축-레이어)\n- [조회 도구](#조회-도구)\n  - [편집 범위의 격리와 내부 조회](#편집-범위의-격리와-내부-조회)\n- [프로젝트 기본 구조](#프로젝트-기본-구조)\n  - [프로젝트·문서·파일](#프로젝트문서파일)\n  - [Phase → Task → Step](#phase--task--step)\n  - [Scene·ontological-component](#sceneontological-component)\n- [모델링](#모델링)\n  - [건축물을 모델로 다루기](#건축물을-모델로-다루기)\n  - [텍토닉: 재료와 구성, 접합](#텍토닉-재료와-구성-접합)\n    - [구축 시스템과 표현 단계](#구축-시스템과-표현-단계)\n  - [구성의 발전과 형상 편집](#구성의-발전과-형상-편집)\n  - [객체들의 묶음 단위 유형](#객체들의-묶음-단위-유형)\n  - [모델링 검수](#모델링-검수)\n- [Drafting](#drafting)\n  - [도면을 공간과 의미로 읽기](#도면을-공간과-의미로-읽기)\n  - [설계와 도면의 발전](#설계와-도면의-발전)\n  - [도면 생성 툴: PlanSection](#도면-생성-툴-plansection)\n  - [Layout 생성 및 관리](#layout-생성-및-관리)\n  - [도면 표현·출력 검수](#도면-표현출력-검수)\n- [구조 검토](#구조-검토)\n- [거의 사용하지 않는 기능](#거의-사용하지-않는-기능)\n\n## 기본 세팅\n\n### 템플릿·재료·구축 레이어\n\n재료·구축 레이어를 준비할 때 `setup_modeling(operation=\"materials\", overwrite=false)`로 기존 동명 재료를 유지하며 재료를 등록하고, `setup_modeling(operation=\"layers\")`로 레이어를 생성·재사용한다. 이미 세팅된 문서에서는 필요한 부분만 보완한다.\n\n레이어는 `M::유형::시스템명::요소역할` 구조이며, 시스템·요소 레이어에는 재료와 표시·출력 색이 설정된다. 모델링한 객체를 해당 레이어에 배치하고 재료·색을 ByLayer로 적용한다.\n\n## 조회 도구\n\nMCP의 관찰·캡처로 필요한 정보를 확인하며 computer use를 검증의 우회 수단으로 호출하지 않는다. 형상과 속성, 화면, 현재 편집 상태는 서로 다른 정보를 주므로 이번 판단에 필요한 관찰을 선택한다.\n\n### get_rhino_objects: 객체·속성·형상 조회\n\n객체 집합을 조회한다.\n- 레이어·형상 유형별 요약으로 범위를 파악한다.\n- `fields`로 ID나 필요한 속성만 요청한다.\n- 객체·면 정보가 나뉘어 반환되면 응답의 후속 조회 정보를 사용한다.\n\n### capture_rhino_inspection: 격리·다중 시점 이미지\n\n필터한 객체 집합을 지정한 여러 시점에서 캡처해 하나의 PNG로 반환한다. 여러 시점에 공통인 전체 GUID 집합은 최상위 `object_ids`로 한 번만 전달할 수 있다. 활성 Layout을 유지한 모델 검수에는 기존 모델뷰 GUID를 `model_view_id`로 지정한다.\n\n### get_object_intersections: 체적 교차 검사\n\n지정한 객체 사이의 체적 교차를 읽기 전용으로 검사한다. 결과가 나뉘어 반환되면 `next_cursor`로 나머지 후보쌍을 이어 검사한다.\n\n### get_rhino_context: 문서·선택·화면·편집 상태\n필요한 `sections`를 함께 요청한다. 기본값은 `[\"document\"]`이며, `project_info`에서 이미 현재 문서를 확인했다면 같은 확인을 반복하지 않는다. 이 조회는 모델을 변경하지 않는다.\n\n| 입력 | 할 수 있는 일 |\n| --- | --- |\n| `sections`: document, selection, viewport, editor, display_modes | 문서 경로·단위·공차와 객체·레이어 수, 선택 요약, 화면의 카메라·표시 정보 등을 필요한 범위로 조회한다. `editor`는 편집 상태의 근거·경고를, `display_modes`는 설치된 표시 모드를 제공한다. |\n| `selection_limit`, `recursive`, `depth` | 선택 객체 요약은 기본 최대 50개, `selection_limit`은 0–200이다. 기본 비재귀 조회는 완전히 선택된 최상위 group·block을 요약하며, `recursive=true`는 `depth=1–8` 범위의 내부 멤버를 펼친다. 일부만 선택된 group은 객체 선택으로 남는다. |\n| `include_image`, `include_ids` | 기본은 이미지와 ID를 제외한다. `include_image=true`는 같은 호출에서 현재 화면 PNG를 반환하며 실패 시 `image_error`와 조회 가능한 상태를 반환한다. 후속 작업에 ID가 필요하면 `include_ids=true`를 지정한다. |\n\ndocument·selection·viewport 조회에도 간략한 편집 모드·대상·안정 상태가 포함된다. 일반 모델 편집 상태가 확인된 경우에만 안정 상태이며, 격리 편집·전환 중이거나 확인할 수 없으면 불안정하다. `unknown`과 `null`은 미확인이므로 선택 상태만으로 편집 대상을 추정하지 않는다. 객체 수나 현재 화면만으로 형상·가시성을 검증할 수는 없다.\n\n### get_selection_references: 선택 객체의 등록 관계\n\n현재 Rhino 선택에서 등록된 ontological-component와 관련 Task·Step의 이름과 ID를 한 번에 역조회한다. 선택 자체는 실시간으로 읽고, 관계는 등록 정보를 기준으로 한다. 직접 지정된 Step 대상과 Task에서 상속된 대상을 구분하며, component의 조상도 포함한다. Scene 맥락만으로 대상 관계를 만들지는 않는다.\n\n`selection_limit`은 조회할 선택 객체 수(기본 50, 1–200), `limit`은 관계 결과 수를 제한한다. 미등록 객체와 선택·Task 결과의 잘림 여부를 확인하고, 결과가 잘렸다면 범위를 나눠 조회한다. 이 도구는 명시적 ID 역조회이므로 ID를 반환한다. 추가 상세는 `field_groups`로 요청한다.\n\n### get_rhino_viewport_image: 화면으로 관찰하기\n\n현재 화면이나 저장된 viewport·Named View·Layout을 활성화하지 않고 PNG로 확인한다. `view=\"a\"`는 이미지 대신 각각의 이름과 GUID 목록을 반환한다. 이름은 중복될 수 있으므로 목록에서 GUID를 골라 `view`에 전달한다.\n\n**Viewport:** `view`를 생략하면 활성 화면을 캡처하고, 목록의 viewport GUID를 지정하면 해당 화면을 캡처한다. 현재 모델 viewport의 표시 모드는 기본적으로 유지한다.\n\n**Named View:** 목록의 GUID를 지정하면 저장된 카메라를 별도 화면에서 렌더링한다. 기본 표시 모드는 Shaded이고, 저장된 픽셀 크기가 없으면 현재 viewport 크기를 사용한다. 보이는 화면의 카메라는 바뀌지 않는다.\n\n**Layout:** 목록의 GUID를 지정하면 Detail을 포함한 용지 영역을 이미지로 확인한다. 활성 화면이 Layout이면 Detail 편집 중에도 용지 영역을 캡처한다. 기본 해상도 기준은 144 dpi이며 `scale_percent=100`으로 캡처한다. 비율을 낮추면 해상도도 비례해 낮아진다. 인쇄 색상·선 두께를 적용하며 Detail별 표시 모드는 유지된다. 표시 모드 변경은 거절하고 Detail 라벨은 지원하지 않는다.\n\n**Group·block:** `view`를 비우고 `target_kind=\"group\"` 또는 `\"block\"`과 `target_id`를 지정한다. 대상은 각각 영속 group GUID 또는 최상위 block instance GUID이며, block 정의 GUID는 대상이 아니다. 별도 화면에서 대상 범위를 확대하고 주변 형상도 표시한다. 기본 표시 모드는 Shaded다.\n\n도면·유닛의 위치나 작업 시점이 불명확하면 질문 전에 기존 Named View·Layout을 찾고, 선택한 GUID의 이미지에서 표제와 실제 대상·주변 관계를 대조한다. 이름만으로 범위를 확정하거나 조회를 위해 새 Named View를 만들지 않는다.\n\n절단면으로 내부를 확인하려면 실제 clipping plane을 설정한다. 캡처의 `display_mode`는 표시 모드만 바꾸며 모델을 절단하지 않는다.\n\n**공통 옵션:** `display_mode`는 `get_rhino_context(sections=[\"display_modes\"], include_ids=true)`로 설치된 이름 또는 GUID를 확인해 지정한다. Raytraced 같은 실시간 렌더링 모드는 지원하지 않는다. `scale_percent`는 1–100이며 기본 75, 판독에 필요한 해상도에 맞춰 선택한다. Layout 이외의 캡처는 `width`·`height`(각 128–2048)와 `scale_percent=100`을 함께 지정해 실제 창 크기와 무관한 출력 픽셀을 선택할 수 있다. Layout의 144 dpi 기준과 Detail 축척은 바꾸지 않는다. 16메가픽셀·4 MiB 제한을 초과하면 자동 축소하지 않고 오류를 반환한다.\n\n`labels=true`가 기본이다. 최상위 group 이름·GUID, block instance 이름·GUID와 group에 속하지 않은 객체 GUID를 이미지에 표시하며 Rhino 객체를 만들지 않는다. 최대 200개이며 `depth=1–8`로 중첩 라벨 범위를 조절한다. 라벨이 잘리면 대상이나 깊이를 좁힌다. `include_usage=true`는 이미지 크기와 참고용 토큰 추정치를 추가하며 실제 사용량은 클라이언트에 따라 다르다.\n\n캡처 PNG는 이미지 응답과 함께 관리되는 작업자료 폴더에 저장되며 `image_file`로 경로·크기·해시·보존 수명을 반환한다. 선택한 Plan이 없으면 연결 소유 임시자료에 저장한다. 파일 저장 실패와 이미지 캡처 실패는 구분한다.\n\n### 편집 범위의 격리와 내부 조회\n\n#### focus_components\n\n`component_ids`에 서로 다른 ontological-component ID를 1–32개 지정하면, 각 component의 현재 멤버와 등록된 자손의 멤버를 선택·격리하고 확대한다. `expected_model_path`는 보통 생략하며 연결된 문서가 자동으로 지정된다.\n\nRhino의 기존 Isolate/Unisolate 이력을 사용하며 선택·가시성·화면 상태를 변경한다. 이미 숨겨지거나 잠긴 객체와 기존 문서 상태는 Rhino의 격리 기능 조건에 영향을 받는다. 실행 결과가 불확실하면 현재 상태를 확인하고 자동으로 재시도하지 않는다.\n\n\n#### analyze_block_reculviely\n\n중첩 블록 구조와 현재 편집 단계의 블록 후보를 읽기 전용으로 조회한다. `mode=\"outline\"`은 `options`의 `ids` 또는 `path`로 대상을 지정하고, 생략 시 `scope`(selected/viewport/document)로 범위를 고른다. `depth`로 펼칠 깊이를 제한한다. 기본 반환은 작은 요약이며 `field_groups=[\"objects\",\"transforms\"]`, `include_ids=true`로 내부 경로·누적 변환·ID를 추가한다. TextDot 관계는 `annotations` 필드군을 요청한다. `field_groups`는 summary/objects/annotations/transforms 중 비어 있지 않은 배열이며 `[]`·`all`은 지원하지 않는다.\n\n`mode=\"resolve-block\"`은 `options={\"path\":[최상위_GUID, 내부_멤버_GUID, ...]}`만 받는다. BlockEditNew에서는 부모를 연 뒤 경로를 한 단계씩 늘려 현재 선택 가능한 후보를 확인한다. 내부 GUID와 지금 선택 가능한 ID를 구분하고, 정의 저장·멤버 교체 후에는 다시 조회한다. 반환의 `unknown`·미지원·`truncated`는 미확인 범위다. 잘리면 IDs·path·depth를 좁힌다. 좌표·길이·공차는 현재 문서 단위다.\n\n## 프로젝트 기본 구조\n\n### 프로젝트·문서·파일\n\n같은 폴더의 여러 `.3dm`이 하나의 프로젝트이며 `.almond/scene.sqlite3`를 공유한다. **Rhino 편집 대상은 활성 문서만**이다. Worksession의 attached/reference 문서는 조회만 한다.\n\n프로젝트·현재 파일은 `project_info`로 확인한다. DB 기록은 도구가 저장하고, 작업자료는 Task를 선택하면 `tmp/YYMMDD_작업명`에 관리된다. 관리 도구에는 프로젝트 상대경로를 전달하면 되므로 TEMP나 절대경로를 따로 조립하지 않는다. Rhino 모델의 `.3dm` 저장은 DB 기록과 별개다. 저장 명령 성공, 저장 후 `modified` 표시, 실제 저장본 확인은 구별한다. 표시가 남으면 저장 이후 변경·미확인 상태를 보고하고 표시를 강제로 지우지 않는다.\n\n이미 확인한 문서 상태는 재사용한다. 최초 연결·재연결, 문서 변경의 증거, 프로젝트·경로 맥락의 누락 또는 사용자 요청이 있을 때 필요한 `project_info` sections만 다시 조회한다.\n\n| 도구 | 입력 | 할 수 있는 일 |\n| ------- | ----- | ----- |\n| `project_info` | 필요한 `sections`: project, document, artifacts, runtime, instructions | 프로젝트 루트·파일명·공유 DB·현재 문서·작업자료 위치 조회. document에 live 확인이 포함된다. |\n| `save_rhino_document` | 없음 | 연결된 기존 `.3dm`을 같은 경로에 비대화식 저장. `saved=null`이면 완료 불명이므로 재시도 전에 실제 결과를 확인한다. |\n| `rename_artifact_folder` | `name`, 선택적 `plan_id` | 작업자료 폴더와 관련 참조를 함께 변경. |\n| `execute_project_python` | `code`, 선택적 `timeout_seconds` | 선택한 작업자료 폴더를 cwd로 하여 RhinoCode Python 3 실행. RhinoCommon과 연결된 doc 사용 가능. |\n| `execute_rhino_script`| `script`, 선택적 `language`, `timeout_seconds` | RhinoCode로 형상·속성 편집 또는 계산. 기본 Python 3, Python 2, C# statement body, command 지원. 도구 설명에 내장 rhino3d-scripts 자료가 포함된다. |\n\n### Phase → Task → Step\n\n**Phase는 작업 묶음, Task는 과업, Step은 과업의 단계**다. API에서는 Task를 `Plan`, 그 ID를 `plan_id`라고 한다. 상태는 `pending`, `running`, `paused`, `completed`, `failed`, `blocked`다.\n\n새 지시가 기존 Task의 연속이면 해당 Task를 재사용하고, 다른 과업이면 관련 Task를 선택·생성한다. 부족한 맥락만 조회하며 일회성 조회에는 새 Task를 만들지 않는다. 요청한 실행과 필요한 검수가 끝나면 완료로 판단한다.\n\nTask의 상위 Phase는 `phase_id`로 지정한다. 관련 Task는 `depends_on` 배열에 기록하고, 관련 Phase는 전용 관계 필드가 없으므로 Phase의 `description`에 ID를 적는다. 다른 파일에 속한 항목도 참조할 수 있다. 관계는 참고 정보이며 실행 순서나 자동 완료를 강제하지 않는다.\n\n| 도구 | 입력 | 할 수 있는 일 |\n| ----- | ----- | ----- |\n| `list_phases` | 선택적 `limit` | 프로젝트의 Phase 목록 조회. |\n| `get_phase` | `phase_id`, 선택적 `field_groups`, `include_ids` | Phase 이름·소속 Task 수 조회. 설명은 `description`, 파일명은 `scope` 필드 그룹으로 요청. |\n| `create_phase`  | `name`, 선택적 `description`, `file_name`, `project_file_id`, `status` | Phase 생성. |\n| `update_phase`  | `phase_id`, 바꿀 `name`, `description`, `file_name`, `project_file_id`, `status` | Phase 정보 수정. |\n| `list_plans` | 선택적 `phase_id`, `scene_id`, `status`, `limit` | Phase·Scene·상태로 범위를 좁혀 Task 요약 조회. ID는 `include_ids=true`로 요청한다. |\n| `get_plan`| `plan_id`, 선택적 `revision`, `field_groups`, `include_ids` | Task 요약 또는 저장 revision 조회. `field_groups=[\"steps\"]`는 Step과 입출력 참조를 함께 반환한다. 대상·맥락 관계도 필요하면 `\"references\"`, Plan 작업자료도 필요하면 `\"artifacts\"`를 추가한다. 일반 조회의 `field_groups` 생략·`[]`은 요약, `all`은 전체 상세, `audit`은 기술 timestamp다. |\n| `set_working_plan` | 선택할 Task의 `plan_id`, 선택적 `step_id`, 최초 폴더 이름 `artifact_name` | 연결에서 Task·Step과 작업자료 폴더를 선택·재사용한다. 이름을 생략하면 Task 목표로 폴더를 정한다. |\n| `create_plan`| Task 목표 `goal`, 선택적 `scope`, `phase_id`, 맥락 `scene_id` 또는 `scene_ids`, 편집 대상 `component_ids`, 관련 `depends_on` | Task와 기본 Step 생성. scope는 house, interior, structure, drawing, component. |\n| `update_plan`| `plan_id`, 바꿀 목표·참조·상태·`artifact_refs`, `expected_revision` | Task 정보와 상태 수정. 조회한 revision을 전달해 오래된 수정의 충돌을 막는다. |\n| `update_step`| `plan_id`, `step_id`, `status`, 선택적 입출력 참조·대상, `expected_revision` | Step의 의미 있는 진행·중단·결과를 기록한다. 대상 `null`은 Task 상속, `[]`는 대상 없음이다. |\n| `resolve_targets`  | `plan_id`, 선택적 `step_id` | Task 또는 Step이 가리키는 ontological-component·문서·group 확인. |\n| `list_plan_revisions` | `plan_id`, 선택적 `limit` | Task의 저장된 변경 이력 조회. |\n\n파일 관계는 `project_files`의 파일명과 UUID를 사용한다. `list_project_files(include_ids=true)`에서 파일 ID를 조회하고 Scene·Phase의 `project_file_id`에 넣는다. 같은 이름이 여러 개면 ID를 지정한다. `file_name`에는 폴더 없이 `ddd.3dm`처럼 파일명만 넣으며 빈 문자열로 관계를 해제한다. 실제 파일 이동·이름 변경은 수행하지 않는다.\n\nPhase·Task·Step의 상태는 pending, running, completed, failed, blocked, paused 중 선택한다. DB의 `workflow_statuses` 관계로 같은 선택지를 제한한다. scope는 `planning_scopes` 관계이며 기본값 외에 새 이름을 추가할 때 `template_scope`를 house/interior/structure/drawing/component 중 하나로 지정한다. 예: scope=facade, template_scope=component. 이름을 추가해도 실행 권한이나 새로운 모델링 도구가 생기지는 않는다. 장부 시간은 UTC 분 단위이며 revision으로 같은 분 안의 변경 순서를 구분한다.\n\n### Scene·ontological-component\n\nScene은 행태·프로그램·장면의 맥락이고, ontological-component는 그 장면을 가능하게 하는 건축 요소와 의미의 묶음이다. ontological-component는 여러 Scene에 참여할 수 있다. 개별 객체는 DB에 등록하지 않는다. Scene은 ontological-component를 통해 현재 Rhino 객체를 조회한다.\n\n#### Scene\n\nScene은 특정 공간에서 일어나는 **행태·프로그램·장면·가치**다. 파일 전체를 Scene 하나로 치환하지 않는다. Scene의 `file_name`을 필요할 때 조회해 현재 활성 파일과 대조한다. 이 필드는 작업 문서의 안내 정보이며 파일을 이동하거나 문서를 자동 전환하지 않는다.\n\n| 도구 | 입력 | 할 수 있는 일 |\n| -- | ----- | --- |\n| `list_design_scenes` | 선택적 `name` 부분검색, `file_name` 정확한 파일명, `limit`, `offset`, `field_groups`, `include_ids` | 프로젝트 전체 Scene 목록. 기본은 이름만 반환하며 `include_ids=true`로 ID, `field_groups=[\"scope\"]`로 파일명·단위를 추가한다. |\n| `get_design_scene` | `scene_id`, 선택적 `field_groups`, `include_ids` | Scene 요약 조회. 파일명·단위는 `scope`, revision은 `state` 필드 그룹으로 요청. |\n| `create_design_scene` | `name`, 선택적 `units`, `file_name`, `project_file_id` | Scene 생성. |\n| `update_design_scene` | `scene_id`, `file_name` 또는 `project_file_id` | 기존 Scene의 파일 관계 변경. |\n| `get_scene_objects`| `scene_id`, 선택적 `limit`, `offset`, `field_groups`, `include_ids`, `expected_model_path` | 현재 Rhino에서 Scene의 ontological-component 멤버를 읽기 전용으로 조회. 개별 객체는 DB에 저장하지 않는다. |\n\n목록과 객체 페이지의 limit은 1–200이다. Scene 삭제 도구는 없으며 등록 정보 변경에는 공개 도구를 사용한다.\n\n#### ontological-component\n\nontological-component는 **건축 요소와, 그 요소들이 함께 가능하게 하는 사용·행태·구조적 역할을 묶은 의미 단위**다. 무엇을 만들었는지와 그 묶음이 무엇을 가능하게 하는지를 함께 설명할 수 있어야 한다. 객체 종류·재료·거리만으로 경계를 정하지 않는다. 예를 들어 창문 하나를 일률적으로 ontological-component로 등록하는 대신, 바깥 풍경을 보며 머무르는 장소를 만드는 벽·창문 등의 관계를 보고 묶는다.\n\n##### 예시(중요)\n\n###### 1. 마루와 계단참\n\n![마루·계단참·지지 구조·가구의 공간 관계](features/guidance/guides/references/assets/resident-porch.png)\n\n작은 계단참과 마루에서 사람들이 머물고 교류하는 행태가 Scene이다. 그 Scene을 이루는 ontological-component는 다음처럼 **실물 구성과 그것이 가능하게 하는 것**을 함께 갖는다.\n\n| ontological-component | 함께 구성하는 요소와 의미 |\n|---|---|\n| 마루 위 공간을 지지하는 구조 | 기둥·보 여러 개가 함께 위에서 오는 하중을 지지한다. 기둥마다 따로 등록하지 않는다. |\n| 사람들이 걸터앉는 마루·계단참 | 지지 콘크리트와 마루 마감이 함께 단차와 앉을 자리를 만든다. 마루라는 실물이면서 걸터앉을 수 있게 하는 장치다. 공유 바닥슬래브 전체를 포함할 필요는 없다. |\n| 마루에서 바둑 두는 가구 묶음 | 방석·낮은 탁자·바둑판·바둑알과 통·시계 등이 함께 앉아서 바둑 두는 행위를 가능하게 하고 유도한다. 가구 하나씩 나누지 않고, 그 행위와 사용 관계로 묶는다. |\n\n###### 2. 지붕과 우수관\n\n![지붕과 우수관](features/guidance/guides/references/assets/roof-drainage.png)\n\n지붕의 의미에는 덮는 역할과 함께 집수·배수가 이어진다. 우수관이 여러 층을 지나거나 기둥 속 콘크리트에 매립돼 있어도 그 역할이 이어지므로 지붕 ontological-component에 포함한다. 지붕 안의 구축 시스템과 우수관 element들은 일반 group으로 나눠 관리할 수 있다. **물리적으로 떨어져 있어도 하나의 역할을 이루면 같은 ontological-component가 될 수 있다.** 두 사례의 [사용자 설명 원문과 사진](features/guidance/guides/references/component-feedback.md)은 별도로 보존한다.\n\n##### 등록·관리 도구\n\n의미 단위를 이루는 객체들을 한 `.3dm`의 Rhino group으로 정의해 ontological-component로 등록한다. 일반 group이 자동으로 ontological-component가 되는 것은 아니다. 내부 구축 시스템·부재는 편집 목적에 따라 일반 group이나 block으로 정리한다.\n\n| 도구 | 입력 | 할 수 있는 일 |\n| --- | --- | --- |\n| `list_ontological_components`  | 선택적 `scene_id`, `recursive`, `field_groups`, `include_ids` | 지정 Scene 또는 연결 문서의 등록 root 목록 조회. `recursive=true`로 등록 자손도 포함한다. |\n| `get_ontological_component` | `component_id`, 선택적 `live`, `recursive`, `field_groups`, `include_ids` | 저장 요약 조회. 실제 group은 `live=true`, 형상은 `field_groups=[\"geometry\"]`로 요청한다. |\n| `upsert_ontological_component` | `name`, 선택적 `object_ids`·`scene_ids`·기존 ID·group GUID·`child_component_ids` | ontological-component 생성·구성 변경·기존 group 채택. GUID 또는 기존 등록 group이 있으면 `object_ids` 생략/null로 실제 멤버를 해석한다. 명시 `[]`는 직접 소유 0개다. 신규 등록에는 Scene이 필요하다. |\n| `sync_ontological_component`| `component_id`, `component_ids`, `scene_id` 중 선택; `component_id` 지정 시 선택적 `rhino_group_id`; 대상 생략 시 연결 문서 | 실제 group에 맞춰 선택 범위의 멤버십·등록 정보를 정합. |\n| `remove_ontological_component` | `component_id` | ontological-component 등록 해제. 형상과 group은 유지. |\n\n등록은 현재 Rhino group의 이름·멤버를 기준으로 하며, 부모 group이 자손 객체를 포함해도 직접 소유권은 자식에 남는다. 등록 해제와 group/block 해체는 별개다. 등록·구성 변경의 입력과 제약은 해당 도구 설명을 따른다.\n\n실제 편집 상태가 필요하면 DB 요약 대신 live 조회를 사용한다. 수동 편집·멤버 교체·Undo/Redo 뒤에는 group/block 편집을 마치고 문서가 안정됐을 때 영향받은 등록 범위를 한 번 sync하며, 결과의 문제·미확인 항목을 확인한다. 이름·색 변경만으로 멤버십 정합을 반복하지 않는다.\n\n등록과 sync는 형상·멤버십 복구 도구가 아니며, 등록의 Undo도 Rhino group-table의 생성·이름 변경·삭제를 모두 되돌리지는 않는다. 재편·복구는 현재 Rhino 상태와 공개 도구의 지원 범위를 확인해 진행하고, DB나 소유권 UserString을 직접 고쳐 우회하지 않는다.\n\n## 모델링\n\n### 건축물을 모델로 다루기\n\n건축 모델링은 공간을 이루는 물질적 구성을 설계하고 구체화하는 일이다. 모델에서 부재와 재료가 차지하는 부분, 그 사이에 생기는 공간, 공간을 연결하거나 나누는 경계를 함께 읽는다. 형상의 크기·두께·방향·배치는 사람이 머물고 움직이는 방식과 빛·시선·환경을 받아들이는 조건을 만든다. 형상을 수정할 때는 그 변화가 어떤 공간과 사용을 가능하게 하고 무엇을 어렵게 하는지 판단한다.\n\n모델의 요소는 건축물 안에서 서로 역할을 주고받는다. 한 요소가 여러 공간을 형성하거나 다른 요소를 지지할 수 있고, 떨어진 요소들이 하나의 기능을 함께 수행할 수도 있다. 따라서 요소의 이름이나 현재 묶음만으로 역할을 확정하지 않고, 어디에 놓여 무엇과 연결되며 어떤 구성에 참여하는지 해석한다. 과업의 규모에 따라 이 관계를 실내에서 건축물 전체와 주변 환경까지 연결해 이해한다.\n\nRhino 객체는 이 건축을 표현하는 편집 단위다. 하나의 실물 부재가 여러 객체로 나뉘거나 하나의 객체가 복합적인 구성을 단순화해 나타낼 수 있다. 모델을 읽을 때는 형상이 무엇을 나타내는지와 실제로 어느 정도까지 구체화돼 있는지를 구별한다. 분할된 객체 사이의 경계와 실물의 이음, 모델에 생긴 빈틈과 의도한 공간은 그 의미를 확인해야 구분할 수 있다.\n\n### 텍토닉: 재료와 구성, 접합\n\n텍토닉은 재료의 성질과 부재의 구성·결합이 건축의 공간과 표현을 성립시키는 방식이다. 재료의 물성과 가공 방식, 부재를 만들고 조립하는 순서는 가능한 형상·치수·접합을 제약한다. 요소를 이해할 때는 이 조건 속에서 부재가 무엇을 받치거나 감싸며, 힘과 기능이 다른 요소로 어떻게 이어지는지 읽는다. 실제 역할과 만드는 방식이 부재의 구분과 연결을 판단하는 근거다.\n\n접합부에는 요소 사이의 의존 관계가 드러난다. 연속돼야 할 부분, 힘이나 기능을 넘겨받는 부분, 서로 움직이거나 교체할 수 있도록 분리할 부분은 서로 다른 구성을 요구한다. 맞닿음·겹침·틈은 이 관계를 표현하는 기하 상태이므로, 각각이 재료·시공·사용 조건에 맞는지 판단한다. 모델에서 면이 맞거나 솔리드가 닫혔다는 사실과, 실제로 조립되고 역할을 수행할 수 있다는 판단은 별도의 근거를 갖는다.\n\n공간과 구축은 함께 발전한다. 부재의 위치와 깊이, 재료의 두께, 접합과 지지 방식은 공간의 여유·개방감·경계의 성질을 바꾸고, 원하는 공간은 다시 구성 방식의 선택에 영향을 준다. 현재 설계 단계에서 판단하려는 내용에 맞춰 형상을 구체화한다. 단순화한 표현으로 남긴 구성과 실제 상세를 결정한 부분을 구별하고, 상세를 추가할 때는 전체 구성과의 관계를 이어 간다.\n\n#### 구축 시스템과 표현 단계\n\n구축 레이어에서 유형 레이어는 시스템 미정, 시스템명 레이어는 시스템이 정해진 단순화 표현, 요소역할 하위 레이어는 부재·마감의 상세 표현에 쓴다.\n\n시스템명 레이어의 단순 형상을 상세화할 때는 `get_construction_guidance(query=\"시스템명\", field_groups=[\"rules\"])`로 요소 역할·재료·간격·초기 치수·구성 메모를 조회한다. 검색 결과의 시스템명을 대조하고, 모델의 지지·경계·접합 조건에 맞춰 부재·마감을 구체화해 기존 요소역할 레이어에 배치한다. 접합 상세의 참고 출처가 필요하면 `search_detail_sources`를 사용한다.\n\n함께 조립·편집할 하나의 구축 구성을 group으로 묶는 것을 권장한다.\n\n### 구성의 발전과 형상 편집\n\n사용자의 목표와 기존 모델·도면·피드백을 함께 읽고, 이어 가야 할 설계 의도와 바꿀 수 있는 조건을 파악한다. 기반자료는 맥락의 근거이며, 이후 합의로 발전한 설계를 과거 문구에 맞춰 되돌리는 명령이 아니다. 지적된 현상을 개별 객체의 수정으로만 환원하지 않고, 그 현상이 공간과 구축의 관계에서 어떤 문제를 만드는지 이해한다. 기존 구성의 역할을 해석해 보완할 지점을 찾고, 유사한 구성을 참고할 때도 현재 목적과 주변 관계에 맞는지 판단한다.\n\n수정할 객체의 범위는 판단하려는 건축 요소와 변경의 영향에서 정한다. 한 요소가 여러 객체에 걸쳐 있으면 그 전체의 형상과 연결을 이해하고, 주변 요소와의 관계가 문제라면 그 관계를 함께 살핀다. 관련 범위에 같은 문제가 반복되는지도 살펴 필요한 조치를 판단한다. 격리나 분류는 이 판단을 돕는 관찰 방법이다. 과업이 달라졌을 때는 앞서 사용한 작업 구획을 이어 쓰기 전에 이번 판단에 필요한 관계가 그 안에 드러나는지 살핀다.\n\n구성을 고칠 때는 현재 방식으로 의도한 역할이 성립하는지 고찰하고, 필요한 경우 부재의 구성·접합·배치나 공간 조직의 대안을 모색한다. 각 대안이 사용자의 의도, 공간 경험, 구축의 성립에 주는 이점과 제약을 비교한다. 형상을 정돈하는 것으로 해소되는 문제와 구성 방식 자체를 바꿔야 하는 문제를 구별해 사용자가 정한 조건 안에서 발전시킨다. 중요한 설계 선택이 불확실하면 대안의 차이와 영향을 설명한다.\n\n실현할 변화가 정해지면 그에 맞는 형상 연산을 선택한다. 이동·면 편집·절단·결합·재구성은 부재와 공간의 관계를 구현하는 수단이다. 연산으로 경계가 사라지거나 객체가 나뉠 때 실제로 연속시킬 부분과 별도 부재로 남길 부분이 현재 표현 목적에 맞게 유지되는지 판단한다. 바뀐 형상에 맞춰 관련 구성과 속성·묶음도 정합하며, 기존 형상을 활용할지 새로 구성할지는 보존해야 할 내용과 필요한 변화에 따라 정한다. 수정 후에는 변경된 객체의 형태뿐 아니라 주변과 함께 의도한 상태를 이루는지, 관련 범위에 같은 문제가 남았는지 확인하고 필요한 조치를 한다.\n\n### 객체들의 묶음 단위 유형\n\n함께 다룰 구성과 변경을 공유할 범위에 따라 group과 block을 선택·조합한다. Group은 개별 객체와 재귀적 묶음을 유지하고, group 자체는 복사본 사이에 변경을 전파하지 않는다. 한 객체가 여러 group에 속할 수 있으므로 중첩과 멤버 중복을 구분한다. Block은 definition을 공유하는 instance의 배치로, 각 배치의 위치·회전·축척은 개별적이고 정의 변경은 공유 배치에 반영된다. 일부 배치의 구성만 달라져야 하면 정의를 분리한다. 중첩 block은 보존되지만 일반 group의 묶음 관계는 block definition 내부에 보존되지 않으며, 바깥 group을 복사해도 내부 block은 정의를 공유한다. 묶음을 전환·해체·재조립할 때는 개별화할 형상과 남길 하위 구성, 변경이 전파될 배치를 구분한다.\n\n#### BlockEditNew에서 편집 범위를 다루기\n\nBlockEditNew에서는 뷰포트에서 선택한 group이나 block instance를 열고, 중첩 구성의 필요한 단계로 들어가 편집한다. Group 편집은 묶음의 구성원들을 다루는 작업이고, block 편집은 선택한 배치를 통해 공유 정의의 내용을 고치는 작업이다. Block을 열었을 때 화면에서 선택 가능한 작업 객체는 저장된 definition 내부 객체와 같은 식별 대상이 아니다. 정의 내부 GUID와 현재 편집 객체의 ID를 구분하고, 편집 진입·완료·재구성 뒤에는 대상을 다시 조회한다. 정의와 배치 변환은 이때 어떤 구성과 위치를 편집하는지 연결하는 근거가 된다.\n\n격리된 부분에서는 부재의 형상과 내부 구성을 읽기 쉽고, 그 부분이 전체에서 맡는 역할은 주변 관계 속에서 판단할 수 있다. 검토할 관계에 맞춰 편집 깊이와 관찰 범위를 선택하고, 부분의 변경이 끝나면 영향을 받는 상위 구성과 공유 배치에서 결과를 확인한다. 중첩 단계 밖의 선택·표시 상태를 임의로 재설정해 현재 편집 맥락을 잃지 않도록 한다. 실제 편집 상태는 `get_rhino_context(sections=[\"editor\"])`, 블록의 중첩 경로와 현재 선택 가능한 블록 후보는 `analyze_block_reculviely`로 확인할 수 있다.\n\n묶음을 별도의 의미 단위(ontological-component)로 등록해 관리하는 경우에는 [등록·관리](#등록관리-도구)의 소유 관계와 정합 계약도 적용한다. 물리적인 묶음의 편집과 의미 등록의 변경은 각각 확인한다.\n\n### 모델링 검수\n\n관찰·검수용 이미지를 만들기 위해 원본 모델을 별도 위치에 복사하거나, 실제 모델의 수정·검수 대신 이미지에 형상을 덧그리지 않는다.\n\n검수는 바뀐 모델이 해결하려던 설계 문제를 해결했는지, 의도한 공간과 구축을 성립시키는지 판단하는 과정이다. 수정한 형상에서 출발해 그 요소의 역할, 접합과 연속, 영향을 받은 공간과 다른 요소로 판단을 이어 간다. 국소적인 형상 개선이 주변의 사용이나 구성에 새로운 문제를 만들었는지도 살핀다.\n\n무엇을 판단할지에 따라 관찰 방법을 정한다. 전체 배치와 공간 관계, 부재의 연결, 가려진 내부 구성은 필요한 관찰 범위와 시점이 다르다. 판단에 필요한 요소들이 함께 드러나도록 화면을 구성하고 실제 이미지를 읽는다. 격리한 화면이 보여 주는 관계와 제외한 관계를 구분하며, 잘린 요소나 빠진 주변 구성 때문에 판단 근거가 달라지지 않는지 확인한다.\n\n시각적으로 읽은 내용은 그 판단에 필요한 형상과 치수로 대조한다. 부재 전체의 연속성을 판단하려면 그 부재를 이루는 객체들의 관계를, 접합을 판단하려면 맞물리는 요소의 실제 형상과 구성을 확인한다. 수치상 교차·간격이나 객체별 유효성은 해당 질문의 근거로 해석한다. 검사를 통과한 항목만으로 아직 보지 않은 관계까지 성립한다고 확대하지 않는다.\n\n의미 있는 편집 묶음이 끝나면 결과를 사용자의 목표와 보존 조건에 대조하고, 그 결과를 바탕으로 다음 개입을 정한다. 변경으로 판단 범위나 구성에 대한 이해가 달라졌다면 관찰과 설계를 다시 이어 간다.\n\n확인한 사실, 설계 의도에 대한 해석, 가정과 미확인 사항을 구분한다. 실행 성공과 형상의 유효성, 공간·구축의 적합성, 사용자 요청의 완료는 각각의 근거로 판단하며 미검사 범위와 남은 문제를 보고한다.\n\n## Drafting\n\n도면은 건축 요소의 표현이자 공간의 구성과 사용을 구상하고 전달하는 설계 도구다. 도면을 읽을 때는 그려진 형상과 표현을 파악하는 동시에, 그 구성이 만들어 내는 공간과 경험, 사람들이 그 안에서 맺는 관계를 이해한다.\n\n### 도면을 공간과 의미로 읽기\n\n도면의 요소를 독립된 객체나 선의 집합으로만 보지 않는다. 요소들이 함께 형성하는 공간적 관계와 그 관계가 가능하게 하는 사용·행태·경험을 읽는다. 하나의 요소가 여러 공간과 역할에 걸쳐 작용할 수 있음을 고려하고, 물리적으로 떨어진 요소도 하나의 사용이나 역할을 함께 이룰 수 있음을 살핀다.\n\n공간의 의미는 실의 명칭이나 도면 기호만으로 결정되지 않는다. 공간의 구성과 주변 관계를 바탕으로 그곳에서 일어날 수 있는 행태를 구상하고, 그 행태가 공간과 건축 요소에 의해 어떻게 뒷받침되는지 판단한다.\n\n평면·단면·입면은 같은 건축을 서로 다른 관점에서 보여 준다. 하나의 도면에서 읽은 관계를 다른 도면이나 모델과 연결해 이해하고, 확인할 수 없는 사항은 추론의 범위와 함께 구분한다.\n\n#### 행태와 공간 경험\n\n공간을 구상하고 검토할 때 사람이 그곳을 어떻게 경험하고 이용할지 생각한다. 공간의 크기나 형태뿐 아니라 공간 사이의 연결과 전이, 경계와 개방, 이용의 가능성과 제약을 함께 이해한다.\n\n사람의 행태는 고정된 하나의 장면이 아니다. 공간은 이용자와 상황에 따라 다르게 사용될 수 있으며, 그 변화가 공간 구성과 어떤 관계를 맺는지 살핀다. 설계가 어떤 경험을 유도하고 무엇을 선택할 수 있게 하는지, 또는 어떤 이용을 어렵게 하는지 판단한다.\n\n도면에 표현된 행태를 그대로 받아들이는 데 그치지 않고, 실제 공간에서 가능한 관계인지 검토한다. 도면만으로 확인할 수 없는 이용 조건은 필요한 자료와 시점을 통해 보완한다.\n\n#### 공간의 규모와 사회적 관계\n\n도면을 개별 실과 건축 요소에서 시작해 더 넓은 공간적 맥락과 연결해 읽는다. 과업의 규모와 목적에 따라 개인의 생활, 공동체의 관계, 거리와 도시, 사회적 가치까지 건축적 판단의 범위에 포함한다.\n\n사람과 사람, 개인과 공동체, 건축과 주변 환경의 관계가 공간을 통해 어떻게 형성되는지 고찰한다. 공간적 구성과 사회적 가치 사이의 관계를 살피되, 도면만으로 확정할 수 없는 운영이나 사회적 효과는 해석과 제안으로 구분한다.\n\n### 설계와 도면의 발전\n\n도면 작업에서는 사용자의 의도와 설계 방향을 바탕으로 공간을 발전시키고, 그 결과가 도면에 정확하게 반영되도록 한다. 피드백이 특정 요소를 가리키더라도 그것이 놓인 공간과 주변 관계를 함께 이해한다.\n\n평면을 수정하거나 새롭게 구성할 때는 도면상 형상의 변화가 실제 공간의 사용과 경험에 어떤 영향을 주는지 판단한다. 설계 과정에서 발견한 관계와 문제를 도면의 구성에 반영하고, 변경에 따라 함께 달라져야 할 사항을 정합한다.\n\n확인된 조건을 바탕으로 전문적으로 판단하되, 사용자의 의도나 중요한 설계 선택이 불확실하면 그 불확실성과 선택의 영향을 분명히 설명한다.\n\n작업의 목적과 대상, 설계 단계, 사용자의 결정과 조건을 파악한다. 현재 도면과 관련 스케치·피드백을 함께 읽고 공간의 구성과 맥락을 이해한다.\n\n실제 도면 이미지를 보며 공간의 구성과 사용 관계를 검토한다. 그려진 요소가 의도한 공간과 행태를 뒷받침하는지, 도면이 설계의 관계를 정확하게 전달하는지 확인한다.\n\n시각적으로 읽은 내용은 필요한 형상과 치수로 대조한다. 평면에서 확인하기 어려운 사항은 단면·입면·모델을 함께 살피고, 수정한 부분과 그 영향을 받는 공간을 다시 검토한다. 지정된 Named View가 있으면 검수에 활용한다.\n\n도면에서 확인한 사실과 그에 대한 해석, 설계상 가정과 미확인 사항을 구분한다.\n\n벽·문·가구·동선·프로그램 관계를 촘촘히 검토한 과거 과정의 참고 이미지가 필요하면 [Bonsai 평면 개요](features/guidance/guides/Bonsai-FloorPlan-overview.png)를 확인하되, 이를 최신 공간 결정이나 완성 도면 원본으로 사용하지 않는다.\n\n### 도면의 작성과 관리\n먼저 도면으로 무엇을 보여주고 어떤 판단을 돕는지 정하고, 그 목적에 필요한 범위와 축척을 선택한다. 선·면·색·두께의 위계가 전달할 관계를 드러내도록 구성하며, 주변 맥락을 포함하느라 핵심 대상이 읽히지 않으면 범위를 조절하거나 별도 도면으로 나눈다.\n\n#### Layout 생성 및 관리\n\nLayout은 현재 파일에서 사용하는 도면을 모은 도면집이다.\n\n- 도면 Layout을 구성할 때는 현재 Rhino 문서에 실제 존재하는 Layout·PageSpace·Detail을 조회해 목적·용지·축척에 맞게 재사용하거나 조정할 수 있는지 살핀다.\n- 필요하면 새 Layout과 Detail 뷰를 추가한다.\n- 채택·폐기로 불필요해진 Layout·대안 복사본은 원본과 필요한 도면·주석·비교 근거를 보존하며 정리한다.\n- 본 도면을 갱신할 때는 검토 대안이 추출 범위에 섞이지 않았는지 확인한다.\n\n#### 도면 생성 툴: [PlanSection](features/modeling/PlanSection/README.md#에이전트에서-사용)\n\nClipping plane GUID를 받아 평면·단면의 단면선·해치·가시 입면선을 추출한다. `execute_rhino_script`에서 해당 스크립트의 `run()`을 호출하며, 입력 형식과 호출 예시는 링크를 따른다. 출력은 별도의 도면 레이어에 놓이며 원본 객체의 색·선종류·SectionStyle을 상속한다. Name·일반 사용자 속성은 실제 기여 원본의 값이 모두 같을 때만 상속하고 충돌·미지원 값은 보고한다. 출력 UserDictionary의 `Floor`는 clipping 이름이다. 단면·입면선의 인쇄색·두께는 출력 레이어를 따르며, 해치는 SectionStyle에 채움이 있을 때 생성된다.\n\n도면은 clipping plane의 축을 기준으로 WorldXY와 평행하게 놓이며, 배치 기준점은 clipping plane의 원점에 대응하는 점이다. `Create`·`Move`의 `points={GUID: [x, y, z]}`로 그 기준점의 절대 위치를 문서 단위로 지정한다. `[x, y]`는 Z=0이고 `Update`는 저장된 높이를 유지한다. `PDF`는 Z=0에서 출력한다. `Move`는 기존 도면을 그대로 옮기고, `Update`는 저장된 위치에서 다시 추출하므로 출력에 직접 가한 형상·속성 수정은 교체된다. `PDF`는 clipping의 `Paper`·`Scale`과 원점으로 용지 크기·축척·중심을 정하며, 용지 밖은 잘라낸다.\n\n#### 도면 표현·출력 검수\n\n관찰·검수용 이미지를 만들기 위해 원본 모델·도면을 별도 위치에 복사하거나, 실제 도면의 수정·검수 대신 이미지에 형상을 덧그리지 않는다.\n\n도면의 용도와 축척에 맞춰 선두께·선종류·해치·문자와 치수의 가독성·잘림을 확인한다. Layout 도면을 검토할 때는 뷰 목록에서 해당 Layout GUID를 골라 용지와 Detail을 캡처하고, 용지 크기와 Detail 축척을 확인한다. 정적 도면의 축척은 이름으로 추정하지 않는다. 파일을 출력했다면 출력본도 열어 확인하고 수정한 부분을 다시 검수한다.\n\n도면을 확인할 때 해당 문서의 PrintDisplay와 Model·Layout의 Print colors 적용 상태를 확인하고, 필요한 설정을 적용한 뒤 Layout 화면을 이미지로 읽는다. 캡처가 실제 화면과 다른 표현을 보이면 그 차이를 확인하고 신뢰할 수 있는 화면 캡처를 사용한다. PrintDisplay는 세밀한 선두께·회색 농도·출력색을 정확히 재현하지 않을 수 있으므로 표현의 대략적인 확인에 사용하고, 세밀한 출력 판단이 필요하면 실제 출력본을 열어 확인한다. Layout 캡처 자체는 기존 Detail 축척과 PrintDisplay를 변경하지 않는다. Detail이 없는 정적 PageSpace 도면만으로는 Detail 축척을 입증할 수 없고, Detail의 존재·축척만으로 출력 객체의 Space·ViewportId와 실제 표시까지 보증되지는 않는다.\n\nPrintDisplay는 `-PrintDisplay State On`으로 켜며, 표시 모드는 검토할 표현에 맞는 설치된 모드를 선택한다. 모델뷰에서는 `-PrintDisplay Scale \u003c축척 숫자>`로 검토 축척을 지정한다. Layout에서는 Detail 축척이 적용된다. 끄거나 전환할 때는 `-PrintDisplay State Off` 또는 `-PrintDisplay State Toggle`을 사용한다. Scale은 모델뷰의 선두께 표시 배율이며, 선 색은 `Color=Print` 설정과 객체·레이어의 Print Color에 따른다.\n\n## 구조 검토\n\n명시한 부재·재료·하중·지지 조건으로 구조를 검토한다. 응답의 engine·해석 수준을 확인하며, `rule_based/low` 결과는 FEA 결과와 구분한다.\n\n| 도구 | 입력 | 할 수 있는 일 |\n|---|---|---|\n| `list_design_codes` | 선택적 `include_ids` | 지원 구조 설계 코드 목록 조회.|\n| `validate_structure` | 객체 `guids`, 구조 형식·재료·하중·지지·해석 조건 | 구조 검토 실행·이력 기록. 응답의 engine·해석 수준 확인. |\n| `visualize_structure`| 대상·해석 조건, 선택적 표시 설정 | 구조 검토 결과를 Rhino 화면에 표시. |\n| `export_structural_report` | 선택적 `path`, `limit`  | 구조 검토 이력 보고서 출력.|\n| `check_egress` | `plate_bounds_mm`, `exits`, 용도·층수·피난 조건  | 출구 수·분리·폭·이동거리 검토. |\n\n## 거의 사용하지 않는 기능\n\n### 자산 목록·검색\n\n모델·2D 자산은 공통 목록에서 다루며, 3D 대표 파일은 3DM이다. 생성·입수 경위는 출처 정보로 보존하고 Diagram은 도식용 자료로 구분한다. [준비·등록·배치·교환·외부 발행·카메라 경로 작업](features/guidance/guides/references/asset-workflows.md)은 해당 작업을 할 때 읽는다.\n\n| 도구| 입력  | 할 수 있는 일  |\n| --- | --- | --- |\n| `search_asset_repository` | `query`, 선택적 `kind`, `drawing_ready`, `limit` | 통합 자산 후보 검색. |\n| `list_drawing_assets`  | 선택적 `category`, `limit`, `offset`| 모델·2D 자산 목록 조회. |\n| `search_drawing_assets`| 검색어·분류·최대 치수 조건  | 크기와 용도에 맞는 모델·2D 자산 검색.  |\n| `get_drawing_asset` | `asset_id`| 3DM 가용성·측정 치수·메타데이터 조회.|\n| `get_asset_drawing` | `asset_id`| 자산의 평면·정면·측면 도면 파일 목록 조회. |\n| `list_diagram_assets`  | 선택적 `category`, `limit`, `offset`| Diagram 자산 목록 조회. |\n| `search_diagram_assets`| 검색어·분류·최대 치수 조건  | Diagram 자산 검색.|\n| `get_diagram_asset` | `asset_id`| Diagram 파일·크기·배치 조건 조회. |\n| `get_retrieval_status` | 선택적 `include_ids`  | 자산 색인·검색 기능 상태 조회.  |\n\n이름·종류로 후보를 좁힌 뒤 치수는 dimensions, 실제 파일은 paths, 출처·라이선스는 source 등 해당 도구가 지원하는 field_groups로 추가한다. include_ids만 켜서 모든 상세를 받은 것으로 해석하지 않는다. 기존 자산 provenance·라이선스는 보존한다.\n\n### Grasshopper\n\n| 도구| 입력| 할 수 있는 일|\n| --- | --- | --- |\n| `list_library`| 선택적 `include_ids`| Grasshopper 로직 목록 조회. |\n| `get_logic_by_id`| `logic_id` | 로직 원형·설명 조회. |\n| `list_capsules`  | 선택적 `capability`, `audited_only=True`  | 실행 가능한 audited capsule과 입출력 port 확인.  |\n| `run_gh_definition` | `capsule_id`, port 계약에 맞는 `inputs`, 선택적 `seed`, `timeout_s` | audited capsule 실행. 정의에 따라 Rhino에 bake할 수 있다. |","basic_refs":[{"path":"src/mcp/BASIC-INSTRUCTIONS.md","sha256":"2787a9a4bf25d9795140bbe939c02660a79374890861d23b3749b9a845cae769"}],"guide_version":"4b2e60d82005d2958ebaab42537f2073566aec1fbf272a776c30472779ad8973"},"listDescriptions":{"project_info":"Read selected project information.","get_rhino_execution":"Read an official RhinoCode execution without rerunning it.","set_working_plan":"Select or resume a Plan and optional Step for this connection.","rename_artifact_folder":"Rename a Plan's artifact folder, defaulting to the selected Plan.","execute_project_python":"Execute Python 3 inside the bound Rhino through official RhinoCode, using the selected Plan artifact folder as cwd.\n\nArgs:\n    code: Synchronous Python 3 source; assign a JSON-safe value to result.\n    timeout_seconds: Integer 1-600, default 60; waiting limit, not execution cancellation.\nReturns:\n    RhinoCode outcome, request_id and selected artifact_dir, with late-result recovery.","publish_objects_to_chestnut":"Exports specific Rhino objects as one GLB and publishes them to Chestnut.\n\nArgs:\n    guids: Rhino object GUIDs to export. Unrelated document objects are excluded.\n    asset_name: Human-readable name shown in Chestnut.\n    asset_id: Stable optional ID for linked updates. Generated deterministically\n              from the Rhino document and GUIDs when omitted.\n    body_type: \"static\" for architecture, \"dynamic\" for loose props, or\n               \"kinematic\" for script-driven objects.\n    collider: Collider intent: \"box\", \"convex\", \"compound\", or \"trimesh\".\n              Chestnut currently falls back to a box where needed.\n    preserve_scale: Keep Rhino's real-world dimensions instead of normalizing\n                    the model to a one-metre display prop.\n    mass: Physics mass in kilograms. Static bodies always use zero.\nReturns:\n    JSON containing the stable Chestnut asset ID, URL, metadata, and whether\n    the operation created or updated the asset.","publish_to_chestnut":"Publishes Rhino objects to Chestnut using safe semantic defaults.\n\nArgs:\n    guids: Rhino object GUIDs returned by execute_rhino_script.\n    asset_name: Human-readable asset name.\n    behavior: Optional semantic preset:\n        \"auto\"         — infer architecture versus movable object from name\n        \"architecture\" — fixed building, terrain, structure, or enclosure\n        \"object\"       — movable physical prop affected by gravity\n        \"animated\"     — script-driven door, lift, platform, or mechanism\n    asset_id: Optional stable link ID. Omit for a deterministic Rhino link.","check_egress":"Checks a floor plate's means of egress against the construction library's egress rules (BCI A.10-A.13 framework + IBC-typical numeric factors - always verify against the governing code; the response repeats this).\n\nArgs:\n    plate_bounds_mm: Floor plate [min_x, min_y, max_x, max_y] in mm\n        (sets gross area and the diagonal used for exit separation).\n    exits: One entry per exit (stair door or exterior exit door):\n        {\"name\": str, \"x_mm\": float, \"y_mm\": float, \"width_mm\": float}.\n        Positions are the door centers; width is the clear egress width.\n    occupancy: Occupant-load key: business, mercantile, assembly_\n        unconcentrated, classroom, residential, storage.\n    stories: Stories served. Above 1, at least two exits are required\n        and exit width demand uses the stair factor (7.6 mm/occupant)\n        instead of the door factor (5.1).\n    sprinklered: Sprinklered throughout (affects separation fraction,\n        travel-distance and dead-end limits).\n    net_area_m2: Override the occupied area; 0 uses the gross plate area.\n    travel_distances_m: Measured worst-case travel distances (e.g. from\n        drawn egress paths); empty skips the travel check.\n    dead_end_m: Longest dead-end corridor in metres; 0 skips the check.\nReturns:\n    JSON: {passed, occupant_load, checks: [{check, required, provided,\n    passed, basis}], warnings, source_note}.","list_project_files":"List project filenames and stable file references without reading Rhino.","create_phase":"Create an organizational Phase for Plans; this does not edit Rhino geometry.","get_phase":"Read a Phase's name, status, description and Plan count.","list_phases":"List organizational Phases with totals and an explicit truncation flag; limit is 1-500.","update_phase":"Update Phase organization; omitted fields retain their values.","create_plan":"Create a Plan in an optional organizational Phase.","get_plan":"Read the current Plan or an immutable saved revision, including legacy baseline 0.","list_plans":"List compact Plan summaries, optionally filtered by Phase, contextual Scene or status.","update_plan":"Update Plan metadata and bindings atomically, recording a new saved revision.","list_plan_revisions":"List saved Plan revisions newest first, with operation labels and truncation metadata.","update_step":"Record a Step's status, evidence and optional explicit Component targets.","resolve_targets":"Resolve registered Step targets, or Plan targets when the Step has no override.","get_selection_references":"Read the current selection and return its registered Component, Plan and Step IDs and names in one call.","list_library":"Lists all available physics logic archetypes in the Grasshopper library.\n\nReturns:\n    JSON list of logic IDs available (e.g., [\"catenary\", \"bending\", \"01_simplebeam\"]).\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds ports, definition, source, paths, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","get_logic_by_id":"Retrieves parsed physics context for a specific Kangaroo2 or Karamba3D archetype.\n\nArgs:\n    logic_id: The filename (without extension) of the Grasshopper file.\n              Use list_library() first to see available IDs.\n              Examples: catenary, bending, 01_simplebeam\nReturns:\n    JSON string with detected physics components and context, or error.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds ports, definition, source, paths, audit, or all; the requested manifest/parsed logic/script remains in the default payload.\ninclude_ids independently enables handles; audit enables timestamps.","list_capsules":"Lists Grasshopper capsules: GH definitions with a typed, audited input/output contract that can be executed via run_gh_definition.\n\nArgs:\n    capability: Optional filter: \"analyze\", \"generate\", \"form_find\", or \"aggregate\".\n    audited_only: When true, list only capsules that run_gh_definition will accept.\nReturns:\n    JSON with total and a list of compact capsule cards.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds ports, definition, source, paths, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","run_gh_definition":"Runs an audited Grasshopper capsule (GH definition + typed contract) through the Rhino bridge and returns its declared outputs.\n\nArgs:\n    capsule_id: Stable capsule identifier from list_capsules (e.g. \"karamba_beam_v1\").\n    inputs: Object mapping ALMOND_IN_* port names to values (forms above).\n    seed: Optional integer seed for stochastic definitions; omit for deterministic ones.\n    timeout_s: Solver budget in seconds (default 60, max 600).\nReturns:\n    JSON with status, capsule_id, outputs, baked_guids, analysis_method,\n    confidence, warnings, and error — or a validation error naming the\n    offending input and the valid port names.","validate_structure":"Analyze the specified Rhino geometry under the supplied loads, supports and calculation assumptions.\n\nArgs:\n    guids: Current Rhino object GUID strings in the analysis scope.\n    structure_type: Analysis template to use. Options:\n        \"beam\"       — simple beam bending/deflection\n        \"truss\"      — axial force/buckling analysis\n        \"shell\"      — shell stress/displacement\n        \"frame\"      — moment/shear frame analysis\n        \"canopy\"     — cantilevered canopy\n        \"gridshell\"  — large deformation gridshell\n        \"membrane\"   — form-finding membrane\n        \"highrise\"   — high-rise structural systems\n    load_kn: Applied load in kN (default 10.0).\n    material: Material type: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\" (default \"Steel\").\n    engine: \"auto\" | \"native\" | \"karamba\" (see above).\n    fixed_supports: True = fully fixed supports, False = pinned (rotations free).\n    self_weight: include member self weight.\n    span_m: structural span in meters for the L/250 limit when members are split at\n        every node (e.g. a 6.2 m joist drawn as two 3.1 m segments). Native engine only.\n    asset_loads: add the gravity loads of placed library assets (estimated self weight\n        plus in-use contents/occupants from each asset's load entry, e.g. a filled\n        bathtub) where they stand on (or hang from) the frame. Placements come from\n        Rhino objects tagged with an Almond asset id, or from the scene ledger when\n        scene_id is given. Native engine only; the result's \"asset_loads\" lists every\n        placement with its load and carrying members, or why it was not applied.\n    floor_load_kn_m2: imposed floor load in kN/m2 (e.g. 2.0 for homes, EN 1991-1-1\n        category A) on every bay enclosed by beams on a level; the beams take it by the\n        45-degree rule (two-way, one-way above 2:1). Native engine only. A code floor load\n        already covers movable furniture and people: combine it with asset_loads only for\n        heavy specific items, and set load_kn to 0 to avoid double counting.\n    floor_dead_kn_m2: superimposed dead load in kN/m2 (floor build-up, finishes) on the\n        same bays.\n    design_basis: \"en1990\" (default): deflection at SLS characteristic (G + Q), member\n        checks at ULS 1.35 G + 1.5 Q. G = self weight, floor build-up and the weight of\n        placed items; Q = load_kn, the occupancy floor load, contents and occupants.\n        \"unfactored\" checks both at G + Q (the Karamba route's basis). Native engine.\n    uls_combination: \"6.10\" or \"6.10ab\" (the worse of 6.10a and 6.10b per member). Default:\n        the design code's choice (Eurocode profile: 6.10). A profile that prescribes one\n        expression overrides the request (with a warning).\n    design_code: design code profile for the numbers a code or National Annex sets\n        (gamma_G, gamma_Q, psi_0, xi, gamma_M0, gamma_M1, deflection limit): \"eurocode\"\n        (default, EN recommended values), any profile from list_design_codes, or \"off\"\n        (unfactored G + Q, no partial factors; same as design_basis=\"unfactored\").\n        Results carry \"design_code\" with the values used and any unverified ones.\n    fabrication: hollow steel sections (CHS/RHS) are \"cold_formed\" (default, EN 10219,\n        buckling curve c) or \"hot_finished\" (EN 10210, curve a; a0 for S460). The difference\n        is up to about 23 % in buckling resistance; use hot_finished only when specified.\n    detail: native engine only. Adds \"members\" (per member: role, length, section, ULS design\n        forces N/V/M/T, governing combination and check, slenderness, chi, stress,\n        utilization, SLS deflection and span/deflection ratio, pinned ends) and \"supports\"\n        (reactions Fx..Mz at SLS and each ULS combination). Off by default to keep replies short.\n    connections: \"rigid\" (default: every joint transmits moment) or \"simple\": beams are\n        pinned (major-axis bending released) and braces pinned in both axes where they\n        stop - not where another member carries on in line - while columns stay\n        continuous. Typical bolted steel and timber framing is closer to \"simple\"; rigid\n        joints can flatter beam deflection. A curve's user text almond:release = \"pinned\" |\n        \"pinned_start\" | \"pinned_end\" | \"rigid\" overrides either mode. Native engine.\n    stability: \"auto\" (default): elastic critical load factor alpha_cr for every ULS\n        combination (EN 1993-1-1 5.2.1) and sway imperfections phi = 1/200 x alpha_h x alpha_m\n        (5.3.2) in +/-x and +/-y; alpha_cr \u003c 10 runs a second-order (P-Delta) ULS analysis,\n        alpha_cr \u003c= 1 fails as unstable. \"off\": first-order without imperfections.\nThe tool also compares the analyzed span with the construction-system library\nand appends a \"construction_check\" object (matching_systems with\nfits_span and suggested member depths, plus warnings when the span falls\noutside every curated system's range for this structure_type/material).\n\nReturns:\n    JSON from the bridge plus the construction_check. Top-level fields: status\n    (\"pass\"|\"fail\"|\"error\"), passed (bool), verdict (text), suggestions,\n    confidence (\"high\"|\"medium\"|\"low\"), warnings, and worst_member_guids\n    (up to 5 Rhino GUIDs of the most over-utilized members). The results\n    object carries the numbers: max_deflection_mm,\n    deflection_limit_mm, utilization_ratio, max_stress_mpa, yield_stress_mpa,\n    span_m, analysis_method (\"native\"|\"api\"|\"template\"|\"rule_based\"), reactions_kn\n    (total vertical reaction, api path only), and per_element_utilization —\n    a list of {source_guids, utilization} entries (utilization 1.0 = at\n    capacity) keyed back to the Rhino objects that produced each element.","list_design_codes":"Lists the design code profiles validate_structure / visualize_structure accept as design_code.","visualize_structure":"Run a live structural analysis on a line model and SHOW it in every Rhino viewport: the undeformed wireframe, the exaggerated deformed shape coloured blue -> red by displacement (or by utilization), supports, load arrows and a legend panel with max deflection, the L/limit check and PASS/FAIL.\n\nArgs:\n    guids: Curve GUIDs of the structural axes plus point GUIDs marking supports\n        (see fixed_supports). Without points, the lowest nodes are supported.\n    load_kn: Total imposed load in kN, shared equally by the free nodes (-Z).\n    material: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\".\n    beam_diameter_mm, beam_wall_mm: circular hollow section for every member\n        (default: inferred / CHS 114.3x4).\n    self_weight: include gravity.\n    fixed_supports: True = fully fixed supports, False = pinned (rotations free).\n    deflection_limit_ratio: span/ratio limit, e.g. 250 for L/250. Default: the design code's\n        limit (Eurocode profile: 250).\n    span_m: reference span in meters for the limit (default: longest member).\n        Set it when members are split at every node, e.g. a 6.2 m joist drawn\n        as two 3.1 m segments.\n    color_by: \"displacement\" or \"utilization\".\n    scale: deformation exaggeration; omit for automatic (~6% of span).\n    reveal: 0..1 fraction of members drawn (for staged construction playback).\n    reanalyze: False re-uses the last solve and only changes the display\n        (scale / color_by / reveal / physics / title) - cheap enough to animate.\n    physics: False draws the same members as plain geometry with no analysis\n        overlay (\"physics off\"), for before/after comparisons.\n    display_guids: draw only these members (e.g. one frame line for a section\n        view); the analysis still covers every member in guids.\n    title: legend title.\n    clear: remove the overlay.\n    engine: \"auto\" (default: Almond's native frame solver, no Karamba needed; Karamba\n        when the selection has shells or the bridge cannot export a model),\n        \"native\" or \"karamba\".\n    asset_loads: add the loads of placed library assets (native engine), as in\n        validate_structure; loaded points are drawn with load arrows.\n    floor_load_kn_m2, floor_dead_kn_m2: floor area loads on every enclosed bay, as in\n        validate_structure.\n    design_basis, uls_combination, design_code: as in validate_structure; the overlay draws\n        the SLS deflected shape coloured by the ULS utilization envelope.\n    connections: \"rigid\" or \"simple\", as in validate_structure; pinned ends are drawn\n        as small circles.\n    stability: \"auto\" or \"off\", as in validate_structure.\n    view: \"deflection\" (default) or \"buckling\": draw the first buckling mode of the\n        governing ULS combination with its alpha_cr (STABLE >= 10, SWAY-SENSITIVE 1-10,\n        UNSTABLE \u003c= 1) instead of the deflected shape.\n\nReturns JSON: status (\"pass\"|\"fail\"|\"error\"|\"cleared\"), max_displacement_mm,\ndeflection_limit_mm, span_m, max_utilization, scale, per-element\n{source_guids, max_displacement_mm, utilization}, warnings.\nThe native engine reports analysis_method \"native\"; engine=\"karamba\" needs\nKaramba3D 3.1 (the trial caps models at 20 beam elements).","export_structural_report":"Renders the persisted validate_structure history to a Markdown report.\n\nArgs:\n    path: Output file path. Default:\n        \u003cuser data dir>/reports/structural-validation-\u003ctimestamp>.md\n    limit: Maximum number of runs to include (default 50, max 500).\nReturns:\n    JSON with the report path and run count.","list_drawing_recipes":"Lists compact audited layer, lineweight, projection, and export recipes.","get_drawing_recipe":"Returns one audited drawing recipe summary by default.","apply_drawing_style":"Creates or updates the Rhino layer hierarchy, plot weights, colours, and linetypes defined by an audited drawing recipe.","import_drawing_hatch_patterns":"Imports the AutoCAD-style .pat hatch definitions of an indexed drawing asset into the active Rhino document's hatch pattern table.","list_drawing_assets":"Lists the common 3DM model and 2D collection, including legacy sources awaiting conversion.","search_drawing_assets":"Searches the common model/2D collection by text, category and measured dimensions.","get_drawing_asset":"Returns one model/2D asset's provenance, representations, availability and conversion or refresh status.","prepare_drawing_asset":"Prepare a source copy as a 3DM while preserving its assembly, layers, materials and origin.","register_drawing_asset":"Register a 3DM model and derive plan/front/right drawings in one versioned publication.","refresh_asset":"Remeasure an edited registered 3DM and regenerate its 2D representations while retaining the linked source path.","get_asset_drawing":"Retrieve a registered 3DM's linked drawings and dimensions, or a legacy pilot package.","generate_asset_drawing_views":"Generate plan/front/right mesh silhouettes with source metadata, full-size DXF, scaled SVG and A3 SVG sheets where they fit.","audit_asset_drawing":"Check exported files and whether source geometry changed.","place_drawing_asset":"Places a common model/2D asset; 3DM models use a linked block with active document layers.","search_asset_repository":"Search the unified model/drawing archive.","get_modeling_guide":"Read BASIC before modeling, or fetch one tool's detailed usage instructions.\n\nArgs:\n    tool: Exact public Almond tool name; empty returns BASIC and available tool names.","get_construction_guidance":"Look up construction systems, their constituent elements and assembly guidance.\n\nArgs:\n    query: Free-text filter (e.g. \"glulam\", \"longspan\", \"bearing wall\").\n    category: \"floor\", \"wall\", \"roof\", \"foundation\" (empty = all).\n    material: \"Wood\", \"Steel\", \"Concrete\" - validate_structure names.\n    structure_type: validate_structure type (\"beam\", \"truss\", \"shell\",\n        \"frame\", \"canopy\", \"gridshell\", \"membrane\", \"highrise\").\n    span_m: If > 0, each returned system reports fits_span and\n        suggested member depths from its span-ratio rules.\n    include_reference_data: Also return occupancy live loads (kPa) and\n        material densities (kg/m3) for choosing load_kn inputs.\nReturns:\n    JSON: {total, systems: [...], reference?} - for wall systems\n    span_range_m is the unsupported height range (span_axis \"vertical\").\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds rules, narrative, source, metadata, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","get_typology_narrative":"Architectural typology narratives for project storytelling - precedents, eras, and urban roles distilled from Ching, Jarzombek & Prakash's A Global History of Architecture, with page references (gha_ref).\n\nArgs:\n    query: Free text (e.g. \"courtyard\", \"skyscraper\", \"timber hall\").\n    construction_system: Filter to entries related to a construction\n        library system_id (e.g. \"steel-column-frame\").\n    structure_type: Filter by validate_structure type (\"shell\",\n        \"truss\", \"frame\", \"membrane\", ...).\n    limit: Maximum entries returned (default 5).\nReturns:\n    JSON: {total, entries: [{typology_id, name, era, region, narrative,\n    precedents, related_construction_systems, urban_role, gha_ref,\n    tags}], source}.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds rules, narrative, source, metadata, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","search_detail_sources":"Search six curated free architectural source directories offline.","get_retrieval_status":"Returns compact diagnostics for the local structured retrieval system.","get_rhino_context":"Read selected LIVE Rhino context on the UI thread.\n\nArgs:\n    selection_limit: Maximum selected object summaries, from 0 to 200; total/truncated are still reported.\n    recursive: False by default: summarize complete top-level groups and block instances.\n        True expands nested members only to depth; partial groups remain object selections.\n    depth: 1..8, default 1. IDs are omitted unless include_ids=true.\n    include_image: False keeps the JSON-only response. True returns JSON text first and\n        the current PNG from the same native UI call. An image_error preserves available\n        context when capture fails. image_file reports the same PNG's managed file, or a\n        separate storage error without removing a successful image.\nReturns:\n    JSON with status, document, selection, viewport and warnings, or an explicit error.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.","analyze_block_reculviely":"Read nested block structure or resolve a block occurrence without modifying the document.\n\nArgs:\n    mode: outline traverses objects and nested definitions; resolve-block finds\n        candidates for the current editing context along an explicit occurrence path.\n    options: outline accepts ids or path, otherwise scope (selected/viewport/document),\n        depth and output budgets. field_groups is a nonempty list of summary, objects,\n        annotations and transforms; the default is a compact summary. include_geometry\n        and annotations explicitly request their details. Narrow IDs/path/depth after\n        truncation; max_items also bounds eligible visits (reason=max_visits).\n        resolve-block accepts only path: 1..65 GUIDs from the top-level instance inward.\n    expected_model_path: Usually omitted; the runtime supplies the bound document path.\n    include_ids: Include IDs when needed; supplied target IDs are not repeated.\nReturns:\n    JSON with status, mode, document identity/units/tolerance and data, or an explicit error.","get_rhino_objects":"읽기 전용으로 일반 모델 객체의 범위·속성·그룹·형상을 조회한다.","get_object_intersections":"명시 GUID 1..512개의 닫힌 Brep·Extrusion·방향이 정해진 manifold Mesh의 체적 교차를 읽기 전용으로 검사한다.","capture_rhino_inspection":"지정한 여러 시점과 객체집합을 하나의 PNG에 담으며 Rhino 문서를 바꾸지 않는 캡처다.","get_rhino_viewport_image":"Return a Rhino viewport, Named View or Layout as a PNG image, without activating it.\n\nArgs:\n    view: Empty for current view, \"a\" for the grouped list, or a listed GUID.\n    scale_percent: Integer from 1 to 100; default 75. Choose sufficient resolution for the intended reading. Controls pixels, not a Layout Detail's drawing scale.\n    width, height: Optional explicit output pixels, both 128..2048 with scale_percent=100.\n        Supported for model view/Named View/group/block with capture_output_size=1;\n        the live window is not resized. Layouts reject these options and retain 144 dpi.\n    include_usage: False returns the image and file metadata. True also returns dimensions and an\n        illustrative token estimate (32px patches x 1.2, without provider resizing).\n        Actual usage depends on the client's model and detail setting, which MCP\n        does not supply. PNG compression reduces bytes, not pixel-token counts.\n    display_mode: Installed display mode name or GUID. Empty preserves the current\n        model viewport mode; Named View/group/block captures default to Shaded. List\n        available modes with get_rhino_context(sections=[\"display_modes\"], include_ids=true).\n        Realtime rendering modes such as Raytraced are rejected; this tool does not\n        wait for asynchronous rendering to finish.\n    labels: True by default. Transient pixels show top-level group name/GUID, block\n        instance name/GUID and ungrouped object GUID, without creating document objects.\n        At most 200 labels; explicit smaller targets/depth narrow a truncated overlay.\n    depth: 1..8, default 1; higher values expose nested entity labels.\n    target_kind: view (default), group or block. group/block frame target bounds in a\n        detached viewport and label that target; surrounding geometry stays visible.\n    target_id: Persistent group GUID or block instance GUID for group/block; leave view\n        empty. Definition GUIDs are not block instance targets.\n    Layouts retain each detail's mode, reject a mode override, and explicitly warn that\n        detail labels are unavailable; capture a Named View/model viewport for labels.\nReturns:\n    One MCP PNG image and image_file metadata, optional warnings/usage, or the grouped name/GUID list for view=\"a\".\n    Images are limited to 16 megapixels and 4 MiB. PNG files are additive writes, so capture-capable tools do not advertise MCP readOnlyHint; the Rhino document remains unchanged.","capture_conditioning_pass":"Capture RGB + edge (line drawing) + depth frames along a camera path from the LIVE Rhino document, as conditioning for geometry-guided video generation (Wan VACE / ControlNet).","list_design_scenes":"List Scene names across the whole project, without a Plan or live document lookup.","create_design_scene":"Creates a persistent scene handle for a house or interior generation.","get_design_scene":"Returns a scene summary; scope adds file_name (empty when not recorded).","update_design_scene":"Set the Scene’s project_files reference by file_name or project_file_id; file_name='' clears it.","get_scene_objects":"Read current Rhino members of the Scene’s registered semantic groups as one set.","export_asset_contract":"Exports Rhino objects as a portable Almond asset: a GLB plus an asset contract (.almond.json) carrying what the file cannot.\n\nArgs:\n    guids: Rhino object GUIDs to export (from execute_rhino_script).\n    asset_id: Stable id, e.g. \"canopy-pavilion-01\" (letters, digits, . _ -).\n    name: Human-readable name; defaults to asset_id.\n    output_dir: Destination folder. Default: \u003cuser data dir>/exchange.\nReturns:\n    JSON with the glb path, contract path, and recorded dimensions.","import_asset_contract":"Imports an Almond asset contract (from Blender, Unreal, or another Rhino) into the open Rhino document, restoring everything the file format drops.\n\nArgs:\n    contract_path: Path to a .almond.json contract file.\n    x_mm, y_mm, z_mm: Placement point in millimetres (contract anchor).\n    rotation_degrees: Rotation about world Z.\n    layer: Destination layer, created if absent.\nReturns:\n    JSON with counts restored/deduplicated and a dimension_check comparing\n    what landed against the contract.","get_blender_helper_script":"Returns Python to run inside Blender (via blender-mcp's execute_code) so Blender participates in the Almond workflow without a dedicated bridge.\n\nArgs:\n    action: \"export\" or \"materials\".\n    asset_id, name, output_dir: for \"export\" (output_dir defaults to the\n        Almond exchange folder).\n    material_id, object_names: for \"materials\".\nReturns:\n    JSON with a \"script\" field to pass to Blender's execute_code.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds notes, audit, or all; the requested manifest/parsed logic/script remains in the default payload.\ninclude_ids independently enables handles; audit enables timestamps.","get_modeling_policy":"Return JSON-defined object/group metadata keys and material-layer naming rules.","execute_rhino_script":"Execute source or a complete macro in the bound Rhino through official RhinoCode.\n\nArgs:\n    script: Synchronous Python source, C# statement body or complete command macro.\n    language: python (default Python 3), python2, csharp, csharp-script or command; every mode uses official RhinoCode.\n    timeout_seconds: Integer 1-600, default 60; waiting limit only. Retrieve the same request after timeout.\nReturns:\n    JSON execution outcome and result with a recoverable request_id; pending or failed calls preserve completion evidence.","edit_planar_face":"Translate one planar face of an existing closed Brep with Rhino's PushPull Extend.","edit_planar_faces":"Edit one planar face on each of 1..32 distinct Breps in one native call and Undo record.","save_rhino_document":"Save the current connection's existing .3dm file without a command, prompt or Enter.","setup_modeling":"Register materials or create construction layers in the current Rhino document.","list_materials":"Lists the curated PBR material library used by assign_material without changing Rhino.","assign_material":"Assigns a curated PBR material and its canonical M:: layer to explicit Rhino objects.","upsert_ontological_component":"Register an ontological_component meaning unit in a current Rhino group.","get_ontological_component":"Read an ontological_component summary or inspect its actual Rhino group.","list_ontological_components":"List compact cached ontological_components, optionally scoped by scene_id.","sync_ontological_component":"Align DB records with actual groups in the current stable Rhino document once.","remove_ontological_component":"Unregister ontological_component meaning while preserving Rhino geometry, ordinary groups and all existing object attributes.","get_component_intersections":"Inspect actual solid overlaps among the current recursive members of 1-32 Components.","show_object_intersection":"Preview one inspected overlap in the active model viewport without adding document geometry.","resolve_object_intersection":"Subtract the selected keep solid from the trim solid, preserving the trim object's ID and attributes.","focus_components":"Select, isolate and zoom to Components.","list_diagram_assets":"Lists available vector and CAD diagram assets (people, trees, symbols).","search_diagram_assets":"Searches the diagram asset library.","get_diagram_asset":"Returns one diagram asset's metadata.","place_diagram_asset":"Places an indexed diagram asset (SVG, DWG, DXF)."}}</script>
<script>

const D=JSON.parse(document.getElementById('flowdata').textContent),T=D.tools,G=D.groups,R=D.resources,H=D.guides;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),j=o=>JSON.stringify(o,null,2);
const S={selected:'guide',trace:[],zoom:1,args:{},invalid:{},query:'',route:null,view:'guide',seq:0};

function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.id);toast.id=setTimeout(()=>$('#toast').style.display='none',2500)}
function link(path,line=1,label='현재 코드 ↗'){return `<a class="source-link" href="https://github.com/${D.repo}/blob/${D.sha}/${path}#L${line}" target="_blank" rel="noopener">${esc(label)}</a>`}

function typ(p){return p.type||(p.anyOf||[]).find(x=>x.type!=='null')?.type||'object'}
function sample(n,k,p){
if(k==='component_ids')return ['〈실제 component_id〉'];
if(k==='guids'||k==='object_ids')return ['〈현재 관찰에서 받은 객체 GUID〉'];
if(k==='plate_bounds_mm')return [0,0,10000,8000];
if(k==='exits')return [{name:'예시 출구 A',x_mm:0,y_mm:0,width_mm:1200},{name:'예시 출구 B',x_mm:10000,y_mm:8000,width_mm:1200}];
if(k==='translation')return [0,0,100];
if(k==='views')return [{direction:'top',label:'평면 관찰'},{direction:'iso_ne',label:'입체 관찰'}];
if(k==='edits')return [{object_id:'〈관찰된 객체 GUID〉',face_index:0,expected_geometry_crc:0,translation:[0,0,100]}];
if(k==='keep'||k==='trim'||k==='a'||k==='b')return {object_id:'〈관찰된 '+k+' 객체 GUID〉',path:[]};
if(k==='options'&&n==='analyze_block_reculviely')return {scope:'selected',depth:1,field_groups:['summary']};
if(k==='mode'&&n==='analyze_block_reculviely')return 'outline';
if(k==='occupancy')return 'residential';
if(k==='inputs'&&n==='run_gh_definition')return {'〈캡슐의 실제 ALMOND_IN_* 포트명〉':{'guids':['〈현재 관찰된 객체 GUID〉']}};
if(k==='shot')return JSON.stringify({type:'orbit',center:[0,0,0],radius:10000,height:5000,frames:17,start_deg:0,end_deg:90,lens:35,target_height:1000});
if(k==='action'&&n==='get_blender_helper_script')return 'export';if(k==='asset_id')return '〈실제 asset_id〉';if(k==='source_file')return '〈프로젝트 기준 원본 파일 상대 경로〉';if(k==='pair_state')return '〈교차 관찰에서 받은 64자리 pair_state〉';if(k==='include_ids')return true;if(k==='goal')return '선택한 구성요소를 검토';if(k==='name')return '검토 범위';if(k==='status')return 'running';if(k==='step_id')return 'inspect_context';if(k==='query')return 'chair';if(k==='script'||k==='code')return '# 입력 예시 — 이 HTML은 실행하지 않습니다\nprint("Almond")';if(k==='operation')return 'layers';if(k==='stage')return 'inspect';if('default'in p&&p.default!==null)return p.default;const type=typ(p);return type==='string'?'〈'+k+'〉':type==='array'?[]:type==='object'?{}:type==='boolean'?false:0}
function argumentsFor(n){const a={},t=T[n],extra={show_object_intersection:['a','b','pair_state'],prepare_drawing_asset:['source_file'],generate_asset_drawing_views:['asset_id'],get_blender_helper_script:['asset_id'],visualize_structure:['guids']}[n]||[];for(const[k,p]of Object.entries(t.inputSchema.properties||{}))if((t.inputSchema.required||[]).includes(k)||k==='include_ids'||extra.includes(k))a[k]=sample(n,k,p);return a}
function choose(n){if(!T[n])return;S.trace.push({name:n,args:argumentsFor(n),open:false,invalid:{}});S.seq=S.trace.length-1;inputPanel(S.seq);graph();$('#viewport').scrollTo({top:(785+S.seq*355)*S.zoom-25,behavior:'smooth'})}
function field(tr,k,p){const req=(T[tr.name].inputSchema.required||[]).includes(k),on=k in tr.args,v=on?tr.args[k]:sample(tr.name,k,p),type=typ(p);let input;if(type==='boolean')input=`<select id="input-${k}" data-arg="${k}" ${on?'':'disabled'}><option value="true" ${v===true?'selected':''}>true</option><option value="false" ${v!==true?'selected':''}>false</option></select>`;else if(type==='object'||type==='array')input=`<textarea id="input-${k}" data-arg="${k}" data-type="json" ${on?'':'disabled'}>${esc(j(v))}</textarea>`;else input=`<${k==='script'||k==='code'?'textarea':'input'} id="input-${k}" data-arg="${k}" data-type="${type}" ${on?'':'disabled'} ${k==='script'||k==='code'?'':`value="${esc(v)}"`}>${k==='script'||k==='code'?esc(v)+'</textarea>':''}`;return `<div class="field"><div class="field-top"><label class="main-label" for="input-${k}">${esc(k)}</label>${req?'<span class="required">필수</span>':`<label class="optional"><input type="checkbox" data-enable="${k}" ${on?'checked':''}>포함</label>`}</div><span class="code-name">${esc(type)}</span>${input}<div class="default">${'default'in p?'기본값: '+esc(j(p.default)):'기본값 없음'}${p.description?`<details><summary>인수 설명 원문</summary><div class="explain">${esc(p.description)}</div></details>`:''}</div></div>`}

function inputPanel(i){S.seq=i;S.selected='tool-'+i;S.view='input';const tr=S.trace[i],t=T[tr.name],h=H[tr.name],props=Object.entries(t.inputSchema.properties||{});$('#panel').innerHTML=`<div class="kicker">tools/list 응답으로 공개된 툴</div><h2>${esc(t.title)}</h2><div class="name">${t.name}</div><h3 class="first">1. 도구 설명과 입력 계약</h3><div class="box"><span class="sub">한국어 전문 번역 · get_modeling_guide의 상세 설명</span><div class="explain">${esc(D.translations[t.name])}</div></div><details><summary>상세 설명 원문 전문 펼치기</summary><div class="explain">${esc(t.doc)}</div></details><details><summary>tools/list에서 실제 전달되는 축약 설명</summary><div class="explain">${esc(D.listDescriptions[t.name])}</div><p class="sub">tools/list는 첫 문장과 인수·반환 설명을 전달합니다. 위 전문은 명시적 get_modeling_guide(tool=...)의 상세 안내입니다.</p></details><h3>2. arguments 작성 · 예시 미리 입력됨</h3><p class="sub">〈…〉는 실제 관찰값·ID·포트명으로 바꿀 자리입니다. 숫자·좌표도 구조를 보여주는 예시이며 실측값이 아닙니다. 특히 CRC·면 번호는 같은 관찰 결과로 교체해야 합니다. 선택 인수는 ‘포함’을 켜야 요청에 들어갑니다.</p>${props.filter(([k])=>(t.inputSchema.required||[]).includes(k)||k in tr.args).map(([k,p])=>field(tr,k,p)).join('')||'<div class="box amber">필수 인수 없음. {} 또는 선택 인수로 호출합니다.</div>'}${props.some(([k])=>!(t.inputSchema.required||[]).includes(k)&&!(k in tr.args))?`<details><summary>선택 인수 펼치기 (${props.filter(([k])=>!(t.inputSchema.required||[]).includes(k)&&!(k in tr.args)).length})</summary>${props.filter(([k])=>!(t.inputSchema.required||[]).includes(k)&&!(k in tr.args)).map(([k,p])=>field(tr,k,p)).join('')}</details>`:''}<div id="inputError" class="error-msg" role="status"></div><details open><summary>tools/call에 전달되는 JSON</summary><pre id="request-json">${esc(j(req(tr)))}</pre></details><button class="primary" id="show-result">이 입력에 대한 반환 형식 보기 →</button><h3>3. 반환 필드와 조건부 분기</h3>${fields(h)}${branches(h)}<details><summary>입력 스키마 · 현재 공식 fixture</summary><pre>${esc(j(t.inputSchema))}</pre></details><p>${guideLink(t)}</p>${h.source?`<p>${helperLink(h.source)}</p>`:''}`;graph();topPanel()}
function helperLink(s){const [p,l]=s.split(':');return link(p,parseInt(l)||1,'실제 helper 반환 근거 ↗')}
