os`) when using `_-RunPythonScript` | Script filename shadows a stdlib module (e.g. `random.py` shadows `random`). IronPython 2.7 searches the script directory before stdlib. Rename the script, or remove the `import` that pulls in the shadowed module and replace it with a direct alternative (e.g. read `%TEMP%` via `os.environ` instead of `import tempfile`). |\n| `SyntaxError: Non-ASCII character '\\xe2' ... but no encoding declared` | IronPython 2.7 (`_-RunPythonScript`) hit an em dash or similar character. Add `# -*- coding: utf-8 -*-` as line 1, or replace the character: em dash `--`, arrow `->`. The same file runs fine under `rhinocode` (CPython 3), which hides the problem. |\n\n## References\n\n- [references/rhinoscriptsyntax-cheatsheet.md](references/rhinoscriptsyntax-cheatsheet.md) — most-used `rs.*` functions by category.\n- [references/rhinocommon-map.md](references/rhinocommon-map.md) — which namespace to import for which task.\n- [references/macros-and-loading.md](references/macros-and-loading.md) — command-line macro syntax, `LoadScript` / `RunScript`, search paths.\n- [references/vbscript-quirks.md](references/vbscript-quirks.md) — VBScript-only traps relevant to RhinoScript.\n\n### Upstream docs\n\n- RhinoScript landing: \u003chttps://docs.mcneel.com/rhino/8/help/en-us/information/rhinoscripting.htm>\n- Developer hub: \u003chttps://developer.rhino3d.com/>\n- RhinoCommon API index: \u003chttps://mcneel.github.io/rhinocommon-api-docs/api/RhinoCommon/html/R_Project_RhinoCommon.htm>\n- Example scripts repo: \u003chttps://github.com/mcneel/rhino-developer-samples/tree/8/rhinoscript>\n"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/macros-and-loading.md","sha256":"14a0822d61d74c34694b753aa727b08b6802aaaf89ff4d40e65746e784b595cd","text":"# Macros, Loading, and Running Scripts\n\n## Command Macros (no script needed)\n\nA macro is a string of command-line input. Anywhere Rhino accepts a command (alias, toolbar button, `_ReadCommandFile`), you can place a macro.\n\n### Syntax rules\n\n| Token | Meaning |\n|---|---|\n| `!` | **Cancel** any currently running command before this one starts. Always start macros with `!`. |\n| `_` | Use the **English** (invariant) command name, so the macro works in any locale. |\n| `-` | Run the command in **script mode** — suppress dialogs, accept input from the macro string. |\n| `_Enter` | Press Enter at the current prompt. |\n| `Pause` | Stop and wait for the user to supply this input interactively. |\n| `;` | Comment to end of line. |\n| Newline | Same as a space — a separator between tokens, not a command terminator. |\n\n### Example macros\n\n```text\n! _-Line 0,0,0 10,0,0\n! _-Circle 0,0,0 5 _Enter\n! _SelAll _Delete\n! _-Properties _Object _Name \"MyObject\" _EnterEnd _Enter\n! _-RunPythonScript \"MyScript.py\"\n```\n\n## Running Saved Scripts\n\n### Python (`.py`)\n\n```text\n_-RunPythonScript \"C:\\Users\\example\\Scripts\\MyScript.py\"\n```\n\nOr, with the script folder on the search path:\n\n```text\n_-RunPythonScript \"MyScript.py\"\n```\n\n`_EditPythonScript` opens the legacy editor; `_ScriptEditor` (Rhino 8) opens the unified editor with Python 3, VB, and C#.\n\n### RhinoScript (`.rvb`, `.vbs`)\n\nTwo steps: **load** the file (registers its subs/functions), then **run** a named sub.\n\n```text\n_-LoadScript \"MyScript.rvb\"\n_-RunScript MyMainSub\n```\n\nA single `.rvb` can hold many subs; `_RunScript` chooses which to invoke.\n\n### Search Paths\n\n`Options → Files → Search paths` — folders listed here are scanned when you reference a script by bare filename. Without this, you must give a full path.\n\n### Startup Scripts\n\n`Options → RhinoScript → Startup` (and `Options → Python → Startup`) — files in these lists run once when Rhino opens. Useful for registering custom commands or aliases.\n\n**Guard against missing document** in startup code:\n\n```python\nimport scriptcontext as sc\n\ndef startup():\n    if sc.doc is None:\n        return\n\nstartup()\n```\n\n## Toolbar Buttons & Aliases\n\nA toolbar button’s **Command** field is just a macro. To make a button that runs your script:\n\n```text\n! _-RunPythonScript \"MyScript.py\"\n```\n\nSet the **Tooltip** to a short description; set the icon via the button editor.\n\nTo create an alias: `Options → Aliases → New`. The alias name becomes a typed command; its value is the macro.\n\n## Invoking Macros From a Script\n\n```python\nimport rhinoscriptsyntax as rs\nrs.Command(\"! _-Line 0,0,0 10,0,0\", echo=False)\n```\n\n`echo=False` suppresses command-history output but does **not** suppress prompts — always use `-` and complete every prompt within the macro string.\n\n## rhinocode CLI (Rhino 8)\n\n`rhinocode` is the Rhino 8 command-line tool for running scripts and commands against a running Rhino instance from an external terminal.\n\n### Basic commands\n\n```text\nrhinocode script \"C:\\path\\to\\MyScript.py\"            # run a Python script\nrhinocode command \"_Circle 0,0,0 5 _Enter\"           # run a Rhino command\nrhinocode --rhino \u003cinstance-id> script \"MyScript.py\" # target a specific instance\n```\n\n`\u003cinstance-id>` looks like `rhinocode_remotepipe_75029`. Find the ID in Rhino's title bar or\nby running `StartScriptServer` in Rhino, which prints the pipe name to the command line.\n\n### Architecture — pipe server\n\nrhinocode does **not** spawn a new Rhino process. It connects to a persistent server that Rhino\nexposes (`StartScriptServer`). Scripts execute inside that server process, which means:\n\n- **Environment variables are isolated.** Variables set in the calling shell (`set FOO=bar`)\n  are NOT visible inside the script via `os.environ`. The server was started before your shell.\n- **`os.getcwd()` is the server's working directory**, not the directory you called rhinocode\n  from. Do not rely on it for output paths; pass the path explicitly.\n- **`print()` output IS piped back** to the calling terminal — use it freely for status messages.\n\n### Passing data into a script\n\nrhinocode does not support positional arguments after the script path — any extra tokens are\nconcatenated onto the file URI, causing a \"file does not exist\" error. Workarounds:\n\n|Channel|How|Notes|\n|---|---|---|\n|Temp file|Caller writes a file to a known location; script reads and deletes it.|Use a path derived from `__file__` (see below), not `%TEMP%` — the server may resolve a different temp dir.|\n|Rhino dialog|Script calls `rhinoscriptsyntax.ListBox` / `GetString`|Always works; user sees a prompt in Rhino.|\n\n### `__file__` is a URI\n\nWhen running via rhinocode, `__file__` is set as a `file:///` URI with URL-encoded characters\n(spaces become `%20`). Decode it before using it as a filesystem path:\n\n```python\nimport os, sys, urllib.parse\n\ndef _script_dir():\n    raw = __file__\n    if raw.startswith(\"file:///\"):\n        raw = urllib.parse.unquote(raw[len(\"file:///\"):])\n        if sys.platform == \"win32\":\n            raw = raw.replace(\"/\", os.sep)\n    return os.path.dirname(os.path.abspath(raw))\n```\n"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/rhinocommon-map.md","sha256":"e9baa208601cd5edfa824aa576d314bdf19d48b9e29b8e5e636bc3a2867094e0","text":"# RhinoCommon Namespace Map\n\nUse this to decide which `Rhino.*` namespace to import for a task. All of these are accessible from Python with `import Rhino`.\n\n## Document & Object Model\n\n| Need | Namespace | Key types |\n|---|---|---|\n| The active document, units, tolerances, undo | `Rhino` | `RhinoDoc`, `RhinoApp` |\n| Reading/writing objects in the doc | `Rhino.DocObjects` | `RhinoObject`, `ObjectAttributes`, `Layer`, `ObjectType` |\n| Tables (layers, materials, blocks, dim styles) | `Rhino.DocObjects.Tables` | `LayerTable`, `InstanceDefinitionTable`, `MaterialTable` |\n| Custom per-object user data | `Rhino.DocObjects.Custom` | `UserData` |\n| File I/O (.3dm, import/export) | `Rhino.FileIO` | `File3dm`, `File3dmObject` |\n\n## Geometry\n\n| Need | Namespace | Key types |\n|---|---|---|\n| Points, vectors, transforms | `Rhino.Geometry` | `Point3d`, `Vector3d`, `Transform`, `Plane`, `BoundingBox` |\n| Curves | `Rhino.Geometry` | `Curve`, `NurbsCurve`, `PolylineCurve`, `LineCurve`, `ArcCurve` |\n| Surfaces & breps | `Rhino.Geometry` | `Surface`, `NurbsSurface`, `Brep`, `BrepFace`, `Extrusion` |\n| Meshes | `Rhino.Geometry` | `Mesh`, `MeshFace`, `MeshNgon` |\n| SubD | `Rhino.Geometry` | `SubD`, `SubDFace`, `SubDEdge` |\n| Geometry collections (vertices, edges, faces lists) | `Rhino.Geometry.Collections` | `MeshVertexList`, `BrepEdgeList` |\n| Intersections | `Rhino.Geometry.Intersect` | `Intersection`, `CurveIntersections` |\n| Mesh refinement | `Rhino.Geometry.MeshRefinements` | |\n| Space morphs (bend, twist, etc.) | `Rhino.Geometry.Morphs` | `BendSpaceMorph`, `TwistSpaceMorph` |\n\n## User Interaction\n\n| Need | Namespace | Key types |\n|---|---|---|\n| Prompts, getters, command results | `Rhino.Input` / `Rhino.Input.Custom` | `RhinoGet`, `GetObject`, `GetPoint`, `GetOption` |\n| Commands (when building a plugin) | `Rhino.Commands` | `Command`, `Result` |\n| Forms, dialogs, panels | `Rhino.UI` | `Dialog`, `Panels`, `RhinoEtoExtensions` |\n| UI controls / data sources | `Rhino.UI.Controls` | |\n| Gumball | `Rhino.UI.Gumball` | |\n\n## Display & Rendering\n\n| Need | Namespace | Key types |\n|---|---|---|\n| Viewports, display conduits, draw overlays | `Rhino.Display` | `DisplayPipeline`, `DisplayConduit`, `RhinoViewport` |\n| Render content (materials, environments) | `Rhino.Render` | `RenderContent`, `RenderMaterial`, `RenderTexture` |\n| Render mesh customization | `Rhino.Render.CustomRenderMeshes` | |\n| Post effects | `Rhino.Render.PostEffects` | |\n\n## Runtime & Plugins\n\n| Need | Namespace | Key types |\n|---|---|---|\n| Plugin lifecycle, settings | `Rhino.PlugIns` | `PlugIn`, `FileImportPlugIn`, `FileExportPlugIn` |\n| In-process Rhino (run Rhino from external .NET) | `Rhino.Runtime.InProcess` | `RhinoCore` |\n| Native interop (pointers, marshalling) | `Rhino.Runtime.InteropWrappers` | |\n| User notifications (toasts) | `Rhino.Runtime.Notifications` | |\n\n## Common Patterns\n\n```python\nimport Rhino\nimport scriptcontext as sc\nimport System.Drawing\n\ndoc = sc.doc                                          # Rhino.RhinoDoc\ntol = doc.ModelAbsoluteTolerance                      # float\nview = doc.Views.ActiveView                           # Rhino.Display.RhinoView\nlayer_index = doc.Layers.Add(\"MyLayer\", System.Drawing.Color.Red)\n\n# Find a Rhino object from a rhinoscriptsyntax GUID\nrhobj = doc.Objects.Find(guid)                        # Rhino.DocObjects.RhinoObject\ngeom  = rhobj.Geometry                                # Rhino.Geometry.GeometryBase\n\n# Add geometry with attributes\nattrs = Rhino.DocObjects.ObjectAttributes()\nattrs.LayerIndex = layer_index\nattrs.Name = \"example\"\nnew_id = doc.Objects.AddCurve(curve, attrs)\n```\n\n## Undo\n\n```python\nundo_serial = doc.BeginUndoRecord(\"Batch Op\")\ntry:\n    # ... many doc.Objects.* calls ...\n    pass\nfinally:\n    doc.EndUndoRecord(undo_serial)\n    doc.Views.Redraw()\n```\n"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/rhinoscriptsyntax-cheatsheet.md","sha256":"8abd85be2b9e915ebeeec5538d62043e676f59c74d34fb438021a6f852e3eac0","text":"# `rhinoscriptsyntax` Cheatsheet\n\n```python\nimport rhinoscriptsyntax as rs\n```\n\n## User Input\n\n| Function | Returns |\n|---|---|\n| `rs.GetObject(message, filter, preselect, select)` | GUID or `None` |\n| `rs.GetObjects(message, filter)` | list of GUIDs |\n| `rs.GetPoint(message, base_point)` | `Point3d` or `None` |\n| `rs.GetString(message, default, strings)` | str |\n| `rs.GetInteger`, `rs.GetReal` | int / float |\n| `rs.GetBoolean(message, items, defaults)` | list of bools |\n\nCommon `rs.filter.*` flags (OR them together):\n\n```\npoint=1, point_cloud=2, curve=4, surface=8, polysurface=16,\nmesh=32, light=256, annotation=512, instance_reference=4096,\ntext_dot=8192, grip=16384, detail=32768, hatch=65536,\nmorph_control=131072, sub_d=262144\n```\n\n## Creating Geometry\n\n| Function | Notes |\n|---|---|\n| `rs.AddPoint(point)` | |\n| `rs.AddLine(start, end)` | |\n| `rs.AddPolyline(points)` | `points` is a list of 3-tuples |\n| `rs.AddCircle(plane_or_center, radius)` | |\n| `rs.AddArc(plane, radius, angle_deg)` | angle in **degrees** |\n| `rs.AddCurve(points, degree=3)` | NURBS through control points |\n| `rs.AddInterpCurve(points, degree=3)` | NURBS through points |\n| `rs.AddSphere(center, radius)` | |\n| `rs.AddBox(corners)` | `corners` = 8 points |\n| `rs.AddPlanarSrf(curves)` | returns list |\n| `rs.AddLoftSrf(curves, ...)` | returns list of GUIDs |\n| `rs.AddExtrusion(profile, path)` / `rs.ExtrudeCurveStraight` | |\n\n## Object Properties\n\n| Function | Purpose |\n|---|---|\n| `rs.ObjectLayer(id [, layer])` | get/set |\n| `rs.ObjectColor(id [, color])` | RGB tuple |\n| `rs.ObjectName(id [, name])` | |\n| `rs.ObjectType(id)` | int matching `rs.filter.*` |\n| `rs.IsCurve / IsSurface / IsBrep / IsMesh / IsPoint(id)` | |\n| `rs.DeleteObject(id)` / `rs.DeleteObjects(ids)` | |\n| `rs.CopyObject(id, translation)` | |\n| `rs.MoveObject(id, translation)` | |\n| `rs.RotateObject(id, center, angle, axis=None, copy=False)` | angle in degrees |\n| `rs.ScaleObject(id, origin, scale)` | scale is a 3-tuple |\n\n## Curves\n\n| Function | |\n|---|---|\n| `rs.CurveLength(id)` | |\n| `rs.CurveDomain(id)` | `(t0, t1)` |\n| `rs.EvaluateCurve(id, t)` | `Point3d` |\n| `rs.CurveStartPoint / CurveEndPoint(id)` | |\n| `rs.CurveClosestPoint(id, point)` | parameter `t` |\n| `rs.DivideCurve(id, segments, create_points=False, return_points=True)` | |\n| `rs.IsCurveClosed / IsCurvePlanar(id)` | |\n\n## Layers\n\n| Function | |\n|---|---|\n| `rs.AddLayer(name, color=None, visible=True, locked=False, parent=None)` | |\n| `rs.CurrentLayer([layer])` | |\n| `rs.LayerNames()` | list |\n| `rs.LayerVisible(name [, visible])` | |\n| `rs.DeleteLayer(name)` | |\n| `rs.ObjectsByLayer(name)` | list of GUIDs |\n\n## Document & View\n\n| Function | |\n|---|---|\n| `rs.UnitAbsoluteTolerance()` | |\n| `rs.UnitSystem()` | int (`rs.unit_system_*`) |\n| `rs.EnableRedraw(enable)` | **toggle this around bulk ops** |\n| `rs.Redraw()` | force one redraw |\n| `rs.ViewNames()` / `rs.CurrentView([name])` | |\n| `rs.ZoomExtents(view=None, all=False)` | |\n\n## Selection\n\n| Function | |\n|---|---|\n| `rs.SelectedObjects()` | list |\n| `rs.SelectObject(id)` / `rs.SelectObjects(ids)` | |\n| `rs.UnselectAllObjects()` | |\n| `rs.InvertSelectedObjects()` | |\n\n## Macros from Script\n\n`rs.Command(command_string, echo=True)` runs a macro exactly as if typed at the command line. Always prefix `!` (cancel) and `-` (no dialog):\n\n```python\nrs.Command(\"! _-Line 0,0,0 10,0,0\", echo=False)\n```\n"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/vbscript-quirks.md","sha256":"0a9163940db6ac3618ce2ab6df8ae845b802ac303862b6b38375fd41a4536364","text":"# VBScript Quirks for RhinoScript\n\nThings that bite when writing `.rvb` / `.vbs` files and aren’t obvious to anyone whose mental model is C-family or Python.\n\n## Always Start With `Option Explicit`\n\nWithout it, mistyping a variable name silently creates a new `Variant` set to `Empty`. Every `.rvb` file should begin:\n\n```vbscript\nOption Explicit\n```\n\n## No Block Scope\n\nAll `Dim` declarations inside a `Sub`/`Function` are hoisted to the top. A `Dim` inside an `If` block is visible after the `If` ends. Loop counters survive the loop.\n\n## `Nothing` vs `Empty` vs `Null`\n\n| Sentinel | Test with | Meaning |\n|---|---|---|\n| `Empty` | `IsEmpty(x)` | `Dim`’d but never assigned |\n| `Null` | `IsNull(x)` | Explicit “no value” — what `Rhino.GetObject` returns on cancel |\n| `Nothing` | `x Is Nothing` | An **object** reference that points to nothing — only for `Set` variables |\n\nWrong sentinel → silently false.\n\n## Parentheses Change Semantics\n\n```vbscript\nFoo a, b              ' Call a Sub or Function (return value discarded)\nCall Foo(a, b)        ' Call a Sub or Function (return value discarded)\nx = Foo(a, b)         ' Call a Function and capture the return\nFoo(a, b)             ' SYNTAX ERROR for multi-arg subs\n\nFoo(x)                ' Calls Foo passing x BY VALUE, even if Foo declares ByRef\nFoo x                 ' Honors Foo's ByRef declaration\n```\n\nIf a Sub modifies its argument and your change isn’t taking effect — you wrapped the argument in parentheses.\n\n## `ByRef` Is the Default\n\nUnlike most languages, VBScript passes arguments **by reference by default**. Functions can mutate their callers’ variables. Be explicit:\n\n```vbscript\nSub Increment(ByRef n)\n    n = n + 1\nEnd Sub\n```\n\n## Arrays Are 0-Based But Have `UBound`, Not `Length`\n\n```vbscript\nDim arr(2)            ' Three elements: arr(0), arr(1), arr(2)\nFor i = 0 To UBound(arr)\n    arr(i) = i * 10\nNext\n```\n\n`Dim arr(n)` creates `n+1` elements. `ReDim Preserve arr(newSize)` resizes (only the last dimension of a multi-dim array).\n\n## `Set` Is Required for Object Assignment\n\n```vbscript\nSet fso = CreateObject(\"Scripting.FileSystemObject\")    ' correct\nfso = CreateObject(\"Scripting.FileSystemObject\")        ' RUNTIME ERROR\n```\n\nAny time the right-hand side is an object (COM object, RegExp, Dictionary), you must use `Set`.\n\n## Error Handling Is Manual\n\n```vbscript\nOn Error Resume Next\nRhino.AddCircle Array(0,0,0), -1\nIf Err.Number \u003c> 0 Then\n    Rhino.Print \"Failed: \" & Err.Description\n    Err.Clear\nEnd If\nOn Error GoTo 0           ' Restore normal error behavior\n```\n\n`On Error Resume Next` suppresses **all** errors until `On Error GoTo 0`. Forgetting to restore is a common bug.\n\n## Points Are 3-Element Arrays\n\nRhino expects `Array(x, y, z)`. A 2-element array (`Array(x, y)`) raises a type-mismatch error.\n\n```vbscript\nDim pt\npt = Array(1.0, 2.0, 3.0)\nRhino.AddPoint pt\n```\n\n## String Concatenation Uses `&`, Not `+`\n\n`+` on strings works only if **both** sides are strings. If one side is a number, `+` does numeric addition and throws a type-mismatch. Always use `&`:\n\n```vbscript\nRhino.Print \"Count: \" & n\n```\n\n## `For Each` Needs a `Variant`\n\n```vbscript\nDim item\nFor Each item In someCollection\n    ' ...\nNext\n```\n\nThe loop variable must be `Variant`. You cannot `Dim item As Long` (VBScript has no typed `Dim`).\n"}]}},"edit_planar_face":{"text":"Translate one planar face of an existing closed Brep with Rhino's PushPull Extend.\nUse when extending or retracting that face preserves the intended element and its connections. The selected face and every adjacent face must be planar. This tool supports unlocked top-level model-space Breps, not extrusion conversions or block interiors; finish group/block editing first. It requires Bridge face_edit=1 and Rhino 8.16+.\n\nPass object_id, face_index and expected_geometry_crc from the same current geometry observation. A changed CRC rejects the edit before replacement. translation is an XYZ vector in document units; its component normal to the face must exceed document tolerance. The helper prepares a duplicate and checks valid closed manifold geometry, orientation and finite positive volume before replacing the original under its same GUID. Object attributes, groups, geometry UserStrings and the geometry UserDictionary are preserved. Other custom geometry user data is rejected before editing because its preservation cannot be verified by this operation.\n\nThe existing native executor owns Undo and completion. A confirmed result returns edited=true, the new geometry_crc, before/after volumes and face counts. Face indices may change; observe faces again before another edit. This reports the geometric edit, not construction suitability, clearance from neighbours or a saved document. Choose the observations needed to assess the intended change. An unconfirmed result must be inspected before retrying; timeout and result_error do not prove the edit was undone.","source_refs":[{"path":"src/mcp/features/modeling/tools-explain.md","sha256":"0ec8c4a7070dd1c23ec1e5f4e9cab18d235548367894dfe590ba47ebba143ad9"}]},"edit_planar_faces":{"text":"Edit one planar face on each of 1..32 distinct Breps in one native call and Undo record.\nUse the batch when the targets and face movements are already identified together.\nEach `edits` item contains `object_id`, `face_index`, `expected_geometry_crc` and `translation`, with the same geometry and preservation contract as `edit_planar_face`.\nRequires Bridge `face_edit_batch=1`. Repeated object IDs are rejected because an edit can change that object's face indices; observe its result before choosing another face.\n\nAll replacements are prepared and checked before the first document change. A preparation failure leaves every original unchanged. A replacement failure stops the batch and returns per-item `applied`, `failed`, `unknown` or `not_attempted` outcomes and `applied_count`.\nCompleted edits remain in the single Undo record; it is not an automatic rollback.\nPartial or uncertain execution is not a request to repeat the whole batch. Inspect the reported objects and reconcile any unknown outcome before deciding the next edit.","source_refs":[{"path":"src/mcp/features/modeling/tools-explain.md","sha256":"0ec8c4a7070dd1c23ec1e5f4e9cab18d235548367894dfe590ba47ebba143ad9"}]},"save_rhino_document":{"text":"Save the current connection's existing .3dm file without a command, prompt or Enter.\nUse after an authorized editing batch when the file should be saved. It saves the whole bound document to its existing path; there is no SaveAs or arbitrary path input.\nActive or uncertain group/block editing, a mismatched document and a read-only file are rejected before writing. A confirmed response returns saved=true and the actual modified flag. An unconfirmed response is not failure proof: never automatically repeat the save or clear the connection's native-completion protection.","source_refs":[{"path":"src/mcp/features/modeling/tools-explain.md","sha256":"0ec8c4a7070dd1c23ec1e5f4e9cab18d235548367894dfe590ba47ebba143ad9"}]},"setup_modeling":{"text":"Register materials or create construction layers in the current Rhino document.\n\noperation=\"materials\" registers the curated PBR library using readable names.\nFor matching names overwrite=true updates PBR channels, false preserves them; omit it to choose Yes/No once in Rhino. Cancel performs no changes.\n\noperation=\"layers\" creates/reuses M/category/system.name/element.role paths, assigns materials and matching display/print colors. A system uses its first render_material_ids recipe; connection/reinforcement/decking use galvanized steel, and Wood subfloor/sheathing use birch plywood. These are setup defaults, not a role mapping supplied by the construction manifest. Container layers are gray. Existing matching materials are reused; overwrite is only for operation=\"materials\". No object is moved or stamped with metadata.\n\nRequires Bridge modeling_materials=2. The whole operation is one Undo step.\nSuccess reports API execution, not visual review or a saved 3DM. An uncertain result must be inspected before any retry.","source_refs":[{"path":"src/mcp/features/modeling/tools-explain.md","sha256":"0ec8c4a7070dd1c23ec1e5f4e9cab18d235548367894dfe590ba47ebba143ad9"}]},"list_materials":{"text":"Lists the curated PBR material library used by assign_material without changing Rhino.\n\nEach entry carries metallic/roughness PBR channels, an Unreal material slot name (ue_material_slot) for deterministic remapping after import, and tags. Materials do not define object layers. setup_modeling creates M/category/system/role layers from the construction library separately.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds display, physical, metadata, source, paths, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/modeling/tools-explain.md","sha256":"0ec8c4a7070dd1c23ec1e5f4e9cab18d235548367894dfe590ba47ebba143ad9"}]},"assign_material":{"text":"Assigns a curated PBR material and its canonical M:: layer to explicit Rhino objects.\nThe compiled helper creates only the chosen material/layer on demand and reuses existing entries. Returns applied GUIDs without adding automatic dimensions.\n\nFor structural members, also declare what the object IS in construction terms: structural_role (e.g. \"joist\", \"girder\", \"stud\", \"truss_chord\") and construction_system (a system_id from get_construction_guidance).\nAn explicit structural_role retains its legacy user-text key. A system is stored as the typed construction_reference described below. If the chosen material_id is not a typical finish for the declared system, the response carries a warning (it still applies).\n\nfloor is a user-supplied level label. construction_detail is a readable label; construction_reference optionally identifies a known source as {\"kind\": \"construction_system\", \"id\": \"\u003csystem_id>\"}. These source records are preliminary system guidance, not verified construction details. The old construction_system argument is accepted and produces the same typed reference.\nA source name supplies the detail label when no explicit label is given.\n\nTwo effects, independently switchable:\n- apply_render_material: creates/reuses a physically-based Rhino material using the library name and assigns it per object, so GLB export (publish_to_chestnut) and Datasmith carry real PBR channels. The object's layer is always preserved. If false, no native material is changed or created.\n- attach_metadata: defaults to false; ordinary material application writes no object management UserStrings. Set true only for an explicit request to attach metadata. It writes only material_id when a native material is applied, plus supplied floor/detail/reference metadata. PBR channels remain on the native material. A metadata-only call preserves the current material identity and writes only the supplied metadata.\n\nUnspecified metadata and asset provenance are preserved. Requires a Bridge with modeling_materials=2; older Bridges are rejected before any mutation.\nWorks on breps, meshes, and block instances (an instance's material applies to definition geometry set to 'by parent'; the metadata is attached to the instance itself only when explicitly enabled). Query list_materials when the required material ID is not already known.","source_refs":[{"path":"src/mcp/features/modeling/tools-explain.md","sha256":"0ec8c4a7070dd1c23ec1e5f4e9cab18d235548367894dfe590ba47ebba143ad9"}]},"list_project_files":{"text":"List project filenames and stable file references without reading Rhino.\nlimit is 1–500; offset is nonnegative. Set include_ids=true to choose a project_file_id for Scene or Phase when several saved models have the same filename.","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"create_phase":{"text":"Create an organizational Phase for Plans; this does not edit Rhino geometry.\nfile_name accepts only a filename and resolves a project_files reference. Use project_file_id for duplicate names. status is pending, running, completed, failed, blocked or paused, shared with Plan and Step statuses.","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"get_phase":{"text":"Read a Phase's name, status, description and Plan count.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds description, scope, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"list_phases":{"text":"List organizational Phases with totals and an explicit truncation flag; limit is 1-500.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds description, scope, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"update_phase":{"text":"Update Phase organization; omitted fields retain their values.\nstatus uses the same choices as Plans. file_name='' clears the file reference; project_file_id chooses an existing file, without renaming or moving a model.","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"create_plan":{"text":"Create a Plan in an optional organizational Phase. Work may pause, switch and resume in any order; a Plan does not require linear completion.\nscope is selected from planning_scopes; built-ins are house, interior, structure, drawing and component. A custom row selects one of these template_scope values.\nThe component template uses inspect_context, design, model, validate. scene_ids are context; component_ids explicitly bind targets without requiring membership in those Scenes.\nLegacy scene_id must match the first scene_ids entry when both are supplied.\nPlans record state and evidence, do not execute steps, and do not authorize edits.\ndepends_on is an array of related Plan or Phase IDs, including tasks in other Phases. It does not enforce existence, completion, cycles, self-reference or execution order. Use [\"plan_a\", \"phase_b\"], never \"plan_a, phase_b\".","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"get_plan":{"text":"Read the current Plan or an immutable saved revision, including legacy baseline 0.\nIDs (including Step component_ids) are hidden unless include_ids=true.\nThe supplied plan_id is not repeated. artifact_dir and artifact_refs locate work files.\n\nSnapshots contain Plan metadata, step state and handles; they are not Rhino geometry backups. A missing requested revision never falls back to current state.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds steps, references, artifacts, audit, or all; default is summary.\nsteps includes each Step's input_refs and output_refs; references adds target/context relationships, and artifacts adds Plan work files.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"list_plans":{"text":"List compact Plan summaries, optionally filtered by Phase, contextual Scene or status.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds references, artifacts, audit, or all; default is summary. For Step detail use get_plan(field_groups=[\"steps\"]).\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"update_plan":{"text":"Update Plan metadata and bindings atomically, recording a new saved revision.\n\nOmitted fields retain prior values; [] clears refs, and phase_id='' detaches the Phase. expected_revision rejects stale updates without changing the Plan.\nReferences provide context and explicit targets, not permission to edit geometry.\ndepends_on is a free array of related Plan/Phase IDs, including other Phases.\nstatus may be pending, running, paused, completed, failed or blocked; it imposes no completion requirement on related work. artifact_refs records work files.","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"list_plan_revisions":{"text":"List saved Plan revisions newest first, with operation labels and truncation metadata.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"update_step":{"text":"Record a Step's status, evidence and optional explicit Component targets.\nOmitted refs retain prior values; [] clears them. Step component_ids=null in a returned Plan inherits Plan targets; explicit [] selects none. Scene refs never expand the selection. Status may be pending, running, paused, completed, failed or blocked. Dependencies are references, not execution gates. Any Step can be paused or resumed regardless of other Steps; no forced completion is required.\nexpected_revision rejects stale updates. No Rhino operation is executed here.\nChanging refs or targets while resending the same Step status preserves the Plan status, including paused/completed. Only an actual Step status change recalculates it.","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"resolve_targets":{"text":"Resolve registered Step targets, or Plan targets when the Step has no override.\n\nAn explicit empty Step selection stays empty. Contextual Scenes never expand targets. Returned group/document identities have live_verified=false; inspect current Rhino state and user intent before editing. This does not grant authority.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds references, geometry, scope, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"get_selection_references":{"text":"Read the current selection and return its registered Component, Plan and Step IDs and names in one call. IDs are always included because this is an explicit ID lookup.\nDistinguishes direct Step targets from inherited Plan targets and includes ancestor Components. Scene context never invents targets. Selection is live; relationships are registered metadata, not a fresh native ownership reconciliation. Unregistered objects and truncated selection/Plan results are reported explicitly.\nfield_groups adds steps, references, geometry, artifacts, description, scope, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/planning/tools-explain.md","sha256":"50ffb839f789257d7035d91cec31069ffaff97f27d048a081d32dc3328a651a0"}]},"publish_objects_to_chestnut":{"text":"Exports specific Rhino objects as one GLB and publishes them to Chestnut.\n\nUse this after execute_rhino_script (and optionally validate_structure), passing the returned object GUIDs. Reusing asset_id updates the existing Chestnut asset without changing placements that already reference it.\n\nArgs:\n    guids: Rhino object GUIDs to export. Unrelated document objects are excluded.\n    asset_name: Human-readable name shown in Chestnut.\n    asset_id: Stable optional ID for linked updates. Generated deterministically\n              from the Rhino document and GUIDs when omitted.\n    body_type: \"static\" for architecture, \"dynamic\" for loose props, or\n               \"kinematic\" for script-driven objects.\n    collider: Collider intent: \"box\", \"convex\", \"compound\", or \"trimesh\".\n              Chestnut currently falls back to a box where needed.\n    preserve_scale: Keep Rhino's real-world dimensions instead of normalizing\n                    the model to a one-metre display prop.\n    mass: Physics mass in kilograms. Static bodies always use zero.\nReturns:\n    JSON containing the stable Chestnut asset ID, URL, metadata, and whether\n    the operation created or updated the asset.","source_refs":[{"path":"src/mcp/features/publishing/tools-explain.md","sha256":"b948ca02ccecdad3293a2b2e1a0bb450bc717b421cae3de49bab4e61e3896b08"}]},"publish_to_chestnut":{"text":"Publishes Rhino objects to Chestnut using safe semantic defaults.\n\nThis is the preferred publishing tool for normal use. It hides collider, scale, mass, and rigid-body details. Call it when the user says things such as \"publish that to Chestnut\".\n\nArgs:\n    guids: Rhino object GUIDs returned by execute_rhino_script.\n    asset_name: Human-readable asset name.\n    behavior: Optional semantic preset:\n        \"auto\"         — infer architecture versus movable object from name\n        \"architecture\" — fixed building, terrain, structure, or enclosure\n        \"object\"       — movable physical prop affected by gravity\n        \"animated\"     — script-driven door, lift, platform, or mechanism\n    asset_id: Optional stable link ID. Omit for a deterministic Rhino link.","source_refs":[{"path":"src/mcp/features/publishing/tools-explain.md","sha256":"b948ca02ccecdad3293a2b2e1a0bb450bc717b421cae3de49bab4e61e3896b08"}]},"list_design_scenes":{"text":"List Scene names across the whole project, without a Plan or live document lookup.\nname is a case-insensitive substring; file_name is an exact optional filter.\nResults are bounded by limit (1–200) and offset, with total and truncated.\nThe default is names only; field_groups adds scope (file_name, units), audit (created_at, updated_at), state (revision), or all. include_ids independently enables Scene handles.","source_refs":[{"path":"src/mcp/features/scenes/tools-explain.md","sha256":"d479156f9ec96559c35767e91987a0b3a18239e58346f22d689bd88af7036b0a"}]},"create_design_scene":{"text":"Creates a persistent scene handle for a house or interior generation.\nfile_name resolves a project_files reference; project_file_id selects an existing entry.\nScene metadata remains local and is retrieved by ID instead of being repeated in the model context.","source_refs":[{"path":"src/mcp/features/scenes/tools-explain.md","sha256":"d479156f9ec96559c35767e91987a0b3a18239e58346f22d689bd88af7036b0a"}]},"get_design_scene":{"text":"Returns a scene summary; scope adds file_name (empty when not recorded). IDs are hidden unless include_ids=true; the supplied scene_id is not repeated.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds scope (file_name/units/model_path), state (revision), geometry (bounds/component), audit (timestamps), or all.","source_refs":[{"path":"src/mcp/features/scenes/tools-explain.md","sha256":"d479156f9ec96559c35767e91987a0b3a18239e58346f22d689bd88af7036b0a"}]},"update_design_scene":{"text":"Set the Scene’s project_files reference by file_name or project_file_id; file_name='' clears it.\nA filename must have no folders. Duplicate names require project_file_id from list_project_files. This changes metadata only; it does not rename or move the Rhino document.","source_refs":[{"path":"src/mcp/features/scenes/tools-explain.md","sha256":"d479156f9ec96559c35767e91987a0b3a18239e58346f22d689bd88af7036b0a"}]},"get_scene_objects":{"text":"Read current Rhino members of the Scene’s registered semantic groups as one set.\nRequires a live saved document, stable editing state and at most 64 registered groups.\nexpected_model_path optionally verifies the bound model. Individual objects are never registered in the DB.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds scope (file_name/units/model_path), state (revision), geometry (bounds/component), audit (timestamps), or all.\nlimit (1–200), offset and truncated bound the live object page.","source_refs":[{"path":"src/mcp/features/scenes/tools-explain.md","sha256":"d479156f9ec96559c35767e91987a0b3a18239e58346f22d689bd88af7036b0a"}]},"validate_structure":{"text":"Analyze the specified Rhino geometry under the supplied loads, supports and calculation assumptions.\n\nengine=\"auto\" (default) analyses line models (beams, columns, trusses, frames) with Almond's built-in 3D frame solver: analysis_method \"native\", confidence \"high\", no Karamba install needed. It is a linear-elastic first-order frame analysis with EN 1993-1-1 member checks (elastic moduli; flexural buckling with L_cr = member length; no lateral-torsional buckling), benchmarked against closed-form results and live Karamba runs. Models with shells, and shell/gridshell/membrane structure types, go to Karamba. engine=\"karamba\" forces the Karamba route, which tries three pathways in strict order of confidence and always tells you which one ran:\n    analysis_method \"api\"        — direct Karamba 3.1 API solve, confidence \"high\" analysis_method \"template\"   — audited capsule GHX template,  confidence \"medium\" analysis_method \"rule_based\" — heuristic span/slenderness rules, confidence \"low\" The verdict string names the method (e.g. \"[RULE-BASED ESTIMATE, LOW CONFIDENCE] ...\").\nTreat rule_based/low results as estimates, NOT finite element analysis, and say so when reporting to the user.\n\nResults locate demand and capacity issues in the analyzed system. The cause and appropriate design change depend on the members' connections, supports and load path.\n\nArgs:\n    guids: Current Rhino object GUID strings in the analysis scope.\n    structure_type: Analysis template to use. Options:\n        \"beam\"       — simple beam bending/deflection\n        \"truss\"      — axial force/buckling analysis\n        \"shell\"      — shell stress/displacement\n        \"frame\"      — moment/shear frame analysis\n        \"canopy\"     — cantilevered canopy\n        \"gridshell\"  — large deformation gridshell\n        \"membrane\"   — form-finding membrane\n        \"highrise\"   — high-rise structural systems\n    load_kn: Applied load in kN (default 10.0).\n    material: Material type: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\" (default \"Steel\").\n    engine: \"auto\" | \"native\" | \"karamba\" (see above).\n    fixed_supports: True = fully fixed supports, False = pinned (rotations free).\n    self_weight: include member self weight.\n    span_m: structural span in meters for the L/250 limit when members are split at\n        every node (e.g. a 6.2 m joist drawn as two 3.1 m segments). Native engine only.\n    asset_loads: add the gravity loads of placed library assets (estimated self weight\n        plus in-use contents/occupants from each asset's load entry, e.g. a filled\n        bathtub) where they stand on (or hang from) the frame. Placements come from\n        Rhino objects tagged with an Almond asset id, or from the scene ledger when\n        scene_id is given. Native engine only; the result's \"asset_loads\" lists every\n        placement with its load and carrying members, or why it was not applied.\n    floor_load_kn_m2: imposed floor load in kN/m2 (e.g. 2.0 for homes, EN 1991-1-1\n        category A) on every bay enclosed by beams on a level; the beams take it by the\n        45-degree rule (two-way, one-way above 2:1). Native engine only. A code floor load\n        already covers movable furniture and people: combine it with asset_loads only for\n        heavy specific items, and set load_kn to 0 to avoid double counting.\n    floor_dead_kn_m2: superimposed dead load in kN/m2 (floor build-up, finishes) on the\n        same bays.\n    design_basis: \"en1990\" (default): deflection at SLS characteristic (G + Q), member\n        checks at ULS 1.35 G + 1.5 Q. G = self weight, floor build-up and the weight of\n        placed items; Q = load_kn, the occupancy floor load, contents and occupants.\n        \"unfactored\" checks both at G + Q (the Karamba route's basis). Native engine.\n    uls_combination: \"6.10\" or \"6.10ab\" (the worse of 6.10a and 6.10b per member). Default:\n        the design code's choice (Eurocode profile: 6.10). A profile that prescribes one\n        expression overrides the request (with a warning).\n    design_code: design code profile for the numbers a code or National Annex sets\n        (gamma_G, gamma_Q, psi_0, xi, gamma_M0, gamma_M1, deflection limit): \"eurocode\"\n        (default, EN recommended values), any profile from list_design_codes, or \"off\"\n        (unfactored G + Q, no partial factors; same as design_basis=\"unfactored\").\n        Results carry \"design_code\" with the values used and any unverified ones.\n    fabrication: hollow steel sections (CHS/RHS) are \"cold_formed\" (default, EN 10219,\n        buckling curve c) or \"hot_finished\" (EN 10210, curve a; a0 for S460). The difference\n        is up to about 23 % in buckling resistance; use hot_finished only when specified.\n    detail: native engine only. Adds \"members\" (per member: role, length, section, ULS design\n        forces N/V/M/T, governing combination and check, slenderness, chi, stress,\n        utilization, SLS deflection and span/deflection ratio, pinned ends) and \"supports\"\n        (reactions Fx..Mz at SLS and each ULS combination). Off by default to keep replies short.\n    connections: \"rigid\" (default: every joint transmits moment) or \"simple\": beams are\n        pinned (major-axis bending released) and braces pinned in both axes where they\n        stop - not where another member carries on in line - while columns stay\n        continuous. Typical bolted steel and timber framing is closer to \"simple\"; rigid\n        joints can flatter beam deflection. A curve's user text almond:release = \"pinned\" |\n        \"pinned_start\" | \"pinned_end\" | \"rigid\" overrides either mode. Native engine.\n    stability: \"auto\" (default): elastic critical load factor alpha_cr for every ULS\n        combination (EN 1993-1-1 5.2.1) and sway imperfections phi = 1/200 x alpha_h x alpha_m\n        (5.3.2) in +/-x and +/-y; alpha_cr \u003c 10 runs a second-order (P-Delta) ULS analysis,\n        alpha_cr \u003c= 1 fails as unstable. \"off\": first-order without imperfections.\nThe tool also compares the analyzed span with the construction-system library\nand appends a \"construction_check\" object (matching_systems with\nfits_span and suggested member depths, plus warnings when the span falls\noutside every curated system's range for this structure_type/material).\n\nReturns:\n    JSON from the bridge plus the construction_check. Top-level fields: status\n    (\"pass\"|\"fail\"|\"error\"), passed (bool), verdict (text), suggestions,\n    confidence (\"high\"|\"medium\"|\"low\"), warnings, and worst_member_guids\n    (up to 5 Rhino GUIDs of the most over-utilized members). The results\n    object carries the numbers: max_deflection_mm,\n    deflection_limit_mm, utilization_ratio, max_stress_mpa, yield_stress_mpa,\n    span_m, analysis_method (\"native\"|\"api\"|\"template\"|\"rule_based\"), reactions_kn\n    (total vertical reaction, api path only), and per_element_utilization —\n    a list of {source_guids, utilization} entries (utilization 1.0 = at\n    capacity) keyed back to the Rhino objects that produced each element.","source_refs":[{"path":"src/mcp/features/structure/tools-explain.md","sha256":"516cdea147a5affa51feca06a1475d474919cd869b3b2e8cc0f0ec66a5455fe7"}]},"list_design_codes":{"text":"Lists the design code profiles validate_structure / visualize_structure accept as design_code.\n\nA profile holds the numbers a design code or National Annex sets (load factors gamma_G, gamma_Q, psi_0, xi; the ULS expression; material factors gamma_M0, gamma_M1; the deflection limit; suggested imposed floor loads), each with its source clause and a verified flag.\n\"eurocode\" (EN recommended values) is built in and the default; \"off\" is unfactored mechanics.\nPractices add National Annex profiles as JSON files in user_dir (see src/mcp/features/structure/PROFILES-SPEC.md).\nUnverified values are allowed but flagged in every result that uses them.\n\nReturns JSON: default, profiles [{id, name, basis, origin, verified, unverified, uls_expression, uls_default, deflection_limit_ratio, imposed_floor_kn_m2}], problems (files that failed validation), user_dir.\nIDs and GUIDs are omitted by default. Set include_ids=true when needed; supplied target IDs are not repeated.\nfield_groups adds parameters, source, audit, or all; default is summary.\ninclude_ids independently enables handles; audit enables timestamps.","source_refs":[{"path":"src/mcp/features/structure/tools-explain.md","sha256":"516cdea147a5affa51feca06a1475d474919cd869b3b2e8cc0f0ec66a5455fe7"}]},"visualize_structure":{"text":"Run a live structural analysis on a line model and SHOW it in every Rhino viewport:\nthe undeformed wireframe, the exaggerated deformed shape coloured blue -> red by displacement (or by utilization), supports, load arrows and a legend panel with max deflection, the L/limit check and PASS/FAIL. Nothing is baked into the document.\n\nUse it to make structural behaviour visible while designing: model the structural axes as curves, include Rhino point objects at the supports, call this tool, then fix the members it shows in red (add a column, shorten a cantilever, upsize the section via beam_diameter_mm) and call it again. validate_structure gives the auditable verdict; this tool is the visual, iterative view of the same solve.\n\nArgs:\n    guids: Curve GUIDs of the structural axes plus point GUIDs marking supports\n        (see fixed_supports). Without points, the lowest nodes are supported.\n    load_kn: Total imposed load in kN, shared equally by the free nodes (-Z).\n    material: \"Steel\", \"S355\", \"Concrete\", \"Wood\", \"Aluminium\".\n    beam_diameter_mm, beam_wall_mm: circular hollow section for every member\n        (default: inferred / CHS 114.3x4).\n    self_weight: include gravity.\n    fixed_supports: True = fully fixed supports, False = pinned (rotations free).\n    deflection_limit_ratio: span/ratio limit, e.g. 250 for L/250. Default: the design code's\n        limit (Eurocode profile: 250).\n    span_m: reference span in meters for the limit (default: longest member).\n        Set it when members are split at every node, e.g. a 6.2 m joist drawn\n        as two 3.1 m segments.\n    color_by: \"displacement\" or \"utilization\".\n    scale: deformation exaggeration; omit for automatic (~6% of span).\n    reveal: 0..1 fraction of members drawn (for staged construction playback).\n    reanalyze: False re-uses the last solve and only changes the display\n        (scale / color_by / reveal / physics / title) - cheap enough to animate.\n    physics: False draws the same members as plain geometry with no analysis\n        overlay (\"physics off\"), for before/after comparisons.\n    display_guids: draw only these members (e.g. one frame line for a section\n        view); the analysis still covers every member in guids.\n    title: legend title.\n    clear: remove the overlay.\n    engine: \"auto\" (default: Almond's native frame solver, no Karamba needed; Karamba\n        when the selection has shells or the bridge cannot export a model),\n        \"native\" or \"karamba\".\n    asset_loads: add the loads of placed library assets (native engine), as in\n        validate_structure; loaded points are drawn with load arrows.\n    floor_load_kn_m2, floor_dead_kn_m2: floor area loads on every enclosed bay, as in\n        validate_structure.\n    design_basis, uls_combination, design_code: as in validate_structure; the overlay draws\n        the SLS deflected shape coloured by the ULS utilization envelope.\n    connections: \"rigid\" or \"simple\", as in validate_structure; pinned ends are drawn\n        as small circles.\n    stability: \"auto\" or \"off\", as in validate_structure.\n    view: \"deflection\" (default) or \"buckling\": draw the first buckling mode of the\n        governing ULS combination with its alpha_cr (STABLE >= 10, SWAY-SENSITIVE 1-10,\n        UNSTABLE \u003c= 1) instead of the deflected shape.\n\nReturns JSON: status (\"pass\"|\"fail\"|\"error\"|\"cleared\"), max_displacement_mm,\ndeflection_limit_mm, span_m, max_utilization, scale, per-element\n{source_guids, max_displacement_mm, utilization}, warnings.\nThe native engine reports analysis_method \"native\"; engine=\"karamba\" needs\nKaramba3D 3.1 (the trial caps models at 20 beam elements).","source_refs":[{"path":"src/mcp/features/structure/tools-explain.md","sha256":"516cdea147a5affa51feca06a1475d474919cd869b3b2e8cc0f0ec66a5455fe7"}]},"export_structural_report":{"text":"Renders the persisted validate_structure history to a Markdown report.\n\nEvery successful validate_structure call is recorded in the local state database (inputs, analysis method, confidence, numbers, warnings). This tool writes them to a .md file, newest first, with an explanation of the analysis pathways and pass criteria.\n\nArgs:\n    path: Output file path. Default:\n        \u003cuser data dir>/reports/structural-validation-\u003ctimestamp>.md\n    limit: Maximum number of runs to include (default 50, max 500).\nReturns:\n    JSON with the report path and run count.","source_refs":[{"path":"src/mcp/features/structure/tools-explain.md","sha256":"516cdea147a5affa51feca06a1475d474919cd869b3b2e8cc0f0ec66a5455fe7"}]},"project_info":{"text":"Read selected project information. sections defaults to [\"project\", \"document\", \"artifacts\"]; runtime and instructions are optional. The document section checks the currently open live document in this same call; do not call get_rhino_context again merely to verify it. Project root is the one absolute path and is actually set as ALMOND_PROJECT_ROOT. Other paths are relative to it. Managed tools apply the root and selected artifact folder automatically; workers supply relative paths.\nReuse known context. Refresh only for first connection/reconnection, evidence of a document change, missing project/path information, or the user's request.\nA new instruction alone is not a refresh trigger.","source_refs":[{"path":"src/mcp/runtime/mcp_server-explain.md","sha256":"44efb81eb0c0085140e16f6e18d0e836a173d79bc2e6824729fdd46de9ea68b2"}]},"get_rhino_execution":{"text":"Read an official RhinoCode execution without rerunning it. Omit request_id for the latest execution in this connection, or supply the exact returned request ID.\nCompleted successful reads return the requested result/logs, page information, request ID and outcome by default. Set include_diagnostics=true for operation identity, native/CLI details, Undo, file/hash and runtime-completion evidence.\nPending, uncertain, failed, partial, nonzero CLI exit and result-display-error responses retain their detailed evidence even when include_diagnostics is false.\nPending and finishing work retains its ownership. Completion requires the exact final Rhino receipt and the CLI process to have exited; timeout and process exit alone do not prove completion. native_completed can expose a verified Rhino result while completed remains false because the CLI lifecycle is still unconfirmed.\nA late exact result can reconcile CLI-only uncertainty. Unrelated native uncertainty remains blocked. include_result controls result retrieval, result_fields selects top-level fields, and offset/limit page retained result rows (or characters for a string) without another Rhino call.\nRead again when completion, needed result data, logs, or diagnostics remain to be checked; a completed response containing the needed result is sufficient. include_stdout is false by default. include_ids defaults true for explicitly authored code results; request identity always remains, and operation identity is available with diagnostics.\nPage information remains on the final page too. Execution files remain available until this connection is cleaned up. In an external client, connection_id reconciles the live tracked connection. After the client process restarts, omit connection_id and provide the exact request_id to read its retained evidence from the recorded session. This recovery-only path does not reconnect or execute Rhino work.\nRetained evidence can still be read after the original model file is renamed or deleted, while its recorded session storage remains at the original location.","source_refs":[{"path":"src/mcp/runtime/mcp_server-explain.md","sha256":"44efb81eb0c0085140e16f6e18d0e836a173d79bc2e6824729fdd46de9ea68b2"}]},"set_working_plan":{"text":"Select or resume a Plan and optional Step for this connection. Reuse its existing artifact folder. On first use, artifact_name (one folder name) or the Plan goal creates a recorded relative path tmp/YYMMDD_name; the directory is created only when files are needed. Plan/Step status need not be completed or linear. Other workers discover the same path and refs from the Plan. Use rename_artifact_folder to change an existing folder name. RhinoCode project Python uses this directory as cwd; Rhino C# uses RhinoAlmondBridge.ManagedFiles.Output(\"relative-name\").","source_refs":[{"path":"src/mcp/runtime/mcp_server-explain.md","sha256":"44efb81eb0c0085140e16f6e18d0e836a173d79bc2e6824729fdd46de9ea68b2"}]},"rename_artifact_folder":{"text":"Rename a Plan's artifact folder, defaulting to the selected Plan. Supply one name; a YYMMDD_ prefix is applied automatically. Managed writes are serialized with the rename. Current Plan/Step file refs are updated together, while immutable revision history is retained. Existing destinations are never overwritten.","source_refs":[{"path":"src/mcp/runtime/mcp_server-explain.md","sha256":"44efb81eb0c0085140e16f6e18d0e836a173d79bc2e6824729fdd46de9ea68b2"}]},"execute_project_python":{"text":"Execute Python 3 inside the bound Rhino through official RhinoCode, using the selected Plan artifact folder as cwd.\n\nRead get_modeling_guide(tool=\"execute_project_python\") for the bundled rhino3d-scripts skill and references. Select a Plan with set_working_plan first. Relative file writes land in its artifact folder. doc and scriptcontext.doc are the bound RhinoDoc; assign a JSON value to result. project_root is absolute and artifact_dir is relative to it. The wrapper applies project/artifact environment variables temporarily and restores cwd, scriptcontext, Undo and redraw. Record useful outputs in Plan/Step refs.\n\nThis replaces the external worker-venv Python process. Rhino's embedded packages may differ; missing dependencies are not automatically installed. RhinoCommon is available. Do not start detached/background writers or switch documents.\nTimeout limits waiting and never kills Rhino. Read get_rhino_execution(request_id) after pending results; never repeat writes just because the CLI returned or timed out.\n\nArgs:\n    code: Synchronous Python 3 source; assign a JSON-safe value to result.\n    timeout_seconds: Integer 1-600, default 60; waiting limit, not execution cancellation.\nReturns:\n    RhinoCode outcome, request_id and selected artifact_dir, with late-result recovery.","source_refs":[{"path":"src/mcp/runtime/mcp_server-explain.md","sha256":"44efb81eb0c0085140e16f6e18d0e836a173d79bc2e6824729fdd46de9ea68b2"},{"path":"src/mcp/features/modeling/rhino3d-scripts/INTEGRATION.md","sha256":"737243612cc0a71b910e5ca54bda68458a770549369a1bade39fe42e7213441d"},{"path":"src/mcp/features/modeling/rhino3d-scripts/SKILL.md","sha256":"6618e636ac83c50a034a477e2ce6b2c0b2f4d8a0fc9dfd4ea0d676a8d32c4c80"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/macros-and-loading.md","sha256":"14a0822d61d74c34694b753aa727b08b6802aaaf89ff4d40e65746e784b595cd"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/rhinocommon-map.md","sha256":"e9baa208601cd5edfa824aa576d314bdf19d48b9e29b8e5e636bc3a2867094e0"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/rhinoscriptsyntax-cheatsheet.md","sha256":"8abd85be2b9e915ebeeec5538d62043e676f59c74d34fb438021a6f852e3eac0"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/vbscript-quirks.md","sha256":"0a9163940db6ac3618ce2ab6df8ae845b802ac303862b6b38375fd41a4536364"}],"scripting_skill":{"name":"rhino3d-scripts","sources":[{"path":"src/mcp/features/modeling/rhino3d-scripts/INTEGRATION.md","sha256":"737243612cc0a71b910e5ca54bda68458a770549369a1bade39fe42e7213441d","text":"# Almond에서 사용하는 Rhino 3D Scripting Skill\n\n이 묶음은 사용자가 설치한 `rhino3d-scripts`의 본문·네 참고자료·MIT LICENSE를 그대로 포함한다. `get_modeling_guide(tool=\"execute_rhino_script\")` 또는 `get_modeling_guide(tool=\"execute_project_python\")`은 이 자료를 같은 guide snapshot으로 반환한다. 개인 skill 폴더나 네트워크 조회는 실행 시 필요하지 않다.\n\n원본: https://github.com/github/awesome-copilot/tree/main/skills/rhino3d-scripts 공식 실행 명세: https://developer.rhino3d.com/guides/scripting/advanced-cli/ 포함본: 2026-10-30 사용자 로컬 설치본. upstream 원본과 동일한 revision이라는 뜻은 아니다.\n\n## 이 도구에 적용하는 실행 방식\n\n- 새 코드는 Python 3이 기본이다. `doc`은 연결된 실제 RhinoDoc이며 `scriptcontext.doc`도 같은 문서다. Python은 `result = {\"changed\": 2}`처럼 JSON 호환 값을 직접 할당한다.\n  구조화 결과는 dict/list로 반환하고, C# statement body는 JSON 문자열 `result_json`에 결과를 넣는다. 첫 결과의 행·문자 예산과 후속 조회 조건은 위 실행 도구 설명을 따른다.\n  `csharp`와 `csharp-script`는 같은 ScriptEditor C# 경로다.\n  이전 `class Script { public static ... Run(RhinoDoc doc) }` 공개 실행 형식은 사용하지 않는다.\n- 두 공개 도구 모두 공식 RhinoCode → ScriptEditor에서 실행한다. 프로젝트 Python의 cwd는 선택한 Plan 산출물 폴더, 일반 Rhino 스크립트의 cwd는 프로젝트 루트다.\n  `project_root`는 절대경로, `artifact_dir`는 프로젝트 상대경로다. 필요하면 `os.path.join(project_root, artifact_dir, \"result.json\")`으로 출력한다.\n  `ALMOND_PROJECT_ROOT`, `ALMOND_MODEL_PATH`, `ALMOND_ARTIFACT_DIR`은 실행 중에만 바인딩된다.\n- 외부 MCP venv의 Python 패키지가 Rhino Python에 설치되어 있다고 가정하지 않는다.\n  누락된 의존성을 자동 설치하지 않는다. RhinoCommon은 Rhino 내장 Python에서 사용한다.\n- 실행기는 `list --json`에서 PID·프로세스 시작 시각·저장 문서 경로에 대응하는 exact `pipeId`를 선택한다. Almond A–J 슬롯 문자는 RhinoCode instance ID가 아니다.\n- 실행 전과 Rhino UI thread 진입 후에 대상 문서를 확인한다. Undo record와 redraw는 실행기가 관리하고 `finally`에서 cwd·환경·scriptcontext·redraw를 복구한다.\n  코드가 추가 Undo record를 만들거나 별도 thread에서 문서를 수정하지 않는다.\n- 반환의 `completed`와 결과를 확인한다. 대기 중이거나 필요한 결과 페이지·로그가 남으면 같은 `request_id`를 조회한다. CLI 프로세스 종료만으로 완료를 판정하지 않으며, timeout은 대기 한도이므로 코드를 종료하거나 반복하지 않는다.\n- 스킬의 대화형 선택 예제는 명시 GUID 입력으로 바꿔 사용한다. `rs.GetObject`, `Pause`, dialog는 자동 실행에 넣지 않는다. macro에 `!`를 자동 추가하지 않는다. 스킬의 일반 매크로 권고보다 기존 사용자 명령 보존과 이 연결의 완료 계약을 우선한다.\n- 원문에 있는 ScriptEditor의 VBScript 지원 설명은 이 실행기에 적용하지 않는다.\n  VBScript는 별도 legacy LoadScript/RunScript 표면이며 공개 RhinoCode 언어로 제공하지 않는다.\n  Python `rs.Command`는 한 번에 한 명령을 사용하며 `! ` 조합을 넣지 않는다.\n- 문서 공차 `doc.ModelAbsoluteTolerance`, GUID 변환, 실제 Geometry 타입, `Guid.Empty` 확인은 참고자료를 따른다. 긴 반복은 `Rhino.RhinoApp.EscapeKeyPressed`를 확인한다.\n  Boolean 결과의 null/빈 배열/유효닫힘 여부와 체적을 구분하고, 결과 검증 전 원본을 Replace/Delete하지 않는다. 유효닫힘만으로 중첩 제거를 성공 판정하지 않는다.\n\n## 내부 호출과 공개 도구의 경계\n\n재료·레이어 설정, 자산 배치·교환, 화면 capture의 감사된 C# recipe는 공개 실행 도구를 호출하지 않는다. 이들은 기존 private Bridge 전송·반환값·ManagedFiles 계약을 유지한다.\n공개 코드 실행에서 그 경로로 fallback하지 않는다. 고정 조회와 native helper도 그대로다.\n이 경계 덕분에 공개 실행 도구 교체가 내부 도구의 `guids`·재료 결과·파일 관리를 바꾸지 않는다.\n"},{"path":"src/mcp/features/modeling/rhino3d-scripts/SKILL.md","sha256":"6618e636ac83c50a034a477e2ce6b2c0b2f4d8a0fc9dfd4ea0d676a8d32c4c80","text":"---\nname: rhino3d-scripts\ndescription: 'Authoring and debugging scripts for Rhinoceros 3D (Rhino 8 and later). Use when asked to write RhinoScript (VBScript / .rvb / .vbs), RhinoPython, or RhinoCommon-based scripts; automate Rhino modeling tasks; build command macros; manipulate Rhino geometry, layers, blocks, or document objects; pick objects from the viewport; control redraw and undo; or load and run scripts from the Rhino Script Editor. Covers `rhinoscriptsyntax`, `scriptcontext`, the `Rhino.*` RhinoCommon namespaces (`Rhino.Geometry`, `Rhino.DocObjects`, `Rhino.Input`, `Rhino.UI`, `Rhino.Display`, `Rhino.FileIO`), and the Rhino 8 unified Script Editor.'\n---\n\n# Rhino 3D Scripting Skill\n\nWrite production-quality scripts for Rhinoceros 3D. Covers the three scripting surfaces (RhinoScript/VBScript, RhinoPython, direct RhinoCommon .NET) and the Rhino 8+ Script Editor.\n\n## When to Use This Skill\n\n- User asks to write, edit, or debug a `.rvb`, `.vbs`, or `.py` Rhino script\n- User wants a Rhino **command macro** or wants to automate a sequence of Rhino commands\n- User wants to manipulate geometry, layers, blocks, materials, viewports, or annotations from code\n- User mentions `rhinoscriptsyntax`, `scriptcontext`, `RhinoCommon`, `Rhino.Geometry`, `RhinoDoc`, or the Script Editor\n- User wants to pick objects, prompt for input, or build a small UI inside Rhino\n- User asks how to load, run, or distribute a script (startup scripts, aliases, toolbar buttons)\n\n## Choosing a Scripting Surface\n\nPick the surface based on the task, not preference. Recommend Python by default for new work.\n\n| Surface | When to choose | File ext |\n|---|---|---|\n| **RhinoPython** (`rhinoscriptsyntax` + RhinoCommon) | Default for new scripts. Best ecosystem, readable, full RhinoCommon access. | `.py` |\n| **RhinoScript** (VBScript) | Maintaining legacy `.rvb`/`.vbs` files; integrating with VBA/COM. | `.rvb`, `.vbs` |\n| **RhinoCommon (C#/.NET) via Script Editor** | Performance-critical loops, complex geometry, leveraging .NET libraries. | `.cs` |\n| **Command macro** | Pure sequence of existing Rhino commands; no logic. | toolbar/alias |\n\nA macro is **not** a script — it is a string of command-line input (e.g. `! _-Line 0,0,0 10,0,0 _Enter`). Use a script the moment you need a variable, loop, or conditional.\n\n## Prerequisites\n\n- Rhino 7 or later (Rhino 8 strongly recommended — unified Script Editor supports Python 3, VB, and C# in one window).\n- Script Editor: type `_ScriptEditor` (Rhino 8) or `_EditPythonScript` / `_EditScript` (older).\n- Run a saved file from the command line with `_-RunPythonScript` or `_LoadScript` + `_RunScript`.\n\n## Core Patterns\n\n### Python: minimal scaffold\n\n```python\nimport rhinoscriptsyntax as rs\nimport scriptcontext as sc\nimport Rhino\n\ndef main():\n    obj_id = rs.GetObject(\"Select a curve\", filter=rs.filter.curve, preselect=True)\n    if not obj_id:\n        return\n    length = rs.CurveLength(obj_id)\n    print(\"Length: {0:.4f}\".format(length))\n\nif __name__ == \"__main__\":\n    main()\n```\n\n### Python: working with RhinoCommon directly\n\n```python\nimport Rhino\nimport scriptcontext as sc\n\ndoc = sc.doc  # Rhino.RhinoDoc.ActiveDoc\ntol = doc.ModelAbsoluteTolerance\n\ncircle = Rhino.Geometry.Circle(Rhino.Geometry.Point3d(0, 0, 0), 5.0)\ncurve_id = doc.Objects.AddCircle(circle)\ndoc.Views.Redraw()\n```\n\n### VBScript: minimal scaffold\n\n```vbscript\nOption Explicit\n\nCall Main()\n\nSub Main()\n    Dim strObject\n    strObject = Rhino.GetObject(\"Select a curve\", 4)  ' 4 = curve filter\n    If IsNull(strObject) Then Exit Sub\n    Rhino.Print \"Length: \" & Rhino.CurveLength(strObject)\nEnd Sub\n```\n\n### Picking objects with a custom filter (Python, RhinoCommon)\n\n```python\nimport Rhino\nimport scriptcontext as sc\n\ngo = Rhino.Input.Custom.GetObject()\ngo.SetCommandPrompt(\"Select breps\")\ngo.GeometryFilter = Rhino.DocObjects.ObjectType.Brep\ngo.SubObjectSelect = False\ngo.GetMultiple(1, 0)\nif go.CommandResult() != Rhino.Commands.Result.Success:\n    pass\nelse:\n    ids = [go.Object(i).ObjectId for i in range(go.ObjectCount)]\n```\n\n## Step-by-Step Workflows\n\n### Bulk-modify many objects fast\n\n1. Disable redraw: `rs.EnableRedraw(False)`.\n2. Wrap mutations in a single undo record: `undo = doc.BeginUndoRecord(\"My Op\")` … `doc.EndUndoRecord(undo)`.\n3. Use RhinoCommon directly inside the loop (skip `rhinoscriptsyntax` overhead).\n4. Re-enable redraw and call `doc.Views.Redraw()` in a `try`/`finally` so a crash never leaves the viewport frozen.\n\n### Distribute a script to a teammate\n\n1. Save the `.py` / `.rvb` somewhere on disk.\n2. Add the folder to `Options → Files → Search paths` so Rhino can find it by name.\n3. Create a toolbar button or alias whose macro is:\n   - Python: `! _-RunPythonScript \"MyScript.py\"`\n   - RhinoScript: `! _-LoadScript \"MyScript.rvb\" _-RunScript MySubName`\n4. The leading `!` cancels any running command; `-` runs the command in script (no-dialog) mode.\n\n### Run code at Rhino startup\n\n1. Place a `.rvb`/`.py` in a search path.\n2. `Tools → Options → RhinoScript` (or `Python`) → add to **Startup** list. The file executes once per session.\n\n## Gotchas\n\n- **`rhinoscriptsyntax` returns GUIDs, RhinoCommon returns objects.** Mixing them is fine, but `doc.Objects.Find(guid)` is the bridge from a `rs.*` id to a `RhinoObject`.\n- **Coordinates differ by surface.** Python uses `(x, y, z)` tuples *or* `Rhino.Geometry.Point3d`; VBScript uses 3-element `Array(x, y, z)`. Never pass a Python list to a VBScript helper through COM.\n- **`Option Explicit` is off by default in VBScript.** Typos silently create new variables. Always add `Option Explicit` at the top of `.rvb` files.\n- **VBScript has no block scope.** All `Dim`s inside a `Sub` are hoisted to the top of the procedure. Loop counters leak.\n- **`Nothing`, `Empty`, and `Null` are different** in VBScript. Use `IsNull` for `Rhino.GetObject` failure, `IsEmpty` for uninitialized `Variant`, `Is Nothing` for object refs.\n- **Parentheses change calling semantics in VBScript.** `Call Foo(a, b)` and `Foo a, b` are valid; `Foo(a, b)` (no `Call`, with parens) is **not** a call to a Sub — it’s a syntax error for multi-arg subs and a forced `ByVal` for single-arg.\n- **Tolerance is per-document.** Always read `doc.ModelAbsoluteTolerance` rather than hardcoding `0.001`; users work in mm, m, inches, etc.\n- **Long loops should poll `Rhino.RhinoApp.EscapeKeyPressed`** so the user can cancel. Otherwise Rhino appears frozen.\n- **GUID strings vs `System.Guid`.** `rhinoscriptsyntax` accepts either; RhinoCommon wants `System.Guid`. Convert with `System.Guid(str_id)` if needed.\n- **Don’t call `doc.Views.Redraw()` inside a tight loop.** Toggle redraw once outside the loop.\n- **`.rvb` is just `.vbs` renamed** with a Rhino-specific extension so Rhino’s `LoadScript` recognizes it. Same VBScript engine.\n- **`Rhino.RhinoApp.IsHeadless` may not exist on older Rhino 8 builds.** Use `getattr(Rhino.RhinoApp, \"IsHeadless\", None)` and check for `None` before using. Fall back to a heuristic (e.g. `sc.doc.Views.Count == 0`) or assume GUI present.\n- **`RhinoMath` is at `Rhino.RhinoMath`, not `Rhino.DocObjects.RhinoMath`.** Accessing `Rhino.DocObjects.RhinoMath` raises `AttributeError`.\n- **`doc.Objects.AddBrep()` returns `System.Guid.Empty` on failure.** In Rhino 8 CPython the `System` namespace may not be directly importable; check the return value as a string: `str(obj_id) == \"00000000-0000-0000-0000-000000000000\"`.\n- **`rhinoscriptsyntax` has no type stubs.** Static analysers (Pylance/Pyright) flag `import rhinoscriptsyntax as rs` as unresolvable. Suppress with `# type: ignore` on the import line; the module is always available at Rhino runtime.\n- **Never name a script after a Python standard-library module** (e.g. `random.py`, `math.py`, `os.py`). IronPython 2.7 (`_-RunPythonScript`) resolves the script directory before stdlib, so any `import random` inside the stdlib (e.g. `tempfile` imports `random` internally) will find your file instead and fail with `Cannot import name \u003cX>`. CPython 3 (`rhinocode`) is unaffected because it resolves stdlib first. Rename the script or avoid importing modules that pull in the shadowed name.\n- **Em dashes and other non-ASCII characters silently break `_-RunPythonScript` (IronPython 2.7).** `rhinocode script` uses CPython 3 (UTF-8 by default) so the same file works there, making the failure non-obvious. IronPython 2.7 raises `SyntaxError: Non-ASCII character '\\xe2'` at the first offending byte. The most common culprit is the **em dash** (`--` auto-converted to `--` by many editors). Add `# -*- coding: utf-8 -*-` as line 1 of every script that must run under both runtimes, and replace typographic characters with ASCII equivalents: em dash `--`, arrow `->`, multiplication `x`.\n\n## Troubleshooting\n\n| Symptom | Fix |\n|---|---|\n| `rs.GetObject` returns `None` immediately | The user pressed Escape, or your `filter` excludes everything. Re-check `rs.filter.*` flags. |\n| “Unable to find script” when running by name | The folder isn’t in `Options → Files → Search paths`. |\n| VBScript `Type mismatch` on coordinates | You passed a 2-element array. Rhino requires 3-element `Array(x, y, z)`. |\n| Python `ImportError: No module named Rhino` | You’re running CPython outside Rhino. RhinoCommon is only available in Rhino’s embedded Python (or via `rhino3dm` for read-only file work). |\n| Created geometry doesn’t appear | You forgot `doc.Views.Redraw()`, or `rs.EnableRedraw(False)` was never re-enabled. |\n| Undo undoes only the last object of a batch | Wrap the batch in `BeginUndoRecord` / `EndUndoRecord`. |\n| Script works alone but fails as a startup script | Startup runs before any document is open — return early or skip document-dependent work when `sc.doc is None`. |\n| `rs.Command(\"...\")` returns `False` | The macro string is malformed. Prefix with `!` and `-`, end every prompt with `_Enter` or a value. |\n| `AttributeError: type object 'RhinoApp' has no attribute 'IsHeadless'` | Property added in a later Rhino 8 build. Use `getattr(Rhino.RhinoApp, \"IsHeadless\", None)` and guard against `None`. |\n| `rhinocode script` ignores arguments after the script path | rhinocode concatenates extra tokens onto the file URI. Pass data via a temp file or a Rhino dialog instead. See `references/macros-and-loading.md`. |\n| `Cannot import name \u003cX>` inside stdlib (e.g. `tempfile`, `os`) when using `_-RunPythonScript` | Script filename shadows a stdlib module (e.g. `random.py` shadows `random`). IronPython 2.7 searches the script directory before stdlib. Rename the script, or remove the `import` that pulls in the shadowed module and replace it with a direct alternative (e.g. read `%TEMP%` via `os.environ` instead of `import tempfile`). |\n| `SyntaxError: Non-ASCII character '\\xe2' ... but no encoding declared` | IronPython 2.7 (`_-RunPythonScript`) hit an em dash or similar character. Add `# -*- coding: utf-8 -*-` as line 1, or replace the character: em dash `--`, arrow `->`. The same file runs fine under `rhinocode` (CPython 3), which hides the problem. |\n\n## References\n\n- [references/rhinoscriptsyntax-cheatsheet.md](references/rhinoscriptsyntax-cheatsheet.md) — most-used `rs.*` functions by category.\n- [references/rhinocommon-map.md](references/rhinocommon-map.md) — which namespace to import for which task.\n- [references/macros-and-loading.md](references/macros-and-loading.md) — command-line macro syntax, `LoadScript` / `RunScript`, search paths.\n- [references/vbscript-quirks.md](references/vbscript-quirks.md) — VBScript-only traps relevant to RhinoScript.\n\n### Upstream docs\n\n- RhinoScript landing: \u003chttps://docs.mcneel.com/rhino/8/help/en-us/information/rhinoscripting.htm>\n- Developer hub: \u003chttps://developer.rhino3d.com/>\n- RhinoCommon API index: \u003chttps://mcneel.github.io/rhinocommon-api-docs/api/RhinoCommon/html/R_Project_RhinoCommon.htm>\n- Example scripts repo: \u003chttps://github.com/mcneel/rhino-developer-samples/tree/8/rhinoscript>\n"},{"path":"src/mcp/features/modeling/rhino3d-scripts/references/macros-and-loading.md","sha256":"14a0822d61d74c34694b753aa727b08b6802aaaf89ff4d40e65746e784b595cd","text":"# Macros, Loading, and Running Scripts\n\n## Command Macros (no script needed)\n\nA macro is a string of command-line input. Anywhere Rhino accepts a command (alias, toolbar button, `_ReadCommandFile`), you can place a macro.\n\n### Syntax rules\n\n| Token | Meaning |\n|---|---|\n| `!` | **Cancel** any currently running command before this one starts. Always start macros with `!`. |\n| `_` | Use the **English** (invariant) command name, so the macro works in any locale. |\n| `-` | Run the command in **script mode** — suppress dialogs, accept input from the macro string. |\n| `_Enter` | Press Enter at the current prompt. |\n| `Pause` | Stop and wait for the user to supply this input interactively. |\n| `;` | Comment to end of line. |\n| Newline | Same as a space — a separator between tokens, not a command terminator. |\n\n### Example macros\n\n```text\n! _-Line 0,0,0 10,0,0\n! _-Circle 0,0,0 5 _Enter\n! _SelAll _Delete\n! _-Properties _Object _Name \"MyObject\" _EnterEnd _Enter\n! _-RunPythonScript \"MyScript.py\"\n```\n\n## Running Saved Scripts\n\n### Python (`.py`)\n\n```text\n_-RunPythonScript \"C:\\Users\\example\\Scripts\\MyScript.py\"\n```\n\nOr, with the script folder on the search path:\n\n```text\n_-RunPythonScript \"MyScript.py\"\n```\n\n`_EditPythonScript` opens the legacy editor; `_ScriptEditor` (Rhino 8) opens the unified editor with Python 3, VB, and C#.\n\n### RhinoScript (`.rvb`, `.vbs`)\n\nTwo steps: **load** the file (registers its subs/functions), then **run** a named sub.\n\n```text\n_-LoadScript \"MyScript.rvb\"\n_-RunScript MyMainSub\n```\n\nA single `.rvb` can hold many subs; `_RunScript` chooses which to invoke.\n\n### Search Paths\n\n`Options → Files → Search paths` — folders listed here are scanned when you reference a script by bare filename. Without this, you must give a full path.\n\n### Startup Scripts\n\n`Options → RhinoScript → Startup` (and `Options → Python → Startup`) — files in these lists run once when Rhino opens. Useful for registering custom commands or aliases.\n\n**Guard against missing document** in startup code:\n\n```python\nimport scriptcontext as sc\n\ndef startup():\n    if sc.doc is None:\n        return\n\nstartup()\n```\n\n## Toolbar Buttons & Aliases\n\nA toolbar button’s **Command** field is just a macro. To make a button that runs your script:\n\n```text\n! _-RunPythonScript \"MyScript.py\"\n```\n\nSet the **Tooltip** to a short description; set the icon via the button editor.\n\nTo create an alias: `Options → Aliases → New`. The alias name becomes a typed command; its value is the macro.\n\n## Invoking Macros From a Script\n\n```python\nimport rhinoscriptsyntax as rs\nrs.Command(\"! _-Line 0,0,0 10,0,0\", echo=False)\n```\n\n`echo=False` suppresses command-history output but does **not** suppress prompts — always use `-` and complete every prompt within the macro string.\n\n## rhinocode CLI (Rhino 8)\n\n`rhinocode` is the Rhino 8 command-line tool for running scripts and commands against a running Rhino instance from an external terminal.\n\n### Basic commands\n\n```text\nrhinocode script \"C:\\path\\to\\MyScript.py\"            # run a Python script\nrhinocode command \"_Circle 0,0,0 5 _Enter\"           # run a Rhino command\nrhinocode --rhino \u003cinstance-id> script \"MyScript.py\" # target a specific instance\n```\n\n`\u003cinstance-id>` looks like `rhinocode_remotepipe_75029`. Find the ID in Rhino's title bar or\nby running `StartScriptServer` in Rhino, which prints the pipe name to the command line.\n\n### Architecture — pipe server\n\nrhinocode does **not** spawn a new Rhino process. It connects to a persistent server that Rhino\nexposes (`StartScriptServer`). Scripts execute inside that server process, which means:\n\n- **Environment variables are isolated.** Variables set in the calling shell (`set FOO=bar`)\n  are NOT visible inside the script via `os.environ`. The server was started before
